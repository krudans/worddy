<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordDay 관리자</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<script src="js/wordpacks.js"></script>
<script src="js/default-words.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');

:root {
  --primary: #1E40AF;
  --primary-light: #3B82F6;
  --primary-dark: #1E3A8A;
  --accent: #06B6D4;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --purple: #7C3AED;
  --bg: #F0F4F8;
  --bg-card: #FFFFFF;
  --bg-sidebar: #0F172A;
  --bg-header: #1E293B;
  --text-1: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;
  --border: #E2E8F0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
  --radius: 12px;
  --radius-lg: 16px;
}
async function generateOneWordEx(packId, wordIdx) {
  const packs = window._adminPacks||[];
  const p = packs.find(x=>x.id===packId);
  if(!p||!p.words[wordIdx]) return;
  const w = p.words[wordIdx];
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:`"${w.en}" (${w.kr}) 단어를 사용한 영어 예문 3개를 JSON 배열로만 반환해줘. 예: ["ex1","ex2","ex3"]`}]})
    });
    const data = await resp.json();
    const text = (data.content?.[0]?.text||'').trim();
    const arr = JSON.parse(text.match(/\[[\s\S]+\]/)?.[0]||'[]');
    if(arr.length) {
      w.exList = arr.slice(0,3);
      w.ex = w.exList[0];
      if(p._fromFirebase) {
        await db.collection('packs').doc(packId).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      }
      showPackWordTab('list');
      toast('✅ 예문 생성 완료','ok');
    }
  } catch(e) { toast('예문 생성 실패: '+e.message,'err'); }
}


* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text-1); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* ── 로그인 ── */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #0E7490 100%); }
.login-box { background: rgba(255,255,255,.97); border-radius: 24px; padding: 40px 36px; width: 100%; max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.05); }
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo .ic { font-size: 52px; margin-bottom: 8px; display: block; }
.login-logo h1 { font-size: 22px; font-weight: 800; color: var(--primary-dark); letter-spacing: -0.5px; }
.login-logo p { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.login-tab { display: flex; background: #F1F5F9; border-radius: 10px; padding: 4px; margin-bottom: 22px; gap: 4px; }
.login-tab button { flex:1; padding:8px; border:none; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; background:transparent; color:#64748B; font-family:inherit; }
.login-tab button.on { background:#fff; color: var(--primary); box-shadow: var(--shadow-sm); }
.lf { display: flex; flex-direction: column; gap: 12px; }
.lf-group label { font-size: 11px; font-weight: 700; color: var(--text-2); display: block; margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase; }
.lf-group input { border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 14px; width: 100%; background: #F8FAFC; transition: all .15s; font-family: inherit; color: var(--text-1); }
.lf-group input:focus { outline: none; border-color: var(--primary-light); background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.btn-login { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; width: 100%; font-family: inherit; transition: all .2s; letter-spacing: -0.2px; }
.btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(30,64,175,.35); }
.btn-login:active { transform: translateY(0); }
.login-err { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--danger); display: none; }
.login-err.show { display: block; }

/* ── 앱 레이아웃 ── */
#app-screen { display: none; min-height: 100vh; }
.hd { position: fixed; top: 0; left: 220px; right: 0; height: 56px; background: var(--bg-header); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,.06); }
.hd h1 { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.hd-right { display: flex; align-items: center; gap: 10px; }
.hd-badge { background: rgba(255,255,255,.1); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: rgba(255,255,255,.7); font-weight: 600; }

/* ── 사이드바 ── */
.sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: var(--bg-sidebar); display: flex; flex-direction: column; z-index: 200; overflow-y: auto; }
.sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid rgba(255,255,255,.07); flex-shrink: 0; }
.sidebar-logo .logo-icon { font-size: 28px; margin-bottom: 4px; }
.sidebar-logo .logo-title { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.sidebar-logo .logo-sub { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; }
.sidebar nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
.ss { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.3); letter-spacing: 1.2px; text-transform: uppercase; padding: 14px 10px 6px; }
.ni { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.55); transition: all .15s; margin-bottom: 1px; }
.ni:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
.ni.on { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; font-weight: 700; box-shadow: 0 3px 10px rgba(30,64,175,.4); }
.ni .ic { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-bottom { padding: 10px 8px 16px; border-top: 1px solid rgba(255,255,255,.07); flex-shrink: 0; }
#au-info { padding: 10px 12px; margin-bottom: 6px; }
#au-info .au-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.8); }
#au-info .au-role { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 2px; }
.ni-logout { color: rgba(239,68,68,.6) !important; }
.ni-logout:hover { background: rgba(239,68,68,.1) !important; color: rgba(239,68,68,.9) !important; }

/* ── 메인 콘텐츠 ── */
#main { margin-left: 220px; padding-top: 56px; min-height: 100vh; }
.main-inner { padding: 28px; max-width: 1100px; }

/* ── 카드 ── */
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 16px; overflow: hidden; }
.ct { font-size: 13px; font-weight: 700; color: var(--text-2); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: #FAFBFC; }
.card > *:not(.ct) { padding: 16px 20px; }
.card > .ct + * { padding-top: 16px; }

/* ── 페이지 헤더 ── */
.page-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-hd h2 { font-size: 20px; font-weight: 800; color: var(--text-1); letter-spacing: -0.5px; }
.page-hd .page-hd-actions { display: flex; gap: 8px; align-items: center; }

/* ── 버튼 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 14px; border-radius: 9px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; font-family: inherit; white-space: nowrap; }
.btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.bb { background: var(--primary); color: #fff; }
.bb:hover { background: var(--primary-light); }
.bg { background: var(--success); color: #fff; }
.bgr { background: #F1F5F9; color: var(--text-2); border: 1px solid var(--border); }
.br { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; }
.bp { background: #F5F3FF; color: var(--purple); border: 1px solid #E9D5FF; }

/* ── 통계 그리드 ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px; box-shadow: var(--shadow-sm); }
.stat-card .s-icon { font-size: 24px; margin-bottom: 8px; }
.stat-card .s-val { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
.stat-card .s-lb { font-size: 11px; color: var(--text-3); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: .3px; }

/* ── 테이블 ── */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-3); background: #F8FAFC; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid #F1F5F9; color: var(--text-1); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #F8FAFC; }

/* ── 뱃지 ── */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-blue { background: #EFF6FF; color: #2563EB; }
.badge-green { background: #ECFDF5; color: #059669; }
.badge-red { background: #FEF2F2; color: #DC2626; }
.badge-yellow { background: #FFFBEB; color: #D97706; }
.badge-purple { background: #F5F3FF; color: #7C3AED; }
.badge-gray { background: #F1F5F9; color: #64748B; }

/* ── 빈 상태 ── */
.es { text-align: center; padding: 48px 20px; color: var(--text-3); }
.ei { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.es p { font-size: 14px; font-weight: 600; color: var(--text-2); }
.es small { font-size: 12px; color: var(--text-3); }

/* ── 입력 ── */
.input { border: 1.5px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 13px; font-family: inherit; background: #F8FAFC; width: 100%; transition: all .15s; color: var(--text-1); }
.input:focus { outline: none; border-color: var(--primary-light); background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
select.input { cursor: pointer; }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.6; }

/* ── 바 차트 ── */
.bi { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bl { font-size: 12px; min-width: 80px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
.bt { flex: 1; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
.bf { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 4px; transition: width .6s ease; }
.bv { font-size: 11px; color: var(--text-3); min-width: 60px; text-align: right; font-weight: 600; }

/* ── 모달 ── */
#mr { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
#mr > * { pointer-events: all; }
#ma { position: fixed; inset: 0; z-index: 10000; pointer-events: none; }
#ma > * { pointer-events: all; }
.mbg { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.modal { background: #fff; border-radius: 20px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,.25); }
.modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text-1); }

/* ── 토스트 ── */
#tw { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: #1E293B; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toastIn .3s ease; white-space: nowrap; }
.toast.tok { background: var(--success); }
.toast.terr { background: var(--danger); }
@keyframes toastIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

/* ── 구분선 ── */
.divider { height: 1px; background: var(--border); margin: 8px 0; }

/* ── 반응형 ── */
@media(max-width:768px) {
  .hd { left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .25s; }
  .sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }
  .stat-grid { grid-template-columns: repeat(2,1fr); }
}

/* ── 스크롤바 ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

/* ── 테이블 깨짐 방지 ── */
.tw table { width:100%; border-collapse:collapse; }
.tw td, .tw th { overflow:hidden; text-overflow:ellipsis; }
.tw tr:hover td { background:#F9FAFB; }
/* ── 관리자 폼 입력 ── */
.admin-form input, .admin-form textarea, .admin-form select {
  padding:8px 10px; border:1.5px solid #E5E7EB; border-radius:8px;
  font-size:13px; outline:none; width:100%; box-sizing:border-box; font-family:inherit;
}
.admin-form input:focus, .admin-form textarea:focus, .admin-form select:focus { border-color:#1E5FA5; }
.admin-form label { font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:4px; }
.admin-form .field { margin-bottom:12px; }
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="ic">⚡</div>
      <h1>WordDay 관리자</h1>
      <p>관리자 계정으로 로그인하세요</p>
    </div>
    <div class="login-tab">
      <button class="on" id="lt-login" onclick="switchLoginTab('login')">🔐 로그인</button>
      <button id="lt-reg" onclick="switchLoginTab('reg')">📝 관리자 등록</button>
    </div>

    <!-- 로그인 폼 -->
    <div id="lf-login" class="lf">
      <div class="lf-group">
        <label>관리자 ID (이메일)</label>
        <input type="email" id="li-id" placeholder="admin@wordday.com" autocomplete="username">
      </div>
      <div class="lf-group">
        <label>비밀번호</label>
        <input type="password" id="li-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-toggle" onclick="togglePw('li-pw',this)" type="button">👁️</button>
      </div>
      <div class="login-err" id="li-err"></div>
      <button class="login-btn" onclick="doLogin()" id="li-btn">🔐 이메일 로그인</button>
      <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
        <div style="flex:1;height:1px;background:#E5E7EB"></div>
        <span style="font-size:12px;color:#9CA3AF">또는</span>
        <div style="flex:1;height:1px;background:#E5E7EB"></div>
      </div>
      <button onclick="doGoogleLogin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:#374151;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>

      </button>
      <div style="text-align:center;font-size:11px;color:#9CA3AF;margin-top:8px">슈퍼 관리자는 Google 로그인 사용</div>
        <span style="font-size:12px;color:#9CA3AF">또는</span>
        <div style="flex:1;height:1px;background:#E5E7EB"></div>
      </div>
      <button onclick="doGoogleLogin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:#374151;cursor:pointer;transition:background .15s" onmouseover="this.style.background='#F9FAFB'" onmouseout="this.style.background='#fff'">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
        Google 계정으로 로그인
      </button>
      <div style="text-align:center;font-size:11px;color:#9CA3AF;margin-top:8px">슈퍼 관리자(krudans@gmail.com)는 Google 로그인 사용</div>
    </div>

    <!-- 관리자 등록 폼 -->
    <div id="lf-reg" class="lf" style="display:none">
      <div style="background:#FFF8E1;border-radius:10px;padding:10px 14px;font-size:12px;color:#E65100;font-weight:600;margin-bottom:4px">
        ⚠️ 등록 후 슈퍼 관리자 승인이 필요합니다
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="lf-group">
          <label>이름 *</label>
          <input type="text" id="rg-name" placeholder="홍길동">
        </div>
        <div class="lf-group">
          <label>전화번호 *</label>
          <input type="tel" id="rg-phone" placeholder="010-0000-0000">
        </div>
      </div>
      <div class="lf-group">
        <label>주소</label>
        <input type="text" id="rg-addr" placeholder="서울시 강남구...">
      </div>
      <div class="lf-group">
        <label>관리자 ID (이메일) *</label>
        <input type="email" id="rg-id" placeholder="admin@wordday.com" autocomplete="username">
      </div>
      <div class="lf-group">
        <label>비밀번호 * (8자 이상)</label>
        <input type="password" id="rg-pw" placeholder="••••••••" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('rg-pw',this)" type="button">👁️</button>
      </div>
      <div class="lf-group">
        <label>비밀번호 확인 *</label>
        <input type="password" id="rg-pw2" placeholder="••••••••" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('rg-pw2',this)" type="button">👁️</button>
      </div>
      <div class="lf-group">
        <label>소속/직책</label>
        <input type="text" id="rg-role" placeholder="예: 콘텐츠팀 / 단어장 관리자">
      </div>
      <div class="lf-group">
        <label>등록 코드 (슈퍼 관리자에게 받기)</label>
        <input type="text" id="rg-code" placeholder="WORDDAY-ADMIN-XXXX">

// ── Google 로그인 ──
async function rDB(){
  const mi = document.getElementById('main-inner');
  if(!mi) return;
  mi.innerHTML='<div style="color:#9CA3AF;text-align:center;padding:40px"><div style="font-size:24px;margin-bottom:8px">⏳</div>대시보드 로딩 중...</div>';
  
  // Firebase 연결 확인
  if(typeof db==='undefined'||!db) {
    mi.innerHTML='<div style="text-align:center;padding:40px;color:#EF4444"><div style="font-size:32px;margin-bottom:8px">⚠️</div><div style="font-weight:700">Firebase 연결 안됨</div><div style="font-size:12px;margin-top:6px;color:#9CA3AF">로그인 후 다시 시도해주세요</div><button onclick="rDB()" class="btn bg" style="margin-top:14px">🔄 다시 시도</button></div>';
    return;
  }
  
  let uc=0, tu=0, wu=0, pc=0, totalXP=0, avgStreak=0, activeUsers=[];
  const td=today();
  const wa=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const ma=new Date(Date.now()-30*86400000).toISOString().slice(0,10);

  try {
    const s=await db.collection('users').get();
    uc=s.size;
    s.forEach(d=>{
      const x=d.data();
      totalXP += (x.xp||0);
      avgStreak += (x.streak||0);
      const la = x.lastActive?.toDate?.()?.toISOString()?.slice(0,10)||x.updatedAt?.toDate?.()?.toISOString()?.slice(0,10);
      if(la>=td) tu++;
      if(la>=wa) wu++;
      activeUsers.push({nick:x.nick,xp:x.xp||0,streak:x.streak||0,lid:x.lid||'egg'});
    });
    avgStreak = uc ? Math.round(avgStreak/uc) : 0;
    activeUsers.sort((a,b)=>b.xp-a.xp);
  } catch(e) { console.error('users 로드 실패:',e); }
  try{const ps=await db.collection('pokes').where('read','==',false).get();pc=ps.size;}catch(e){}

  // 팩 단어수 정확히 집계
  let marketWords = 0, localWords = 0, fbPackCount = 0, localPackCount = 0;
  try {
    const pkSnap = await db.collection('packs').get();
    fbPackCount = pkSnap.size;
    marketWords = pkSnap.docs.reduce((s,d)=>s+((d.data().words||[]).length),0);
  } catch(e){}
  const localPacks2 = typeof WORD_PACKS!=='undefined' ? WORD_PACKS : [];
  localPackCount = localPacks2.length;
  localWords = localPacks2.reduce((s,p)=>s+(p.words?.length||0),0);
  const totalWords = marketWords + localWords;

  // XP 설정 로드
  let xpcfg = {};

          ⚡ XP 배율 ×${xpMult} <button onclick="T('xp')" style="background:none;border:none;font-size:11px;color:#9CA3AF;cursor:pointer;text-decoration:underline">변경</button>
        </div>
        <div style="font-size:13px;color:#9CA3AF">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}</div>

      <div style="flex:1">
        <div style="font-size:16px;font-weight:800">${currentAdmin?.name||'관리자'}</div>
        <div style="font-size:12px;opacity:.8">${currentAdmin?.email||''}</div>
      </div>
      <div style="font-size:12px;opacity:.7">${isSuperAdmin()?'👑 슈퍼 관리자':''}</div>
    </div>

    <div class="sg" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">

      </div>
      <div class="st">

      </div>
      <div class="st" style="background:#FFF8E1">
        <div class="v" style="color:#D97706">${pc}</div><div class="l">미확인 콕</div>

        <div class="ct">📚 레벨별 시스템 단어수</div>
${LIDS.map(l=>`<div class="bi"><div class="bl">${LI[l].e} ${LI[l].n.split(' ')[0]}</div><div class="bt"><div class="bf" id="bf-${l}" style="height:100%;background:#1E5FA5;border-radius:4px;width:0%;transition:width .6s"></div></div><div id="bv-${l}" style="font-size:11px;font-weight:700;color:#374151;min-width:28px;text-align:right">0</div></div>`).join('')}
      </div>
      <div class="card">
        <div class="ct">🛒 마켓팩 카테고리</div>

          ${['여행','비즈니스','학업','미디어','드라마/영화','취미문화','수능','토익'].map(function(cat){const cnt=(window.WORD_PACKS||[]).filter(function(p){return p.cat===cat;}).length;const wc=(window.WORD_PACKS||[]).filter(function(p){return p.cat===cat;}).reduce(function(acc,p){return acc+(p.words?p.words.length:0);},0);return '<div style="background:#F9FAFB;border-radius:10px;padding:8px;cursor:pointer" onclick="T(\'pk\')"><div style="font-size:11px;font-weight:700;color:#374151">'+cat+'</div><div style="font-size:13px;font-weight:900;color:#1E5FA5">'+cnt+'팩</div><div style="font-size:10px;color:#9CA3AF">'+wc+'단어</div></div>';}).join('')}
        </div>
      </div>
    </div>`;

  // 레벨별 단어수 로드
  let mx=1; const wcs={};
  await Promise.all(LIDS.map(async l=>{
    try{const d=await db.collection('words').doc(l).get();wcs[l]=d.exists?(d.data().list||[]).length:0;}catch(e){wcs[l]=0;}
    if(wcs[l]>mx) mx=wcs[l];

  LIDS.forEach(l=>{
    const be=document.getElementById('bf-'+l), bv=document.getElementById('bv-'+l);
    if(be){be.style.width=Math.round((wcs[l]||0)/mx*100)+'%';}
    if(bv){bv.textContent=wcs[l]||0;}
  });
}

function showAddBF(bf){

window._bfOpenFile = function(){ const el=document.getElementById('bf-file-input'); if(el) el.click(); };
window._bfToggleSvg = function(){ const el=document.getElementById('bf-svg-area'); if(el) el.style.display=el.style.display==='none'?'block':'none'; };
window._bfClearImg = function(){
  const sv=document.getElementById('bf-svg'); if(sv) sv.value='';
  const iu=document.getElementById('bf-imageUrl'); if(iu) iu.value='';
  const pv=document.getElementById('bf-preview'); if(pv) pv.innerHTML='<span style="font-size:40px">🦋</span>';
  const st=document.getElementById('bf-upload-status'); if(st) st.textContent='';

async function saveBF(id){
  const name = (document.getElementById('bf-name')?.value||'').trim();
  if(!name){toast('이름은 필수입니다','err');return;}
  // id 생성: 수정이면 기존 id, 신규면 이름 기반
  const bid = id || ('bf_'+name.replace(/[^a-zA-Z0-9가-힣]/g,'_')+'_'+Date.now().toString(36));
  const svgCode = (document.getElementById('bf-svg')?.value||'').trim();
  const imageUrl = (document.getElementById('bf-imageUrl')?.value||'').trim();
  const scoreRaw = (document.getElementById('bf-score')?.value||'').trim();
  const data={
    id:bid, name,
    enName:(document.getElementById('bf-enName')?.value||'').trim(),
    en:(document.getElementById('bf-enName')?.value||'').trim(), // 앱 BUTTERFLY_LIST 호환
    sci:(document.getElementById('bf-sci')?.value||'').trim(),
    rare:document.getElementById('bf-rare')?.value||'⭐⭐',
    habitat:(document.getElementById('bf-habitat')?.value||'').trim(),
    season:(document.getElementById('bf-season')?.value||'').trim(),
    desc:(document.getElementById('bf-desc')?.value||'').trim(),
    msg:(document.getElementById('bf-msg')?.value||'').trim(),
    threat:(document.getElementById('bf-threat')?.value||'').trim(),
    protect:(document.getElementById('bf-protect')?.value||'').trim(),
    // 게임 연동 필드
    score: scoreRaw===''? null : Math.max(0, Math.min(100, parseInt(scoreRaw)||0)),
    status:(document.getElementById('bf-status')?.value||'생존'),
    size:(document.getElementById('bf-size')?.value||'').trim(),
    feature:(document.getElementById('bf-feature')?.value||'').trim(),
    story:(document.getElementById('bf-story')?.value||'').trim(),
    // 이미지
    imageUrl: imageUrl,
    svgCode: svgCode,
    updatedAt: new Date().toISOString()
  };
  try{
    await db.collection('butterflies').doc(bid).set(data,{merge:true});
    toast('✅ '+(id?'수정':'등록')+' 완료','ok');
    cm(); rBF();
  }catch(e){toast('저장 실패: '+e.message,'err');}
}
async function editBF(id){
  // Firebase에서 먼저 찾기
  try{
    const d=await db.collection('butterflies').doc(id).get();
    if(d.exists){ showAddBF({id:d.id,...d.data()}); return; }
  }catch(e){}
  // Firebase에 없으면 현재 allBF 목록에서 찾기
  const bf = (window._adminAllBF||[]).find(b=>b.id===id);
  if(bf){ showAddBF({...bf}); return; }
  toast('나비 정보를 찾을 수 없어요','err');
}
async function deleteBF(id,name){if(!confirm(name+' 삭제?'))return;try{await db.collection('butterflies').doc(id).delete();toast('삭제');rBF();}catch(e){toast('오류','err');}}
async function downloadBFImages(){toast('준비 중...');if(typeof JSZip==='undefined'){const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';document.head.appendChild(s);await new Promise(res=>s.onload=res);}const snap=await db.collection('butterflies').get();const zip=new JSZip();const canvas=document.createElement('canvas');canvas.width=200;canvas.height=200;const ctx=canvas.getContext('2d');for(const doc of snap.docs){const bf=doc.data();if(!bf.svgCode)continue;const svgStr=bf.svgCode.replace(/width="[^"]*"/,'width="200"').replace(/height="[^"]*"/,'height="200"');const img=new Image();const blob=new Blob([svgStr],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);await new Promise(res=>{img.onload=()=>{ctx.clearRect(0,0,200,200);ctx.drawImage(img,0,0);res();};img.src=url;});zip.file(`${bf.id}_${(bf.name||bf.id).replace(/\s/g,'_')}.png`,canvas.toDataURL('image/png').split(',')[1],{base64:true});URL.revokeObjectURL(url);}const content=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(content);a.download='butterfly_images.zip';a.click();toast('✅ 완료');}

// PDF 30선 데이터를 Firebase butterflies 컬렉션에 일괄 등록/업데이트
async function seedPdfButterflies() {
  const keys = Object.keys(PDF_SEED_DATA);
  const confirm1 = confirm(
    'PDF "지구상 가장 드라마틱한 나비 30선" 데이터로 ' + keys.length + '종의 나비 정보를(점수·서식지·에피소드 등) Firebase에 등록/업데이트합니다.\n\n' +
    '- 같은 ID(b01~b23)의 기존 Firebase 데이터가 있으면 PDF 내용으로 덮어씁니다 (이미지 svgCode·imageUrl은 보존).\n' +
    '- PDF에 없는 7종(b24~b30)은 손대지 않고 그대로 둡니다.\n\n' +
    '진행할까요?'
  );
  if (!confirm1) return;

  let success = 0, fail = 0;
  toast('등록 시작... 0/' + keys.length, 'ok');
  for (let i = 0; i < keys.length; i++) {
    const id = keys[i];
    const seed = PDF_SEED_DATA[id];
    try {
      // 기존 문서 있으면 svgCode와 imageUrl은 보존
      let preserved = {};
      try {
        const existing = await db.collection('butterflies').doc(id).get();
        if (existing.exists) {
          const ed = existing.data();
          if (ed.svgCode) preserved.svgCode = ed.svgCode;
          if (ed.imageUrl) preserved.imageUrl = ed.imageUrl;
        }
      } catch(_) {}
      const payload = {
        id,
        ...seed,
        ...preserved,
        updatedAt: new Date().toISOString(),
        seededFrom: 'pdf30'
      };
      await db.collection('butterflies').doc(id).set(payload, { merge: true });
      success++;
    } catch(e) {
      console.error('[seed] ' + id + ' 실패:', e);
      fail++;
    }
    if ((i+1) % 5 === 0 || i === keys.length-1) {
      toast('등록 중... ' + (i+1) + '/' + keys.length, 'ok');
    }
  }
  toast('✅ 완료! 성공 ' + success + ' / 실패 ' + fail, 'ok');
  rBF();
}

async function copySysToFb(lid, en){
  if(typeof DEFAULT_WORDS==='undefined') return toast('시스템 단어 데이터 없음','err');
  const sysList = DEFAULT_WORDS[lid]||[];
  const w = sysList.find(x=>x.en===en);
  if(!w) return toast('단어를 찾을 수 없어요','err');
  try{
    const doc = await db.collection('words').doc(lid).get();
    const fbList = doc.exists?(doc.data().list||[]):[];
    if(fbList.find(x=>x.en.toLowerCase()===en.toLowerCase())){
      toast('이미 DB에 있어요','err'); return;
    }
    fbList.push({...w});
    await db.collection('words').doc(lid).set({list:fbList,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast('✅ DB에 복사됨!','ok');
    loadW(lid);
  }catch(e){toast('오류: '+e.message,'err');}
}

// ── AI 호출 공통 함수 (관리자용) ──
async function callAI(prompt, maxTokens=300) {
  // admin.html은 Anthropic 앱 내에서 실행 → API 키 없이 호출
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      messages: [{role:'user', content: prompt}]
    })
  });
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const d = await resp.json();
  return (d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
}

async function uploadCSV(input){
  const file=input.files[0];if(!file)return;
  const text=await file.text();const lines=text.split('\n').filter(l=>l.trim());
  const ws=[];const start=lines[0].toLowerCase().includes('en')||lines[0].toLowerCase().includes('영')?1:0;
  lines.slice(start).forEach(line=>{const p=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(p.length>=2&&p[0]&&p[1])ws.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});});
  if(!ws.length){toast('유효한 데이터가 없어요','err');return;}
  if(!confirm(`${ws.length}개 단어를 "${LI[selLv].n}"에 추가할까요?`))return;
  try{
    const doc=await db.collection('words').doc(selLv).get();const ex=doc.exists?(doc.data().list||[]):[];let added=0;const mg=[...ex];
    ws.forEach(w=>{if(!mg.find(e=>e.en.toLowerCase()===w.en.toLowerCase())){mg.push(w);added++;}});
    await db.collection('words').doc(selLv).set({list:mg,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast(`✅ ${added}개 추가! (중복 ${ws.length-added}개 제외)`,'ok');loadW(selLv);
  }catch(e){toast('오류: '+e.message,'err');}
}

function exportW(){
  (async()=>{
    try{
      const doc=await db.collection('words').doc(selLv).get();const ws=doc.exists?(doc.data().list||[]):[];
      if(!ws.length){toast('단어가 없어요','err');return;}
      const rows=['en,kr,ph,ex,img,tip'];ws.forEach(w=>rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.img||'',w.tip||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
      const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`WordDay_${selLv}_${today()}.csv`;a.click();
      toast('✅ 내보내기 완료','ok');
    }catch(e){toast('오류: '+e.message,'err');}
  })();
}

async function generateExamples(packId) {
  const packs = window._adminPacks||[];
  const p = packs.find(x=>x.id===packId);
  if(!p||!p.words||!p.words.length){ toast('단어가 없어요','err'); return; }
  const total = p.words.length;
  if(!confirm('전체 '+total+'개 단어에 예문 3개씩 생성할까요?\n(기존 예문도 덮어씁니다)')) return;

  const progressEl = document.createElement('div');
  progressEl.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1E3A5F;color:#fff;padding:14px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.4);min-width:200px';
  document.body.appendChild(progressEl);
  const upd = (cur,msg) => {
    progressEl.innerHTML = '<div>'+(msg||'📖 예문 생성 중...')+'</div><div style="margin-top:6px;background:rgba(255,255,255,.2);border-radius:4px;height:6px"><div style="height:100%;background:#60A5FA;border-radius:4px;width:'+Math.round(cur/total*100)+'%;transition:width .3s"></div></div><div style="font-size:11px;margin-top:4px;opacity:.7">'+cur+'/'+total+'</div>';
  };
  upd(0);
  let done=0,failed=0;
  const batchSize=15;

  for(let i=0;i<p.words.length;i+=batchSize){
    const batch=p.words.slice(i,i+batchSize);
    const wordList=batch.map(w=>w.en+' ('+w.kr+')').join('\n');
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:3000,messages:[{role:'user',content:'다음 영단어 각각에 영어 예문을 3개씩 만들어줘.\n\n단어 목록:\n'+wordList+'\n\n규칙:\n- 각 예문에 해당 단어 포함\n- 짧고 자연스러운 문장\n- JSON만 반환\n\n형식: {"단어":["예문1","예문2","예문3"],...}'}]})
      });
      if(!resp.ok) throw new Error('API '+resp.status);
      const data=await resp.json();
      const text=(data.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
      const jm=text.match(/\{[\s\S]+\}/);
      if(!jm) throw new Error('JSON 없음');
      const result=JSON.parse(jm[0]);
      for(const w of batch){
        const exArr=result[w.en]||result[w.en.toLowerCase()];
        if(exArr&&Array.isArray(exArr)&&exArr.length>=1){w.exList=exArr.slice(0,3);w.ex=w.exList[0];done++;}
        else failed++;
      }
    }catch(e){console.error('배치 실패:',e.message);failed+=batch.length;}
    upd(Math.min(i+batchSize,total));
    await new Promise(r=>setTimeout(r,200));
  }
  upd(total,'💾 Firebase 저장 중...');
  try{
    await db.collection('packs').doc(packId).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    progressEl.remove();
    toast('✅ 완료! '+done+'개 성공 / '+failed+'개 실패','ok');
    showPackWordTab('list');
  }catch(e){progressEl.remove();toast('저장 오류: '+e.message,'err');}
}

async function uploadLocalPackToFirebase(packId) {
  const packs = window._adminPacks||[];

  }
}

async function fixPackWordFields(packId) {
  const _packs = window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);
  const p = _packs.find(x=>x.id===packId);
  if(!p||!p.words) return;

  let fixed=0, removed=0;
  const dummies = ['포함된 문장','단어','한국어뜻','발음기호','형태','한국어','예문'];

  p.words = p.words.filter(w => {
    // 더미 헤더 행 제거
    if(dummies.includes(w.en)) { removed++; return false; }
    if(!w.en || !w.kr) { removed++; return false; }

    // 패턴 1: en=예문(긴 문장), kr=영단어, ph=한국어 → 완전히 뒤바뀜
    const enIsEx  = w.en && w.en.includes(' ') && w.en.length > 10;
    const krIsEn  = w.kr && /^[a-zA-Z]+$/.test(w.kr) && w.kr.length < 20;
    const phIsKr  = w.ph && /[가-힣]/.test(w.ph);

    if(enIsEx && krIsEn && phIsKr) {
      // en=예문, kr=영단어, ph=한국어, pos=품사, ex=발음기호
      const tmp = {en:w.kr, kr:w.ph, ph:w.ex||'', ex:w.en.replace(/\s*\[cite:[^\]]*\]/g,'').trim(), pos:w.pos||''};
      Object.assign(w, tmp); w.meanings=[w.kr]; fixed++;
    }
    // 패턴 2: ph=품사(명사/동사), ex=발음기호([...]) → pos/ph/ex 순서 뒤바뀜
    else if(w.ph && /^(명사|동사|형용사|부사|전치사|접속사)/.test(w.ph) && w.ex && /^\[/.test(w.ex)) {
      // 현재: ph=품사, ex=발음기호
      // 목표: pos=품사, ph=발음기호, ex=원래예문
      w.pos = w.ph;
      w.ph  = w.ex;
      w.ex  = (w.en+'.').replace(/\s*\[cite:[^\]]*\]/g,'').trim();
      fixed++;
    }
    // [cite: N] 제거
    if(w.ex) w.ex = w.ex.replace(/\s*\[cite:[^\]]*\]/g,'').trim();
    return true;
  });

  try {
    await db.collection('packs').doc(packId).set({...p, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    toast(`✅ ${fixed}개 수정, ${removed}개 제거 완료! Firebase 저장 완료`, 'ok');
  } catch(e) {
    toast('저장 오류: '+e.message, 'err');
  }
  showPackWordTab('list');
}

async function saveBulkWords() {
  const text=document.getElementById('bulk-input')?.value.trim();

  if(!text){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">내용을 입력하세요</div>';return;}
  const packs=window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);

  const lines=text.split('\n').filter(l=>l.trim());

  lines.forEach(line=>{

    try { await db.collection('packs').doc(selPack).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); } catch(e){}
  }
}

async function uploadPackCSV() {
  const file=document.getElementById('pack-csv')?.files[0];
  const msg=document.getElementById('csv-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const packs=window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);
  const p=packs.find(x=>x.id===selPack);
  if(!p){toast('팩을 찾을 수 없어요','err');return;}
  if(!p.words)p.words=[];
  const text = await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'UTF-8');});
  const allLines=text.split('\n').filter(l=>l.trim());
  if(!allLines.length){toast('파일이 비어있어요','err');return;}

  // ── 헤더 행 감지 (더 넓은 조건) ──
  // 첫 줄에 영어 단어가 아닌 텍스트(한국어, 컬럼명 등)가 포함되면 헤더로 간주
  const firstCell = allLines[0].split(',')[0].trim().replace(/^"|"$/g,'');
  const isHeader = /[가-힣]/.test(firstCell)  // 한국어 포함
    || /^(en|영단어|word|단어|포함|header|no|번호|순번)/i.test(firstCell)  // 헤더 키워드
    || firstCell.length > 30;  // 너무 긴 첫 셀 (예문이 첫 컬럼에 있으면)
  const dataLines = isHeader ? allLines.slice(1) : allLines;

  // ── 컬럼 순서 자동 감지 ──
  // 헤더가 있으면 헤더로 컬럼 매핑, 없으면 기본 순서(영단어,한국어,발음기호,예문,이모지,팁)
  // 컬럼 순서 자동 감지 - 헤더 없이 컬럼 내용으로 판단
  let colMap = {en:0, kr:1, pos:-1, ph:-1, ex:-1, img:-1, tip:-1};
  
  if(isHeader) {
    // 헤더로 매핑
    const headers = allLines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
    headers.forEach((h,i) => {
      if(/^(en|영단어|word|english|단어)/.test(h))           colMap.en  = i;
      else if(/^(kr|한국어|뜻|korean|meaning)/.test(h))     colMap.kr  = i;
      else if(/^(pos|품사|part|type)/.test(h))              colMap.pos = i;
      else if(/^(ph|발음|pronunciation)/.test(h))           colMap.ph  = i;
      else if(/^(ex|예문|example|sentence|문장)/.test(h))   colMap.ex  = i;
      else if(/^(img|이모지|emoji|image)/.test(h))          colMap.img = i;
      else if(/^(tip|팁|hint|암기)/.test(h))                colMap.tip = i;
    });
  } else {
    // 헤더 없을 때: 첫 번째 데이터 행으로 컬럼 순서 추론
    const sample = (dataLines[0]||'').split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    // 3번째 컬럼이 발음기호([...])인지 품사(명사/동사 등)인지 확인
    const col2 = sample[2]||'';
    const col3 = sample[3]||'';
    if(/^\[/.test(col2) || /[ˈˌæəɪʊɔɑɛʌθðʃʒŋ]/.test(col2)) {
      // col2 = 발음기호 → en,kr,ph,ex 순서
      colMap = {en:0, kr:1, pos:-1, ph:2, ex:3, img:4, tip:5};
    } else if(/^(명사|동사|형용사|부사|전치사|접속사|대명사|감탄사|n\.|v\.|adj\.|adv\.)/.test(col2)) {
      // col2 = 품사 → en,kr,pos,ph,ex 순서 (이번 CSV 형식)
      colMap = {en:0, kr:1, pos:2, ph:3, ex:4, img:5, tip:6};
    } else {
      // 기본: en,kr,ph,ex
      colMap = {en:0, kr:1, pos:-1, ph:2, ex:3, img:4, tip:5};
    }
  }

  const get = (parts, key) => colMap[key]>=0 ? (parts[colMap[key]]||'').trim().replace(/^"|"$/g,'') : '';

  let added=0, dup=0, skip=0;
  dataLines.forEach(line=>{
    const parts=line.split(',');
    const en=get(parts,'en');
    const kr=get(parts,'kr');
    if(!en||!kr||en.length>80||/[가-힣]/.test(en)){skip++;return;} // 영단어 자리에 한국어 오면 skip
    if(p.words.find(w=>w.en.toLowerCase()===en.toLowerCase())){dup++;return;}
    p.words.push({
      en, kr,
      pos: get(parts,'pos'),
      ph:  get(parts,'ph'),
      ex:  (get(parts,'ex')||en+'.').replace(/\s*\[cite:[^\]]*\]/g,'').trim(),
      img: get(parts,'img')||'📝',
      tip: get(parts,'tip'),
      meanings:[kr]
    });
    added++;
  });

  if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ ${added}개 추가! (중복 ${dup}개, 건너뜀 ${skip}개 제외)</div>`;
  if(added>0) {
    try { await db.collection('packs').doc(selPack).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); } catch(e){}
  }
}

function exportPackCSV(packId) {
  const packs=window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);
  const p=packs.find(x=>x.id===packId);
  if(!p||!p.words?.length){toast('단어가 없어요','err');return;}
  const rows=['en,kr,ph,ex,img,tip'];
  p.words.forEach(w=>rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.img||'',w.tip||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${packId}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  toast('✅ CSV 내보내기 완료','ok');
}

async function removeInternalDups(packId) {
  const _packs=window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);
  const p=_packs.find(x=>x.id===packId);
  if(!p||!p.words)return;
  const seen=new Set();
  const before=p.words.length;
  p.words=p.words.filter(w=>{
    const key=w.en.toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  toast(`✅ ${before-p.words.length}개 중복 제거!`,'ok');
  try { await db.collection('packs').doc(packId).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); } catch(e){}
  showPackWordTab('dup');
}

      JSON 형식: {"id":"..","name":"..","cat":"..","words":[{"en":"..","kr":".."},...]}
    </div>
    <div class="fg"><label>JSON 파일</label><input type="file" id="import-json" accept=".json"></div>
    <div style="display:flex;gap:8px">
      <button class="btn bb" onclick="doImportPack()" style="flex:1">가져오기</button>
      <button class="btn bgr" onclick="cm()">취소</button>
    </div>
    <div id="import-msg" style="margin-top:8px"></div>
  </div></div>`;

function doImportPack() {
  const file=document.getElementById('import-json')?.files[0];
  const msg=document.getElementById('import-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const pack=Array.isArray(data)?data[0]:data;
      if(!pack.id||!pack.name){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">올바른 형식이 아니에요</div>';return;}
      const _ip = window._adminPacks||(typeof WORD_PACKS!=='undefined'?WORD_PACKS:[]);
      if(_ip.find(p=>p.id===pack.id)){
        if(!confirm(`"${pack.name}" (${pack.id})가 이미 있어요. 덮어쓸까요?`))return;
        const idx=_ip.findIndex(p=>p.id===pack.id);
        _ip[idx]={..._ip[idx],...pack};
      } else {
        _ip.push({emoji:'📚',cat:'기타',count:100,words:[],...pack});
        if(window._adminPacks) window._adminPacks = _ip;
      }
      toast(`✅ "${pack.name}" 가져오기 완료!`,'ok');
      cm(); rPK();
    }catch(err){if(msg)msg.innerHTML=`<div style="color:#DC2626;font-size:12px">파싱 실패: ${err.message}</div>`;}
  };
  reader.readAsText(file,'UTF-8');
}

async function saveXP() {
  const get = id => {
    const el = document.getElementById('xpf-'+id);
    return el ? (id==='xpMultiplier' ? parseFloat(el.value)||1 : parseInt(el.value)||0) : null;
  };
  const keys = [
    'word_learn','word_flip','quiz_correct','srs_hard','srs_good','speak_word',
    'daily_first','chain_step','challenge','pomodoro','achievement',
    'test_60','test_80','test_90','test_100',
    'combo_3','combo_5','combo_10','combo_20',
    'game_quiz_base','game_quiz_perfect','game_fill_base','game_fill_perfect',
    'game_typing_base','game_typing_perfect','game_listen_base','game_listen_perfect',
    'game_match_base','game_match_perfect','game_sentence_base','game_sentence_perfect',
    'game_wordfind_base','game_wordfind_perfect','game_wordle_base','game_wordle_perfect',
    'game_chain_base','game_chain_perfect','game_wc_base','game_wc_perfect',
    'game_ssort_base','game_ssort_perfect','xpMultiplier',

async function generateAllExamples() {
  const packs = window._adminPacks||[];
  if(!packs.length){toast('팩이 없어요','err');return;}
  const total = packs.reduce((s,p)=>s+(p.words||[]).length,0);
  if(!confirm(`Firebase의 모든 팩 ${packs.length}개, 단어 ${total}개에 예문 3개씩 생성할까요?\n시간이 오래 걸릴 수 있어요.`)) return;

  const progressEl = document.createElement('div');
  progressEl.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1E3A5F;color:#fff;padding:14px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.4);min-width:220px';
  document.body.appendChild(progressEl);

  let doneWords=0, failWords=0;
  const batchSize=15;

  for(const p of packs) {
    if(!p._fromFirebase) continue;
    const words = p.words||[];
    progressEl.innerHTML = `<div>📖 ${p.name}</div><div style="font-size:11px;opacity:.7">${doneWords}/${total} 완료</div>`;

    for(let i=0;i<words.length;i+=batchSize){
      const batch=words.slice(i,i+batchSize);
      const wordList=batch.map(w=>`${w.en} (${w.kr})`).join('\n');
      try{
        const resp=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:3000,messages:[{role:'user',content:`다음 영단어 각각에 영어 예문을 3개씩 만들어줘.\n\n단어 목록:\n${wordList}\n\n규칙:\n- 각 예문에 해당 단어 포함\n- 짧고 자연스러운 문장\n- JSON만 반환\n\n형식: {"단어":["예문1","예문2","예문3"],...}`}]})
        });
        if(!resp.ok) throw new Error('API '+resp.status);
        const data=await resp.json();
        const text=(data.content?.[0]?.text||'').replace(/\`\`\`json|\`\`\`/g,'').trim();
        const jm=text.match(/\{[\s\S]+\}/);
        if(!jm) throw new Error('JSON 없음');
        const result=JSON.parse(jm[0]);
        for(const w of batch){
          const exArr=result[w.en]||result[w.en.toLowerCase()];
          if(exArr&&Array.isArray(exArr)&&exArr.length>=1){
            w.exList=exArr.slice(0,3);w.ex=w.exList[0];doneWords++;
          } else failWords++;
        }
      }catch(e){console.error(e);failWords+=batch.length;}
      progressEl.innerHTML=`<div>📖 ${p.name}</div><div style="font-size:11px;opacity:.7">${doneWords}/${total} 완료</div>`;
      await new Promise(r=>setTimeout(r,200));
    }
    // 팩별 Firebase 저장
    try{await db.collection('packs').doc(p.id).set({...p,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}
    catch(e){console.error('저장 실패:',p.name,e.message);}
  }
  progressEl.remove();
  toast(`✅ 완료! ${doneWords}개 성공 / ${failWords}개 실패`,'ok');
  rPK();
}

function handleBFImageUpload(event) {
  const file = event.target.files?.[0];
  if(!file) return;
  if(file.type === 'image/svg+xml') {
    const reader = new FileReader();
    reader.onload = e => {
      const svgText = e.target.result;
      const ta = document.getElementById('bf-svg');
      if(ta) { ta.value = svgText; updateBFPreview(); }
    };
    reader.readAsText(file);
  } else {
    // 일반 이미지 → base64로 img 태그로 변환
    const reader = new FileReader();
    reader.onload = e => {
      const b64 = e.target.result;
      const svgWrap = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><image href="${b64}" x="0" y="0" width="120" height="120" preserveAspectRatio="xMidYMid meet"/></svg>`;
      const ta = document.getElementById('bf-svg');
      if(ta) { ta.value = svgWrap; updateBFPreview(); }
    };
    reader.readAsDataURL(file);
  }
}

// JPG/PNG → 캔버스로 리사이즈/압축 후 Blob 반환
async function _bfCompressImage(file, maxSide = 800, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      // PNG는 PNG로, 나머지는 JPEG로
      const mime = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
      canvas.toBlob(blob => {
        if (blob) resolve({ blob, mime });
        else reject(new Error('이미지 압축 실패'));
      }, mime, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

async function handleBFFileUpload(event) {
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  // input 초기화 (같은 파일 재선택 가능하도록)
  event.target.value = '';

  const statusEl = document.getElementById('bf-upload-status');
  const setStatus = (t, color='#9CA3AF') => { if(statusEl){ statusEl.textContent = t; statusEl.style.color = color; } };

  // SVG는 텍스트로 svgCode에 저장 (Storage 사용 안 함)
  if(file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) {
    const reader = new FileReader();
    reader.onload = function(e) {
      let svg = e.target.result;
      svg = svg.replace(/width="[^"]*"/g,'').replace(/height="[^"]*"/g,'');
      if(!svg.includes('viewBox')) svg = svg.replace(/<svg/, '<svg viewBox="0 0 120 120"');
      const ta = document.getElementById('bf-svg');
      if(ta) ta.value = svg;
      // SVG를 선택했으면 imageUrl은 비움
      const iu = document.getElementById('bf-imageUrl'); if(iu) iu.value = '';
      const sa = document.getElementById('bf-svg-area'); if(sa) sa.style.display = 'block';
      updateBFPreview();
      setStatus('✅ SVG 로드됨', '#16A34A');
      if(typeof toast === 'function') toast('✅ SVG 로드됨','ok');
    };
    reader.readAsText(file);
    return;
  }

  // JPG/PNG/WebP → Cloudinary 업로드
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) {
    if(typeof toast === 'function') toast('JPG, PNG, WebP만 지원합니다','err');
    return;
  }

  const CLOUDINARY_CLOUD_NAME = 'dhnjiryh5';
  const CLOUDINARY_UPLOAD_PRESET = 'worddy_butterflies';

  try {
    setStatus('압축 중...', '#1E5FA5');
    let uploadBlob = file, uploadMime = file.type;
    try {
      const r = await _bfCompressImage(file, 1024, 0.85);
      uploadBlob = r.blob; uploadMime = r.mime;
    } catch(_) { /* 압축 실패 시 원본 사용 */ }

    if(uploadBlob.size > 10 * 1024 * 1024) {
      setStatus('파일이 너무 큽니다 (10MB 이하)', '#DC2626');
      if(typeof toast === 'function') toast('파일이 너무 큽니다 (10MB 이하)','err');
      return;
    }

    // 미리보기 (base64)
    try {
      const dataUrl = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = e => res(e.target.result);
        fr.onerror = rej;
        fr.readAsDataURL(uploadBlob);
      });
      const pv = document.getElementById('bf-preview');
      if(pv) pv.innerHTML = '<img src="'+dataUrl+'" style="width:96px;height:96px;object-fit:contain;display:block">';
    } catch(_){}

    setStatus('업로드 중...', '#1E5FA5');

    // Cloudinary Unsigned Upload
    const formData = new FormData();
    formData.append('file', uploadBlob);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    formData.append('folder', 'worddy/butterflies');

    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      { method: 'POST', body: formData }
    );

    if(!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || '업로드 실패');
    }

    const data = await res.json();
    const url = data.secure_url;
    console.log('[Cloudinary] 업로드 완료:', url);

    const iu = document.getElementById('bf-imageUrl'); if(iu) iu.value = url;
    const sv = document.getElementById('bf-svg'); if(sv) sv.value = '';
    setStatus('✅ 업로드 완료', '#16A34A');
    if(typeof toast === 'function') toast('✅ 사진 업로드 완료','ok');
    updateBFPreview();
  } catch(e) {
    console.error('[Cloudinary upload] 실패:', e);
    setStatus('업로드 실패: '+e.message, '#DC2626');
    if(typeof toast === 'function') toast('업로드 실패: '+e.message,'err');
  }
}

function updateBFPreview() {
  const svg = document.getElementById('bf-svg')?.value||'';
  const imageUrl = document.getElementById('bf-imageUrl')?.value||'';
  const preview = document.getElementById('bf-preview');
  if(!preview) return;
  if(imageUrl) {
    preview.innerHTML = '<img src="'+imageUrl+'" style="width:96px;height:96px;object-fit:contain;display:block">';
  } else if(svg.trim().startsWith('<svg')) {
    let fixed = svg
      .replace(/width="[^"]*"/g,'')
      .replace(/height="[^"]*"/g,'')
      .replace(/viewBox="[^"]*"/g,'viewBox="0 0 120 120"')
      .replace(/<svg/, '<svg width="96" height="96" style="display:block" preserveAspectRatio="xMidYMid meet"');
    preview.innerHTML = fixed;
  } else if(svg.includes('data:image')) {
    preview.innerHTML = '<img src="'+svg+'" style="width:96px;height:96px;object-fit:contain">';
  } else {
    preview.innerHTML = '<span style="font-size:40px">🦋</span>';
  }
}
