<script>
firebase.initializeApp({apiKey:"AIzaSyAjs9nugwoI-S9CiPrtn0Y5UXYOKJ1lJic",authDomain:"wordday-75ae0.firebaseapp.com",projectId:"wordday-75ae0",storageBucket:"wordday-75ae0.firebasestorage.app",messagingSenderId:"959781543804",appId:"1:959781543804:web:63630bb49b91c9b3908ef9"});
const auth=firebase.auth(), db=firebase.firestore();

// 슈퍼 관리자 이메일 (Firebase 콘솔에서 직접 생성한 계정)
const SUPER_ADMINS=['krudans@gmail.com'];
// 등록 코드 (실제 운영 시 변경 권장)
const REG_CODE='WORDDAY-ADMIN-2025';

const LIDS=['egg','baby','crown','coco','shine','small','big','god'];
const LI={egg:{n:'알',e:'🥚',c:'#F9A825'},baby:{n:'아기 벌거지',e:'🐛',c:'#43A047'},crown:{n:'왕관 벌거지',e:'🍀',c:'#2E7D32'},coco:{n:'번데기',e:'🫘',c:'#5D4037'},shine:{n:'빛나는 번데기',e:'✨',c:'#E65100'},small:{n:'작은 나비',e:'🦋',c:'#880E4F'},big:{n:'큰 나비',e:'🦋',c:'#6A1B9A'},god:{n:'황금 나비',e:'⚡',c:'#E65100'}};
let selLv='egg', currentAdmin=null;

// ── 시계 ──
setInterval(()=>{const e=document.getElementById('at');if(e)e.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});},1000);

// ── 인증 상태 감지 ──
auth.onAuthStateChanged(async u=>{
  if(!u){
    showLoginScreen();
    return;
  }
  // Firestore에서 관리자 정보 확인
  try{
    const doc=await db.collection('admins').doc(u.uid).get();
    if(!doc.exists){
      // 슈퍼 관리자이면 자동 허용
      if(SUPER_ADMINS.includes(u.email)){
        currentAdmin={uid:u.uid,email:u.email,name:u.email.split('@')[0],role:'슈퍼 관리자',approved:true};
      } else {
        showErr('승인 대기 중인 계정입니다. 슈퍼 관리자에게 문의하세요.');
        auth.signOut();
        return;
      }
    } else {
      const data=doc.data();
      if(!data.approved && !SUPER_ADMINS.includes(u.email)){
        showErr('아직 승인되지 않은 계정입니다. 슈퍼 관리자 승인 후 이용 가능합니다.');
        auth.signOut();
        return;
      }
      currentAdmin={uid:u.uid,email:u.email,...data};
    }
    showAppScreen();
  }catch(e){
    if(SUPER_ADMINS.includes(u.email)){
      currentAdmin={uid:u.uid,email:u.email,name:u.email.split('@')[0],role:'슈퍼 관리자',approved:true};
      showAppScreen();
    } else {
      showErr('오류: '+e.message);
      auth.signOut();
    }
  }
});

function rSW() {
  if(typeof db==='undefined'){document.getElementById('sw-body').innerHTML='<div style="padding:20px;color:#9CA3AF">Firebase 연결 필요</div>';return;}
  const lvId=window._swLv||'egg';
  document.getElementById('sw-body').innerHTML='<div style="padding:20px;text-align:center">로딩 중...</div>';
  db.collection('system_words').where('level','==',lvId).orderBy('order','asc').get()
    .then(snap=>{
      const words=snap.docs.map(d=>({id:d.id,...d.data()}));
      let h=`<div style="padding:16px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          ${['egg','baby','crown','coco','shine','small','big','god'].map(l=>`<button onclick="window._swLv='${l}';rSW()" style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-weight:700;background:${lvId===l?'#1E5FA5':'#F3F4F6'};color:${lvId===l?'#fff':'#374151'};font-size:12px">${l}</button>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-bottom:16px">
          <button onclick="swAddWord()" style="background:#1E5FA5;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">+ 단어 추가</button>
          <label style="background:#16A34A;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-block">📥 CSV<input type="file" accept=".csv" style="display:none" onchange="csvUpload(this)"></label>
          <label style="background:#16A34A;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">📥 CSV<input type="file" accept=".csv" style="display:none" onchange="csvUpload(this,window._swLv||'egg')"></label>
          <span style="font-size:13px;color:#9CA3AF;line-height:36px">${words.length}개</span>
        </div>
        <div id="sw-add-form" style="display:none;background:#EFF6FF;border-radius:14px;padding:16px;margin-bottom:16px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <input id="sw-en" placeholder="영어 (en)" style="padding:8px 12px;border-radius:8px;border:1.5px solid #BFDBFE;font-size:13px">
            <input id="sw-kr" placeholder="한국어 (kr)" style="padding:8px 12px;border-radius:8px;border:1.5px solid #BFDBFE;font-size:13px">
            <input id="sw-ph" placeholder="발음 (ph)" style="padding:8px 12px;border-radius:8px;border:1.5px solid #BFDBFE;font-size:13px">
            <input id="sw-img" placeholder="이모지 (img)" style="padding:8px 12px;border-radius:8px;border:1.5px solid #BFDBFE;font-size:13px">
          </div>
          <input id="sw-ex" placeholder="예문 (ex)" style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #BFDBFE;font-size:13px;box-sizing:border-box;margin-bottom:8px">
          <div style="display:flex;gap:8px">
            <button onclick="swSaveWord()" style="flex:2;background:#1E5FA5;color:#fff;border:none;border-radius:8px;padding:8px;font-size:13px;font-weight:700;cursor:pointer">저장</button>
            <button onclick="document.getElementById('sw-add-form').style.display='none'" style="flex:1;background:#F3F4F6;border:none;border-radius:8px;padding:8px;font-size:13px;cursor:pointer">취소</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">`;
      words.forEach((w,i)=>{
        h+=`<div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 14px;border:1px solid #E5E7EB">
          <span style="font-size:20px">${w.img||'📝'}</span>
          <div style="flex:1"><div style="font-size:14px;font-weight:700;font-family:monospace">${w.en}</div>
            <div style="font-size:12px;color:#6B7280">${w.kr} ${w.ph?'· '+w.ph:''}</div>
            ${w.ex?`<div style="font-size:11px;color:#9CA3AF;font-style:italic">${w.ex}</div>`:''}
          </div>
          <button onclick="swDeleteWord('${w.id}')" style="background:#FEF2F2;border:none;border-radius:8px;padding:6px 10px;font-size:12px;color:#DC2626;cursor:pointer">삭제</button>
        </div>`;
      });
      h+=`</div></div>`;
      document.getElementById('sw-body').innerHTML=h;
    }).catch(e=>{document.getElementById('sw-body').innerHTML='<div style="padding:20px;color:#DC2626">오류: '+e.message+'</div>';});
}


function csvUpload(input) {
  const file=input.files[0]; if(!file)return;
  const lv=document.getElementById('sw-level-sel')?.value||'egg';
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const words=[];
    lines.forEach((line,i)=>{
      if(i===0&&line.toLowerCase().includes('en'))return;
      const parts=line.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
      if(parts.length>=2&&parts[0]){
        words.push({en:parts[0],kr:parts[1]||'',ph:parts[2]||'',img:parts[3]||'📝',ex:parts[4]||'',level:lv,order:Date.now()+i});
      }
    });
    if(!words.length){alert('단어를 찾을 수 없어요. (en,kr,ph,img,ex 형식)');return;}
    if(!confirm(words.length+'개 단어를 추가할까요?'))return;
    const batch=db.batch();
    words.forEach(w=>batch.set(db.collection('system_words').doc(),w));
    batch.commit().then(()=>{alert('✅ '+words.length+'개 추가 완료!');rSW();}).catch(e=>alert('오류: '+e.message));
  };
  reader.readAsText(file);
}
function swAddWord() {
  const f=document.getElementById('sw-add-form');
  if(f) f.style.display=f.style.display==='none'?'block':'none';
}

function swSaveWord() {
  const en=document.getElementById('sw-en')?.value?.trim();
  const kr=document.getElementById('sw-kr')?.value?.trim();
  if(!en||!kr){alert('영어와 한국어는 필수입니다');return;}
  const lvId=window._swLv||'egg';
  const data={en,kr,ph:document.getElementById('sw-ph')?.value?.trim()||'',
    img:document.getElementById('sw-img')?.value?.trim()||'📝',
    ex:document.getElementById('sw-ex')?.value?.trim()||'',
    level:lvId,order:Date.now()};
  db.collection('system_words').add(data)
    .then(()=>{alert('저장 완료!');rSW();})
    .catch(e=>alert('오류: '+e.message));
}

function swDeleteWord(id) {
  if(!confirm('삭제할까요?'))return;
  db.collection('system_words').doc(id).delete()
    .then(()=>rSW()).catch(e=>alert('오류: '+e.message));
}


function rMarketAdmin() {
  const body = document.getElementById('market-body');

// ── 관리자 등록 ──
async function doRegister(){
  const name=document.getElementById('rg-name').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const addr=document.getElementById('rg-addr').value.trim();
  const id=document.getElementById('rg-id').value.trim();
  const pw=document.getElementById('rg-pw').value;
  const pw2=document.getElementById('rg-pw2').value;
  const role=document.getElementById('rg-role').value.trim();
  const code=document.getElementById('rg-code').value.trim().toUpperCase();
  const err=document.getElementById('rg-err');
  const btn=document.getElementById('rg-btn');
  err.classList.remove('show');

  if(!name||!phone||!id||!pw){err.textContent='필수 항목을 모두 입력하세요';err.classList.add('show');return;}
  if(pw.length<8){err.textContent='비밀번호는 8자 이상이어야 합니다';err.classList.add('show');return;}
  if(pw!==pw2){err.textContent='비밀번호가 일치하지 않습니다';err.classList.add('show');return;}
  if(code && code!==REG_CODE){err.textContent='등록 코드가 올바르지 않습니다';err.classList.add('show');return;}

  btn.textContent='등록 중...';btn.disabled=true;
  try{
    // Firebase Auth에 계정 생성
    const cred=await auth.createUserWithEmailAndPassword(id,pw);
    // Firestore에 관리자 정보 저장
    await db.collection('admins').doc(cred.user.uid).set({
      name,phone,addr:addr||'',email:id,role:role||'관리자',
      approved:code===REG_CODE, // 코드 있으면 자동 승인
      isSuperAdmin:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      registeredAt:new Date().toISOString(),
    });
    if(code!==REG_CODE){
      toast('✅ 등록 신청 완료! 슈퍼 관리자 승인 후 로그인 가능합니다','ok');
      auth.signOut();
      switchLoginTab('login');
    }
    // 코드 있으면 onAuthStateChanged가 자동으로 앱 화면으로 이동
  }catch(e){
    const msg={
      'auth/email-already-in-use':'이미 등록된 이메일입니다',
      'auth/invalid-email':'이메일 형식이 올바르지 않습니다',
      'auth/weak-password':'비밀번호가 너무 약합니다 (8자 이상, 영문+숫자)',
    }[e.code]||'등록 실패: '+e.message;
    err.textContent=msg;err.classList.add('show');
  }
  btn.textContent='관리자 등록 신청';btn.disabled=false;
}

async function approveAdmin(uid,name){
  try{
    await db.collection('admins').doc(uid).update({approved:true,approvedAt:firebase.firestore.FieldValue.serverTimestamp(),approvedBy:currentAdmin?.email});
    toast(`✅ ${name} 승인 완료`,'ok');rADM();
  }catch(e){toast('오류: '+e.message,'err');}
}

async function rejectAdmin(uid,name){
  if(!confirm(`${name}의 등록 신청을 거절하고 삭제할까요?`))return;
  try{
    // Firebase Auth 계정 삭제는 Admin SDK 필요, Firestore 문서만 삭제
    await db.collection('admins').doc(uid).delete();
    toast(`🗑 ${name} 거절 및 삭제`,'ok');rADM();
  }catch(e){toast('오류: '+e.message,'err');}
}

async function saveAddAdmin(){
  const name=document.getElementById('aa-name')?.value.trim();
  const email=document.getElementById('aa-email')?.value.trim();
  const pw=document.getElementById('aa-pw')?.value;
  const errEl=document.getElementById('aa-err');
  if(!name||!email||!pw){if(errEl){errEl.textContent='필수 항목을 입력하세요';errEl.style.display='block';}return;}
  if(pw.length<8){if(errEl){errEl.textContent='비밀번호는 8자 이상이어야 합니다';errEl.style.display='block';}return;}
  try{
    // 새 계정 생성 (현재 로그인은 유지됨 - Firebase 특성상 일시적으로 해당 계정으로 전환됨)
    // 실제로는 Admin SDK가 필요하지만, 클라이언트에서 임시로 처리
    const oldUser=auth.currentUser;
    const cred=await auth.createUserWithEmailAndPassword(email,pw);
    await db.collection('admins').doc(cred.user.uid).set({
      name,email,
      phone:document.getElementById('aa-phone')?.value.trim()||'',
      addr:document.getElementById('aa-addr')?.value.trim()||'',
      role:document.getElementById('aa-role')?.value.trim()||'관리자',
      approved:true,
      isSuperAdmin:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      registeredAt:new Date().toISOString(),
      createdBy:currentAdmin?.email,
    });
    // 다시 원래 계정으로 로그인
    await auth.signOut();
    toast(`✅ ${name} 관리자 추가 완료! 다시 로그인해주세요.`,'ok');
    currentAdmin=null;
    cm();
    showLoginScreen();
  }catch(e){
    const msg={'auth/email-already-in-use':'이미 등록된 이메일입니다','auth/weak-password':'비밀번호가 너무 약합니다'}[e.code]||e.message;
    if(errEl){errEl.textContent='오류: '+msg;errEl.style.display='block';}
  }
}

      // 일별 활성 사용자
      const lastD = x.updatedAt?.toDate?.()?.toISOString().slice(0,10);

async function callAI(prompt, maxTokens=300) {
  // admin.html은 Anthropic 앱 내에서 실행 → API 키 없이 호출
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      messages: [{role:'user', content: prompt}]
    })
  });
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const d = await resp.json();
  return (d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
}

async function uploadCSV(input){
  const file=input.files[0];if(!file)return;
  const text=await file.text();const lines=text.split('\n').filter(l=>l.trim());
  const ws=[];const start=lines[0].toLowerCase().includes('en')||lines[0].toLowerCase().includes('영')?1:0;
  lines.slice(start).forEach(line=>{const p=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(p.length>=2&&p[0]&&p[1])ws.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});});
  if(!ws.length){toast('유효한 데이터가 없어요','err');return;}
  if(!confirm(`${ws.length}개 단어를 "${LI[selLv].n}"에 추가할까요?`))return;
  try{
    const doc=await db.collection('words').doc(selLv).get();const ex=doc.exists?(doc.data().list||[]):[];let added=0;const mg=[...ex];
    ws.forEach(w=>{if(!mg.find(e=>e.en.toLowerCase()===w.en.toLowerCase())){mg.push(w);added++;}});
    await db.collection('words').doc(selLv).set({list:mg,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast(`✅ ${added}개 추가! (중복 ${ws.length-added}개 제외)`,'ok');loadW(selLv);
  }catch(e){toast('오류: '+e.message,'err');}
}

      </label>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn bb" onclick="saveNewPack()" style="flex:1">만들기</button>

function saveNewPack() {
  const name = document.getElementById('pk-name')?.value.trim();
  const id = document.getElementById('pk-id')?.value.trim();
  if(!name||!id){toast('이름과 ID를 입력하세요','err');return;}
  if(typeof WORD_PACKS === 'undefined'){toast('WORD_PACKS를 찾을 수 없어요','err');return;}
  if(WORD_PACKS.find(p=>p.id===id)){toast('이미 있는 ID예요','err');return;}
  const newPack = {
    id, name,
    emoji: document.getElementById('pk-emoji')?.value||'📚',
    cat: document.getElementById('pk-cat')?.value||'기타',
    desc: document.getElementById('pk-desc')?.value||'',
    count: +(document.getElementById('pk-count')?.value||100),
    isPopular: document.getElementById('pk-popular')?.checked||false,
    addedAt: document.getElementById('pk-new')?.checked ? new Date().toISOString().slice(0,10) : null,
    words: []
  };
  WORD_PACKS.push(newPack);
  toast(`✅ "${name}" 팩 생성!`,'ok');
  cm();
  rPK();
  // 바로 단어 관리로 이동
  setTimeout(()=>showPackWords(id), 300);
}

// 팩 수정
function showEditPack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!p) return;
  const cats = ['여행','비즈니스','학업','미디어','드라마/영화','취미문화','수능','토익'];
  document.getElementById('ma').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div class="mt">✏️ 팩 수정: ${p.name}</div>
    <div style="display:grid;grid-template-columns:60px 1fr;gap:10px;margin-bottom:12px">
      <div class="fg"><label>이모지</label><input id="ep-emoji" value="${p.emoji}" style="text-align:center;font-size:20px"></div>
      <div class="fg"><label>팩 이름</label><input id="ep-name" value="${p.name}"></div>
    </div>
    <div class="fg"><label>카테고리</label>
      <select id="ep-cat">${cats.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>설명</label><input id="ep-desc" value="${p.desc||''}"></div>

    <div style="display:flex;gap:12px;margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
        <input type="checkbox" id="ep-popular" ${p.isPopular?'checked':''}> 🔥 인기 팩
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">

      <button class="btn bb" onclick="saveEditPack('${packId}')" style="flex:1">저장</button>

function saveEditPack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!p) return;
  p.emoji = document.getElementById('ep-emoji')?.value||p.emoji;
  p.name = document.getElementById('ep-name')?.value.trim()||p.name;
  p.cat = document.getElementById('ep-cat')?.value||p.cat;
  p.desc = document.getElementById('ep-desc')?.value||p.desc;
  p.count = +(document.getElementById('ep-count')?.value||p.count);
  p.isPopular = document.getElementById('ep-popular')?.checked||false;
  p.addedAt = document.getElementById('ep-new')?.checked ? (p.addedAt||new Date().toISOString().slice(0,10)) : null;
  toast(`✅ "${p.name}" 수정 완료`,'ok');
  cm(); rPK();
}

// 팩 삭제
function deletePack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!confirm(`"${p?.name}" 팩을 삭제할까요?\n단어 ${p?.words?.length||0}개가 모두 삭제됩니다.`)) return;
  const idx = WORD_PACKS.findIndex(x=>x.id===packId);
  if(idx>=0) WORD_PACKS.splice(idx,1);
  toast('🗑 팩 삭제됨','ok');
  rPK();
}

function showPackWordTab(tab) {
  const p = WORD_PACKS.find(x=>x.id===selPack);
  if(!p) return;
  const words = p.words||[];

  // 탭 활성화
  ['add','list','dup'].forEach(t=>{
    const el = document.getElementById('pwt-'+t);
    if(!el) return;
    el.style.color = t===tab ? '#1E5FA5' : '#9CA3AF';
    el.style.borderBottomColor = t===tab ? '#1E5FA5' : 'transparent';
  });

  const cont = document.getElementById('pw-content');
  if(!cont) return;

  if(tab==='add') {
    cont.innerHTML=`
      <!-- 방법 탭 -->
      <div style="display:flex;gap:6px;margin-bottom:14px;background:#F3F4F6;border-radius:10px;padding:4px">
        <button onclick="showAddMethod('single')" id="am-single" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:#1E5FA5">✏️ 직접 입력</button>
        <button onclick="showAddMethod('bulk')" id="am-bulk" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">📋 대량 입력</button>
        <button onclick="showAddMethod('csv')" id="am-csv" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">📄 CSV</button>
        <button onclick="showAddMethod('ai')" id="am-ai" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">✨ AI</button>
      </div>
      <div id="add-method-content"></div>`;
    showAddMethod('single');
  }

  else if(tab==='list') {
    if(!words.length) {
      cont.innerHTML='<div style="text-align:center;padding:40px;color:#9CA3AF"><div style="font-size:36px">📭</div><p>단어가 없어요</p></div>';
      return;
    }
    cont.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <input placeholder="단어 검색..." oninput="filterPackWords(this.value)" style="flex:1;font-size:13px">
        <button class="btn br" style="font-size:12px;padding:6px 10px" onclick="if(confirm('모든 단어를 삭제할까요?')){WORD_PACKS.find(x=>x.id===selPack).words=[];showPackWordTab('list')}">전체삭제</button>
      </div>
      <div style="font-size:12px;color:#9CA3AF;margin-bottom:8px">${words.length}개</div>
      <div id="pack-word-list" style="display:flex;flex-direction:column;gap:6px">
        ${words.map((w,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#F9FAFB;border-radius:10px">
          <span style="font-size:18px">${w.img||'📝'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;font-family:monospace">${w.en}</div>
            <div style="font-size:11px;color:#6B7280">${w.kr}</div>
          </div>
          <button onclick="editPackWord('${selPack}',${i})" style="background:none;border:none;font-size:14px;cursor:pointer;color:#9CA3AF">✏️</button>
          <button onclick="deletePackWord('${selPack}',${i})" style="background:none;border:none;font-size:14px;cursor:pointer;color:#FCA5A5">×</button>
        </div>`).join('')}
      </div>`;
  }

  else if(tab==='dup') {
    // 중복 단어 찾기 (팩 내부 + 다른 팩과의 중복)
    const enSet = new Set();
    const dups = [];
    words.forEach((w,i)=>{
      if(enSet.has(w.en.toLowerCase())) dups.push({w,i,type:'내부'});
      else enSet.add(w.en.toLowerCase());
    });

    // 다른 팩과의 중복 확인
    const otherPacks = WORD_PACKS.filter(x=>x.id!==selPack);
    const crossDups = words.filter(w=>otherPacks.some(op=>(op.words||[]).find(ow=>ow.en.toLowerCase()===w.en.toLowerCase())));

    cont.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:#FEF2F2;border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:24px;font-weight:900;color:#DC2626">${dups.length}</div>
          <div style="font-size:12px;color:#9CA3AF">팩 내 중복</div>
        </div>
        <div style="background:#FFF8E1;border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:24px;font-weight:900;color:#E65100">${crossDups.length}</div>
          <div style="font-size:12px;color:#9CA3AF">다른 팩과 중복</div>
        </div>
      </div>
      ${dups.length>0?`
        <div style="margin-bottom:14px">
          <div style="font-size:13px;font-weight:700;color:#DC2626;margin-bottom:8px">🔴 팩 내부 중복 (${dups.length}개)</div>
          ${dups.map(({w,i})=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px;background:#FEF2F2;border-radius:8px;margin-bottom:4px">
            <span style="font-size:13px;font-family:monospace">${w.en} - ${w.kr}</span>
            <button onclick="deletePackWord('${selPack}',${i});showPackWordTab('dup')" class="btn br" style="font-size:11px;padding:3px 8px">삭제</button>
          </div>`).join('')}
          <button onclick="removeInternalDups('${selPack}')" class="btn br" style="width:100%;margin-top:6px;font-size:12px">🧹 내부 중복 모두 제거</button>
        </div>`:'<div style="background:#F0FDF4;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:#16A34A;margin-bottom:14px">✅ 내부 중복 없음!</div>'}
      ${crossDups.length>0?`
        <div>
          <div style="font-size:13px;font-weight:700;color:#E65100;margin-bottom:8px">🟡 다른 팩과 중복 (${crossDups.length}개)</div>
          <div style="max-height:200px;overflow-y:auto">
            ${crossDups.slice(0,20).map(w=>{
              const inPacks = otherPacks.filter(op=>(op.words||[]).find(ow=>ow.en.toLowerCase()===w.en.toLowerCase())).map(op=>op.name).join(', ');
              return `<div style="padding:6px 8px;background:#FFF8E1;border-radius:8px;margin-bottom:4px;font-size:12px">
                <strong>${w.en}</strong> - ${w.kr}<br>
                <span style="color:#9CA3AF">→ ${inPacks}</span>
              </div>`;
            }).join('')}
          </div>
          ${crossDups.length>20?`<div style="text-align:center;font-size:11px;color:#9CA3AF;margin-top:4px">외 ${crossDups.length-20}개</div>`:''}
        </div>`:'<div style="background:#F0FDF4;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:#16A34A">✅ 다른 팩과 중복 없음!</div>'}`;
  }
}

function filterPackWords(v) {
  document.querySelectorAll('#pack-word-list > div').forEach(el=>{
    el.style.display = el.textContent.toLowerCase().includes(v.toLowerCase()) ? '' : 'none';
  });
}

// 단어 추가 함수들
function addPackWord() {
  const en=document.getElementById('pw-en')?.value.trim();
  const kr=document.getElementById('pw-kr')?.value.trim();
  const msg=document.getElementById('pw-msg');
  if(!en||!kr){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">영단어와 뜻을 입력하세요</div>';return;}
  const p=WORD_PACKS.find(x=>x.id===selPack);
  if(!p){return;}
  if(!p.words) p.words=[];
  if(p.words.find(w=>w.en.toLowerCase()===en.toLowerCase())){
    if(msg)msg.innerHTML='<div style="color:#E65100;font-size:12px">⚠️ 이미 있는 단어예요</div>';return;
  }
  p.words.push({en,kr,ph:document.getElementById('pw-ph')?.value.trim()||'',ex:document.getElementById('pw-ex')?.value.trim()||en+'.',img:document.getElementById('pw-img')?.value.trim()||'📝',tip:document.getElementById('pw-tip')?.value.trim()||'',meanings:[kr]});
  ['pw-en','pw-kr','pw-ph','pw-ex','pw-img','pw-tip'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ "${en}" 추가! (총 ${p.words.length}개)</div>`;
  document.getElementById('pw-en')?.focus();
}

async function aiPackWordFill() {
  const en=document.getElementById('pw-en')?.value.trim();
  if(!en){toast('영단어를 입력하세요','err');return;}
  const msg=document.getElementById('pw-msg');
  if(msg)msg.innerHTML='<div style="color:#9CA3AF;font-size:12px">AI 자동완성 중...</div>';
  try{
    const text=await callAI(`"${en}" 단어 정보를 JSON으로만: {"kr":"뜻","ph":"[발음기호]","ex":"예문","tip":"암기팁","img":"이모지"}`);

function saveBulkWords() {
  const text=document.getElementById('bulk-input')?.value.trim();
  const msg=document.getElementById('bulk-msg');
  if(!text){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">내용을 입력하세요</div>';return;}
  const p=WORD_PACKS.find(x=>x.id===selPack);
  if(!p.words)p.words=[];
  const lines=text.split('\n').filter(l=>l.trim());
  let added=0,dup=0;
  lines.forEach(line=>{
    const parts=line.split(',').map(s=>s.trim());
    if(parts.length<2||!parts[0]||!parts[1])return;
    if(p.words.find(w=>w.en.toLowerCase()===parts[0].toLowerCase())){dup++;return;}
    p.words.push({en:parts[0],kr:parts[1],ph:parts[2]||'',ex:parts[3]||parts[0]+'.',img:parts[4]||'📝',tip:parts[5]||'',meanings:[parts[1]]});
    added++;
  });
  if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ ${added}개 추가! (중복 ${dup}개 제외)</div>`;
  if(added>0)document.getElementById('bulk-input').value='';
}

function uploadPackCSV() {
  const file=document.getElementById('pack-csv')?.files[0];
  const msg=document.getElementById('csv-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const p=WORD_PACKS.find(x=>x.id===selPack);
    if(!p.words)p.words=[];
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const start=lines[0].toLowerCase().includes('en')||lines[0].toLowerCase().startsWith('영')?1:0;
    let added=0,dup=0;
    lines.slice(start).forEach(line=>{
      const parts=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      if(parts.length<2||!parts[0]||!parts[1])return;
      if(p.words.find(w=>w.en.toLowerCase()===parts[0].toLowerCase())){dup++;return;}
      p.words.push({en:parts[0],kr:parts[1],ph:parts[2]||'',ex:parts[3]||parts[0]+'.',img:parts[4]||'📝',tip:parts[5]||'',meanings:[parts[1]]});
      added++;
    });
    if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ ${added}개 추가! (중복 ${dup}개 제외)</div>`;
  };
  reader.readAsText(file,'UTF-8');
}

function exportPackCSV(packId) {
  const p=WORD_PACKS.find(x=>x.id===packId);
  if(!p||!p.words?.length){toast('단어가 없어요','err');return;}
  const rows=['en,kr,ph,ex,img,tip'];
  p.words.forEach(w=>rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.img||'',w.tip||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${packId}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  toast('✅ CSV 내보내기 완료','ok');
}

function saveAIPackWords(wsJson) {
  try{
    const ws=typeof wsJson==='string'?JSON.parse(wsJson.replace(/&quot;/g,'"')):wsJson;

    if(!p.words)p.words=[];
    const existSet=new Set(p.words.map(w=>w.en.toLowerCase()));

function removeInternalDups(packId) {
  const p=WORD_PACKS.find(x=>x.id===packId);
  if(!p||!p.words)return;
  const seen=new Set();
  const before=p.words.length;
  p.words=p.words.filter(w=>{
    const key=w.en.toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  toast(`✅ ${before-p.words.length}개 중복 제거!`,'ok');
  showPackWordTab('dup');
}

function doImportPack() {
  const file=document.getElementById('import-json')?.files[0];
  const msg=document.getElementById('import-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const pack=Array.isArray(data)?data[0]:data;
      if(!pack.id||!pack.name){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">올바른 형식이 아니에요</div>';return;}
      if(WORD_PACKS.find(p=>p.id===pack.id)){
        if(!confirm(`"${pack.name}" (${pack.id})가 이미 있어요. 덮어쓸까요?`))return;
        const idx=WORD_PACKS.findIndex(p=>p.id===pack.id);
        WORD_PACKS[idx]={...WORD_PACKS[idx],...pack};
      } else {
        WORD_PACKS.push({emoji:'📚',cat:'기타',count:100,words:[],...pack});
      }
      toast(`✅ "${pack.name}" 가져오기 완료!`,'ok');
      cm(); rPK();
    }catch(err){if(msg)msg.innerHTML=`<div style="color:#DC2626;font-size:12px">파싱 실패: ${err.message}</div>`;}
  };
  reader.readAsText(file,'UTF-8');
}

function parseCsvForPack(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
    const words = lines.slice(1).map(line => {
      const vals = line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
      const obj = {};
      headers.forEach((h,i) => { if(vals[i]) obj[h] = vals[i]; });
      return obj;
    }).filter(w=>w.en && w.kr);
    document.getElementById('pk-words').value = JSON.stringify(words, null, 2);
    alert('✅ CSV 파싱 완료: '+words.length+'개 단어');
  };
  reader.readAsText(file, 'UTF-8');
}

async function downloadBFImages() {
  toast('📦 이미지 준비 중...', 'info');
  // JSZip 동적 로드
  if(typeof JSZip === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    document.head.appendChild(s);
    await new Promise(res => s.onload = res);
  }
  const snap = await db.collection('butterflies').get();
  const zip = new JSZip();
  const canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  for(const doc of snap.docs) {
    const bf = doc.data();
    if(!bf.svgCode) continue;
    const svgStr = bf.svgCode.replace(/width="[^"]*"/, 'width="200"').replace(/height="[^"]*"/, 'height="200"');
    const img = new Image();
    const blob = new Blob([svgStr], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    await new Promise(res => { img.onload=()=>{ctx.clearRect(0,0,200,200);ctx.drawImage(img,0,0);res();}; img.src=url; });
    const pngData = canvas.toDataURL('image/png').split(',')[1];
    zip.file(`${bf.id}_${(bf.name||bf.id).replace(/\s/g,'_')}.png`, pngData, {base64:true});
    URL.revokeObjectURL(url);
  }
  const content = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = 'butterfly_images.zip';
  a.click();
  toast('✅ 다운로드 완료!');
}

    updatedAt: new Date().toISOString(),
  };
  try {
    await db.collection('config').doc('ad_banner').set(data);
    toast('✅ 광고 배너 저장 완료');
    rAD();
  } catch(e) { alert('저장 오류: '+e.message); }
}

// ══════════════════════════════════
// 💬 회화 문장 관리
// ══════════════════════════════════
async function rCV() {
  const main = document.getElementById('main');
  main.innerHTML = '<div style="color:#9CA3AF;text-align:center;padding:40px">로딩 중...</div>';
  let cats = [], sentences = [];
  try {
    const snap = await db.collection('conversation_sentences').orderBy('cat').orderBy('order').get();
    sentences = snap.docs.map(d=>({id:d.id,...d.data()}));
    cats = [...new Set(sentences.map(s=>s.cat||'기타'))];
  } catch(e) {}
  const selCat = window._cvCat || cats[0] || '';
  const filtered = selCat ? sentences.filter(s=>s.cat===selCat) : sentences;
  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-size:22px;font-weight:900">💬 회화 문장 관리</h2>
      <div style="display:flex;gap:8px">
        <span style="background:#FDF2F8;color:#BE185D;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700">${sentences.length}개 등록</span>
        <button class="btn bb" onclick="showAddCV()">➕ 문장 추가</button>
        <button class="btn bg" onclick="uploadCVCSV()">📤 CSV 업로드</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${cats.map(cat=>`<button onclick="window._cvCat='${cat}';rCV()" style="background:${selCat===cat?'#BE185D':'#F9FAFB'};color:${selCat===cat?'#fff':'#374151'};border:1.5px solid ${selCat===cat?'#BE185D':'#E5E7EB'};border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer">${cat}</button>`).join('')}
    </div>
    <div class="card">
      ${filtered.length ? `<div class="tw"><table>
        <tr><th>#</th><th>카테고리</th><th>영어 문장</th><th>한국어</th><th>난이도</th><th>작업</th></tr>
        ${filtered.map((s,i)=>`<tr>
          <td style="color:#9CA3AF;font-size:11px">${i+1}</td>
          <td><span style="background:#FDF2F8;color:#BE185D;border-radius:20px;padding:2px 8px;font-size:11px">${s.cat||'기타'}</span></td>
          <td style="font-weight:600;max-width:200px">${s.en||''}</td>
          <td style="color:#6B7280;max-width:160px">${s.kr||''}</td>
          <td><span style="font-size:11px">${'⭐'.repeat(s.level||1)}</span></td>
          <td><div style="display:flex;gap:4px">
            <button class="btn bgr" style="font-size:11px;padding:4px 8px" onclick="editCV('${s.id}')">✏️</button>
            <button class="btn br" style="font-size:11px;padding:4px 8px" onclick="deleteCV('${s.id}')">🗑</button>
          </div></td>
        </tr>`).join('')}
      </table></div>` : '<div class="es"><div class="ei">💬</div><p>등록된 문장이 없어요</p></div>'}
    </div>`;
}

function showAddCV(existing) {
  const mr = document.getElementById('mr') || (() => {
    const d=document.createElement('div');d.id='mr';document.body.appendChild(d);return d;
  })();
  const s = existing || {};
  const cats=['인사/소개','쇼핑','음식/식당','교통','호텔/숙소','여행','병원/긴급','비즈니스','일상대화','감정표현'];
  mr.innerHTML=`<div class="mbg" onclick="this.parentElement.innerHTML=''"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:16px;font-weight:900;margin-bottom:14px">${s.id?'문장 수정':'문장 추가'}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <select id="cv-cat" style="padding:8px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:13px">
        ${cats.map(c=>`<option value="${c}" ${s.cat===c?'selected':''}>${c}</option>`).join('')}
        <option value="기타" ${!cats.includes(s.cat)?'selected':''}>기타</option>
      </select>
      <input id="cv-en" placeholder="영어 문장" value="${s.en||''}" style="padding:8px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:13px">
      <input id="cv-kr" placeholder="한국어 뜻" value="${s.kr||''}" style="padding:8px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:13px">
      <input id="cv-ph" placeholder="발음 (선택)" value="${s.ph||''}" style="padding:8px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:13px">
      <select id="cv-lv" style="padding:8px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:13px">
        ${[1,2,3].map(l=>`<option value="${l}" ${s.level===l?'selected':''}>${'⭐'.repeat(l)} 난이도 ${l}</option>`).join('')}
      </select>
      <button onclick="saveCV('${s.id||''}')" class="btn bb">💾 저장</button>
    </div>
  </div></div>`;
}

async function saveCV(existingId) {
  const en=document.getElementById('cv-en').value.trim();
  const kr=document.getElementById('cv-kr').value.trim();
  if(!en||!kr){alert('영어/한국어는 필수');return;}
  const data={cat:document.getElementById('cv-cat').value,en,kr,ph:document.getElementById('cv-ph').value.trim(),level:parseInt(document.getElementById('cv-lv').value),order:Date.now()};
  try{
    if(existingId) await db.collection('conversation_sentences').doc(existingId).update(data);
    else await db.collection('conversation_sentences').add(data);
    toast('✅ 저장 완료');document.getElementById('mr').innerHTML='';rCV();
  }catch(e){alert('오류: '+e.message);}
}

async function editCV(id){
  try{const doc=await db.collection('conversation_sentences').doc(id).get();if(doc.exists)showAddCV({id:doc.id,...doc.data()});}catch(e){alert('오류: '+e.message);}
}
async function deleteCV(id){
  if(!confirm('삭제할까요?'))return;
  try{await db.collection('conversation_sentences').doc(id).delete();toast('삭제 완료');rCV();}catch(e){alert('오류: '+e.message);}
}
function uploadCVCSV(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const lines=ev.target.result.split('\n').filter(l=>l.trim());
      const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
      const rows=lines.slice(1).map(line=>{
        const vals=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
        const obj={};headers.forEach((h,i)=>{if(vals[i])obj[h]=vals[i];});
        return obj;
      }).filter(r=>r.en&&r.kr);
      const batch=db.batch();
      rows.forEach(r=>{const ref=db.collection('conversation_sentences').doc();batch.set(ref,{...r,level:parseInt(r.level||1),order:Date.now()});});
      await batch.commit();
      toast('✅ '+rows.length+'개 문장 업로드 완료');rCV();
    };
    reader.readAsText(file,'UTF-8');
  };
  inp.click();
}


</script>
