<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordDay 관리자</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#F5F7FF;color:#111;min-height:100vh}

/* ── 로그인 화면 ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0F172A,#1E3A5F,#1E5FA5);padding:20px}
.login-box{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .ic{font-size:56px;margin-bottom:8px}
.login-logo h1{font-size:24px;font-weight:900;color:#1E3A5F}
.login-logo p{font-size:13px;color:#9CA3AF;margin-top:4px}
.login-tab{display:flex;background:#F3F4F6;border-radius:12px;padding:4px;margin-bottom:24px;gap:4px}
.login-tab button{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;background:transparent;color:#6B7280}
.login-tab button.on{background:#fff;color:#1E5FA5;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.lf{display:flex;flex-direction:column;gap:14px}
.lf-group{position:relative}
.lf-group label{font-size:12px;font-weight:700;color:#6B7280;display:block;margin-bottom:5px}
.lf-group input{border:1.5px solid #E5E7EB;border-radius:10px;padding:11px 14px;font-size:14px;width:100%;background:#fff;transition:border-color .15s;font-family:inherit}
.lf-group input:focus{outline:none;border-color:#1E5FA5;box-shadow:0 0 0 3px rgba(30,95,165,.1)}
.lf-group .pw-toggle{position:absolute;right:12px;bottom:11px;cursor:pointer;font-size:16px;color:#9CA3AF;border:none;background:none}
.login-btn{background:linear-gradient(135deg,#1E5FA5,#2563EB);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;width:100%;font-family:inherit;transition:all .15s;margin-top:4px}
.login-btn:hover{background:linear-gradient(135deg,#1a52a0,#1d4ed8);transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,95,165,.4)}
.login-btn:active{transform:translateY(0)}
.login-err{background:#FEF2F2;border:1.5px solid #FECDD3;border-radius:10px;padding:10px 14px;font-size:13px;color:#DC2626;font-weight:600;display:none}
.login-err.show{display:block}

/* ── 앱 전체 ── */
#app-screen{display:none}
.hd{background:linear-gradient(135deg,#1E3A5F,#1E5FA5);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hd h1{font-size:18px;font-weight:900;letter-spacing:.5px}
.hd-right{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.9}
.sidebar{width:220px;background:#fff;border-right:1.5px solid #E5E7EB;position:fixed;top:56px;left:0;bottom:0;overflow-y:auto;padding:12px 0;z-index:90}
.ss{font-size:10px;font-weight:800;color:#9CA3AF;padding:10px 20px 4px;text-transform:uppercase;letter-spacing:.8px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;font-weight:600;color:#6B7280;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.ni:hover{color:#1E5FA5;background:#F0F7FF}
.ni.on{color:#1E5FA5;background:#EFF6FF;border-left-color:#1E5FA5}
.ni .ic{font-size:16px;width:20px;text-align:center}
.main{margin-left:220px;margin-top:56px;padding:24px;min-height:calc(100vh - 56px)}
.card{background:#fff;border-radius:14px;border:1.5px solid #E5E7EB;padding:20px;margin-bottom:16px}
.ct{font-size:15px;font-weight:800;color:#111;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.st{background:#fff;border-radius:14px;border:1.5px solid #E5E7EB;padding:18px;text-align:center}
.st .v{font-size:32px;font-weight:900;margin-bottom:4px}
.st .l{font-size:12px;color:#9CA3AF;font-weight:600}
.btn{border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}.br{background:#DC2626;color:#fff}.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}.bp{background:#7C3AED;color:#fff}.bo{background:#E65100;color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F9FAFB;padding:10px 14px;text-align:left;font-weight:700;color:#374151;border-bottom:1.5px solid #E5E7EB;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
input,select,textarea{font-family:inherit;border:1.5px solid #E5E7EB;border-radius:8px;padding:9px 12px;font-size:13px;width:100%;background:#fff;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1E5FA5;box-shadow:0 0 0 3px rgba(30,95,165,.1)}
label{font-size:12px;font-weight:700;color:#6B7280;display:block;margin-bottom:5px}
.fg{margin-bottom:12px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.bb2{background:#EFF6FF;color:#1E5FA5}.bg2{background:#F0FDF4;color:#16A34A}.br2{background:#FEF2F2;color:#DC2626}
.by{background:#FFF8E1;color:#E65100}.bp2{background:#FDF4FF;color:#7C3AED}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.mt{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.tw2{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:#1A1A2E;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;animation:pop .25s ease}
.tok{background:#16A34A}.terr{background:#DC2626}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bi{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bl{width:80px;font-size:12px;font-weight:600;color:#374151;text-align:right;flex-shrink:0}
.bt{flex:1;background:#F3F4F6;border-radius:4px;height:8px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .5s}
.bv{font-size:11px;color:#9CA3AF;width:40px;flex-shrink:0}
.es{text-align:center;padding:48px 20px;color:#9CA3AF}
.es .ei{font-size:48px;margin-bottom:12px}
.es p{font-size:14px;font-weight:600}
.admin-card{background:linear-gradient(135deg,#1E3A5F,#1E5FA5);border-radius:16px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px}
.admin-avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:2px solid rgba(255,255,255,.4);flex-shrink:0}
@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.sg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="ic">⚡</div>
      <h1>WordDay 관리자</h1>
      <p>관리자 계정으로 로그인하세요</p>
    </div>
    <div class="login-tab">
      <button class="on" id="lt-login" onclick="switchLoginTab('login')">🔐 로그인</button>
      <button id="lt-reg" onclick="switchLoginTab('reg')">📝 관리자 등록</button>
    </div>

    <!-- 로그인 폼 -->
    <div id="lf-login" class="lf">
      <div class="lf-group">
        <label>관리자 ID (이메일)</label>
        <input type="email" id="li-id" placeholder="admin@wordday.com" autocomplete="username">
      </div>
      <div class="lf-group">
        <label>비밀번호</label>
        <input type="password" id="li-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-toggle" onclick="togglePw('li-pw',this)" type="button">👁️</button>
      </div>
      <div class="login-err" id="li-err"></div>
      <button class="login-btn" onclick="doLogin()" id="li-btn">로그인</button>
      <div style="text-align:center;font-size:12px;color:#9CA3AF;margin-top:8px">비밀번호를 잊었다면 슈퍼 관리자에게 문의하세요</div>
    </div>

    <!-- 관리자 등록 폼 -->
    <div id="lf-reg" class="lf" style="display:none">
      <div style="background:#FFF8E1;border-radius:10px;padding:10px 14px;font-size:12px;color:#E65100;font-weight:600;margin-bottom:4px">
        ⚠️ 등록 후 슈퍼 관리자 승인이 필요합니다
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="lf-group">
          <label>이름 *</label>
          <input type="text" id="rg-name" placeholder="홍길동">
        </div>
        <div class="lf-group">
          <label>전화번호 *</label>
          <input type="tel" id="rg-phone" placeholder="010-0000-0000">
        </div>
      </div>
      <div class="lf-group">
        <label>주소</label>
        <input type="text" id="rg-addr" placeholder="서울시 강남구...">
      </div>
      <div class="lf-group">
        <label>관리자 ID (이메일) *</label>
        <input type="email" id="rg-id" placeholder="admin@wordday.com" autocomplete="username">
      </div>
      <div class="lf-group">
        <label>비밀번호 * (8자 이상)</label>
        <input type="password" id="rg-pw" placeholder="••••••••" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('rg-pw',this)" type="button">👁️</button>
      </div>
      <div class="lf-group">
        <label>비밀번호 확인 *</label>
        <input type="password" id="rg-pw2" placeholder="••••••••" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('rg-pw2',this)" type="button">👁️</button>
      </div>
      <div class="lf-group">
        <label>소속/직책</label>
        <input type="text" id="rg-role" placeholder="예: 콘텐츠팀 / 단어장 관리자">
      </div>
      <div class="lf-group">
        <label>등록 코드 (슈퍼 관리자에게 받기)</label>
        <input type="text" id="rg-code" placeholder="WORDDAY-ADMIN-XXXX">
      </div>
      <div class="login-err" id="rg-err"></div>
      <button class="login-btn" onclick="doRegister()" id="rg-btn" style="background:linear-gradient(135deg,#7C3AED,#A855F7)">관리자 등록 신청</button>
    </div>
  </div>
</div>

<!-- ── 앱 화면 ── -->
<div id="app-screen">
  <div class="hd">
    <div style="display:flex;align-items:center;gap:12px">
      <button onclick="document.getElementById('sb').classList.toggle('open')" style="background:rgba(255,255,255,.1);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;color:#fff;font-size:16px">☰</button>
      <h1>⚡ WordDay 관리자</h1>
    </div>
    <div class="hd-right">
      <span id="au" style="font-weight:700"></span>
      <span id="au-role" style="font-size:11px;opacity:.7;background:rgba(255,255,255,.1);padding:3px 8px;border-radius:20px"></span>
      <span id="at" style="font-family:monospace;font-size:12px;opacity:.7"></span>
      <button onclick="doLogout()" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;color:#fff;font-size:12px;font-weight:700">로그아웃</button>
    </div>
  </div>
  <nav class="sidebar" id="sb">
    <div class="ss">메인</div>
    <div class="ni on" onclick="T('db')" id="ni-db"><span class="ic">📊</span>대시보드</div>
    <div class="ni" onclick="T('an')" id="ni-an"><span class="ic">📈</span>분석</div>
    <div class="ss">콘텐츠</div>
    <div class="ni" onclick="T('wd')" id="ni-wd"><span class="ic">📚</span>단어장 관리</div>
    <div class="ni" onclick="T('sw')" id="ni-sw"><span class="ic">🎓</span>시스템 단어장</div>
    <div class="ni" onclick="T('pk')" id="ni-pk"><span class="ic">🛒</span>마켓 팩</div>
    <div class="ni" onclick="T('lv')" id="ni-lv"><span class="ic">🦋</span>레벨 관리</div>
    <div class="ni" onclick="T('nt')" id="ni-nt"><span class="ic">📢</span>공지사항</div>
    <div class="ss">사용자</div>
    <div class="ni" onclick="T('us')" id="ni-us"><span class="ic">👥</span>회원 관리</div>
    <div class="ni" onclick="T('po')" id="ni-po"><span class="ic">👉</span>콕 찌르기</div>
    <div class="ss">관리자</div>
    <div class="ni" onclick="T('adm')" id="ni-adm"><span class="ic">🔐</span>관리자 관리</div>
    <div class="ss">시스템</div>
    <div class="ni" onclick="T('st')" id="ni-st"><span class="ic">⚙️</span>앱 설정</div>
  </nav>
  <main class="main" id="main">
    <div style="text-align:center;padding:80px;color:#9CA3AF"><div style="font-size:48px;margin-bottom:16px">⚡</div><div style="font-size:16px;font-weight:700">로딩 중...</div></div>
  </main>
</div>

<div id="tw" class="tw2"></div>
<div id="ma"></div>

<script src="js/wordpacks.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAjs9nugwoI-S9CiPrtn0Y5UXYOKJ1lJic",authDomain:"wordday-75ae0.firebaseapp.com",projectId:"wordday-75ae0",storageBucket:"wordday-75ae0.firebasestorage.app",messagingSenderId:"959781543804",appId:"1:959781543804:web:63630bb49b91c9b3908ef9"});
const auth=firebase.auth(), db=firebase.firestore();

// 슈퍼 관리자 이메일 (Firebase 콘솔에서 직접 생성한 계정)
const SUPER_ADMINS=['krudans@gmail.com'];
// 등록 코드 (실제 운영 시 변경 권장)
const REG_CODE='WORDDAY-ADMIN-2025';

const LIDS=['egg','baby','crown','coco','shine','small','big','god'];
const LI={egg:{n:'알',e:'🥚',c:'#F9A825'},baby:{n:'아기 벌거지',e:'🐛',c:'#43A047'},crown:{n:'왕관 벌거지',e:'🍀',c:'#2E7D32'},coco:{n:'번데기',e:'🫘',c:'#5D4037'},shine:{n:'빛나는 번데기',e:'✨',c:'#E65100'},small:{n:'작은 나비',e:'🦋',c:'#880E4F'},big:{n:'큰 나비',e:'🦋',c:'#6A1B9A'},god:{n:'황금 나비',e:'⚡',c:'#E65100'}};
let selLv='egg', currentAdmin=null;

// ── 시계 ──
setInterval(()=>{const e=document.getElementById('at');if(e)e.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});},1000);

// ── 인증 상태 감지 ──
auth.onAuthStateChanged(async u=>{
  if(!u){
    showLoginScreen();
    return;
  }
  // Firestore에서 관리자 정보 확인
  try{
    const doc=await db.collection('admins').doc(u.uid).get();
    if(!doc.exists){
      // 슈퍼 관리자이면 자동 허용
      if(SUPER_ADMINS.includes(u.email)){
        currentAdmin={uid:u.uid,email:u.email,name:u.email.split('@')[0],role:'슈퍼 관리자',approved:true};
      } else {
        showErr('승인 대기 중인 계정입니다. 슈퍼 관리자에게 문의하세요.');
        auth.signOut();
        return;
      }
    } else {
      const data=doc.data();
      if(!data.approved && !SUPER_ADMINS.includes(u.email)){
        showErr('아직 승인되지 않은 계정입니다. 슈퍼 관리자 승인 후 이용 가능합니다.');
        auth.signOut();
        return;
      }
      currentAdmin={uid:u.uid,email:u.email,...data};
    }
    showAppScreen();
  }catch(e){
    if(SUPER_ADMINS.includes(u.email)){
      currentAdmin={uid:u.uid,email:u.email,name:u.email.split('@')[0],role:'슈퍼 관리자',approved:true};
      showAppScreen();
    } else {
      showErr('오류: '+e.message);
      auth.signOut();
    }
  }
});

function showLoginScreen(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
}
function showAppScreen(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('au').textContent=currentAdmin?.name||currentAdmin?.email?.split('@')[0]||'관리자';
  document.getElementById('au-role').textContent=currentAdmin?.role||'관리자';
  T('db');
}
function showErr(msg){
  const el=document.getElementById('li-err');
  if(el){el.textContent=msg;el.classList.add('show');}
}

// ── 탭 전환 ──
function switchLoginTab(tab){
  document.getElementById('lt-login').classList.toggle('on',tab==='login');
  document.getElementById('lt-reg').classList.toggle('on',tab==='reg');
  document.getElementById('lf-login').style.display=tab==='login'?'flex':'none';
  document.getElementById('lf-reg').style.display=tab==='reg'?'flex':'none';
  document.getElementById('li-err').classList.remove('show');
  document.getElementById('rg-err').classList.remove('show');
}

function togglePw(id,btn){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁️';}
}

// ── 로그인 ──
async function doLogin(){
  const id=document.getElementById('li-id').value.trim();
  const pw=document.getElementById('li-pw').value;
  const err=document.getElementById('li-err');
  const btn=document.getElementById('li-btn');
  err.classList.remove('show');
  if(!id||!pw){err.textContent='이메일과 비밀번호를 입력하세요';err.classList.add('show');return;}
  btn.textContent='로그인 중...';btn.disabled=true;
  try{
    await auth.signInWithEmailAndPassword(id,pw);
    // onAuthStateChanged가 처리
  }catch(e){
    const msg={
      'auth/user-not-found':'등록되지 않은 이메일입니다',
      'auth/wrong-password':'비밀번호가 틀렸습니다',
      'auth/invalid-email':'이메일 형식이 올바르지 않습니다',
      'auth/too-many-requests':'로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요',
      'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다',
    }[e.code]||'로그인 실패: '+e.message;
    err.textContent=msg;err.classList.add('show');
  }
  btn.textContent='로그인';btn.disabled=false;
}

// ── 관리자 등록 ──
async function doRegister(){
  const name=document.getElementById('rg-name').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const addr=document.getElementById('rg-addr').value.trim();
  const id=document.getElementById('rg-id').value.trim();
  const pw=document.getElementById('rg-pw').value;
  const pw2=document.getElementById('rg-pw2').value;
  const role=document.getElementById('rg-role').value.trim();
  const code=document.getElementById('rg-code').value.trim().toUpperCase();
  const err=document.getElementById('rg-err');
  const btn=document.getElementById('rg-btn');
  err.classList.remove('show');

  if(!name||!phone||!id||!pw){err.textContent='필수 항목을 모두 입력하세요';err.classList.add('show');return;}
  if(pw.length<8){err.textContent='비밀번호는 8자 이상이어야 합니다';err.classList.add('show');return;}
  if(pw!==pw2){err.textContent='비밀번호가 일치하지 않습니다';err.classList.add('show');return;}
  if(code && code!==REG_CODE){err.textContent='등록 코드가 올바르지 않습니다';err.classList.add('show');return;}

  btn.textContent='등록 중...';btn.disabled=true;
  try{
    // Firebase Auth에 계정 생성
    const cred=await auth.createUserWithEmailAndPassword(id,pw);
    // Firestore에 관리자 정보 저장
    await db.collection('admins').doc(cred.user.uid).set({
      name,phone,addr:addr||'',email:id,role:role||'관리자',
      approved:code===REG_CODE, // 코드 있으면 자동 승인
      isSuperAdmin:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      registeredAt:new Date().toISOString(),
    });
    if(code!==REG_CODE){
      toast('✅ 등록 신청 완료! 슈퍼 관리자 승인 후 로그인 가능합니다','ok');
      auth.signOut();
      switchLoginTab('login');
    }
    // 코드 있으면 onAuthStateChanged가 자동으로 앱 화면으로 이동
  }catch(e){
    const msg={
      'auth/email-already-in-use':'이미 등록된 이메일입니다',
      'auth/invalid-email':'이메일 형식이 올바르지 않습니다',
      'auth/weak-password':'비밀번호가 너무 약합니다 (8자 이상, 영문+숫자)',
    }[e.code]||'등록 실패: '+e.message;
    err.textContent=msg;err.classList.add('show');
  }
  btn.textContent='관리자 등록 신청';btn.disabled=false;
}

// ── AI 호출 공통 함수 (관리자용) ──
async function callAI(prompt, maxTokens=300) {
  // admin.html은 Anthropic 앱 내에서 실행 → API 키 없이 호출
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      messages: [{role:'user', content: prompt}]
    })
  });
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const d = await resp.json();
  return (d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
}

async function uploadCSV(input){
  const file=input.files[0];if(!file)return;
  const text=await file.text();const lines=text.split('\n').filter(l=>l.trim());
  const ws=[];const start=lines[0].toLowerCase().includes('en')||lines[0].toLowerCase().includes('영')?1:0;
  lines.slice(start).forEach(line=>{const p=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(p.length>=2&&p[0]&&p[1])ws.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});});
  if(!ws.length){toast('유효한 데이터가 없어요','err');return;}
  if(!confirm(`${ws.length}개 단어를 "${LI[selLv].n}"에 추가할까요?`))return;
  try{
    const doc=await db.collection('words').doc(selLv).get();const ex=doc.exists?(doc.data().list||[]):[];let added=0;const mg=[...ex];
    ws.forEach(w=>{if(!mg.find(e=>e.en.toLowerCase()===w.en.toLowerCase())){mg.push(w);added++;}});
    await db.collection('words').doc(selLv).set({list:mg,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast(`✅ ${added}개 추가! (중복 ${ws.length-added}개 제외)`,'ok');loadW(selLv);
  }catch(e){toast('오류: '+e.message,'err');}
}

function filterPacks(v) {
  document.querySelectorAll('#pk-table tr:not(:first-child)').forEach(tr=>{

  });
}

function saveNewPack() {
  const name = document.getElementById('pk-name')?.value.trim();
  const id = document.getElementById('pk-id')?.value.trim();
  if(!name||!id){toast('이름과 ID를 입력하세요','err');return;}
  if(typeof WORD_PACKS === 'undefined'){toast('WORD_PACKS를 찾을 수 없어요','err');return;}
  if(WORD_PACKS.find(p=>p.id===id)){toast('이미 있는 ID예요','err');return;}
  const newPack = {
    id, name,
    emoji: document.getElementById('pk-emoji')?.value||'📚',
    cat: document.getElementById('pk-cat')?.value||'기타',
    desc: document.getElementById('pk-desc')?.value||'',
    count: +(document.getElementById('pk-count')?.value||100),
    isPopular: document.getElementById('pk-popular')?.checked||false,
    addedAt: document.getElementById('pk-new')?.checked ? new Date().toISOString().slice(0,10) : null,
    words: []
  };
  WORD_PACKS.push(newPack);
  toast(`✅ "${name}" 팩 생성!`,'ok');
  cm();
  rPK();
  // 바로 단어 관리로 이동
  setTimeout(()=>showPackWords(id), 300);
}

// 팩 수정
function showEditPack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!p) return;
  const cats = ['여행','비즈니스','학업','미디어','드라마/영화','취미문화','수능','토익'];
  document.getElementById('ma').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div class="mt">✏️ 팩 수정: ${p.name}</div>

      <div class="fg"><label>이모지</label><input id="ep-emoji" value="${p.emoji}" style="text-align:center;font-size:20px"></div>
      <div class="fg"><label>팩 이름</label><input id="ep-name" value="${p.name}"></div>

    <div class="fg"><label>카테고리</label>

      </label>

function saveEditPack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!p) return;
  p.emoji = document.getElementById('ep-emoji')?.value||p.emoji;
  p.name = document.getElementById('ep-name')?.value.trim()||p.name;
  p.cat = document.getElementById('ep-cat')?.value||p.cat;
  p.desc = document.getElementById('ep-desc')?.value||p.desc;
  p.count = +(document.getElementById('ep-count')?.value||p.count);
  p.isPopular = document.getElementById('ep-popular')?.checked||false;
  p.addedAt = document.getElementById('ep-new')?.checked ? (p.addedAt||new Date().toISOString().slice(0,10)) : null;
  toast(`✅ "${p.name}" 수정 완료`,'ok');
  cm(); rPK();
}

// 팩 삭제
function deletePack(packId) {
  const p = WORD_PACKS.find(x=>x.id===packId);
  if(!confirm(`"${p?.name}" 팩을 삭제할까요?\n단어 ${p?.words?.length||0}개가 모두 삭제됩니다.`)) return;
  const idx = WORD_PACKS.findIndex(x=>x.id===packId);
  if(idx>=0) WORD_PACKS.splice(idx,1);
  toast('🗑 팩 삭제됨','ok');
  rPK();
}

    <div id="pw-content" style="flex:1;overflow-y:auto;padding:16px"></div>
  </div></div>`;

function showPackWordTab(tab) {
  const p = WORD_PACKS.find(x=>x.id===selPack);
  if(!p) return;
  const words = p.words||[];

  // 탭 활성화
  ['add','list','dup'].forEach(t=>{
    const el = document.getElementById('pwt-'+t);
    if(!el) return;
    el.style.color = t===tab ? '#1E5FA5' : '#9CA3AF';
    el.style.borderBottomColor = t===tab ? '#1E5FA5' : 'transparent';
  });

  const cont = document.getElementById('pw-content');
  if(!cont) return;

  if(tab==='add') {
    cont.innerHTML=`
      <!-- 방법 탭 -->
      <div style="display:flex;gap:6px;margin-bottom:14px;background:#F3F4F6;border-radius:10px;padding:4px">
        <button onclick="showAddMethod('single')" id="am-single" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:#1E5FA5">✏️ 직접 입력</button>
        <button onclick="showAddMethod('bulk')" id="am-bulk" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">📋 대량 입력</button>
        <button onclick="showAddMethod('csv')" id="am-csv" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">📄 CSV</button>
        <button onclick="showAddMethod('ai')" id="am-ai" style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#6B7280">✨ AI</button>
      </div>
      <div id="add-method-content"></div>`;
    showAddMethod('single');
  }

  else if(tab==='list') {
    if(!words.length) {
      cont.innerHTML='<div style="text-align:center;padding:40px;color:#9CA3AF"><div style="font-size:36px">📭</div><p>단어가 없어요</p></div>';
      return;
    }
    cont.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <input placeholder="단어 검색..." oninput="filterPackWords(this.value)" style="flex:1;font-size:13px">
        <button class="btn br" style="font-size:12px;padding:6px 10px" onclick="if(confirm('모든 단어를 삭제할까요?')){WORD_PACKS.find(x=>x.id===selPack).words=[];showPackWordTab('list')}">전체삭제</button>
      </div>
      <div style="font-size:12px;color:#9CA3AF;margin-bottom:8px">${words.length}개</div>
      <div id="pack-word-list" style="display:flex;flex-direction:column;gap:6px">
        ${words.map((w,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#F9FAFB;border-radius:10px">
          <span style="font-size:18px">${w.img||'📝'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;font-family:monospace">${w.en}</div>
            <div style="font-size:11px;color:#6B7280">${w.kr}</div>
          </div>
          <button onclick="editPackWord('${selPack}',${i})" style="background:none;border:none;font-size:14px;cursor:pointer;color:#9CA3AF">✏️</button>
          <button onclick="deletePackWord('${selPack}',${i})" style="background:none;border:none;font-size:14px;cursor:pointer;color:#FCA5A5">×</button>
        </div>`).join('')}
      </div>`;
  }

  else if(tab==='dup') {
    // 중복 단어 찾기 (팩 내부 + 다른 팩과의 중복)
    const enSet = new Set();
    const dups = [];
    words.forEach((w,i)=>{
      if(enSet.has(w.en.toLowerCase())) dups.push({w,i,type:'내부'});
      else enSet.add(w.en.toLowerCase());
    });

    // 다른 팩과의 중복 확인
    const otherPacks = WORD_PACKS.filter(x=>x.id!==selPack);
    const crossDups = words.filter(w=>otherPacks.some(op=>(op.words||[]).find(ow=>ow.en.toLowerCase()===w.en.toLowerCase())));

    cont.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:#FEF2F2;border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:24px;font-weight:900;color:#DC2626">${dups.length}</div>
          <div style="font-size:12px;color:#9CA3AF">팩 내 중복</div>
        </div>
        <div style="background:#FFF8E1;border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:24px;font-weight:900;color:#E65100">${crossDups.length}</div>
          <div style="font-size:12px;color:#9CA3AF">다른 팩과 중복</div>
        </div>
      </div>
      ${dups.length>0?`
        <div style="margin-bottom:14px">
          <div style="font-size:13px;font-weight:700;color:#DC2626;margin-bottom:8px">🔴 팩 내부 중복 (${dups.length}개)</div>
          ${dups.map(({w,i})=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px;background:#FEF2F2;border-radius:8px;margin-bottom:4px">
            <span style="font-size:13px;font-family:monospace">${w.en} - ${w.kr}</span>
            <button onclick="deletePackWord('${selPack}',${i});showPackWordTab('dup')" class="btn br" style="font-size:11px;padding:3px 8px">삭제</button>
          </div>`).join('')}
          <button onclick="removeInternalDups('${selPack}')" class="btn br" style="width:100%;margin-top:6px;font-size:12px">🧹 내부 중복 모두 제거</button>
        </div>`:'<div style="background:#F0FDF4;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:#16A34A;margin-bottom:14px">✅ 내부 중복 없음!</div>'}
      ${crossDups.length>0?`
        <div>
          <div style="font-size:13px;font-weight:700;color:#E65100;margin-bottom:8px">🟡 다른 팩과 중복 (${crossDups.length}개)</div>
          <div style="max-height:200px;overflow-y:auto">
            ${crossDups.slice(0,20).map(w=>{
              const inPacks = otherPacks.filter(op=>(op.words||[]).find(ow=>ow.en.toLowerCase()===w.en.toLowerCase())).map(op=>op.name).join(', ');
              return `<div style="padding:6px 8px;background:#FFF8E1;border-radius:8px;margin-bottom:4px;font-size:12px">
                <strong>${w.en}</strong> - ${w.kr}<br>
                <span style="color:#9CA3AF">→ ${inPacks}</span>
              </div>`;
            }).join('')}
          </div>
          ${crossDups.length>20?`<div style="text-align:center;font-size:11px;color:#9CA3AF;margin-top:4px">외 ${crossDups.length-20}개</div>`:''}
        </div>`:'<div style="background:#F0FDF4;border-radius:10px;padding:12px;text-align:center;font-size:13px;color:#16A34A">✅ 다른 팩과 중복 없음!</div>'}`;
  }
}

  document.querySelectorAll('#pack-word-list > div').forEach(el=>{
    el.style.display = el.textContent.toLowerCase().includes(v.toLowerCase()) ? '' : 'none';

function saveBulkWords() {
  const text=document.getElementById('bulk-input')?.value.trim();
  const msg=document.getElementById('bulk-msg');
  if(!text){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">내용을 입력하세요</div>';return;}
  const p=WORD_PACKS.find(x=>x.id===selPack);
  if(!p.words)p.words=[];
  const lines=text.split('\n').filter(l=>l.trim());
  let added=0,dup=0;
  lines.forEach(line=>{
    const parts=line.split(',').map(s=>s.trim());
    if(parts.length<2||!parts[0]||!parts[1])return;
    if(p.words.find(w=>w.en.toLowerCase()===parts[0].toLowerCase())){dup++;return;}
    p.words.push({en:parts[0],kr:parts[1],ph:parts[2]||'',ex:parts[3]||parts[0]+'.',img:parts[4]||'📝',tip:parts[5]||'',meanings:[parts[1]]});
    added++;
  });
  if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ ${added}개 추가! (중복 ${dup}개 제외)</div>`;
  if(added>0)document.getElementById('bulk-input').value='';
}

function uploadPackCSV() {
  const file=document.getElementById('pack-csv')?.files[0];
  const msg=document.getElementById('csv-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const p=WORD_PACKS.find(x=>x.id===selPack);
    if(!p.words)p.words=[];
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const start=lines[0].toLowerCase().includes('en')||lines[0].toLowerCase().startsWith('영')?1:0;
    let added=0,dup=0;
    lines.slice(start).forEach(line=>{
      const parts=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      if(parts.length<2||!parts[0]||!parts[1])return;
      if(p.words.find(w=>w.en.toLowerCase()===parts[0].toLowerCase())){dup++;return;}
      p.words.push({en:parts[0],kr:parts[1],ph:parts[2]||'',ex:parts[3]||parts[0]+'.',img:parts[4]||'📝',tip:parts[5]||'',meanings:[parts[1]]});
      added++;
    });
    if(msg)msg.innerHTML=`<div style="color:#16A34A;font-size:12px">✅ ${added}개 추가! (중복 ${dup}개 제외)</div>`;
  };
  reader.readAsText(file,'UTF-8');
}

function exportPackCSV(packId) {
  const p=WORD_PACKS.find(x=>x.id===packId);
  if(!p||!p.words?.length){toast('단어가 없어요','err');return;}
  const rows=['en,kr,ph,ex,img,tip'];
  p.words.forEach(w=>rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.img||'',w.tip||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${packId}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  toast('✅ CSV 내보내기 완료','ok');
}

async function aiGenPackWords() {
  const th=document.getElementById('pak-theme')?.value.trim();

  const re=document.getElementById('pai-result');
  if(!th){toast('테마를 입력하세요','err');return;}
  if(re)re.innerHTML='<div style="text-align:center;padding:16px;color:#9CA3AF">AI 생성 중... ⏳</div>';
  try{
    const p=WORD_PACKS.find(x=>x.id===selPack);
    const existing=(p?.words||[]).map(w=>w.en).slice(0,20).join(', ');
    const text=await callAI(`영어 단어 ${cnt}개를 JSON 배열로만 반환. 다른 텍스트 없이 순수 JSON만.
테마: "${th}"
${existing?`이미 있는 단어(중복 금지): ${existing}`:''}
형식: [{"en":"word","kr":"뜻","ph":"[발음기호]","ex":"예문","img":"이모지","tip":"암기팁"}]`, 3000);
    const ws=JSON.parse(text);

    const newWs=ws.filter(w=>!existSet.has(w.en.toLowerCase()));

        <div style="font-size:12px;color:#374151;max-height:100px;overflow-y:auto;margin-top:6px">
          ${newWs.slice(0,8).map(w=>`• ${w.en} - ${w.kr}`).join('<br>')}
          ${newWs.length>8?`<br>... 외 ${newWs.length-8}개`:''}
        </div>
      </div>
      <button class="btn bg" style="width:100%" onclick="saveAIPackWords(${JSON.stringify(newWs).replace(/"/g,'&quot;')})">📥 팩에 저장</button>`;
  }catch(e){
    if(re)re.innerHTML=`<div style="color:#DC2626;padding:10px;background:#FEF2F2;border-radius:8px;font-size:12px">❌ 생성 실패: ${e.message}</div>`;
  }
}

function saveAIPackWords(wsJson) {
  try{
    const ws=typeof wsJson==='string'?JSON.parse(wsJson.replace(/&quot;/g,'"')):wsJson;
    const p=WORD_PACKS.find(x=>x.id===selPack);
    if(!p.words)p.words=[];
    const existSet=new Set(p.words.map(w=>w.en.toLowerCase()));
    let added=0;
    ws.forEach(w=>{
      if(!existSet.has(w.en.toLowerCase())){
        p.words.push({en:w.en,kr:w.kr,ph:w.ph||'',ex:w.ex||w.en+'.',img:w.img||'📝',tip:w.tip||'',meanings:[w.kr]});
        added++;
      }
    });
    toast(`✅ ${added}개 저장 완료!`,'ok');
    showPackWordTab('list');
  }catch(e){toast('저장 실패: '+e.message,'err');}
}

function removeInternalDups(packId) {
  const p=WORD_PACKS.find(x=>x.id===packId);
  if(!p||!p.words)return;
  const seen=new Set();
  const before=p.words.length;
  p.words=p.words.filter(w=>{
    const key=w.en.toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  toast(`✅ ${before-p.words.length}개 중복 제거!`,'ok');
  showPackWordTab('dup');
}

function doImportPack() {
  const file=document.getElementById('import-json')?.files[0];
  const msg=document.getElementById('import-msg');
  if(!file){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">파일을 선택하세요</div>';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const pack=Array.isArray(data)?data[0]:data;
      if(!pack.id||!pack.name){if(msg)msg.innerHTML='<div style="color:#DC2626;font-size:12px">올바른 형식이 아니에요</div>';return;}
      if(WORD_PACKS.find(p=>p.id===pack.id)){
        if(!confirm(`"${pack.name}" (${pack.id})가 이미 있어요. 덮어쓸까요?`))return;
        const idx=WORD_PACKS.findIndex(p=>p.id===pack.id);
        WORD_PACKS[idx]={...WORD_PACKS[idx],...pack};
      } else {
        WORD_PACKS.push({emoji:'📚',cat:'기타',count:100,words:[],...pack});
      }
      toast(`✅ "${pack.name}" 가져오기 완료!`,'ok');
      cm(); rPK();
    }catch(err){if(msg)msg.innerHTML=`<div style="color:#DC2626;font-size:12px">파싱 실패: ${err.message}</div>`;}
  };
  reader.readAsText(file,'UTF-8');
}

      <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer">취소</button>

function swBulkPreview() {
  const raw = document.getElementById('sw-bulk')?.value||'';
  const lines = raw.split('\n').filter(l=>l.trim());
  const parsed = lines.map(ln=>{
    const p = ln.split(/[,\t]/);
    return {en:(p[0]||'').trim(), kr:(p[1]||'').trim(), ph:(p[2]||'').trim(), ex:(p[3]||'').trim()};
  }).filter(w=>w.en&&w.kr);
  const existing = new Set(swWords.map(w=>w.en.toLowerCase()));
  const newOnes = parsed.filter(w=>!existing.has(w.en.toLowerCase()));
  const dupOnes = parsed.filter(w=>existing.has(w.en.toLowerCase()));
  const el = document.getElementById('sw-bulk-preview');
  if(el) el.innerHTML = `✅ 추가 가능: <strong>${newOnes.length}개</strong>  |  ⚠️ 중복(건너뜀): ${dupOnes.length}개`;
}

async function swBulkSave() {
  const raw = document.getElementById('sw-bulk')?.value||'';
  const lines = raw.split('\n').filter(l=>l.trim());
  const parsed = lines.map(ln=>{
    const p = ln.split(/[,\t]/);
    return {en:(p[0]||'').trim(), kr:(p[1]||'').trim(), ph:(p[2]||'').trim(), ex:(p[3]||'').trim(), img:'📝'};
  }).filter(w=>w.en&&w.kr);
  const existing = new Set(swWords.map(w=>w.en.toLowerCase()));
  const newOnes = parsed.filter(w=>!existing.has(w.en.toLowerCase()));
  if(newOnes.length===0){toast('추가할 새 단어가 없어요','err');return;}
  try {
    const batch = db.batch();
    newOnes.forEach((w,i)=>{
      const ref = db.collection('system_words').doc();
      batch.set(ref, {...w, level:swLevel, order:swWords.length+i, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
    cm(); toast(`✅ ${newOnes.length}개 추가 완료`);
    await swLoadWords();
  } catch(e) { toast('오류: '+e.message,'err'); }
}

function swExportCSV() {
  if(swWords.length===0){toast('단어가 없어요','err');return;}
  const lvInfo = SW_LEVELS.find(l=>l.id===swLevel);
  const header = 'en,kr,ph,ex,img\n';
  const rows = swWords.map(w=>`"${w.en||''}","${w.kr||''}","${w.ph||''}","${w.ex||''}","${w.img||''}"`).join('\n');
  const blob = new Blob([header+rows], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `system_words_${swLevel}_${lvInfo.name}.csv`;
  a.click();
  toast(`✅ CSV 내보내기 완료 (${swWords.length}개)`);
}

    <input type="file" accept=".csv" onchange="swImportCSV(this)" style="margin-bottom:12px">

async function swImportCSV(input) {
  const file = input.files[0];
  if(!file) return;
  const text = await file.text();
  const lines = text.split('\n').slice(1).filter(l=>l.trim());
  const existing = new Set(swWords.map(w=>w.en.toLowerCase()));
  const toAdd = [];
  lines.forEach(ln=>{
    const p = ln.split(',').map(v=>v.replace(/^"|"$/g,'').trim());
    const en=(p[0]||'').trim(), kr=(p[1]||'').trim();
    if(en&&kr&&!existing.has(en.toLowerCase())){
      toAdd.push({en, kr, ph:(p[2]||'').trim(), ex:(p[3]||'').trim(), img:(p[4]||'📝').trim()});
    }
  });
  if(toAdd.length===0){toast('추가할 새 단어가 없어요','err');return;}
  try {
    const batch = db.batch();
    toAdd.forEach((w,i)=>{
      const ref = db.collection('system_words').doc();
      batch.set(ref, {...w, level:swLevel, order:swWords.length+i, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
    cm(); toast(`✅ ${toAdd.length}개 가져오기 완료`);
    await swLoadWords();
  } catch(e) { toast('오류: '+e.message,'err'); }
}

  document.getElementById('main').innerHTML=`
    <h2 style="font-size:22px;font-weight:900;margin-bottom:20px">⚙️ 앱 설정</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card"><div class="ct">📱 기본 설정</div>
        <div class="fg"><label>앱 이름</label><input id="sn" value="${s.appName}"></div>
        <div class="fg"><label>XP 배율</label><input id="sx" type="number" value="${s.xpMultiplier}" min="0.5" max="10" step="0.5"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:12px;background:#FEF2F2;border-radius:10px">
          <input type="checkbox" id="sm" ${s.maintenanceMode?'checked':''} style="width:18px;height:18px">
          <div><label style="display:inline;margin-bottom:0;font-size:13px;font-weight:700;color:#DC2626" for="sm">🚧 점검 모드</label><div style="font-size:11px;color:#9CA3AF">활성화 시 일반 사용자 접근 차단</div></div>
        </div>
        <button class="btn bb" onclick="saveST()" style="width:100%">설정 저장</button>
      </div>
      <div class="card"><div class="ct">📢 앱 내 공지</div>
        <div class="fg"><label>공지 메시지</label><textarea id="so" style="min-height:100px;resize:none" placeholder="앱에 표시할 공지사항...">${s.notice||''}</textarea></div>
        <div class="fg"><label>공지 유형</label><select id="sot"><option value="info">ℹ️ 안내</option><option value="warning">⚠️ 경고</option><option value="event">🎉 이벤트</option></select></div>
        <button class="btn bg" onclick="saveST()" style="width:100%">공지 저장</button>
      </div>
    </div>
    <div class="card"><div class="ct">🗄️ Firestore 컬렉션 구조</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${[['users','회원 정보'],['words','레벨별 단어장'],['admins','관리자 계정'],['pokes','콕 찌르기'],['notices','공지사항'],['settings','앱 설정']].map(([c,d])=>`<div style="background:#F9FAFB;border-radius:10px;padding:10px"><div style="font-size:13px;font-weight:700;color:#1E5FA5;font-family:monospace">${c}</div><div style="font-size:11px;color:#9CA3AF;margin-top:2px">${d}</div></div>`).join('')}
      </div>
    </div>`;
}

async function saveST(){
  try{
    await db.collection('settings').doc('app').set({appName:document.getElementById('sn').value,notice:document.getElementById('so').value,noticeType:document.getElementById('sot').value,xpMultiplier:+document.getElementById('sx').value,maintenanceMode:document.getElementById('sm').checked,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    toast('✅ 설정 저장 완료!','ok');
  }catch(e){toast('오류: '+e.message,'err');}
}
</script>
