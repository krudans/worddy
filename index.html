<style>
/* ══ 리셋 & 기본 ══ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:#E8EDFF;
  display:flex;justify-content:center;align-items:center;
}

/* ══ 앱 컨테이너 ══ */
#app{
  width:100%;max-width:430px;
  height:100%;max-height:100dvh;
  background:#F8FAFF;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* Safe area (iPhone 노치/다이나믹 아일랜드 대응) */
.top-bar{
  background:#fff;
  border-bottom:1px solid #E5E7EB;
  padding:env(safe-area-inset-top,0) 14px 10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:30;
  flex-shrink:0;
}
.nav-bar{
  background:#fff;
  border-top:1px solid #E5E7EB;
  padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 6px);
  display:flex;
  position:sticky;bottom:0;z-index:30;
  flex-shrink:0;
}

.logo{font-size:20px;font-weight:900;color:#1E5FA5;letter-spacing:.5px;cursor:pointer;}
.top-r{display:flex;gap:7px;align-items:center;}
.cb{background:#FFFBEB;border:1px solid #FDE68A;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:#D97706;cursor:pointer;}
.tb{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:20px;padding:5px 10px;font-size:10px;font-weight:700;color:#1D4ED8;cursor:pointer;}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* 네비게이션 */
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:transparent;padding:0;}
.ni-ic{font-size:20px;line-height:1.2;}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF;}
.ni-lb.on{color:#1E5FA5;font-weight:800;}
.ni-dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5;}

/* 학습 서브탭 */
.stabs{display:flex;background:#fff;border-bottom:1px solid #E5E7EB;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;}
.stabs::-webkit-scrollbar{display:none;}
.st{flex:1;min-width:65px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px;white-space:nowrap;}
.st.on{border-bottom-color:#1E5FA5;}
.st-ic{font-size:16px;}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF;}
.st-lb.on{color:#1E5FA5;}

/* 공통 카드 */
.card{background:#fff;border-radius:14px;border:1px solid #E5E7EB;padding:14px;}
.btn{border:none;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;width:100%;transition:all .15s;font-family:inherit;-webkit-appearance:none;}
.btn:disabled{background:#E5E7EB!important;color:#9CA3AF!important;cursor:not-allowed;}
.btn:active:not(:disabled){transform:scale(0.97);}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
.pbar{height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden;}
.pf{height:100%;border-radius:3px;transition:width .4s;}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;display:inline-block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tbar{display:flex;background:#F3F4F6;border-radius:12px;padding:3px;gap:3px;}
.ti{flex:1;text-align:center;padding:7px 0;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;color:#6B7280;}
.ti.on{background:#fff;color:#111;box-shadow:0 1px 5px rgba(0,0,0,.08);}
.toggle{width:44px;height:24px;border-radius:12px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:#1E5FA5;}
.tk{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on .tk{transform:translateX(20px);}
.al-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6;}
.al-row:last-child{border:none;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);}

/* 토스트 */
.toast-w{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:#1A1A2E;color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:fu .3s ease;}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* PWA 설치 배너 */
#install-banner{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);
  left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:398px;
  background:linear-gradient(135deg,#1E5FA5,#2563EB);
  border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(30,95,165,.35);
  z-index:50;
  animation:slideUp .4s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#install-banner .ib-icon{font-size:28px;flex-shrink:0;}
#install-banner .ib-text{flex:1;color:#fff;}
#install-banner .ib-title{font-size:13px;font-weight:800;margin-bottom:2px;}
#install-banner .ib-sub{font-size:11px;opacity:.8;}
#install-banner .ib-btn{background:#fff;color:#1E5FA5;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
#install-banner .ib-close{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;}

/* 루틴 아이템 */
.ritem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F3F4F6;cursor:pointer;}
.ritem:last-child{border:none;}
.rck{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .2s;}
.rck-done{background:#16A34A;color:#fff;}
.rck-todo{border:2.5px solid #D1D5DB;}

/* 게임 격자 */
.gc{background:#fff;border-radius:14px;padding:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.gc:active{transform:scale(0.97);}

/* 워들 셀 */
.wc{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s;}

input,textarea{font-family:inherit;-webkit-appearance:none;appearance:none;}
input:focus,textarea:focus{outline:none;}

/* 스크롤바 숨김 */
.body::-webkit-scrollbar{display:none;}
.body{scrollbar-width:none;}
</style>

'use strict';

// ══════════════════════════════════════
//  Service Worker 등록
// ══════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[WordDay] SW 등록:', reg.scope))
      .catch(err => console.log('[WordDay] SW 실패:', err));
  });
}

// ══════════════════════════════════════
//  PWA 설치 배너
// ══════════════════════════════════════
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // 앱 로드 2초 후 배너 표시
  setTimeout(() => {
    const banner = document.getElementById('install-banner');
    if(banner && !localStorage.getItem('wd-installed')) banner.style.display = 'flex';
  }, 2000);
});

window.addEventListener('appinstalled', () => {
  localStorage.setItem('wd-installed','1');
  hideBanner();
  toast('🎉 WordDay가 설치됐어요!');
});

function installPWA(){
  hideBanner();
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r => {
      if(r.outcome==='accepted') toast('🎉 설치 완료! 홈 화면에서 실행하세요');
      deferredPrompt = null;
    });
  }
}
function hideBanner(){
  const b = document.getElementById('install-banner');
  if(b) b.style.display='none';
}

// localStorage 저장
function save(){
  localStorage.setItem('wd-coins',S.coins);
  localStorage.setItem('wd-streak',S.streak);
  localStorage.setItem('wd-words',S.totalWords);
  localStorage.setItem('wd-deck',S.deckId);
  localStorage.setItem('wd-learned',JSON.stringify(S.learned));

const deck=()=>DECKS[S.deckId];
const wds=()=>deck().words;
const todayW=()=>wds().slice(0,6);
const srcW=()=>wds().length>=3?wds():DECKS.middle.words;
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const pick=(a,n)=>shuf(a).slice(0,n);
const pad=n=>String(n).padStart(2,"0");

function earn(amt,msg){
  S.coins+=amt; S.dailyCoins+=amt;
  document.getElementById("cdsp").textContent=`🪙 ${S.coins.toLocaleString()}`;
  save();
  toast(`+${amt}코인 ${msg}`);
  if(S.totalWords<1001 && msg.includes("암기")){
    S.totalWords++;
    if(S.totalWords===100) setTimeout(()=>earn(300,"🎉 단어 100개 달성!"),300);
  }
}
function spend(amt,lbl){
  if(S.coins<amt){toast(`코인 부족 (${S.coins}/${amt})`);return false;}
  S.coins-=amt; document.getElementById("cdsp").textContent=`🪙 ${S.coins.toLocaleString()}`; save(); return true;
}
function toast(msg){
  const w=document.getElementById("tw");
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; w.appendChild(t);
  setTimeout(()=>t.remove(),2300);
}
function closeModal(){document.getElementById("mr").innerHTML="";}

// ══ 알람 예약 ══
function scheduleAlarm(h,m,title,body,tag){
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  const now=new Date(), target=new Date();
  target.setHours(h,m,0,0);
  if(target<=now) target.setDate(target.getDate()+1);
  const ms=target-now;
  setTimeout(()=>{
    new Notification(title,{body,icon:'/icons/icon-192.png',tag,badge:'/icons/icon-96.png'});
  },ms);
}

function requestNotificationPermission(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(perm=>{

// ══ AI 함수 ══
async function callAI(prompt,sysPrompt=""){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,system:sysPrompt||"You are a helpful English learning assistant. Respond in Korean.",messages:[{role:"user",content:prompt}]})});
  const d=await r.json(); return d.content?.[0]?.text||"";
}
async function genStory(){S.aiLoading=true;go("study","story");const ws=pick(srcW(),5);const wl=ws.map(w=>`${w.en}(${w.kr})`).join(", ");
  try{S.storyText=await callAI(`5개 단어(${wl})를 포함한 ${S.storyGenre} 영어 이야기 5~7문장. 단어는 [단어] 형식. 마지막에 한국어 요약 한 줄.`);}
  catch(e){S.storyText="AI 연결 오류. API 키 확인 후 재시도해주세요.";}
  S.aiLoading=false;go("study","story");}
async function storyFB(){S.aiLoading=true;go("study","story");const ws=pick(srcW(),5).map(w=>w.en).join(", ");
  try{S.storyFeedback=await callAI(`학생이 단어들(${ws})로 썼어: "${S.storyMyText}". 한국어로: 1)몇 개 사용, 2)문법 교정, 3)자연스러운 버전.`);}
  catch(e){S.storyFeedback="AI 연결 오류.";}
  S.aiLoading=false;go("study","story");}
async function aiMean(){const w=document.getElementById("aw")?.value.trim()||S.addWord;if(!w)return;S.aiLoading=true;go("study","add");
  try{S.addKr=(await callAI(`영어 단어 "${w}"의 한국어 뜻 딱 하나만. 예: "인내"`)).trim();S.addWord=w;}
  catch(e){S.addKr="AI 오류";}S.aiLoading=false;go("study","add");}
function doAdd(){const w=document.getElementById("aw")?.value.trim()||S.addWord,k=document.getElementById("ak")?.value.trim()||S.addKr;if(!w||!k)return;DECKS.my.words.push({en:w,kr:k,ph:"",pos:"",ex:w+".",pun:w+" = "+k,syn:[],ant:[]});S.addWord="";S.addKr="";toast("단어 추가 완료");go("study","add");}
function doBulk(){const t=document.getElementById("bulk")?.value||S.addBulk;const p=t.split("\n").filter(l=>l.trim()).map(l=>{const a=l.split(/[,=:\t]/);return a.length>=2?{en:a[0].trim(),kr:a[1].trim(),ph:"",pos:"",ex:a[0].trim()+".",pun:a[0].trim()+" = "+a[1].trim(),syn:[],ant:[]}:null;}).filter(Boolean);DECKS.my.words.push(...p);S.addBulk="";toast(`${p.length}개 추가`);go("study","add");}

function startGame(id){
  S.gameId=id;S.gameScore=0;S.gameIdx=0;S.gameAnswered=false;S.gameResult=null;S.gameDone=false;S.gameInput="";
  S.gameWords=pick(srcW(),Math.min(8,srcW().length));
  if(id==="match"){S.matchPairs=pick(srcW(),Math.min(5,srcW().length));S.matchEn=shuf(S.matchPairs.map(p=>p.en));S.matchKr=shuf(S.matchPairs.map(p=>p.kr));S.matchMatched=new Set();S.matchSelEn=null;S.matchSelKr=null;S.matchScore=0;}
  if(id==="wordle"){const ws2=srcW().filter(w=>w.en.length>=4&&w.en.length<=7);S.wordleWord=ws2.length?ws2[Math.floor(Math.random()*ws2.length)]:srcW()[0];S.wordleGuesses=[];S.wordle="";S.wordleOver=false;S.wordleWon=false;}
  go("game");
}
function calcReward(id,score){const cfg=GAME_CFG[id]||{base:30,max:50};const ratio=S.gameWords.length?score/(S.gameWords.length*100):0;return cfg.base+Math.round(cfg.max*ratio*ratio);}
function renderGame(){
  if(S.gameDone){const r=calcReward(S.gameId,S.gameScore);if(!S.routineDone.game){S.routineDone.game=true;earn(r,"게임 완료 🎮");}
    return`<div style="padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;">

        <div style="font-size:11px;color:#D97706;font-weight:700;margin-bottom:6px;">🪙 코인 내역</div>

        <div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:#6B7280;">점수 보너스</span><span style="font-weight:700;color:#D97706;">+${r-(GAME_CFG[S.gameId]?.base||30)}</span></div>
        <div style="border-top:1px solid #FDE68A;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-size:14px;font-weight:900;"><span style="color:#D97706;">합계</span><span style="color:#D97706;">+${r}코인</span></div>
      </div>
      ${!S.routineDone.diary?`<div class="card" style="width:100%;background:#F0FDF4;border-color:#BBF7D0;"><div style="font-size:13px;font-weight:800;color:#14532D;margin-bottom:6px;">✍️ 마지막 루틴!</div><button class="btn" onclick="go('diary')" style="background:#16A34A;color:#fff;">영어 일기 쓰러 가기 →</button></div>`:""}
      <div style="display:flex;gap:8px;width:100%;">
        <button class="btn" onclick="go('games')" style="background:#F3F4F6;color:#6B7280;">다른 게임</button>
        <button class="btn" onclick="go('home')" style="background:#1E5FA5;color:#fff;">홈으로</button>
      </div>
    </div>`;}
  if(S.gameId==="match") return renderMatch();
  if(S.gameId==="wordle") return renderWordle();
  const w=S.gameWords[S.gameIdx];
  if(!w){S.gameDone=true;return renderGame();}
  if(S.gameId==="quiz4"||S.gameId==="blank") return renderQ4(w);
  return renderTyp(w);
}
function renderQ4(w){const cs=shuf([w,...pick(S.gameWords.filter(x=>x.en!==w.en),3)]);const co=GAME_CFG[S.gameId]?.color||"1E5FA5";
  return`<div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <button onclick="go('games')" style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:9px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;">← 나가기</button>
      <div style="font-size:14px;font-weight:800;color:#${co};">${S.gameScore}점</div>

      ${S.gameId==="blank"?`<div style="font-size:11px;color:#9CA3AF;margin-bottom:7px;">빈칸에 들어갈 단어는?</div><div style="font-size:14px;color:#1A1A2E;font-style:italic;line-height:1.8;">"${w.ex.replace(w.en,"_______")}"</div><div style="font-size:12px;color:#9CA3AF;margin-top:7px;">뜻: ${w.kr}</div>`
      :`<div style="font-size:11px;color:#9CA3AF;margin-bottom:7px;">이 단어의 뜻은?</div><div style="font-size:28px;font-weight:900;color:#${co};font-family:monospace;">${w.en}</div><div style="font-size:12px;color:#9CA3AF;margin-top:3px;">${w.ph}</div>`}
    </div>
    <div class="g2">${cs.map(c=>{let bg="fff",col="111827",bd="E5E7EB";if(S.gameAnswered){if(c.en===w.en){bg="F0FDF4";col="16A34A";bd="BBF7D0";}else if(S.gameResult==="wrong"){bg="FFF1F2";col="DC2626";bd="FECDD3";}}return`<button onclick="${S.gameAnswered?"":`ansQ('${c.en}','${w.en}')`}" style="background:#${bg};color:#${col};border:1.5px solid #${bd};border-radius:12px;padding:12px 8px;font-size:13px;font-weight:700;cursor:${S.gameAnswered?"default":"pointer"};transition:all .2s;">${c.kr}</button>`;}).join("")}</div>
  </div>`;}
function ansQ(c,ok){S.gameAnswered=true;S.gameResult=c===ok?"correct":"wrong";if(c===ok)S.gameScore+=100;go("game");setTimeout(()=>{S.gameIdx++;S.gameAnswered=false;S.gameResult=null;if(S.gameIdx>=S.gameWords.length)S.gameDone=true;go("game");},900);}
function renderTyp(w){const sc=shuf([...w.en]).join(""),co=GAME_CFG[S.gameId]?.color||"16A34A";
  return`<div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <button onclick="go('games')" style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:9px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;">← 나가기</button>
      <div style="font-size:14px;font-weight:800;color:#${co};">${S.gameScore}점</div>
      <div style="font-size:11px;color:#9CA3AF;">${S.gameIdx+1}/${S.gameWords.length}</div>
    </div>
    <div class="pbar"><div class="pf" style="width:${Math.round(S.gameIdx/S.gameWords.length*100)}%;background:#${co};"></div></div>
    <div class="card" style="text-align:center;padding:22px;background:#${co}0D;">
      <div style="font-size:11px;color:#9CA3AF;margin-bottom:7px;">${S.gameId==="scramble"?"섞인 철자를 올바르게":"이 뜻의 영단어는?"}</div>
      ${S.gameId==="scramble"?`<div style="font-size:24px;font-weight:900;color:#${co};letter-spacing:5px;font-family:monospace;">${sc}</div>`:`<div style="font-size:20px;font-weight:800;color:#111;">${w.kr}</div>`}
      <div style="font-size:11px;color:#9CA3AF;margin-top:7px;font-style:italic;">"${w.ex.replace(w.en,"_____")}"</div>
    </div>
    <input id="ti" value="${S.gameInput}" oninput="S.gameInput=this.value" onkeydown="if(event.key==='Enter')chkT('${w.en}')" placeholder="영단어 입력..." style="border:2px solid ${S.gameResult==="correct"?"#16A34A":S.gameResult==="wrong"?"#DC2626":"#BFDBFE"};border-radius:12px;padding:12px 14px;font-size:16px;font-family:monospace;font-weight:700;width:100%;background:${S.gameResult==="correct"?"#F0FDF4":S.gameResult==="wrong"?"#FFF1F2":"#fff"};transition:all .2s;"/>
    <button class="btn" onclick="chkT('${w.en}')" ${S.gameAnswered?"disabled":""} style="background:#${co};color:#fff;">확인</button>
  </div>`;}
function chkT(ok){const v=document.getElementById("ti")?.value.trim().toLowerCase()||"";const r=v===ok.toLowerCase();S.gameAnswered=true;S.gameResult=r?"correct":"wrong";if(r)S.gameScore+=100;go("game");setTimeout(()=>{S.gameIdx++;S.gameAnswered=false;S.gameResult=null;S.gameInput="";if(S.gameIdx>=S.gameWords.length)S.gameDone=true;go("game");},900);}
function renderMatch(){const all=S.matchMatched.size>=S.matchPairs.length*2;if(all&&!S.gameDone){S.gameDone=true;S.gameScore=S.matchScore;setTimeout(()=>go("game"),400);}
  return`<div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <button onclick="go('games')" style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:9px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;">← 나가기</button>
      <div style="font-size:14px;font-weight:800;color:#0D9488;">⚡ ${S.matchScore}점</div>
      <div style="font-size:11px;color:#9CA3AF;">${S.matchMatched.size/2}/${S.matchPairs.length}</div>

         {key:"alarmForget",ic:"🔁",nm:"망각 곡선 복습",sub:"PRO 전용"},
      ].map(al=>{const c=S[al.key];return`<div class="al-row">
        <span style="font-size:18px;">${al.ic}</span>
        <div style="flex:1;"><div style="font-size:12px;font-weight:700;color:#111;">${al.nm}</div><div style="font-size:10px;color:#9CA3AF;">${al.sub}</div></div>
        <button class="toggle ${c.on?"on":""}" onclick="S.${al.key}.on=!S.${al.key}.on;go('settings')"><div class="tk"></div></button>
      </div>`;}).join("")}
      <button class="btn" onclick="requestNotificationPermission()" style="background:#EFF6FF;color:#1E5FA5;margin-top:10px;font-size:12px;">🔔 알람 권한 허용하기</button>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:8px;">🪙 코인 현황</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12px;color:#6B7280;">현재 보유</span><span style="font-size:20px;font-weight:900;color:#D97706;">${S.coins.toLocaleString()}코인</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12px;color:#6B7280;">오늘 획득</span><span style="font-size:13px;font-weight:700;color:#16A34A;">+${S.dailyCoins}코인</span></div>
      <div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:#6B7280;">누적 단어</span><span style="font-size:13px;font-weight:700;color:#1E5FA5;">${S.totalWords}개</span></div>
    </div>
    <div class="card" style="background:#FDF4FF;border-color:#E9D5FF;">
      <div style="font-size:13px;font-weight:800;color:#7C3AED;margin-bottom:6px;">⭐ PRO 구독</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">${["망각 곡선","AI 회화","발음 평가","연상 이미지"].map(f=>`<span class="tag" style="background:#E9D5FF;color:#581C87;">${f}</span>`).join("")}</div>
      <div style="font-size:11px;color:#7C3AED;margin-bottom:8px;">4,500코인/월 또는 ₩3,900/월</div>
      <button class="btn" onclick="${S.coins>=4500?"spend(4500,'PRO 구독');toast('PRO 구독 완료! 🎉')":"showNeedCoin(4500)"}" style="background:#7C3AED;color:#fff;">코인으로 PRO 구독하기</button>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:8px;">📲 앱 설치</div>
      <div style="font-size:11px;color:#6B7280;line-height:1.7;margin-bottom:10px;">홈 화면에 추가하면 앱처럼 바로 실행돼요!</div>
      <button class="btn" onclick="installPWA()" style="background:#1E5FA5;color:#fff;">📲 홈 화면에 추가하기</button>
    </div>
  </div>`;}

// ══ 초기화 ══
renderNav();
go("home");
</script>

<!-- ════════════════════════════════════
     DEV TOOLS — 테스트 모드 전용 디버그 패널
     (배포 시 이 블록 전체 삭제)
     ════════════════════════════════════ -->
<style>
#dev-panel{position:fixed;bottom:0;left:0;right:0;z-index:9999;transition:transform .3s cubic-bezier(.4,0,.2,1);}
#dev-panel.collapsed{transform:translateY(calc(100% - 36px));}
#dev-toggle{background:#0D1B4B;color:#60A5FA;border:none;width:100%;padding:8px 14px;font-size:12px;font-weight:700;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:monospace;}
#dev-toggle .badge{background:#EF4444;color:#fff;border-radius:20px;padding:1px 8px;font-size:10px;display:none;}
#dev-toggle .badge.show{display:inline;}
#dev-body{background:#0D1B4B;border-top:1px solid #1E3A7A;padding:10px 12px;max-height:280px;overflow-y:auto;}
#dev-logs{font-family:monospace;font-size:11px;color:#94A3B8;display:flex;flex-direction:column;gap:4px;}
.dl-err{color:#FCA5A5;}.dl-warn{color:#FCD34D;}.dl-ok{color:#86EFAC;}.dl-info{color:#93C5FD;}
.dev-actions{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.dev-btn{background:#1E3A7A;color:#93C5FD;border:1px solid #1E5FA5;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:monospace;}
.dev-btn:hover{background:#1E5FA5;}
.dev-btn.danger{background:#3B0A0A;color:#FCA5A5;border-color:#7F1D1D;}
.dev-btn.danger:hover{background:#7F1D1D;}
.dev-sep{height:1px;background:#1E3A7A;margin:8px 0;}
.dev-stat{display:flex;gap:14px;font-size:10px;color:#64748B;margin-bottom:8px;font-family:monospace;}
.dev-stat span{color:#93C5FD;}
</style>

<div id="dev-panel" class="collapsed">
  <button id="dev-toggle" onclick="toggleDev()">
    <span>🛠 WordDay DevTools</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge" id="err-badge">0</span>
      <span id="dev-arrow">▲</span>
    </div>
  </button>
  <div id="dev-body">
    <div class="dev-stat">
      <div>화면: <span id="ds-screen">home</span></div>
      <div>코인: <span id="ds-coins">0</span></div>
      <div>단어: <span id="ds-words">0</span></div>
      <div>스트릭: <span id="ds-streak">0</span></div>
      <div>에러: <span id="ds-errcnt">0</span></div>
    </div>
    <div class="dev-actions">
      <button class="dev-btn" onclick="devReload()">↺ 새로고침</button>
      <button class="dev-btn" onclick="devAddCoins()">+1000 코인</button>
      <button class="dev-btn" onclick="devCompleteAll()">루틴 완료</button>
      <button class="dev-btn" onclick="devAddWords()">단어 5개 추가</button>
      <button class="dev-btn" onclick="devSetStreak7()">7일 연속 설정</button>
      <button class="dev-btn" onclick="devClearLogs()">로그 지우기</button>
      <button class="dev-btn danger" onclick="devReset()">⚠ 전체 초기화</button>
    </div>
    <div class="dev-sep"></div>
    <div id="dev-logs">
      <div class="dl-ok">✅ DevTools 시작됨 — 에러는 여기에 표시됩니다</div>
    </div>
  </div>
</div>

<script>
// ── DevTools 전역 ──────────────────────────
let _errCount = 0;
let _devOpen  = false;

function toggleDev() {
  _devOpen = !_devOpen;
  const panel = document.getElementById('dev-panel');
  const arrow = document.getElementById('dev-arrow');
  panel.classList.toggle('collapsed', !_devOpen);
  arrow.textContent = _devOpen ? '▼' : '▲';
  if (_devOpen) updateDevStats();
}

function devLog(msg, type='info') {
  const logs = document.getElementById('dev-logs');
  const ts   = new Date().toLocaleTimeString('ko-KR', {hour12:false});
  const cls  = {error:'dl-err', warn:'dl-warn', ok:'dl-ok', info:'dl-info'}[type] || 'dl-info';
  const el   = document.createElement('div');
  el.className = cls;
  el.textContent = `[${ts}] ${msg}`;
  logs.appendChild(el);
  logs.scrollTop = logs.scrollHeight;
  // 최대 100줄 유지
  while (logs.children.length > 100) logs.removeChild(logs.firstChild);
}

function updateDevStats() {
  const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  setTxt('ds-screen', S?.screen || '-');
  setTxt('ds-coins',  S?.coins?.toLocaleString() || '0');
  setTxt('ds-words',  S?.totalWords || '0');
  setTxt('ds-streak', S?.streak || '0');
  setTxt('ds-errcnt', _errCount);
}

// ── 전역 에러 캐치 ────────────────────────
window.addEventListener('error', (e) => {
  _errCount++;
  const badge = document.getElementById('err-badge');
  if (badge) { badge.textContent = _errCount; badge.classList.add('show'); }
  const msg = `❌ ${e.message} (${e.filename?.split('/').pop()}:${e.lineno})`;
  devLog(msg, 'error');
  // 패널 자동 열기 (에러 시)
  if (!_devOpen) {
    document.getElementById('dev-panel').classList.remove('collapsed');
    document.getElementById('dev-arrow').textContent = '▼';
    _devOpen = true;
  }
  // 서버로 전송
  fetch('/___log', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ type:'error', message:e.message, source:e.filename, line:e.lineno })
  }).catch(()=>{});
});

window.addEventListener('unhandledrejection', (e) => {
  _errCount++;
  devLog(`❌ Promise 에러: ${e.reason}`, 'error');
});

// console.log/warn/error 가로채기
const _origLog   = console.log.bind(console);
const _origWarn  = console.warn.bind(console);
const _origError = console.error.bind(console);

console.log = (...args) => {
  _origLog(...args);
  devLog('ℹ ' + args.map(String).join(' '), 'info');
};
console.warn = (...args) => {
  _origWarn(...args);
  devLog('⚠ ' + args.map(String).join(' '), 'warn');
};
console.error = (...args) => {
  _origError(...args);
  _errCount++;
  devLog('❌ ' + args.map(String).join(' '), 'error');
};

// ── 개발 도구 버튼 함수 ───────────────────
function devReload() {
  devLog('새로고침...', 'info');
  setTimeout(() => location.reload(), 200);
}
function devAddCoins() {
  S.coins += 1000; S.dailyCoins += 1000;
  localStorage.setItem('wd-coins', S.coins);
  document.getElementById("cdsp").textContent = `🪙 ${S.coins.toLocaleString()}`;
  devLog(`+1000코인 → 총 ${S.coins.toLocaleString()}코인`, 'ok');
  updateDevStats();
  toast('🛠 +1000코인 (테스트)');
}
function devCompleteAll() {
  S.routineDone = {study:true, game:true, diary:true};
  devLog('루틴 3개 완료 처리', 'ok');
  go(S.screen);
  updateDevStats();
}
function devAddWords() {
  const testWords = [
    {en:'ephemeral',kr:'덧없는',ph:'[ɪˈfem(ə)r(ə)l]',pos:'형용사',ex:'Fame is ephemeral.',pun:'에페(없어)! 머(뭐)? 럴(럴)?',syn:['transient'],ant:['permanent']},
    {en:'tenacious',kr:'끈질긴',ph:'[tɪˈneɪʃəs]',pos:'형용사',ex:'She is tenacious.',pun:'테나(tough)! 셔스(셔!)',syn:['persistent'],ant:['weak']},
    {en:'ambiguous',kr:'모호한',ph:'[æmˈbɪɡjuəs]',pos:'형용사',ex:'The message was ambiguous.',pun:'암! 비겨(뭐야)',syn:['vague'],ant:['clear']},
    {en:'concise',kr:'간결한',ph:'[kənˈsaɪs]',pos:'형용사',ex:'Be concise.',pun:'컨(큰)! 사이스(사이즈) 줄여!',syn:['brief'],ant:['verbose']},
    {en:'vigilant',kr:'경계하는',ph:'[ˈvɪdʒɪlənt]',pos:'형용사',ex:'Stay vigilant.',pun:'비질런트 = 비질하며 랜턴 들고!',syn:['watchful'],ant:['careless']},
  ];
  DECKS.my.words.push(...testWords);
  S.deckId = 'my'; save();
  devLog(`테스트 단어 5개 추가 → 나만의 단어장 (${DECKS.my.words.length}개)`, 'ok');
  go(S.screen);
  updateDevStats();
  toast('🛠 테스트 단어 5개 추가');
}
function devSetStreak7() {
  S.streak = 7;
  localStorage.setItem('wd-streak', 7);
  devLog('스트릭 7일로 설정', 'ok');
  updateDevStats();
  toast('🛠 스트릭 7일 설정');
}
function devClearLogs() {
  const logs = document.getElementById('dev-logs');
  logs.innerHTML = '<div class="dl-ok">✅ 로그 초기화됨</div>';
  _errCount = 0;
  const badge = document.getElementById('err-badge');
  if (badge) { badge.textContent = '0'; badge.classList.remove('show'); }
  document.getElementById('ds-errcnt').textContent = '0';
}
function devReset() {
  if (!confirm('⚠️ 모든 학습 데이터를 초기화합니다. 계속하시겠습니까?')) return;
  localStorage.clear();
  devLog('전체 데이터 초기화 → 새로고침', 'warn');
  setTimeout(() => location.reload(), 500);
}

// 화면 변경 시 통계 업데이트
const _origGo = go;
window.go = function(...args) {
  _origGo(...args);
  if (_devOpen) setTimeout(updateDevStats, 100);
  devLog(`화면 이동: ${args[0]}${args[1]?'/'+args[1]:''}`, 'info');
};

// 1초마다 통계 갱신
setInterval(() => { if (_devOpen) updateDevStats(); }, 1000);

devLog('DevTools 준비 완료 — 하단 🛠 버튼으로 열기', 'ok');
</script>
</body>
</html>
