<style>
/* ── 꽃밭 테마 배경 ── */
:root {
  --bg: #FFFBF0;
  --bg2: #FFF8E7;
  --bg-card: #FFFEF8;
  --bg-sub: #FFF9ED;
  --border: #F0E6C8;
  --text1: #3D2C00;
  --text2: #6B5200;
  --text3: #A08040;
  --accent: #F6D860;
  --accent2: #F0C840;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1505;
    --bg2: #221C08;
    --bg-card: #2A2210;
    --bg-sub: #221C08;
    --border: #3D3010;
    --text1: #F5E6C0;
    --text2: #D4B870;
    --text3: #9A8040;
  }
  body { background: var(--bg) !important; }
  #app { background: var(--bg) !important; }
}
body { background: var(--bg) !important; }
#app { background: var(--bg) !important; }
.pad { background: var(--bg) !important; }
/* 카드 기본 배경 */
.modal { background: var(--bg-card) !important; }
/* nav 배경 */
.nav { background: var(--bg-card) !important; border-top: 1.5px solid var(--border) !important; }
/* 헤더 유지 (성향색) */

/* 캐릭터 미세 움직임 */
@keyframes comboFlash {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.5); }
  30%  { opacity:1; transform:translate(-50%,-60%) scale(1.2); }
  70%  { opacity:1; transform:translate(-50%,-70%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-90%) scale(.9); }
}
@keyframes bfAppear {
  0%   { opacity:0; transform:scale(0.5) rotate(-10deg); }
  60%  { opacity:1; transform:scale(1.1) rotate(3deg); }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes float {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  33%      { transform: translateY(-5px) rotate(0.5deg); }
  66%      { transform: translateY(-3px) rotate(-0.5deg); }
}
@keyframes float-sad {
  0%,100% { transform: translateY(0px) rotate(-1deg) scale(0.98); }
  50%      { transform: translateY(-2px) rotate(1deg) scale(0.97); }
}
@keyframes float-angry {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  20%      { transform: translateY(-1px) rotate(1.5deg); }
  40%      { transform: translateY(1px) rotate(-1.5deg); }
  60%      { transform: translateY(-1px) rotate(1deg); }
  80%      { transform: translateY(0px) rotate(-1deg); }
}
@keyframes float-happy {
  0%,100% { transform: translateY(0px) scale(1) rotate(0deg); }
  25%      { transform: translateY(-7px) scale(1.02) rotate(1deg); }
  50%      { transform: translateY(-5px) scale(1.01) rotate(-0.5deg); }
  75%      { transform: translateY(-8px) scale(1.02) rotate(0.5deg); }
}
@keyframes float-danger {
  0%,100% { transform: translateY(0px) scale(0.96) rotate(-1deg); }
  50%      { transform: translateY(2px) scale(0.95) rotate(1deg); }
}
@keyframes wiggle {
  0%,100% { transform: rotate(0deg); }
  25%      { transform: rotate(-2deg); }
  75%      { transform: rotate(2deg); }
}
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.025); }
}
@keyframes antenna-wave {
  0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
  50%      { transform: rotate(3deg); transform-origin: bottom center; }
}
@keyframes tail-wag {
  0%,100% { transform: rotate(0deg); }
  33%      { transform: rotate(2deg); }
  66%      { transform: rotate(-2deg); }
}
.char-float        { animation: float 3.5s ease-in-out infinite; }
.char-float-happy  { animation: float-happy 2.8s ease-in-out infinite; }
.char-float-sad    { animation: float-sad 5s ease-in-out infinite; }
.char-float-angry  { animation: float-angry 1.6s ease-in-out infinite; }
.char-float-danger { animation: float-danger 6s ease-in-out infinite; }
.char-wiggle       { animation: wiggle 2.5s ease-in-out infinite; }
.char-breathe      { animation: breathe 4s ease-in-out infinite; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg,#FFFBF0);display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:430px;height:100%;height:100svh;height:-webkit-fill-available;background:var(--bg,#FFFBF0);display:flex;flex-direction:column;overflow:hidden;position:relative}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;width:100%;position:relative}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;box-sizing:border-box}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
/* ── 테마: 크림 라이트 (기본) ── */
body, body.theme-light {
  --bg:       #FAF8F5;
  --bg-card:  #FFFFFF;
  --bg-sub:   #F2F0EC;
  --bg-input: #FFFFFF;
  --bg-nav:   #FFFFFF;
  --text1:    #1A1A2E;
  --text2:    #4A5568;
  --text3:    #9CA3AF;
  --border:   #E8E4DE;
  --border2:  #D1CCC4;
  --btn-gray: #F2F0EC;
  --btn-gray-t:#4A5568;
  --shadow:   rgba(0,0,0,0.06);
}
body{background:var(--bg);color:var(--text1)}
#app{background:var(--bg)!important}
.body,.pad{background:var(--bg)!important}
.card{background:var(--bg-card)!important;border-color:var(--border)!important}
.nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
.stabs{background:var(--bg-sub)!important}
.bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
input,select,textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
.bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
.modal{background:var(--bg-card)!important}
.mbg .modal{background:var(--bg-card)!important}

/* ── 테마: 차콜 다크 ── */
body.theme-dark {
  --bg:       #1A1A1A;
  --bg-card:  #242424;
  --bg-sub:   #1F1F1F;
  --bg-input: #2C2C2C;
  --bg-nav:   #242424;
  --text1:    #ECECEC;
  --text2:    #A0AEC0;
  --text3:    #64748B;
  --border:   #333333;
  --border2:  #444444;
  --btn-gray: #2C2C2C;
  --btn-gray-t:#A0AEC0;
  --shadow:   rgba(0,0,0,0.4);
}
body.theme-dark{background:var(--bg)!important;color:var(--text1)!important}
body.theme-dark #app{background:var(--bg)!important}
body.theme-dark .hd{background:linear-gradient(135deg,#111,#1E3A5F)!important}
body.theme-dark .body,body.theme-dark .pad{background:var(--bg)!important}
body.theme-dark .card{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
body.theme-dark .stabs{background:var(--bg-sub)!important}
body.theme-dark .st{color:var(--text3)!important}
body.theme-dark .st.on .st-lb{color:#60A5FA!important}
body.theme-dark .bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
body.theme-dark .modal{background:var(--bg-card)!important;color:var(--text1)!important}
body.theme-dark .mbg .modal{background:var(--bg-card)!important}
body.theme-dark h2,body.theme-dark h3,body.theme-dark div{color:inherit}
body.theme-dark .logo{color:#ECECEC!important}

/* ── 폰트 크기 ── */
body.fs-sm{font-size:13px!important}
body.fs-md{font-size:15px!important}
body.fs-lg{font-size:17px!important}
</style>

const SFX = {
  ctx: null,
  init() { try { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  play(type) {
    try {
      this.init(); const c = this.ctx;
      const g = c.createGain(); g.connect(c.destination);
      const o = c.createOscillator(); o.connect(g);
      if(type==='correct') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);
        [523,659,784].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.4);
      } else if(type==='wrong') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
        o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+.15);
        o.type='sawtooth'; o.start(c.currentTime); o.stop(c.currentTime+.3);
      } else if(type==='levelup') {
        [523,659,784,1047].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.3,c.currentTime+i*.12);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.12+.3);
          oo.start(c.currentTime+i*.12); oo.stop(c.currentTime+i*.12+.3);
        });
      } else if(type==='flip'||type==='tap') {
        g.gain.setValueAtTime(.1,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.08);
        o.frequency.value=type==='flip'?800:600; o.start(c.currentTime); o.stop(c.currentTime+.08);
      } else if(type==='combo') {
        g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.5);
        [659,784,988,1047].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.5);
      } else if(type==='achievement') {
        [523,523,659,784,659,784,988].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.25,c.currentTime+i*.1);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.1+.25);
          oo.start(c.currentTime+i*.1); oo.stop(c.currentTime+i*.1+.25);
        });
      } else if(type==='swipe_ok') {
        g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25);
        [784,988].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.25);
      } else if(type==='swipe_ng') {
        g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25);
        [440,330].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.25);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};
const vib = p => { try { if('vibrate' in navigator) navigator.vibrate(p); } catch(e){} };
const ok = () => {
  SFX.play('correct'); vib([50,0,50]);
  S._combo = (S._combo||0)+1;
  S._maxCombo = Math.max(S._maxCombo||0, S._combo);
  // 콤보 보너스 XP + 연출
  if(S._combo===3)  { addXP(xp('combo_3'),true); showComboFlash(3, '+'+xp('combo_3')+'XP'); }
  if(S._combo===5)  { addXP(xp('combo_5'),true); showComboFlash(5, '+'+xp('combo_5')+'XP 🔥'); SFX.play('combo'); }
  if(S._combo===10) { addXP(xp('combo_10'),true); showComboFlash(10, '+'+xp('combo_10')+'XP ⚡'); }
  if(S._combo===20) { addXP(xp('combo_20'),true); showComboFlash(20, '+'+xp('combo_20')+'XP 🌟'); }
};
const ng = () => {
  SFX.play('wrong'); vib([100,50,100]);
  if(S._combo>=3) toast('콤보 끊김 😢 ('+S._combo+'연속)');
  S._combo = 0;
  // 오답 노트 추가
  const gw = S.gWords?.[S.gIdx];
  if(gw && !(S._wrongWords||[]).some(w=>w.en===gw.en)) {
    if(!S._wrongWords) S._wrongWords=[];
    S._wrongWords.unshift({...gw, wrongAt:Date.now()});
    if(S._wrongWords.length>50) S._wrongWords.pop();
    sv();
  }
};

function logStudy(type) {
  // 하루 공부시간 누적 (매 단어학습마다 약 0.1분 추가)
  const todayKey = new Date().toISOString().slice(0,10);
  if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
  if(type==='words') S._dailyStudiedMin = Math.round(((S._dailyStudiedMin||0) + 0.1)*10)/10;
  else if(type==='quiz') S._dailyStudiedMin = Math.round(((S._dailyStudiedMin||0) + 0.05)*10)/10;
  // 목표 달성 체크
  const goal = S._dailyGoalMin||30;
  const studied = S._dailyStudiedMin||0;
  if(Math.floor(studied) > Math.floor(studied-0.1) && Math.floor(studied) > 0) {
    const pct = Math.round(studied/goal*100);
    const milestone = Math.floor(pct/10)*10;
    if(!S._dailyXpGiven) S._dailyXpGiven={};
    if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
      S._dailyXpGiven[milestone]=true;
      const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
      addXP(xpReward);
      const msg = milestone===100
        ? '🏆 목표 100% 달성! +200XP 🎉'
        : milestone===50
        ? '🎉 목표 50% 달성! +80XP'
        : `⭐ 목표 ${milestone}% 달성! +30XP`;
      toast(msg);
      if(milestone===100) vib([100,50,100,50,200]);
      else vib(50);
    }
  }
  // 헤더 미니 카드 업데이트
  if(typeof updHD==='function') updHD();
  // XP 지급
  if(type==='words') { addXP(xp('daily_first'), true); checkXpUsable(); }
  else if(type==='quiz') { addXP(xp('quiz_correct'), true); }
  const t = today();
  if(!S.studyLog[t]) S.studyLog[t] = {words:0, quiz:0, min:0};
  S.studyLog[t][type]++;
  // 날짜별 공부 시간도 함께 저장
  if(!S.studyLog[t].min) S.studyLog[t].min = 0;
  if(type==='words') S.studyLog[t].min = Math.round(((S.studyLog[t].min||0) + 0.1)*10)/10;
  else if(type==='quiz') S.studyLog[t].min = Math.round(((S.studyLog[t].min||0) + 0.05)*10)/10;
  updStreak();
  // 단어 학습 → 배부름 직접 연결 (10개마다 +1)
  if(type==='words') {
    const todayWords = S.studyLog[t].words;
    if(todayWords % 10 === 0) {
      S._petFull = Math.min(10, (S._petFull||5) + 1);
      if(todayWords % 30 === 0) {
        // 30개마다 기분도 +1
        S._petHappy = Math.min(10, (S._petHappy||5) + 1);
      }
      toast('🐛 벌거지가 배불러했어! 배부름 +1 (현재 '+(S._petFull||5)+'/10)');
      vib([50,30,50]);
    }
  }
  sv();
}

function buildSentenceFromWords(wordList) {
  const candidates=(wordList||S.gWords||[]).filter(w=>w.ex&&w.ex.trim().length>3);
  let chosen=candidates.length>0?rnd(candidates):null;
  if(chosen){
    const sentence=chosen.ex.replace(/[.,!?;:]/g,'').trim();
    const words=sentence.split(/\s+/).filter(w=>w.length>0);
    if(words.length>=3){
      const wrongPool=(wordList||S.gWords||[])
        .filter(w=>w.en!==chosen.en)
        .map(w=>w.en.split(/\s+/)[0])
        .filter(w=>!words.map(x=>x.toLowerCase()).includes(w.toLowerCase()))
        .slice(0,3);
      S.sbS={kr:chosen.kr+'(예문)',en:sentence,words};
      S.sbP=shuf([...words,...wrongPool].slice(0,words.length+2));
      S.sbC=[];S.sbAns=false;S.sbOk=false;return;
    }
  }
  const fallback=[
    {kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing']},
    {kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are']},
    {kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach']},
  ];
  const st=rnd(fallback);
  S.sbS=st;S.sbP=shuf([...st.words,...st.wrong]);S.sbC=[];S.sbAns=false;S.sbOk=false;
}

function shareWordBook(bookName) {
  const words=bookName==='내 단어장'?S.words:((S.books||[]).find(b=>b.name===bookName)?.words||[]);
  if(!words.length){toast('단어가 없어요');return;}
  const data=JSON.stringify({name:bookName,words:words.slice(0,200)});
  const encoded=btoa(unescape(encodeURIComponent(data)));
  const url=location.origin+location.pathname+'?share='+encoded;
  if(navigator.share){navigator.share({title:'Vocabug - '+bookName,text:bookName+' 단어장 ('+words.length+'개)',url});}
  else{navigator.clipboard?.writeText(url).then(()=>toast('링크 복사 완료!')).catch(()=>toast('복사됨'));}
}

function checkSharedWordBook() {

function importSharedBook(btn) {
  const data=JSON.parse(btn.dataset.book.replace(/&quot;/g,'"'));
  if(!S.books)S.books=[];
  let name=data.name,cnt=1;
  while(S.books.find(b=>b.name===name)||name==='내 단어장')name=data.name+'('+( ++cnt)+')';
  S.books.push({name,words:data.words,markMap:{},srsMap:{},learned:[]});

function getTodayWord() {
  const t = new Date().toISOString().slice(0,10);
  const key = 'wd-today-word-' + t;
  let cached = localStorage.getItem(key);
  if(cached) return JSON.parse(cached);
  const pool = (S._sysWords||[]).length ? S._sysWords : S.words;
  if(!pool.length) return null;
  // 날짜 기반 시드로 항상 같은 단어
  let seed = t.replace(/-/g,'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const word = pool[seed % pool.length];
  localStorage.setItem(key, JSON.stringify(word));
  return word;
}

async function loadXPConfig() {
  try {
    if(typeof db === 'undefined') return;
    const doc = await db.collection('settings').doc('xpConfig').get();
    if(doc.exists) {
      const data = doc.data();
      window._XPC = {...XP_DEFAULT, ...data};

  } catch(e) {}

  const x = window._XPC;
  GAME_XP.quiz     = {base: x.game_quiz_base,     perfect: x.game_quiz_perfect};
  GAME_XP.fill     = {base: x.game_fill_base,     perfect: x.game_fill_perfect};

function xp(key) { const v = window._XPC[key]; return Math.round((v!=null ? v : (XP_DEFAULT[key]||0)) * (window._XPC.xpMultiplier||1)); }

function saveGameScore(score) {
  if(!S.bestScores) S.bestScores={};
  const gid = S.gameId;
  if(!gid) return;
  // 최고 점수 저장
  if(!S.bestScores[gid] || score > S.bestScores[gid]) {
    S.bestScores[gid] = score;
  }
  // XP 계산
  const xpTable = GAME_XP[gid] || {base:10, perfect:20};
  const words = (S.gWords||[]).length || 1;
  const right = Math.round(score/100);
  const pct = Math.round(right/words*100);
  let xpGain = xpTable.base;
  if(pct===100) xpGain = xpTable.perfect;
  else if(pct>=80) xpGain = Math.round(xpTable.base*1.5);
  // 연속 보너스
  const streak = S.streak||0;
  let mult = streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  xpGain = Math.round(xpGain * mult);
  if(xpGain>0) {
    earnXP(xpGain, '게임 완료');
  }
  sv();
}

// 테스트 결과 XP
function earnTestXP(pct) {
  let base = 0;
  if(pct===100) base=xp('test_100');
  else if(pct>=90) base=xp('test_90');
  else if(pct>=80) base=xp('test_80');
  else if(pct>=60) base=xp('test_60');
  const streak=S.streak||0;
  const mult=streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  const total = Math.round(base*mult);
  if(total>0) earnXP(total, '테스트 통과');
}

function downloadButterflyCard(bId) {
  const b = BUTTERFLY_LIST.find(x=>x.id===bId);
  if(!b) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d');
  // 배경
  ctx.fillStyle = b.bg || '#F9FAFB';
  ctx.roundRect(0,0,400,560,20);
  ctx.fill();
  // 헤더 색상 배경
  ctx.fillStyle = b.color || '#7C3AED';
  ctx.roundRect(0,0,400,200,20);
  ctx.fill();
  ctx.fillRect(0,180,400,20);
  // 나비 이모지
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦋', 200, 120);
  // 이름
  ctx.fillStyle = 'white';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(b.name, 200, 165);
  ctx.font = '14px sans-serif';
  ctx.fillText(b.en, 200, 188);
  // 정보
  ctx.fillStyle = '#374151';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(b.rare + ' · ' + b.score + '점', 20, 230);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#6B7280';
  ctx.fillText('서식지: ' + (b.habitat||'-'), 20, 255);
  ctx.fillText('상태: ' + (b.status||'-'), 20, 275);
  // 이야기
  ctx.fillStyle = '#374151';
  ctx.font = '12px sans-serif';
  const words = (b.story||'').split(' ');
  let line='', y=310;
  words.forEach(w=>{
    const test=line+w+' ';
    if(ctx.measureText(test).width>360&&line){
      ctx.fillText(line,20,y); line=w+' '; y+=18;
    } else line=test;
  });
  if(line) ctx.fillText(line,20,y);
  // 보호 메시지
  ctx.fillStyle = '#16A34A';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🌿 ' + (b.protect||'').slice(0,50), 20, 460);
  // 앱 이름
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Butterfly Word', 200, 540);
  // 다운로드
  const a = document.createElement('a');
  a.download = 'butterfly-' + b.id + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('카드 저장됨! 🦋');
}

  const packs = S._marketPacks||[];

  console.log('[마켓] 현재 보유팩:', JSON.stringify(ownedPacks));

  // 카테고리 순서 정의
  const CAT_ORDER = ['전체','여행','비즈니스','학업','수능','토익','미디어','드라마/영화','취미문화'];
  const selCat = S._mktCat||'전체';

  // 팩 정렬 함수
  const sortPacks = arr => {
    if(mktSort==='kr') return [...arr].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
    if(mktSort==='en') return [...arr].sort((a,b)=>(a.name||'').localeCompare(b.name||'','en'));
    if(mktSort==='cnt') return [...arr].sort((a,b)=>(b.words?.length||0)-(a.words?.length||0));
    return arr;
  };

  // 중복 제거 (id 기준)
  const seen = new Set();
  const dedupedPacks = packs.filter(p=>{ if(seen.has(p.id)) return false; seen.add(p.id); return true; });

  // 카테고리 목록 (데이터에 있는 것만)
  const allCats = ['전체', ...CAT_ORDER.filter(cat=>cat!=='전체' && dedupedPacks.some(p=>p.cat===cat)),
    ...dedupedPacks.map(p=>p.cat||'기타').filter((c,i,a)=>c!=='기타'&&!CAT_ORDER.includes(c)&&a.indexOf(c)===i),
    ...(dedupedPacks.some(p=>!p.cat||p.cat==='기타')?['기타']:[])
  ];

  // 필터링
  const filtered = selCat==='전체' ? dedupedPacks : dedupedPacks.filter(p=>(p.cat||'기타')===selCat);

  let html = `<div class="pad" style="padding-bottom:24px">

        </div>

          ${ownedPacks.length > 0 ? `<button onclick="resetOwnedPacks()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);border-radius:8px;padding:3px 8px;font-size:10px;color:#fff;cursor:pointer">보유 초기화</button>` : ''}
          <button onclick="loadMarketPacks().then(()=>go())" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:3px 8px;font-size:10px;color:#fff;cursor:pointer">🔄 새로고침</button>
        </div>
      </div>
    </div>

    <!-- 카테고리 탭 -->
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none">
      ${allCats.map(cat=>`<button onclick="S._mktCat='${cat}';go()" style="flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid ${selCat===cat?petCol.main:'var(--border,#E5E7EB)'};background:${selCat===cat?petCol.main:'var(--bg-card,#fff)'};color:${selCat===cat?'#fff':'var(--text2,#374151)'};font-size:12px;font-weight:${selCat===cat?700:500};cursor:pointer;white-space:nowrap">${cat} ${cat==='전체'?'('+dedupedPacks.length+')':'('+dedupedPacks.filter(p=>(p.cat||'기타')===cat).length+')'}</button>`).join('')}

    <!-- 팩 목록 -->

        const owned = ownedPacks.includes(pk.id);

  return html;

function buyPack(packId) {
  const pk = (S._marketPacks||[]).find(p=>p.id===packId);
  if(!pk) { toast('팩을 찾을 수 없어요'); return; }
  if(!S._ownedPacks) S._ownedPacks = [];
  if(S._ownedPacks.includes(packId)) { toast('이미 보유 중이에요'); return; }

  const words = pk.words||[];
  if(!words.length) { toast('단어가 없는 팩이에요'); return; }

  // 구매 확인
  if(!confirm(pk.name+' ('+words.length+'개 단어)를 내 단어장에 추가할까요?')) return;

  // 새 단어장으로 추가 (기존 단어장과 분리)
  if(!S.books) S.books = [];
  const existing = S.books.find(b=>b.name===pk.name);
  if(existing) {
    // 이미 같은 이름 단어장 있으면 업데이트
    const newW = words.filter(w=>!existing.words.find(x=>x.en===w.en));
    existing.words = [...existing.words, ...newW];
  } else {
    // 새 단어장 생성
    S.books.push({
      name: pk.name,
      emoji: pk.emoji||'📦',
      words: [...words],
      markMap: {},
      srsMap: {},
      learned: [],
      fromMarket: true,
      packId: packId,
    });
  }

  // 내 단어장에도 추가 (현재 단어장)
  const newWords = words.filter(w=>!S.words.find(x=>x.en===w.en));

  S._ownedPacks.push(packId);
  // Firebase 즉시 저장
  if(typeof db !== 'undefined' && S.user?.uid) {
    db.collection('user_packs').doc(S.user.uid).set(
      {owned: S._ownedPacks},
      {merge: true}
    ).catch(()=>{});
  }
  sv();

  toast('✅ '+pk.name+' 추가! 단어장에서 확인하세요 📚');
  vib([100,50,100]);
  SFX.play('levelup');
  go('mybooks','market');
}

function changeNickname() {
  const v = document.getElementById('cnk')?.value.trim();
  if(!v) { toast('닉네임을 입력해주세요'); return; }
  if(v.length < 2 || v.length > 12) { toast('닉네임은 2~12자로 해주세요'); return; }

  // 복사왕 특수 처리
  if(v === '복사왕') {
    // 복사왕은 특수 계정만 사용 가능
    const uid = firebase?.auth?.()?.currentUser?.uid||'';
    if(!uid || uid !== '627everyday_admin') {
      toast('이 닉네임은 사용할 수 없어요 🚫'); return;
    }
    // 복사왕 → 나비 30종 전체 획득
    const allIds = BUTTERFLY_LIST.map(b=>b.id);
    localStorage.setItem('wd-butterflies', JSON.stringify(allIds));
    S.nick = v; sv();
    toast('👑 복사왕! 나비 30종 전체 획득!'); vib([100,50,200]);
    go(); return;
  }

  // 중복 체크 (Firestore)
  if(typeof db !== 'undefined') {
    db.collection('users').where('nick','==',v).get().then(snap=>{
      const taken = snap.docs.some(d=>d.id !== (firebase?.auth?.()?.currentUser?.uid||''));
      if(taken) { toast('이미 사용 중인 닉네임이에요 😅'); return; }
      S.nick=v; sv();
      // Firestore에도 업데이트
      const uid=firebase?.auth?.()?.currentUser?.uid;
      if(uid) db.collection('users').doc(uid).set({nick:v},{merge:true});
      toast('닉네임 변경! ✅'); go();
    }).catch(()=>{ S.nick=v; sv(); toast('닉네임 변경!'); go(); });
  } else {
    S.nick=v; sv(); toast('닉네임 변경!'); go();
  }
}

function checkAchievements() {

function showPomodoroTimer() {
  const mr=document.getElementById('mr');
  if(!mr) return;
  let mins=25, secs=0, running=false, interval=null;
  const render=()=>{
    const mm=String(Math.floor(mins)).padStart(2,'0');
    const ss=String(secs).padStart(2,'0');
    const total=25*60, left=mins*60+secs;
    const pct=Math.round((1-left/total)*100);
    mr.innerHTML=`<div class="mbg"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:24px">
      <div style="font-size:14px;font-weight:700;color:var(--text3,#A08040);margin-bottom:16px">🍅 집중 타이머</div>
      <div style="position:relative;width:160px;height:160px;margin:0 auto 16px">
        <svg width="160" height="160" style="position:absolute;top:0;left:0;transform:rotate(-90deg)">
          <circle cx="80" cy="80" r="70" fill="none" stroke="var(--border,#F0E6C8)" stroke-width="8"/>
          <circle cx="80" cy="80" r="70" fill="none" stroke="#E65100" stroke-width="8"
            stroke-dasharray="${2*Math.PI*70}" stroke-dashoffset="${2*Math.PI*70*(1-pct/100)}"
            stroke-linecap="round" style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">
          <div style="font-size:42px;font-weight:900;color:var(--text1,#3D2C00);font-family:monospace">${mm}:${ss}</div>
          <div style="font-size:11px;color:var(--text3,#A08040)">${running?'집중 중 🔥':'준비'}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
        ${[['5분',5],['10분',10],['25분',25]].map(([lb,m])=>`<button onclick="window._pomMins=${m};window._pomReset&&window._pomReset()" style="background:${mins===m&&secs===0?'#E65100':'var(--bg-sub,#FFF9ED)'};color:${mins===m&&secs===0?'#fff':'var(--text2,#6B5200)'};border:1.5px solid var(--border,#F0E6C8);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer">${lb}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="window._pomToggle&&window._pomToggle()" style="flex:2;background:${running?'#FEF2F2':'#E65100'};color:${running?'#DC2626':'#fff'};border:${running?'1.5px solid #FECDD3':'none'};border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer">${running?'⏸ 일시정지':'▶ 시작'}</button>
        <button onclick="window._pomReset&&window._pomReset()" style="flex:1;background:var(--bg-sub,#FFF9ED);color:var(--text2,#6B5200);border:1.5px solid var(--border,#F0E6C8);border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">🔄 초기화</button>
      </div>
      <button onclick="if(window._pomInterval)clearInterval(window._pomInterval);cm()" style="width:100%;background:none;border:none;color:var(--text3,#A08040);font-size:13px;cursor:pointer;padding:12px 0 0">닫기</button>
    </div></div>`;
  };
  window._pomReset = ()=>{
    if(interval)clearInterval(interval);
    running=false; interval=null;
    mins=window._pomMins||25; secs=0;
    render();
  };
  window._pomToggle = ()=>{
    if(running){
      clearInterval(interval); interval=null; running=false; render();
    } else {
      running=true;
      interval=setInterval(()=>{
        if(secs===0){if(mins===0){
          clearInterval(interval); running=false;
          SFX.play('levelup'); vib([200,100,200,100,400]);
          addXP(xp('pomodoro')); checkAchievements(); sv();
          toast('🍅 집중 완료! +'+xp('pomodoro')+'XP 획득!');
          render(); return;
        }mins--;secs=59;}else secs--;
        render();
      },1000);
      render();
    }
  };
  window._pomInterval=interval;
  window._pomMins=25;
  render();
}

function showCountdown(cb) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9997;display:flex;align-items:center;justify-content:center;pointer-events:none';
  document.body.appendChild(overlay);
  const nums = ['3','2','1','GO!'];
  const colors = ['#EF4444','#F97316','#22C55E','#FFD700'];
  let i = 0;
  const show = () => {
    overlay.innerHTML = `<div style="font-size:${nums[i]==='GO!'?80:96}px;font-weight:900;color:${colors[i]};text-shadow:0 4px 20px rgba(0,0,0,.5);animation:comboFlash .6s ease-out forwards">${nums[i]}</div>`;
    if(nums[i]!=='GO!') SFX.play('tap'); else SFX.play('correct');
    vib(nums[i]==='GO!'?[100,50,100]:50);
    i++;
    if(i < nums.length) setTimeout(show, 700);
    else setTimeout(()=>{ overlay.remove(); if(cb) cb(); }, 600);
  };

function downloadWordCard(en) {
  const w = S.words.find(x=>x.en===en);
  if(!w) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 240;
  const ctx = canvas.getContext('2d');
  // 배경
  const grad = ctx.createLinearGradient(0,0,400,240);
  const petCol = PET_COLORS[getPetColor()]||PET_COLORS.green;
  grad.addColorStop(0, petCol.main);
  grad.addColorStop(1, petCol.main+'88');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,400,240,20);
  ctx.fill();
  // 앱 이름
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('🦋 Butterfly Word', 20, 30);
  // 이모지
  ctx.font = '48px sans-serif';
  ctx.fillText(w.img||'📝', 300, 80);
  // 영어 단어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.fillText(w.en, 24, 80);
  // 발음
  if(w.ph) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '16px sans-serif';
    ctx.fillText(w.ph, 24, 110);
  }
  // 한국어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(w.kr, 24, 150);
  // 예문
  if(w.ex) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px sans-serif';
    const ex = w.ex.length>40 ? w.ex.slice(0,40)+'...' : w.ex;
    ctx.fillText('"'+ex+'"', 24, 185);
  }
  // 마킹
  const mark = getMark(en);
  const markEmojis = ['○','✅','🦋'];
  ctx.font = '18px sans-serif';
  ctx.fillText(markEmojis[mark]||'○', 24, 220);
  // 날짜
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('ko-KR'), 300, 220);
  // 다운로드
  const a = document.createElement('a');
  a.download = en+'-card.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('📸 단어 카드 저장!');
}

function showStudyCalendar() {
  const mr = document.getElementById('mr');
  if(!mr) return;
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const days = new Date(year, month+1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const dayNames = ['일','월','화','수','목','금','토'];
  const monthName = (month+1)+'월';

  // 이번 달 학습 데이터
  const monthData = {};
  for(let d=1; d<=days; d++) {
    const key = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const log = S.studyLog[key]||{};
    monthData[d] = (log.words||0) + (log.quiz||0);
  }
  const maxVal = Math.max(...Object.values(monthData), 1);

  let calHTML = `<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="padding:0;border-radius:20px;overflow:hidden">
    <div style="background:linear-gradient(135deg,#E65100,#F97316);padding:16px 20px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:16px;font-weight:900;color:#fff">📅 ${year}년 ${monthName} 학습 달력</div>
      <button onclick="cm()" style="background:rgba(255,255,255,.2);border:none;border-radius:8px;padding:4px 10px;color:#fff;font-size:13px;cursor:pointer">닫기</button>
    </div>
    <div style="padding:16px">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px">
        ${dayNames.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--text3,#A08040);padding:4px">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">
        ${Array(firstDay).fill('<div></div>').join('')}
        ${Array.from({length:days},(_,i)=>{
          const d = i+1;
          const val = monthData[d]||0;
          const isToday = d===now.getDate();
          const intensity = val===0?0:Math.ceil(val/maxVal*4);
          const bgColors = ['var(--bg-sub,#FFF9ED)','#FEF9C3','#FDE68A','#F59E0B','#D97706'];
          const bg = isToday ? '#E65100' : bgColors[intensity];
          const col = isToday ? '#fff' : intensity>=3 ? '#1A0A00' : 'var(--text1,#3D2C00)';
          return `<div style="text-align:center;padding:6px 2px;border-radius:6px;background:${bg};border:${isToday?'2px solid #B45309':'1px solid transparent'}">
            <div style="font-size:11px;font-weight:${isToday?'900':'400'};color:${col}">${d}</div>
            ${val>0?`<div style="font-size:8px;color:${isToday?'rgba(255,255,255,.8)':'#A08040'}">${val}</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:center">
        <div style="font-size:11px;color:var(--text3,#A08040)">학습량:</div>
        ${['없음','적음','보통','많음','최다'].map((lb,i)=>`
          <div style="display:flex;align-items:center;gap:3px">
            <div style="width:12px;height:12px;border-radius:2px;background:${['var(--bg-sub)','#FEF9C3','#FDE68A','#F59E0B','#D97706'][i]}"></div>
            <span style="font-size:10px;color:var(--text3,#A08040)">${lb}</span>
          </div>`).join('')}
      </div>
      <div style="margin-top:12px;background:var(--bg-sub,#FFF9ED);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[
          ['이번달 학습일', Object.values(monthData).filter(v=>v>0).length+'일'],
          ['이번달 총 학습', Object.values(monthData).reduce((s,v)=>s+v,0)+'개'],
          ['최대 하루 학습', Math.max(...Object.values(monthData))+'개'],

        ].map(([lb,v])=>`<div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--text1,#3D2C00)">${v}</div><div style="font-size:10px;color:var(--text3,#A08040)">${lb}</div></div>`).join('')}

// ── 마켓 단어팩 Firebase 로드 ──
async function loadMarketPacks() {
  if(typeof db === 'undefined') {
    // Firebase 없으면 WORD_PACKS 사용
    S._marketPacks = typeof WORD_PACKS !== 'undefined' ? [...WORD_PACKS] : [];
    return;
  }
  try {
    // 관리자가 저장한 Firebase 팩 로드 (컬렉션: 'packs')
    const snap = await db.collection('packs').get();
    const fbPacks = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(p => p.active !== false && p.name);
    // 로컬 WORD_PACKS와 병합 (Firebase 팩 우선)
    const localPacks = typeof WORD_PACKS !== 'undefined' ? WORD_PACKS : [];
    const fbIds = new Set(fbPacks.map(p => p.id));
    S._marketPacks = [...fbPacks, ...localPacks.filter(p => !fbIds.has(p.id))];
    console.log('[마켓] 팩 로드:', fbPacks.length + '개 Firebase +', localPacks.filter(p=>!fbIds.has(p.id)).length + '개 로컬 =', S._marketPacks.length + '개 총합');
  } catch(e) {
    console.warn('마켓 Firebase 로드 실패, 로컬 사용:', e.message);
    S._marketPacks = typeof WORD_PACKS !== 'undefined' ? [...WORD_PACKS] : [];
  }
}

function checkStudyHourReward() {
  if(!S._studyStartTime) return;
  const elapsed = Date.now() - S._studyStartTime;
  const hours = Math.floor(elapsed / 3600000);
  const lastReward = S._studyHourReward||0;
  if(hours > lastReward) {
    S._studyHourReward = hours;
    sv();
    // 가치 50점 이하 나비 랜덤 (일반⭐⭐ 또는 희귀⭐⭐⭐)
    const pool = BUTTERFLY_LIST.filter(b =>
      b.rare === '⭐⭐' || (b.rare === '⭐⭐⭐' && Math.random() < 0.3)
    );
    const bf = pool[Math.floor(Math.random()*pool.length)];
    if(!bf) return;
    setTimeout(()=>{
      const mr=document.getElementById('mr');
      if(!mr||mr.innerHTML.trim()) return;
      mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:24px">

function _claimHourButterfly(bfId) {
  const bf = BUTTERFLY_LIST.find(b=>b.id===bfId);
  if(!bf) return;
  const key='wd-butterflies';
  const owned=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
  if(!owned.has(bfId)) {
    owned.add(bfId);
    localStorage.setItem(key, JSON.stringify([...owned]));
    showButterflyRoll(bf, null);
    checkAchievements();
  } else {
    toast('이미 보유한 나비예요! (+10XP)');
    addXP(10);
  }
}

function saveMyCharacter() {
  const size = 200;
  const svg = charSVG(S.lid, size, 'happy');
  const equipped = S._equipped||'';
  const accMap = {crown:'👑',star:'⭐',halo:'🌟',ribbon:'🎀',glasses:'👓',wings:'🪶'};
  const accEmoji = accMap[equipped]||'';
  const l = lv(S.lid);
  
  // SVG to Canvas
  const canvas = document.createElement('canvas');
  canvas.width = 300; canvas.height = 360;
  const ctx = canvas.getContext('2d');
  
  // 배경
  const grad = ctx.createLinearGradient(0,0,0,360);
  grad.addColorStop(0, l.bg||'#FFF9C4');
  grad.addColorStop(1, '#fff');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,300,360,20);
  ctx.fill();
  
  // 이름 배지
  ctx.fillStyle = l.color||'#F9A825';
  ctx.roundRect(75,10,150,30,15);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(l.emoji+' '+l.name, 150, 31);
  
  // 캐릭터 SVG 렌더
  const img = new Image();
  const svgBlob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = ()=>{
    ctx.drawImage(img, 50, 50, size, size);
    URL.revokeObjectURL(url);
    
    // 장식품
    if(accEmoji) {
      ctx.font = `${Math.round(size*0.3)}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(accEmoji, 150, 85);
    }
    
    // 닉네임
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(S.nick||'나의 캐릭터', 150, 285);
    
    // XP / 스트릭
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '13px sans-serif';
    ctx.fillText('⚡ '+S.xp+'XP  🔥 '+S.streak+'일', 150, 308);
    
    // 워터마크
    ctx.fillStyle = '#D1D5DB';
    ctx.font = '11px sans-serif';
    ctx.fillText('Butterfly Word', 150, 345);
    
    // 다운로드
    const a = document.createElement('a');
    canvas.toBlob((blob)=>{
      if(!blob){ toast('이미지 생성 실패'); return; }
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `butterfly_${l.name}_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      toast('📸 캐릭터 이미지 저장됨!');
    }, 'image/png');
  };
  img.onerror = ()=>{ toast('이미지 생성 실패. 다시 시도해주세요.'); };
  img.src = url;
}

// ── 전역 학습 타이머 ──
const _LT = {
  elapsed: 0,       // 경과 초
  goal: 0,          // 목표 초 (0=무제한)
  running: false,
  interval: null,

  start() {
    if(this.running) return;
    this.running = true;
    if(!this._startTime) this._startTime = Date.now() - this.elapsed*1000;
    this.interval = setInterval(()=>{
      this.elapsed = Math.floor((Date.now()-this._startTime)/1000);
      this._updateUI();
      // 헤더 미니 카드도 업데이트
      if(typeof updHD==='function') updHD();
      // 하루 공부시간 연동 (1분마다)
      if(this.elapsed > 0 && this.elapsed % 60 === 0) {
        const todayKey = new Date().toISOString().slice(0,10);
        if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
        S._dailyStudiedMin = (S._dailyStudiedMin||0) + 1;
        const goal=S._dailyGoalMin||30, studied=S._dailyStudiedMin||0;
        const pct=Math.round(studied/goal*100);
        // 10%마다 XP 지급 (각 구간 1회만)
        if(!S._dailyXpGiven) S._dailyXpGiven={};
        const milestone = Math.floor(pct/10)*10;
        if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
          S._dailyXpGiven[milestone]=true;
          const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
          addXP(xpReward);
          const msg = milestone===100
            ? '🏆 목표 100% 달성! +200XP 🎉'
            : milestone===50
            ? '🎉 목표 50% 달성! +80XP'
            : `⭐ 목표 ${milestone}% 달성! +30XP`;
          toast(msg);
          if(milestone===100) vib([100,50,100,50,200]);
          else if(milestone===50) vib([50,30,100]);
          else vib(50);
        }
        const rem=Math.max(0,goal-studied);
        if(rem>0 && rem%10===0 && rem<goal) toast('⏱ 목표까지 '+rem+'분 남았어요!');
        sv();
      }
      // 세션 목표 달성
      if(this.goal > 0 && this.elapsed >= this.goal) {
        this.stop();
        toast('🎉 목표 시간 달성! 수고했어요!');
        vib([100,50,100,50,200]);
      }
    }, 1000);
  },

  stop() {
    this.running = false;
    clearInterval(this.interval);
    this.interval = null;
  },

  reset() {
    this.stop();
    this.elapsed = 0;
    this._startTime = null;
    this._updateUI();
  },

  fmt(s) {
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  },

  _updateUI() {
    document.querySelectorAll('._lt-display').forEach(el=>{
      const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
      const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:800;color:${color};font-family:monospace">${this.fmt(this.elapsed)}</div>
          ${this.goal>0?`<div style="font-size:10px;color:rgba(255,255,255,.4)">/ ${this.fmt(this.goal)}</div>`:''}
          <button onclick="showTimerSettings()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:3px 8px;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer">⏱</button>
        </div>
        ${this.goal>0?`<div style="background:rgba(255,255,255,.12);border-radius:2px;height:2px;overflow:hidden;margin-top:3px"><div style="height:100%;background:${color};width:${pct}%;transition:width .5s"></div></div>`:''}
      `;
    });
  },

  barHTML() {
    const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
    const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
    return `<div class="_lt-display" style="min-width:80px"></div>`;
  }
};

// ── Firebase 추가 나비 로드 ──
async function loadFirebaseButterflies() {
  try {
    if(typeof db === 'undefined') return;
    const snap = await db.collection('butterflies').get();
    if(snap.empty) return;
    snap.docs.forEach(doc => {
      const bf = doc.data();
      if(!bf.id || !bf.name) return;
      const existing = BUTTERFLY_LIST.find(b => b.id === bf.id);
      if(existing) {
        if(bf.svgCode) existing.svgCode = bf.svgCode;
      } else {
        BUTTERFLY_LIST.push({
          id: bf.id, name: bf.name, rare: bf.rare||'⭐⭐',
          color: bf.color||'#7C3AED', bg: '#F5F3FF',
          desc: bf.desc||'', svgCode: bf.svgCode||''
        });
      }
    });
  } catch(e) { console.warn('butterfly load failed', e); }
}

function getMark(en) { return S.markMap[en]||0; }
function setMark(en, val) {
  S.markMap[en] = val;
  // 외운 단어 → learned에도 추가
  if(val===1) S.learned.add(en);
  else if(val===2) S.learned.delete(en);
  sv();
}
function cycleMark(en) {
  const cur = getMark(en);
  const next = (cur+1)%3;
  setMark(en, next);
  return next;
}

}

window._auto = window._auto || {
  loop: true,        // 무한 루프 (기본 ON)
  speed: 4000,       // 단어당 시간 (ms) - 스트리밍/오디오용
  shadowRate: 0.75,  // 쉐도잉 발음 속도
  read: 'en+kr',     // 읽기 모드: en/kr/ex/en+kr/en+ex/all
  voice: 'en-US',    // 영어 음성
};
function _autoSpeak(text, lang='en-US') {
  return new Promise(res => {
    if(!text) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = lang === 'ko-KR' ? 0.95 : (window._auto.shadowRate || 0.85);
    u.onend = res; u.onerror = res;
    setTimeout(res, 6000);
    speechSynthesis.speak(u);
  });
}
async function _autoReadWord(w) {
  const A = window._auto || {};
  const m = A.read || 'en+kr';
  const voice = A.voice || 'en-US';
  const shadowGap = A.shadow ? (A.shadowSec||2)*1000 : 0;
  const exCount = parseInt(A.exCount??1);

  // 읽을 예문 목록 (exList 우선, 없으면 ex)
  const exList = (w.exList&&w.exList.length) ? w.exList : (w.ex ? [w.ex] : []);
  const exToRead = exList.slice(0, exCount);

  const speakEn = async () => {
    await _autoSpeak(w.en, voice);
    if(shadowGap > 0) await new Promise(r=>setTimeout(r, shadowGap));
  };
  const speakKr = async () => {
    await _autoSpeak(w.kr, 'ko-KR');
  };
  const speakEx = async () => {
    for(const ex of exToRead) {
      await new Promise(r=>setTimeout(r,250));
      await _autoSpeak(ex, voice);
      if(shadowGap > 0) await new Promise(r=>setTimeout(r, shadowGap));
    }
  };

  if(m==='en') {
    await speakEn();
  } else if(m==='kr') {
    await speakKr();
  } else if(m==='ex') {
    await speakEx();
  } else if(m==='en+kr') {
    await speakEn();
    await new Promise(r=>setTimeout(r,300));
    await speakKr();
    if(exCount>0 && exToRead.length) await speakEx();
  } else if(m==='en+ex') {
    await speakEn();
    await speakEx();
  } else if(m==='all') {
    await speakEn();
    await new Promise(r=>setTimeout(r,250));
    await speakKr();
    await speakEx();
  }
}

    const w = window._autoWords[window._autoIdx];
    if(w) await _autoReadWord(w);
  };

  // 자동 재생 토글
  window._autoToggle = async () => {
    if(window._autoPlaying) {
      window._autoPlaying = false;
      window.speechSynthesis.cancel();
      window._autoRender();
      return;
    }
    window._autoPlaying = true;
    window._autoRender();
    while(window._autoPlaying) {
      const w = window._autoWords[window._autoIdx];
      if(!w) break;
      await _autoReadWord(w);
      if(!window._autoPlaying) break;
      await new Promise(r => setTimeout(r, 600));
      if(!window._autoPlaying) break;
      window._autoIdx++;
      if(window._autoIdx >= window._autoWords.length) {
        if(window._auto.loop) { window._autoIdx=0; toast('🔁 처음부터!'); }
        else { window._autoPlaying=false; toast('🎉 완료!'); break; }
      }
      window._autoRender();
      logStudy('words'); addXP(xp('word_flip'));
    }
    window._autoRender();
  };

  window._curRender = window._autoRender;
  window._autoRender();
  setTimeout(()=>window._autoSpeakNow(), 300);
}

function today() {
  return new Date(new Date().getTime()+9*60*60*1000).toISOString().slice(0,10);
}

function fmtMin(m) {
  if(!m||m<0.01) return '0분';
  if(m<1) return Math.round(m*60)+'초';
  if(m<60) return Math.round(m)+'분';
  return Math.floor(m/60)+'시간'+(m%60>0?' '+Math.round(m%60)+'분':'');
}

  const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=new Date(d.getTime()+9*60*60*1000).toISOString().slice(0,10);const log=S.studyLog[k]||{words:0,quiz:0,min:0};const total=log.words+log.quiz;const isToday=k===t;const dayNames=['일','월','화','수','목','금','토'];return{k,total,words:log.words,quiz:log.quiz,min:log.min||0,isToday,day:dayNames[d.getDay()]};});
  const maxDay=Math.max(...last7.map(d=>d.total),1);
  const maxMin=Math.max(...last7.map(d=>d.min),0.1);

    </div>

      ${last7.map(d=>{const val=_sv==='time'?d.min:d.total;const maxV=_sv==='time'?maxMin:maxDay;const barH=val>0?Math.max(12,Math.round(val/maxV*70)):4;const bc=d.isToday?(_sv==='time'?'#E65100':'#1E5FA5'):(val>0?(_sv==='time'?'#FB923C':'#60A5FA'):'#E5E7EB');const lbl=_sv==='time'?(d.min>=1?Math.round(d.min)+'m':(d.min>0?Math.round(d.min*60)+'s':'')):(d.total>0?d.total:'');return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:9px;font-weight:700;color:'+bc+'">'+lbl+'</div><div style="width:100%;background:'+bc+';border-radius:4px 4px 2px 2px;height:'+barH+'px"></div><div style="font-size:9px;color:'+(d.isToday?'#1E5FA5':'#9CA3AF')+';font-weight:'+(d.isToday?800:400)+'">'+d.day+'</div></div>';}).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px">

    </div>

  parts.push('</div>');
  return parts.join('');
}

function startMode(type) {
  const modeWords=getCurrentBookWords?getCurrentBookWords():S.words;
  if(!modeWords.length){toast('현재 단어장에 단어가 없어요! 단어를 먼저 추가해주세요.');return;}
  if(modeWords!==S.words) S.words=modeWords;
  if(type==='stream'||type==='audio'||type==='shadow'||type==='auto') showAutoMode();
  else if(type==='srs') showSRSMode&&showSRSMode();
  else if(type==='sleep') showSleepMode&&showSleepMode();
  else if(type==='speak') showSpeakMode&&showSpeakMode();
}

function rList() {
  const bk=getCurrentBookObj?getCurrentBookObj():null;
  const words=bk?bk.words:S.words;
  const markMap=bk?bk.markMap:S.markMap||{};
  const sortBy=S._listSort||'default';
  const filter=S.listMarkFilter??-1;
  let filtered=[...words];
  if(filter===1) filtered=filtered.filter(w=>(markMap[w.en]||0)===1);
  else if(filter===2) filtered=filtered.filter(w=>(markMap[w.en]||0)===2);
  else if(filter===0) filtered=filtered.filter(w=>(markMap[w.en]||0)===0);
  if(sortBy==='alpha') filtered.sort((a,b)=>a.en.localeCompare(b.en));
  else if(sortBy==='alpha_kr') filtered.sort((a,b)=>a.kr.localeCompare(b.kr));
  else if(sortBy==='mark') filtered.sort((a,b)=>(markMap[b.en]||0)-(markMap[a.en]||0));
  else if(sortBy==='random'){for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}}
  const marked1=Object.values(markMap).filter(v=>v===1).length;
  const marked2=Object.values(markMap).filter(v=>v===2).length;
  if(!filtered.length) return `<div class="pad" style="text-align:center;margin-top:60px">${cbrow?cbrow('단어가 없어! 추가해줘 😊',S.lid):''}<button onclick="S.stab='add';go('mybooks')" style="margin-top:10px" class="btn bb">단어 추가하러 가기</button></div>`;
  return `<div class="pad">
    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      ${[[-1,'전체',words.length],[1,'✅외웠음',marked1],[2,'🦋복습',marked2],[0,'미학습',words.length-marked1-marked2]].map(([v,lb,cnt])=>`<button onclick="S.listMarkFilter=${v};go()" style="padding:5px 10px;border-radius:14px;border:1px solid ${filter===v?'#1E5FA5':'var(--border,#E5E7EB)'};background:${filter===v?'#EFF6FF':'transparent'};color:${filter===v?'#1E5FA5':'#9CA3AF'};font-size:11px;font-weight:700;cursor:pointer">${lb} ${cnt}</button>`).join('')}

        <option value="default" ${sortBy==='default'?'selected':''}>추가순</option>
        <option value="alpha" ${sortBy==='alpha'?'selected':''}>영어 A-Z</option>
        <option value="alpha_kr" ${sortBy==='alpha_kr'?'selected':''}>한글 가나다</option>
        <option value="mark" ${sortBy==='mark'?'selected':''}>마크순</option>
        <option value="random" ${sortBy==='random'?'selected':''}>🔀 랜덤</option>
      </select>
    </div>
    <div style="font-size:11px;color:#9CA3AF;margin-bottom:8px">${filtered.length}개</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${filtered.map((w,i)=>{const mark=markMap[w.en]||0;const mi=MARK_INFO[mark]||MARK_INFO[0];const safeEn=w.en.replace(/\\/g,'\\\\').replace(/'/g,"\\'");return `<div style="background:var(--bg-card,#FFFEF8);border-radius:12px;border:1px solid var(--border,#F0E6C8);padding:10px 12px;display:flex;align-items:flex-start;gap:8px">
        <div style="font-size:20px;flex-shrink:0;margin-top:2px">${w.img||'📝'}</div>
        <div style="flex:1;min-width:0">

          </div>
          ${w.ex?`<div style="font-size:11px;color:#6B7280;font-style:italic;margin-top:2px;line-height:1.4">"${w.ex}"</div>`:''}
        </div>

          <button onclick="showWordDetail('${safeEn}')" style="background:none;border:none;font-size:14px;cursor:pointer;padding:4px;color:#9CA3AF">🔍</button>

function createBook() {

function addXP(amount, silent=false) {
  if(!amount||amount<=0) return;
  S.xp = (S.xp||0) + amount;
  if(!silent) {
    const lvBefore=lv(S.lid).order||0;
    const newLid=getLidFromXP?getLidFromXP(S.xp):S.lid;
    if(newLid&&newLid!==S.lid){
      const lvAfter=lv(newLid).order||0;
      if(lvAfter>lvBefore){
        S.lid=newLid;
        toast(`🎉 레벨업! ${lv(S.lid).name}으로 진화했어요!`);
        vib([100,50,100,50,200]);
      }
    }
  }
  sv();
}


function getLidFromXP(xp) {
  let lid=LEVELS[0].id;
  for(const l of LEVELS){if(xp>=(l.xp||0))lid=l.id;}
  return lid;
}

function getNextEvolution() {
  const curr=lv(S.lid);
  const sorted=[...LEVELS].sort((a,b)=>(a.xp||0)-(b.xp||0));
  return sorted.find(l=>(l.xp||0)>(S.xp||0))||null;
}

function getPetState() {
  const full=S._petFull??5;const happy=S._petHappy??5;
  if(full<=1||happy<=1) return{emoji:'💀',status:'위험!',bg1:'#374151',bg2:'#1F2937'};
  if(full<=3&&happy<=3) return{emoji:'😤',status:'배고파',bg1:'#78350F',bg2:'#92400E'};
  if(full>=8&&happy>=8) return{emoji:'😄',status:'최고야!',bg1:'#166534',bg2:'#15803D'};
  if(full>=6&&happy>=6) return{emoji:'😊',status:'행복해',bg1:'#1E5FA5',bg2:'#2563EB'};
  return{emoji:'😐',status:'보통',bg1:'#4B5563',bg2:'#374151'};
}





function updStreak() {
  const t=today();
  if(S._lastStudyDate===t) return;
  const yesterday=new Date(new Date().getTime()+9*60*60*1000);
  yesterday.setDate(yesterday.getDate()-1);
  const yd=yesterday.toISOString().slice(0,10);
  if(S._lastStudyDate===yd) S.streak=(S.streak||0)+1;
  else if(S._lastStudyDate!==t) S.streak=1;
  S._lastStudyDate=t;
}

  S.words=S.words.filter(w=>w.en&&w.kr&&!_dummyKeys.includes(w.en)&&w.en.length<80);
  (S.books||[]).forEach(bk=>{if(bk.words)bk.words=bk.words.filter(w=>w.en&&w.kr&&!_dummyKeys.includes(w.en)&&w.en.length<80);});

  if(!(S.favorites instanceof Set)) S.favorites=new Set(Array.isArray(S.favorites)?S.favorites:[]);

function startGame(gameId, scope) {
  let curWords=getCurrentBookWords?getCurrentBookWords():S.words;
  if(scope==='all'){
    const allW=[...(S.words||[])];
    (S.books||[]).forEach(b=>(b.words||[]).forEach(w=>{if(!allW.find(x=>x.en===w.en))allW.push(w);}));
    if(allW.length>0) curWords=allW;
  }
  if(!curWords.length){toast('단어를 먼저 추가해주세요!');return;}
  if(curWords!==S.words) S.words=curWords;
  cm();
  // 기본 퀴즈로 연결
  if(gameId==='quiz') { S.stab='quiz3'; go('mybooks','quiz3'); }
  else { S.stab='learn'; go('mybooks','learn'); toast(gameNames&&gameNames[gameId]?gameNames[gameId]+' 준비 중...':'준비 중...'); }
}

function rQuiz3() {
  const words=getCurrentBookWords?getCurrentBookWords():S.words;
  if(!words.length) return `<div class="pad" style="text-align:center;padding:40px">
    <div style="font-size:36px;margin-bottom:8px">📝</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">단어가 없어요!</div>
    <button onclick="S.stab='add';go('mybooks','add')" class="btn bb">단어 추가하기</button>
  </div>`;
  // 퀴즈 문제 생성
  if(!S._quizWords||S._quizIdx===undefined||S._quizNew) {
    S._quizWords=[...words].sort(()=>Math.random()-.5);
    S._quizIdx=0; S._quizScore=0; S._quizNew=false;
  }
  if(S._quizIdx>=S._quizWords.length) {
    const score=S._quizScore; const total=S._quizWords.length;
    return `<div class="pad" style="text-align:center;padding:40px">
      <div style="font-size:52px;margin-bottom:12px">${score>=total*0.8?'🎉':score>=total*0.5?'😊':'😅'}</div>
      <div style="font-size:22px;font-weight:900;margin-bottom:6px">${score} / ${total}</div>
      <div style="font-size:14px;color:#9CA3AF;margin-bottom:20px">${Math.round(score/total*100)}% 정답</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:240px;margin:0 auto">
        <button onclick="S._quizNew=true;go()" class="btn bb">다시 풀기</button>
        <button onclick="S.stab='learn';go()" class="btn" style="background:#EFF6FF;color:#1E5FA5;border:1.5px solid #BFDBFE">플래시카드로</button>
      </div>
    </div>`;
  }
  const w=S._quizWords[S._quizIdx];
  const mm=getCurrentBookMarkMap?getCurrentBookMarkMap():(S.markMap||{});
  // 보기 4개 생성
  const others=words.filter(x=>x.en!==w.en).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[...others,w].sort(()=>Math.random()-.5);
  const safeEn=w.en.replace(/'/g,"\\'");
  return `<div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:13px;color:#9CA3AF">문제 ${S._quizIdx+1} / ${S._quizWords.length}</div>
      <div style="font-size:13px;font-weight:700;color:#1E5FA5">점수: ${S._quizScore}</div>
    </div>
    <div style="background:var(--bg-card,#FFFEF8);border-radius:20px;border:2px solid var(--border,#F0E6C8);padding:30px 20px;text-align:center;margin-bottom:20px">
      <div style="font-size:36px;font-weight:900;font-family:monospace;margin-bottom:8px">${w.en}</div>
      ${w.ph?`<div style="font-size:13px;color:#9CA3AF">${w.ph}</div>`:''}
      ${w.ex?`<div style="font-size:12px;color:var(--text3,#A08040);font-style:italic;margin-top:8px">"${w.ex}"</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${choices.map((ch,i)=>`<button onclick="
        const correct='${w.kr.replace(/'/g,"\\'")}';
        if(this.dataset.answered) return;
        this.dataset.answered=1;
        document.querySelectorAll('.quiz-choice').forEach(b=>b.dataset.answered=1);
        const isRight='${ch.kr.replace(/'/g,"\\'")}' === correct;
        this.style.background=isRight?'#F0FDF4':'#FEF2F2';
        this.style.borderColor=isRight?'#86EFAC':'#FECACA';
        this.style.color=isRight?'#16A34A':'#DC2626';
        if(isRight){S._quizScore=(S._quizScore||0)+1;logStudy('quiz');addXP(xp('quiz_correct'));}
        setTimeout(()=>{S._quizIdx=(S._quizIdx||0)+1;go();},600);
      " class="quiz-choice" style="padding:14px;background:var(--bg-card,#FFFEF8);border:1.5px solid var(--border,#F0E6C8);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;text-align:left">${String.fromCharCode(65+i)}. ${ch.kr}</button>`).join('')}
    </div>
  </div>`;
}

<script>
// ── 단어장 헬퍼 함수들 ──
function getCurrentBookWords() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.words;
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? bk.words : S.words;
}

function getCurrentBookObj() {
  if(!S.currentBook || S.currentBook==='내 단어장') return null;
  return (S.books||[]).find(b=>b.name===S.currentBook)||null;
}

function getCurrentBookMarkMap() {
  const bk = getCurrentBookObj();
  return bk ? (bk.markMap||{}) : (S.markMap||{});
}

function switchBook(name) {
  S.currentBook = name;
  const bk = (S.books||[]).find(b=>b.name===name);
  if(bk) {
    if(!bk.markMap) bk.markMap={};
    if(!bk.srsMap) bk.srsMap={};
    if(!bk.words) bk.words=[];
  }
  sv();
}

// ── SRS ──
function srsRate(en, score) {
  // score: 1=알았어, 0=몰라
  if(!S.srsMap) S.srsMap={};
  const interval = score >= 1 ? 1 : 0;
  const next = new Date();
  next.setDate(next.getDate() + Math.max(1, interval));
  S.srsMap[en] = next.toISOString();
  sv();
}

// ── 수면 학습 ──
function showSleepMode() {
  toast('😴 수면 모드는 준비 중이에요');
}

// ── SRS 학습 ──
function showSRSMode() {
  const srsWords = S.words.filter(w => {
    const d = S.srsMap?.[w.en];
    return d && new Date(d) <= new Date();
  });
  if(!srsWords.length) { toast('오늘 복습할 단어가 없어요! 내일 다시 확인하세요 😊'); return; }
  S._flipWords = srsWords;
  S._flipIdx = 0;
  S.flip = false;
  S.stab = 'learn';
  go('mybooks', 'learn');
}

// ── 로그아웃 ──
function showLogoutMenu() {
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:17px;font-weight:800;margin-bottom:14px">⚙️ 계정 설정</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div onclick="auth.signOut().then(()=>{S=initState?initState():{words:[],books:[],markMap:{},srsMap:{},learned:new Set(),favorites:new Set(),studyLog:{},xp:0,lid:'egg',tab:'home',streak:0,_ownedPacks:[]};go();})" style="padding:14px;border-radius:12px;border:1.5px solid #E5E7EB;cursor:pointer;display:flex;align-items:center;gap:12px"><span style="font-size:20px">🚪</span><span style="font-size:14px;font-weight:600">로그아웃</span></div>
      <div onclick="if(confirm('모든 데이터가 초기화됩니다. 계속할까요?')){S.words=[];S.books=[];S.markMap={};S.srsMap={};S.learned=new Set();S.favorites=new Set();S.studyLog={};S.xp=0;S.lid='egg';S.streak=0;S._ownedPacks=[];sv();cm();go();toast('초기화 완료');}" style="padding:14px;border-radius:12px;border:1.5px solid #FECACA;cursor:pointer;display:flex;align-items:center;gap:12px;color:#DC2626"><span style="font-size:20px">🗑️</span><span style="font-size:14px;font-weight:600">학습 데이터 초기화</span></div>
    </div>
    <button onclick="cm()" class="btn" style="width:100%;margin-top:12px">닫기</button>
  </div></div>`;
}

// ── 레벨 모달 ──
function showLevelModal() {
  const lvI = lv(S.lid);
  const nextEvol = getNextEvolution();
  const xpPct = nextEvol ? Math.min(100,Math.round((S.xp||0)/nextEvol.xp*100)) : 100;
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="text-align:center;margin-bottom:16px">
      ${charSVGAnimated?charSVGAnimated(S.lid,80,'happy'):`<div style="font-size:64px">${lvI.emoji}</div>`}
      <div style="font-size:20px;font-weight:900;margin-top:8px">${lvI.name}</div>
      <div style="font-size:13px;color:#9CA3AF">⚡ ${S.xp||0} XP</div>
    </div>
    <div style="background:#F3F4F6;border-radius:8px;height:8px;margin-bottom:6px"><div style="height:100%;background:linear-gradient(90deg,#1E5FA5,#7C3AED);border-radius:8px;width:${xpPct}%"></div></div>
    <div style="font-size:11px;color:#9CA3AF;text-align:center;margin-bottom:16px">${nextEvol?`다음 진화까지 ${nextEvol.xp-(S.xp||0)} XP`:'최고 레벨 달성! 👑'}</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
      ${LEVELS.map(l=>`<div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:${S.lid===l.id?'#EFF6FF':'#F9FAFB'};border:1px solid ${S.lid===l.id?'#BFDBFE':'#E5E7EB'}">
        <span style="font-size:20px">${l.emoji}</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:700">${l.name}</div><div style="font-size:10px;color:#9CA3AF">${l.xp||0} XP~</div></div>
        ${S.lid===l.id?'<span style="font-size:12px;color:#1E5FA5;font-weight:700">현재</span>':(( S.xp||0)>=(l.xp||0)?'<span style="font-size:12px;color:#16A34A">✓</span>':'')}
      </div>`).join('')}
    </div>
    <button onclick="cm()" class="btn" style="width:100%">닫기</button>
  </div></div>`;
}

// ── 책장 모달 ──
function showBookcaseModal() {
  const books = [{name:'내 단어장', words:S.words},...(S.books||[])];
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:17px;font-weight:800;margin-bottom:14px">📚 책장</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      ${books.map(b=>`<div style="display:flex;align-items:center;gap:10px;padding:12px;background:#F9FAFB;border-radius:12px">
        <span style="font-size:20px">📖</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:700">${b.name}</div>
        <div style="font-size:11px;color:#9CA3AF">${(b.words||[]).length}개 단어</div></div>
        <button onclick="switchBook('${b.name.replace(/'/g,"\\'")}');cm();go()" style="background:#EFF6FF;color:#1E5FA5;border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">선택</button>
      </div>`).join('')}
    </div>
    <button onclick="cm()" class="btn" style="width:100%">닫기</button>
  </div></div>`;
}

// ── 친구 (준비 중) ──
function showFriends() {
  toast('친구 기능은 준비 중이에요');
}

// ── 알 초기화 ──
function resetToEgg() {
  // 도감에 현재 캐릭터 저장
  if(!S._collection) S._collection=[];
  if(S.lid && S.lid!=='egg') {
    S._collection.push({lid:S.lid, level:lv(S.lid).name, emoji:lv(S.lid).emoji, acquiredAt:new Date().toISOString()});
  }
  S.lid='egg'; S.xp=0; sv();
}

// ── CSV 내보내기 ──
function exportCSV(bookName) {
  const bk = bookName==='내 단어장' ? null : (S.books||[]).find(b=>b.name===bookName);
  const words = bk ? bk.words : S.words;
  const rows = ['en,kr,ph,ex,img,tip'];
  words.forEach(w=>rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.img||'',w.tip||''].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${bookName||'단어장'}_${today()}.csv`;
  a.click();
  toast('✅ CSV 내보내기 완료');
}

// ── 스와이프 힌트 ──
function showSwipeHint(text, color) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:${color||'#1E5FA5'};color:#fff;padding:12px 24px;border-radius:20px;font-size:18px;font-weight:800;z-index:9999;pointer-events:none;opacity:1;transition:opacity .5s`;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),500);},700);
}

// ── 말하기 모드 ──
function showSpeakMode() {
  S._flipWords = [...getCurrentBookWords()].sort(()=>Math.random()-.5);
  S._flipIdx = 0; S.flip = false;
  S.stab = 'learn';
  go('mybooks','learn');
  toast('뜻을 보고 영어로 말해보세요!');
}

</script>
