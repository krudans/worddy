// 플래시카드 스와이프 제스처 등록
function initFlashSwipe() {
  const card = document.getElementById('flash-card');
  if(!card) return;
  let sx=0, sy=0;
  card.addEventListener('touchstart', e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  card.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50) {
      e.stopPropagation();
      const w=S.words.length>0?S.words[Math.min(S.idx,S.words.length-1)]:null;
      if(dx>0 && w) {
        // 오른쪽 스와이프 = 알았어 ✅
        setMark(w.en,1); ok(); logStudy('words');
        SFX.play('swipe_ok');
        showSwipeHint('✅ 알았어!', '#16A34A');
        if(!S.learned.has(w.en)){S.learned.add(w.en);srsRate(w.en,1);checkAchievements();checkLearnMilestone();sv();}
        S.idx++; S.flip=false;
      } else if(dx<0 && w) {
        // 왼쪽 스와이프 = 모르겠어 🦋
        setMark(w.en,2); ng();
        SFX.play('swipe_ng');
        showSwipeHint('🦋 복습필요', '#DC2626');
        S.idx++; S.flip=false;
      }
      SFX.play('tap'); vib(30); go();
    } else {
      // 임계값 미만 → 카드 원위치
      card.style.transform = '';
      card.style.background = card.dataset.origBg || '';
    }
  },{passive:true});
  // 스와이프 방향 힌트 표시
  card.addEventListener('touchmove', e=>{
    const dx=e.touches[0].clientX-sx;
    if(Math.abs(dx)>15) {
      card.style.transform=`rotate(${dx*0.025}deg) translateX(${dx*0.12}px)`;
      card.style.background=dx>0?'#F0FDF4':'#FFF1F2';
      card.style.boxShadow=dx>0?'0 4px 24px #86EFAC88':'0 4px 24px #FECDD388';
    }
  },{passive:true});
  card.addEventListener('touchstart', ()=>{
    card.style.transition='none';
  },{passive:true});
}

function startAutoPlay() {
  let playing=true, idx=S.idx;
  const next=()=>{
    if(!playing||idx>=S.words.length){playing=false;cm();return;}
    const w=S.words[idx];
    const u=new SpeechSynthesisUtterance(w.en+'. '+w.kr);
    u.lang='ko-KR'; u.rate=0.9;
    window.speechSynthesis.speak(u);
    S.idx=idx; S.flip=false; go();
    idx++;
    u.onend=()=>{if(playing)setTimeout(next,600);};
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="text-align:center">
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">▶ 자동 재생 중</div>
    <div style="font-size:13px;color:#9CA3AF;margin-bottom:14px">단어를 순서대로 읽어드려요</div>
    <button onclick="playing=false;window.speechSynthesis.cancel();cm()" class="btn bgr">⏹ 정지</button>
  </div></div>`;
  next();
}

function nxtL(ok){
  const words = S.words;
  const w=words[Math.min(S.idx, words.length-1)];
  if(!w) return;
  if(ok&&!S.learned.has(w.en)){
    S.learned.add(w.en);setMark(w.en,1);srsRate(w.en,1);
    logStudy('words');checkAchievements();checkLearnMilestone();sv();
    SFX.play('correct');vib(50);
    const clrs=['#FDE68A','#6EE7B7','#93C5FD'];
    for(let ci=0;ci<6;ci++){const p=document.createElement('div');const ang=(ci/6)*360;p.style.cssText='position:fixed;left:50%;top:60%;width:8px;height:8px;border-radius:50%;background:'+clrs[ci%3]+';z-index:9999;pointer-events:none;transform:translate(-50%,-50%);transition:all .4s ease-out;opacity:1';document.body.appendChild(p);setTimeout(()=>{p.style.transform='translate(calc(-50% + '+Math.round(Math.cos(ang*Math.PI/180)*50)+'px),calc(-50% + '+Math.round(Math.sin(ang*Math.PI/180)*50)+'px))';p.style.opacity='0';},30);setTimeout(()=>p.remove(),500);}
  } else if(ok) {SFX.play('correct');vib(50);}
  S.idx++;
  S.flip=false;
  go();
}

async function extractFromText() {
  const inp = document.getElementById('url-extract-inp')?.value?.trim();
  if(!inp){toast('텍스트를 입력해주세요');return;}
  cm();
  S.ai=true; go('mybooks','add');
  try {
    // URL이면 먼저 내용 가져오기 (CORS 우회 불가, 텍스트 직접 처리)
    const isUrl = inp.startsWith('http://') || inp.startsWith('https://');
    const prompt = isUrl
      ? `이 URL의 내용을 알 수 없으므로, URL 자체에서 단어를 추측해서 JSON 배열로 반환: ${inp}\n형식: [{"en":"word","kr":"뜻"}] (5~10개)`
      : `아래 영어 텍스트에서 학습하기 좋은 단어 10~15개를 뽑아 JSON 배열로만 반환.\n형식: [{"en":"word","kr":"뜻"}]\n\n텍스트:\n${inp.slice(0,2000)}`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    showExtracted(JSON.parse(txt));
  } catch(e) { toast('추출 실패. 텍스트를 직접 입력해주세요'); }
  S.ai=false; go('mybooks','add');
}

async function aiMFull() {
  const en=(document.getElementById('ne')?.value||S.nEn).trim();
  if(!en){toast('영단어를 먼저 입력하세요');return;}
  S.ai=true; S.nAiData=null; go();
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:`"${en}" 단어 정보를 JSON으로만 반환. 형식: {"kr":"뜻1, 뜻2","ph":"[발음기호]","ex":"예문","tip":"한국어 발음 암기팁"}`}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    S.nKr=parsed.kr||''; S.nEn=en;
    S.nAiData={ph:parsed.ph,ex:parsed.ex,tip:parsed.tip};
  } catch(e){
    // 간단 버전으로 폴백
    try{const r2=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:60,messages:[{role:'user',content:`"${en}" 한국어 뜻 2~3개만. 예: "인내, 끈기"`}]})});const d2=await r2.json();S.nKr=d2.content?.[0]?.text?.trim()||'';S.nEn=en;}catch(e2){toast('AI 오류');}
  }
  S.ai=false; go();
}

function addW(){

  const kr=(document.getElementById('nk2')?.value||S.nKr).trim();

  if(S.words.find(w=>w.en.toLowerCase()===en.toLowerCase())){toast('이미 있는 단어');return;}
  const aiD=S.nAiData||{};
  const newWord={en,kr,ph:aiD.ph||'',ex:aiD.ex||en+'.',tip:aiD.tip||en+' = '+kr,meanings:[kr],img:S.nImg||aiD.img||'📝'};
  S.words.push(newWord);

  go();
}

async function aiEnrichWord(en) {
  const wi = S.words.find(x=>x.en===en);
  if(!wi) return;
  toast('AI 분석 중...');
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:`"${en}" 단어 정보 JSON으로만 반환. 형식: {"koSnd":"한국어발음(예:애플)","pos":"품사(예:명사/동사)","syn":"유의어 2개(쉼표구분)","tip":"한국어 암기팁"}`}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const p=JSON.parse(txt);
    if(p.koSnd) wi.koSnd=p.koSnd;
    if(p.pos) wi.pos=p.pos;
    if(p.syn) wi.syn=p.syn;
    if(p.tip&&!wi.tip) wi.tip=p.tip;
    sv();
    showWordDetail(en);
  } catch(e) { toast('AI 오류'); }
}

function startGameW(id, ws) {
  SFX.playBG(); vib(30);
  const gs = S.gameSettings||{count:10};
  // ws가 지정되지 않으면 현재 단어장 단어 사용
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const src = ws || (curWords.length>=2 ? curWords : (DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  S._prevTab=(S.tab==='butterfly'||S.tab==='game')?'butterfly':(S.tab||'home'); S.gameId=id; S.gDone=false; S._gameRunning=true; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput=''; S._combo=0; S._maxCombo=0;
  S.gResultMap={};
  // ws가 이미 지정됐으면 그대로, 아니면 count 적용
  const cnt=ws?ws.length:Math.min(gs.count||10, src.length);
  S.gWords=ws||pick(src,cnt);
  // 이어하기 저장 (quiz/typing만)
  if(id==='quiz'||id==='typing') {
    S.gSavedGame={id,words:S.gWords,score:0,idx:0};
  }
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;S.mWrongEn=null;S.mWrongKr=null;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='wc'){const pool=src.filter(w=>w.en.length>=3);S.wcWord=pool.length?rnd(pool):src[0];S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;}
  if(id==='sentence'||id==='ssort'){buildSentenceFromWords(ws||S.gWords);if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}

  // 깜빡이(flip)는 학습 탭 플래시카드 모드로 이동
  if(id==='flip') {
    // S.words를 덮어쓰지 않고 gWords를 임시로 참조
    S._flipWords = S.gWords; // 임시 저장
    S._flipIdx = 0;
    S.tab = 'study'; S.stab = 'learn'; go();
    toast(`⚡ 깜빡이 시작! ${S.gWords.length}개 단어`);
    return;
  }

  // 나비 탭으로 전환
  S.tab='butterfly'; S.stab=null; updHD();
  showCountdown(()=>go());
}

function rGameDone(){
  SFX.stopBG();
  S._gameRunning=false;
  if(typeof saveGameScore==='function') saveGameScore(S.gScore);
  // 게임 완료 XP 지급
  if(!S._inLevelTest && !S._inLearnSession) {
    const gameXp = {quiz:30,fill:25,typing:35,match:20,sentence:40,listen:35,wordfind:25,wordle:50,wc:25,chain:30};
    const xpAmt = gameXp[S.gameId]||20;
    const pct = S.gWords.length>0 ? Math.round(S.gScore/100/S.gWords.length*100) : 0;
    const bonus = pct>=100?1.5:pct>=80?1.2:1.0;
    const finalXp = Math.round(xpAmt*bonus);
    addXP(finalXp);
    checkAchievements();
    checkXpUsable();
  }
  // 레벨 테스트
  if(S._inLevelTest) {
    const rm={...(S.gResultMap||{})};
    S._inLevelTest=false; S._inLearnSession=false;
    const tw=S._levelTestWords||[];
    const correct=tw.filter(w=>rm[w.en]!==false).length;
    const total=tw.length;
    const pct=total>0?Math.round(correct/total*100):0;
    const passRate=S._levelTestPassRate||100;
    const passed=pct>=passRate;
    const curLvIdx=LEVELS.findIndex(l=>l.id===S.lid);
    const nextLv=LEVELS[Math.min(curLvIdx+1,LEVELS.length-1)];
    const lvInfo=lv(S.lid);
    S.tab='learn'; S.gDone=false;
    requestAnimationFrame(()=>{
      go(S._prevTab||'butterfly');
      requestAnimationFrame(()=>{
        const mr=document.getElementById('mr');
        if(!mr)return;
        mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:56px;margin-bottom:12px">${passed?'🎉':'😢'}</div>
      <div style="font-size:22px;font-weight:900;color:${passed?'#16A34A':'#DC2626'};margin-bottom:6px">${passed?'통과!':'아쉽게도 탈락...'}</div>
      <div style="font-size:32px;font-weight:900;color:${passed?'#16A34A':'#DC2626'};margin-bottom:4px">${pct}%</div>
      <div style="font-size:13px;color:#9CA3AF;margin-bottom:16px">${correct}/${total}개 정답 (기준: ${passRate}%)</div>
      ${passed?`<div style="background:#F0FDF4;border-radius:14px;padding:14px;margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:#16A34A">${lvInfo.emoji} ${lvInfo.name} → ${nextLv?.emoji||'⚡'} ${nextLv?.name||'최고'} 승급!</div></div>
        <button onclick="cm();_doLevelUp()" style="width:100%;background:#16A34A;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px">🎊 레벨업!</button>`
      :`<button onclick="cm();startLearnSession('random')" style="width:100%;background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px">📖 다시 학습</button>`}
      <button onclick="cm();go(S._prevTab||'butterfly')" style="width:100%;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer">학습 탭으로</button>
    </div></div>`;
      });
    });
    return '';
  }
  // 학습 세션
  if(S._inLearnSession) {
    const rm={...(S.gResultMap||{})};
    S._inLearnSession=false;
    S.tab='learn'; S.gDone=false;
    // 화면 전환 후 모달 표시
    requestAnimationFrame(()=>{
      go(S._prevTab||'butterfly');
      requestAnimationFrame(()=>finishLearnSession(rm));
    });
    return '';
  }
  const tot=Math.max(S.gWords.length,1);
  const right=Math.round(S.gScore/100);
  const pct=Math.round(right/tot*100);
  const hp=pct>=70;
  const _gXpMap={quiz:25,fill:20,typing:30,match:18,sentence:35,listen:30,wordfind:20,wordle:40,wc:20,chain:25};
  const _gXp=(_gXpMap[S.gameId]||20)+(pct>=100?10:pct>=80?5:0);
  if(hp){SFX.play('levelup');vib([100,50,100,50,200]);}else{SFX.play('wrong');vib([100,100,200]);}
  const lvInfo=lv(S.lid);
  const msg=pct>=100?['완벽해! 천재다! 🏆',lvInfo.id,'happy']:
    pct>=80?['아주 잘했어! 🎉',lvInfo.id,'happy']:
    pct>=60?['조금 더 할 수 있어! 💪',lvInfo.id,'normal']:
    ['괜찮아! 다시 도전! 🔥',lvInfo.id,'sad'];

  // 최고점 업데이트
  if(!S.bestScores) S.bestScores={};
  const prevBest=S.bestScores[S.gameId]||0;
  const isNewBest=pct>prevBest;
  if(isNewBest){ S.bestScores[S.gameId]=pct; sv(); }

  // 자동 마킹: gameSettings.autoMark가 true일 때만

function rWC(){
  if(!S.wcWord){S.gDone=true;return rGame();}

  }).join('');

  if(allDone){S.gScore+=Math.max(0,(6-S.wcWrong)*20);ok();setTimeout(()=>{S.gIdx++;if(S.gIdx>=S.gWords.length){S.gDone=true;go();return;}

  const alpha='abcdefghijklmnopqrstuvwxyz'.split('');

    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:20px;padding:20px;text-align:center;border:3px solid #BFDBFE">

function guessWC(letter){

  if(hits.length>0){hits.forEach(i=>S.wcGuessed.add(i));ok();}
  else{S.wcWrong++;ng();if(S.wcWrong>=6){setTimeout(()=>{S.gIdx++;if(S.gIdx>=S.gWords.length)S.gDone=true;const pool=(S.words.length>=2?S.words:DEFAULT_WORDS[S.lid]).filter(ww=>ww.en.length>=3);S.wcWord=rnd(pool);S.wcLetters=S.wcWord.en.split('').map((l,i2)=>{const hide=Math.random()<.5&&i2>0&&i2<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;go();},1000);}  }
  go();
}

function rMatch(){
  const all=S.mMatched.size>=S.mPairs.length*2;
  if(all&&!S.gDone){
    // 남은 단어 있으면 다음 세트, 없으면 종료
    S._matchPlayed = (S._matchPlayed||0) + S.mPairs.length;
    const remaining = S.gWords.slice(S._matchPlayed);
    if(remaining.length >= 2) {
      SFX.play('levelup'); vib([100,50,100]);
      toast('🎉 세트 완료! 다음 세트 시작!');
      setTimeout(()=>{
        const nextPairs = pick(remaining, Math.min(5, remaining.length));
        S.mPairs=nextPairs; S.mEn=shuf(nextPairs.map(p=>p.en));
        S.mKr=shuf(nextPairs.map(p=>p.kr)); S.mMatched=new Set();
        S.mEn0=null; S.mKr0=null; S.mScore+= S.mPairs.length*100;
        S.mWrongEn=null; S.mWrongKr=null; go();
      }, 800);
    } else {
      S.gDone=true; S.gScore=S.mScore; setTimeout(()=>go(),300);

function selM(t,v){
  // mEn[i]↔mKr[j] 인덱스 기반 매칭
  // mEnIdx[en] → mPairs에서의 원본 인덱스 저장
  if(t==='en'){
    if(S.mMatched.has(v)) return; // 이미 매칭된 것
    S.mEn0=v;
  } else {
    if(S.mMatched.has('kr_'+v)) return; // 이미 매칭된 것
    S.mKr0=v;
  }
  // 양쪽 모두 선택됐을 때 매칭 시도
  if(S.mEn0!==null && S.mKr0!==null){
    const enVal = S.mEn0;
    const krIdx = S.mKr0;
    const krVal = S.mKr[krIdx];
    // mPairs에서 해당 en의 정답 kr 찾기
    const pair = S.mPairs.find(p=>p.en===enVal);
    const isMatch = pair && pair.kr===krVal;
    if(isMatch){
      S.mMatched.add(enVal);
      S.mMatched.add('kr_'+krIdx);
      S.mScore+=100; ok(); logStudy('quiz');
      S.mEn0=null; S.mKr0=null;
    } else {
      // 오답: 잠깐 빨간색으로 표시 후 초기화
      ng();
      S.mWrongEn=enVal; S.mWrongKr=krIdx;
      go();
      setTimeout(()=>{S.mWrongEn=null;S.mWrongKr=null;S.mEn0=null;S.mKr0=null;go();},700);
      return;
    }
  }
  go();
}

function buildWF(src){
  // 단어 수에 따라 그리드 크기 결정
  const wordCount = Math.min((src||S.gWords||[]).length, 8);
  const pickWords = pick((src||S.gWords).map(w=>w.en.toUpperCase().replace(/\s/g,'_')), wordCount);
  const sz = Math.max(8, Math.ceil(Math.sqrt(pickWords.reduce((a,w)=>a+w.length,0)*2)));
  const gridSz = Math.min(sz, 12); // 최대 12×12
  const grid = Array.from({length:gridSz},()=>Array(gridSz).fill(''));
  const placed = [];
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  pickWords.forEach(w=>{
    for(let t=0;t<100;t++){
      const dir=Math.floor(Math.random()*2);
      const dr=[0,1][dir], dc=[1,0][dir];
      const r=Math.floor(Math.random()*(gridSz-dr*(w.length-1)));
      const c=Math.floor(Math.random()*(gridSz-dc*(w.length-1)));
      if(r+dr*(w.length-1)>=gridSz||c+dc*(w.length-1)>=gridSz) continue;
      let ok=true;
      const cells=[];
      for(let i=0;i<w.length;i++){
        const cr=r+dr*i, cc=c+dc*i;
        if(grid[cr][cc]&&grid[cr][cc]!==w[i]){ok=false;break;}
        cells.push(`${cr},${cc}`);
      }
      if(ok){
        cells.forEach((k,i)=>{const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=w[i];});
        placed.push({word:w,cells});
        break;
      }
    }
  });

  // 빈 칸 채우기
  for(let r=0;r<gridSz;r++)for(let c=0;c<gridSz;c++)
    if(!grid[r][c])grid[r][c]=alpha[Math.floor(Math.random()*26)];

  S.wfGrid=grid;
  S.wfWords=placed; // 실제 배치된 단어만
  S.wfFound=new Set();
  S.wfSel=[];
  S.wfGridSz=gridSz;
}

function addDiaryPhoto(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=600; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      if(!S.dPhotos)S.dPhotos=[];
      if(S.dPhotos.length>=3){toast('사진은 최대 3장');return;}
      S.dPhotos.push(canvas.toDataURL('image/jpeg',0.7)); go();
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}

function createBookcase() {
  const icon = document.getElementById('bc-icon')?.value.trim()||'📁';
  const name = document.getElementById('bc-name')?.value.trim();
  if(!name){toast('책장 이름을 입력하세요','err');return;}
  const selected = [...document.querySelectorAll('#bc-books-select button.selected')].map(b=>b.textContent);
  if(!S.bookcase) S.bookcase = [];
  S.bookcase.push({name, icon, bookNames: selected});
  sv();
  toast(`✅ "${name}" 책장 생성!`);
  showBookcaseModal();
}

function deleteBookcase(idx) {
  if(!confirm('책장을 삭제할까요? 단어장은 유지돼요')) return;
  S.bookcase.splice(idx, 1);
  sv();
  showBookcaseModal();
}

// CSV 불러오기 (앱 설정에서)
function importCSVApp(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const start = lines[0].toLowerCase().includes('en') ? 1 : 0;
    const newWords = [];
    lines.slice(start).forEach(line => {
      const p = line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
      if(p.length>=2&&p[0]&&p[1]) {
        if(!S.words.find(w=>w.en.toLowerCase()===p[0].toLowerCase())) {
          newWords.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});
        }
      }
    });
    if(!newWords.length){toast('추가할 새 단어가 없어요');return;}
    S.words.push(...newWords);
    sv(); cm();
    toast(`✅ ${newWords.length}개 불러오기 완료!`,'ok');
    go();
  };
  reader.readAsText(file, 'UTF-8');
}

// 구글 드라이브 백업
async function syncGoogleDrive() {
  try {
    // Google Identity Services로 토큰 요청
    if(!window.google?.accounts) {
      // GIS 라이브러리 동적 로드
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://accounts.google.com/gsi/client';
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }
    toast('구글 드라이브 연동 중...');
    // 백업 데이터 준비
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      words: S.words,
      markMap: S.markMap,
      srsMap: S.srsMap,
      dList: S.dList,
      books: S.books,
      streak: S.streak,
      attendDates: S.attendDates,
      lid: S.lid,
      nick: S.nick,
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});

    // Google OAuth2 토큰 요청
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: '959781543804-wordday.apps.googleusercontent.com',
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (tokenResp) => {
        if(tokenResp.error) { toast('구글 로그인 실패: '+tokenResp.error,'err'); return; }
        // 파일 업로드
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({
          name: `Vocabug_backup_${new Date().toISOString().slice(0,10)}.json`,
          mimeType: 'application/json',
          parents: ['appDataFolder']
        })], {type:'application/json'}));
        form.append('file', blob);
        const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method:'POST',
          headers:{Authorization:`Bearer ${tokenResp.access_token}`},
          body: form,
        });
        if(resp.ok) {
          const now = new Date().toLocaleString('ko-KR');
          localStorage.setItem('wd-gdrive-sync', now);
          toast('☁️ 구글 드라이브 백업 완료!','ok');
          showAppSettings('backup');
        } else {
          toast('업로드 실패: '+resp.status,'err');
        }
      },
    });
    tokenClient.requestAccessToken();
  } catch(e) {
    // 드라이브 API 불가 시 로컬 파일로 대체
    toast('드라이브 연결 실패. 로컬 파일로 저장할게요.');
    showDataBackup();
  }
}

      if(data.srsMap) S.srsMap = data.srsMap;
      if(data.dList) S.dList = data.dList;

async function addFriendByCode() {
  const code = document.getElementById('friend-code-inp')?.value?.trim()?.toUpperCase();
  if(!code||code.length<8){toast('8자리 코드를 입력해주세요');return;}
  if(code === (S.user?.uid?.slice(0,8)?.toUpperCase())){toast('본인 코드예요!');return;}
  try {
    // Firebase에서 해당 코드 사용자 찾기
    const snap = await db.collection('users').where('code','==',code).limit(1).get();
    if(snap.empty){toast('해당 코드의 사용자를 찾을 수 없어요');return;}
    const friendData = snap.docs[0].data();
    const friendUid = snap.docs[0].id;
    if(!S.friends) S.friends=[];
    if(S.friends.find(f=>f.uid===friendUid)){toast('이미 친구예요!');return;}
    S.friends.push({uid:friendUid, nick:friendData.nick||'친구', lid:friendData.lid||'egg', streak:friendData.streak||0, code});
    sv();
    toast(`✅ ${friendData.nick||'친구'} 추가 완료!`);
    showFriends();
  } catch(e){toast('검색 실패. 잠시 후 다시 시도해주세요');}
}

async function pokeFriend(uid, nick, btn) {
  btn.disabled=true; btn.textContent='전송 중...';
  try {
    await db.collection('pokes').add({
      to: uid,
      from: S.user?.uid,
      fromNick: S.nick||'친구',
      msg: `${S.nick||'친구'}님이 공부하러 오라고 콕 찔렀어요! 💪`,
      read: false,
      at: new Date().toISOString(),
    });
    btn.textContent='✅ 전송!';
    toast(`👉 ${nick}에게 콕 찌르기 전송!`);
    setTimeout(()=>{btn.textContent='👉 콕';btn.disabled=false;},3000);
  } catch(e){btn.textContent='👉 콕';btn.disabled=false;toast('전송 실패');}
}

async function syncProfileToFirebase() {
  if(!S.user?.uid) return;

function exportCSV() {
  const rows = ['영단어,한국어뜻,발음기호,예문,암기팁,마크'];
  S.words.forEach(w => {
    const mark = ['미분류','외운','헷갈리는'][getMark(w.en)||0];
    rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.tip||'',mark].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vocabug_단어장_${today()}.csv`;
  a.click();
  toast('✅ CSV 내보내기 완료!');
}

function importCSV(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l=>l.trim());
    let cnt = 0;
    // 헤더 스킵
    const start = lines[0].toLowerCase().includes('영단어') ? 1 : 0;
    lines.slice(start).forEach(line => {
      const parts = line.split(',').map(p=>p.trim().replace(/^"|"$/g,'').replace(/""/g,'"'));
      if(parts.length>=2) {
        const en=parts[0], kr=parts[1], ph=parts[2]||'', ex=parts[3]||'', tip=parts[4]||'';
        if(en&&kr&&!S.words.find(w=>w.en.toLowerCase()===en.toLowerCase())) {
          S.words.push({en,kr,ph,ex:ex||en+'.',tip:tip||en+' = '+kr,meanings:[kr],img:'📝'});
          cnt++;
        }
      }
    });
    sv(); cm(); toast(`✅ ${cnt}개 단어 가져오기 완료!`); go('mybooks','list');
  };
  reader.readAsText(file, 'UTF-8');
}

function importJSON(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.words) { toast('올바른 JSON 파일이 아니에요'); return; }
      if(!confirm(`백업 파일에서 ${data.words.length}개 단어를 복원할까요?\n현재 데이터와 합쳐집니다.`)) return;
      let cnt = 0;
      (data.words||[]).forEach(w => {
        if(!S.words.find(x=>x.en.toLowerCase()===w.en.toLowerCase())) {
          S.words.push(w); cnt++;
        }
      });
      // 마크/SRS 병합
      Object.assign(S.markMap, data.markMap||{});
      Object.assign(S.srsMap, data.srsMap||{});
      Object.assign(S.studyLog, data.studyLog||{});
      sv(); cm(); toast(`✅ ${cnt}개 단어 복원 완료!`); go('mybooks','list');
    } catch(err) { toast('파일을 읽을 수 없어요'); }
  };
  reader.readAsText(file);
}
