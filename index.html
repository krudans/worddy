<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg,#FAF8F5);display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;max-height:100dvh;background:var(--bg,#FAF8F5);display:flex;flex-direction:column;overflow:hidden}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
/* ── 테마: 크림 라이트 (기본) ── */
body, body.theme-light {
  --bg:       #FAF8F5;
  --bg-card:  #FFFFFF;
  --bg-sub:   #F2F0EC;
  --bg-input: #FFFFFF;
  --bg-nav:   #FFFFFF;
  --text1:    #1A1A2E;
  --text2:    #4A5568;
  --text3:    #9CA3AF;
  --border:   #E8E4DE;
  --border2:  #D1CCC4;
  --btn-gray: #F2F0EC;
  --btn-gray-t:#4A5568;
  --shadow:   rgba(0,0,0,0.06);
}
body{background:var(--bg);color:var(--text1)}
#app{background:var(--bg)!important}
.body,.pad{background:var(--bg)!important}
.card{background:var(--bg-card)!important;border-color:var(--border)!important}
.nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
.stabs{background:var(--bg-sub)!important}
.bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
input,select,textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
.bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
.modal{background:var(--bg-card)!important}
.mbg .modal{background:var(--bg-card)!important}

/* ── 테마: 차콜 다크 ── */
body.theme-dark {
  --bg:       #1A1A1A;
  --bg-card:  #242424;
  --bg-sub:   #1F1F1F;
  --bg-input: #2C2C2C;
  --bg-nav:   #242424;
  --text1:    #ECECEC;
  --text2:    #A0AEC0;
  --text3:    #64748B;
  --border:   #333333;
  --border2:  #444444;
  --btn-gray: #2C2C2C;
  --btn-gray-t:#A0AEC0;
  --shadow:   rgba(0,0,0,0.4);
}
body.theme-dark{background:var(--bg)!important;color:var(--text1)!important}
body.theme-dark #app{background:var(--bg)!important}
body.theme-dark .hd{background:linear-gradient(135deg,#111,#1E3A5F)!important}
body.theme-dark .body,body.theme-dark .pad{background:var(--bg)!important}
body.theme-dark .card{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
body.theme-dark .stabs{background:var(--bg-sub)!important}
body.theme-dark .st{color:var(--text3)!important}
body.theme-dark .st.on .st-lb{color:#60A5FA!important}
body.theme-dark .bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
body.theme-dark .modal{background:var(--bg-card)!important;color:var(--text1)!important}
body.theme-dark .mbg .modal{background:var(--bg-card)!important}
body.theme-dark h2,body.theme-dark h3,body.theme-dark div{color:inherit}
body.theme-dark .logo{color:#ECECEC!important}

/* ── 폰트 크기 ── */
body.fs-sm{font-size:13px!important}
body.fs-md{font-size:15px!important}
body.fs-lg{font-size:17px!important}
</style>

// ── 음향 시스템 ──
const SFX = {
  ctx: null,
  init() { try { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  play(type) {
    try {
      this.init(); const c = this.ctx;
      const g = c.createGain(); g.connect(c.destination);
      const o = c.createOscillator(); o.connect(g);
      if(type==='correct') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);
        [523,659,784].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.4);
      } else if(type==='wrong') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
        o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+.15);
        o.type='sawtooth'; o.start(c.currentTime); o.stop(c.currentTime+.3);
      } else if(type==='levelup') {
        [523,659,784,1047].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.3,c.currentTime+i*.12);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.12+.3);
          oo.start(c.currentTime+i*.12); oo.stop(c.currentTime+i*.12+.3);
        });
      } else if(type==='flip'||type==='tap') {
        g.gain.setValueAtTime(.1,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.08);
        o.frequency.value=type==='flip'?800:600; o.start(c.currentTime); o.stop(c.currentTime+.08);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};
const vib = p => { try { if('vibrate' in navigator) navigator.vibrate(p); } catch(e){} };
const ok = () => { SFX.play('correct'); vib([50,0,50]); };
const ng = () => { SFX.play('wrong'); vib([100,50,100]); };

const shuf = a => [...a].sort(()=>Math.random()-.5);

function checkAttend() {
  const t = today();
  if(S.attendPopupShown === t) return; // 오늘 이미 표시
  S.attendPopupShown = t;
  if(!S.attendDates.includes(t)) {
    S.attendDates.push(t);
    S.attendCount++;
    sv();
    showAttendPopup();
  }
}

function logStudy(type) {
  // type: 'words' or 'quiz'
  const t = today();
  if(!S.studyLog[t]) S.studyLog[t] = {words:0, quiz:0};
  S.studyLog[t][type]++;
  updStreak(); // 학습 시 streak 자동 업데이트
  sv();
}

  {label:'미분류',       color:'#9CA3AF', bg:'#F3F4F6', emoji:'🥚', paw:'🥚'},
  {label:'외운 단어',    color:'#1E5FA5', bg:'#EFF6FF', emoji:'🐛', paw:'🐛'},

];
function getMark(en) { return S.markMap[en]||0; }
function setMark(en, val) {
  S.markMap[en] = val;
  // 외운 단어 → learned에도 추가
  if(val===1) S.learned.add(en);
  else if(val===2) S.learned.delete(en);
  sv();
}
function cycleMark(en) {
  const cur = getMark(en);
  const next = (cur+1)%3;
  setMark(en, next);
  return next;
}
function markPawBtn(en, size=24) {
  const m = getMark(en);
  const info = MARK_INFO[m];
  return `<button onclick="event.stopPropagation();const n=cycleMark('${en.replace(/'/g,"\\'")}');const inf=MARK_INFO[n];toast(inf.emoji+' '+inf.label+'로 표시!');go();" style="background:${info.bg};border:1.5px solid ${info.color}44;border-radius:50%;width:${size+8}px;height:${size+8}px;cursor:pointer;font-size:${Math.round(size*.6)}px;display:flex;align-items:center;justify-content:center;flex-shrink:0" title="${info.label}">${MARK_INFO[m].emoji}</button>`;
}

function toast(msg) {
  const w=document.getElementById('tw');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; w.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

function applyFont() {
  const ff = S.fontFamily || 'default';
  const fontMap = {
    'default': '-apple-system,"Apple SD Gothic Neo",sans-serif',
    'gothic':  '"Noto Sans KR",sans-serif',
    'serif':   '"Noto Serif KR",serif',
    'mono':    'monospace',
  };
  document.body.style.fontFamily = fontMap[ff] || fontMap['default'];
}

function applyTheme() {
  const b = document.body;
  b.classList.remove('theme-light','theme-dark');
  b.classList.add('theme-'+(S.theme||'light'));
  b.classList.remove('fs-sm','fs-md','fs-lg');
  b.classList.add('fs-'+(S.fontSize||'md'));
  applyFont();
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.content = S.theme==='dark' ? '#1A1A1A' : '#1E5FA5';
}

function addXP(n) {
  S.xp=Math.min(100,S.xp+n); updHD();
  const ni=LEVELS.findIndex(l=>l.id===S.lid), next=LEVELS[ni+1];
  if(next&&S.xp>=next.min) {
    S.lid=next.id; S.xp=next.min;
    S.words=[...DEFAULT_WORDS[next.id]||DEFAULT_WORDS.egg]; S.learned.clear(); S.idx=0;
    sv(); updHD(); SFX.play('levelup'); vib([100,50,100,50,200]);
    loadWordsFromFirestore(next.id);
    document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="text-align:center;padding:32px 20px">
      <div style="font-size:56px;margin-bottom:10px">${next.emoji}</div>

}
function updStreak() {
  const td=today(); if(S.lastDate===td) return;
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.lastDate===yd) S.streak++; else S.streak=1;
  S.lastDate=td; sv();
}

// ── Firestore 단어 로드 ──
async function loadWordsFromFirestore(lid) {
  try {
    const doc = await db.collection('words').doc(lid).get();
    if(doc.exists) {
      const data = doc.data();
      if(data.list && data.list.length > 0) {
        S.words = data.list;
        sv(); go();
        toast(`✅ ${data.list.length}개 단어 로드 완료!`);
      }
    }
  } catch(e) { /* Firestore 없으면 기본 단어 사용 */ }
}

// ── 알람 스케줄링 ──
function scheduleAlarms() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const l = lv(S.lid);
  const msg = rnd(l.alarm);
  const alarms = [
    {cfg:S.alStudy, title:`${l.emoji} Vocabug 공부 알람`, body:msg},
    {cfg:S.alDiary, title:`${l.emoji} Vocabug 일기 알람`, body:'오늘 일기 아직 안 썼지? 얼른!'},
    {cfg:S.alGoal, title:`${l.emoji} Vocabug 목표 알람`, body:'오늘 목표 아직 미완료! 빨리!'},
    {cfg:S.alStreak, title:`${l.emoji} Vocabug 스트릭 알람`, body:`${S.streak}일 연속 기록이 끊기기 직전!`},
  ];
  alarms.forEach(({cfg, title, body}) => {
    if(!cfg.on) return;
    const now = new Date();
    const target = new Date();
    target.setHours(cfg.h, cfg.m, 0, 0);
    if(target <= now) target.setDate(target.getDate()+1);
    const delay = target - now;
    if('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({type:'SCHEDULE_ALARM', title, body, delay, tag:title});
    }
  });
}

function startTest() {
  // 적응형 테스트: egg부터 시작, 3연속 정답→상승, 2오답→확정
  S.tQs = [];
  S.tIdx = 0;
  S.tScore = {};
  S.tAns = false;
  S.tRes = null;
  S.tCurChoices = null;
  S.tCorrectIdx = null;
  // 상태 초기화
  S.tLvIdx = 0;        // 현재 도전 레벨 인덱스
  S.tConsecRight = 0;  // 연속 정답 수
  S.tWrongCount = 0;   // 현재 레벨 오답 수
  S.tTotalQ = 0;       // 총 문제 수
  S.tLvResult = {};    // 레벨별 결과
  renderAdaptiveQ();
}

// ── 적응형 테스트 핵심 ──
function renderAdaptiveQ() {
  const lvId = LEVELS[S.tLvIdx]?.id;
  if(!lvId) { finishAdaptiveTest(); return; }
  const pool = TEST_POOL[lvId] || TEST_POOL.egg;
  const q = {...rnd(pool), lv: lvId};
  S.tCurrentQ = q;
  S.tTotalQ++;
  renderAdaptiveMCQ(q);
}

function renderAdaptiveMCQ(q) {
  const l = lv(q.lv);
  const lvIdx = S.tLvIdx;
  // 보기 순서 고정
  if(!S.tAns) {
    S.tCurChoices = shuf(q.c.map((c,i)=>({c,i})));
    S.tCorrectIdx = S.tCurChoices.findIndex(x=>x.i===q.a);
  }
  const cs = S.tCurChoices||[];
  const correctIdx = S.tCorrectIdx||0;
  window._tCorrect = correctIdx;
  window._tLv = q.lv;

  // 상단 진행 표시 (레벨 + 연속정답/오답)
  const consecDots = Array(3).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tConsecRight?'#16A34A':'#E5E7EB'};border:2px solid ${i<S.tConsecRight?'#86EFAC':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tConsecRight?'✓':''}</span>`
  ).join('');
  const wrongDots = Array(2).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tWrongCount?'#DC2626':'#E5E7EB'};border:2px solid ${i<S.tWrongCount?'#FECDD3':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tWrongCount?'✗':''}</span>`
  ).join('');

  document.getElementById('body').innerHTML=`<div class="pad">
    <div style="background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid #E5E7EB">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:#1E5FA5">${l.emoji} ${l.name} 도전 중</div>
        <div style="font-size:11px;color:#9CA3AF">${S.tTotalQ}번째 문제</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#16A34A;font-weight:700">정답</span>
          ${consecDots}
          <span style="font-size:11px;color:#9CA3AF">3개면 상승!</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#DC2626;font-weight:700">오답</span>
          ${wrongDots}
          <span style="font-size:11px;color:#9CA3AF">2개면 확정</span>
        </div>
      </div>
    </div>
    <div style="background:#F8F9FA;border-radius:20px;padding:32px 24px;text-align:center;border:1.5px solid #E5E7EB">
      ${S.showImg!==false?`<div style="font-size:64px;margin-bottom:12px">${q.img||'📝'}</div>`:''}
      <div style="font-size:32px;font-weight:900;color:#111;font-family:monospace">${q.q}</div>
    </div>
    <div class="g2">${cs.map((x,ri)=>{
      let bg='#fff',col='#374151',bd='#E5E7EB';
      if(S.tAns){
        if(ri===correctIdx){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}
        else if(ri===S.tRes){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}
      }
      return `<button onclick="tOptClick(${ri})" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600;cursor:${S.tAns?'default':'pointer'};width:100%;font-family:inherit;text-align:center">${x.c}</button>`;
    }).join('')}</div>`;
}

window.tOptClick = function(ri) {
  if(S.tAns) return;
  S.tAns = true;
  S.tRes = ri;
  const correct = window._tCorrect;
  const lvId = window._tLv;
  const isRight = ri === correct;

  if(isRight) {
    ok();
    S.tConsecRight++;
    S.tScore[lvId] = (S.tScore[lvId]||0) + 1;
  } else {
    ng();
    S.tConsecRight = 0;
    S.tWrongCount++;
  }

  renderAdaptiveMCQ(S.tCurrentQ);

  setTimeout(() => {
    S.tAns = false; S.tRes = null;
    S.tCurChoices = null; S.tCorrectIdx = null;

    if(S.tConsecRight >= 3) {
      // 레벨 통과 → 다음 레벨
      S.tLvResult[lvId] = 'pass';
      S.tLvIdx++;
      S.tConsecRight = 0;
      S.tWrongCount = 0;
      if(S.tLvIdx >= LEVELS.length) { finishAdaptiveTest(); return; }
      toast(`✅ ${lv(lvId).name} 통과! 다음 레벨로!`);
    } else if(S.tWrongCount >= 2) {
      // 레벨 확정
      S.tLvResult[lvId] = 'fail';
      finishAdaptiveTest(); return;
    }

    // 최대 24문제 제한
    if(S.tTotalQ >= 24) { finishAdaptiveTest(); return; }
    renderAdaptiveQ();
  }, 800);
};

function finishAdaptiveTest() {
  // 최종 레벨 결정
  let finalLvIdx = 0;
  LEVELS.forEach((l,i) => {
    if(S.tLvResult[l.id] === 'pass') finalLvIdx = i+1;
  });
  finalLvIdx = Math.min(finalLvIdx, LEVELS.length-1);
  const finalLv = LEVELS[finalLvIdx];

  S.lid = finalLv.id;
  S.xp = finalLv.min * 10;
  sv();
  localStorage.setItem('wd-tested', '1');
  S.tHistory.push({date:today(), lid:finalLv.id, totalQ:S.tTotalQ});
  localStorage.setItem('wd-th', JSON.stringify(S.tHistory));

  // 결과 화면
  const resultRows = LEVELS.map((l,i) => {
    const res = S.tLvResult[l.id];
    if(!res && i > finalLvIdx) return '';
    const icon = res==='pass'?'✅':res==='fail'?'❌':'—';
    const isFinal = i===finalLvIdx;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:${isFinal?'#EFF6FF':'#F8F9FA'};border:${isFinal?'2px solid #1E5FA5':'1px solid #E5E7EB'}">
      <span style="font-size:20px">${l.emoji}</span>
      <span style="flex:1;font-size:13px;font-weight:${isFinal?'800':'600'};color:${isFinal?'#1E5FA5':'#374151'}">${l.name}</span>
      <span style="font-size:16px">${icon}</span>
      ${isFinal?'<span style="font-size:11px;background:#1E5FA5;color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">확정!</span>':''}
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('body').innerHTML=`<div class="pad" style="padding-top:24px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:56px;margin-bottom:8px">${finalLv.emoji}</div>
      <div style="font-size:24px;font-weight:900;color:#111;margin-bottom:4px">테스트 완료!</div>
      <div style="font-size:14px;color:#6B7280">${S.tTotalQ}문제로 레벨을 찾았어요</div>
    </div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:18px;padding:18px;text-align:center;border:2px solid #1E5FA5;margin-bottom:14px">
      <div style="font-size:12px;color:#1E5FA5;font-weight:700;margin-bottom:4px">나의 레벨</div>
      <div style="font-size:22px;font-weight:900;color:#1E5FA5">${finalLv.emoji} ${finalLv.name}</div>
      <div style="font-size:12px;color:#6B7280;margin-top:4px">${finalLv.desc}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">${resultRows}</div>
    ${charSVG(finalLv.id,60,'happy')}
    <button class="btn bb" onclick="startApp()">학습 시작하기! 🚀</button>
  </div>`;
}

        <button onclick="localStorage.setItem('wd-onboard','1');cm()" style="background:none;border:none;font-size:12px;color:#9CA3AF;cursor:pointer">건너뛰기</button>

      <div style="font-size:56px;margin-bottom:12px">${s.ic}</div>
      <div style="font-size:20px;font-weight:900;color:${s.color};margin-bottom:8px">${s.title}</div>
      <div style="font-size:14px;color:#6B7280;line-height:1.8;margin-bottom:20px">${s.desc}</div>
      <div style="display:flex;justify-content:center;gap:5px;margin-bottom:20px">
        ${steps.map((_,i)=>`<div style="width:${i===window._onboardStep?20:6}px;height:6px;border-radius:3px;background:${i===window._onboardStep?s.color:'#E5E7EB'};transition:width .3s"></div>`).join('')}
      </div>
      <button onclick="if(window._onboardStep<${steps.length-1}){window._onboardStep++;renderOnboard();}else{localStorage.setItem('wd-onboard','1');cm();}" style="background:${s.color};color:#fff;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;width:100%">
        ${window._onboardStep<steps.length-1?'다음 →':'시작하기! 🚀'}
      </button>
    </div></div>`;
    window.renderOnboard = renderOnboard;
  };
  renderOnboard();
}

const TABS=[
  {id:'home',     ic:'🏠', lb:'홈'},
  {id:'mybooks',  ic:'📚', lb:'단어장'},
  {id:'learn',    ic:'🎓', lb:'학습'},
  {id:'game_center',ic:'🎮',lb:'게임'},
  {id:'market',   ic:'🛒', lb:'마켓'},
  {id:'diary',    ic:'✍️', lb:'일기'},
  {id:'profile',  ic:'👤', lb:'프로필'},
];

function go(tab,sub) {
  if(tab&&tab!=='game'&&tab!=='ranking') {
    // 단어장 탭 직접 클릭 → 항상 단어장 목록 첫 화면
    if(tab==='mybooks' && !sub) S.stab='books';
    // 기존 study → mybooks로 리다이렉트
    if(tab==='study') tab='mybooks';
    S.tab=tab;
  }
  if(tab==='ranking') S.tab='ranking';
  if(tab==='game') S.tab='game';
  if(sub) S.stab=sub;
  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(t=>`<button class="ni" onclick="go('${t.id}')"><span class="ni-ic">${t.ic}</span><span class="ni-lb ${S.tab===t.id?'on':''}">${t.lb}</span>${S.tab===t.id?'<div class="dot"></div>':''}</button>`).join('');
  const map={home:rHome,mybooks:rMyBooks,learn:rLearnTab,game_center:rGameCenter,game:rGame,market:rMarket,diary:rDiary,profile:rProfile};
  const body=document.getElementById('body');
  body.innerHTML=(map[S.tab]||rHome)();
  body.scrollTop=0;
  // game 탭일 때 nav 숨김 (게임헤더가 나가기 버튼 포함)
  const navEl=document.getElementById('nav');
  if(navEl) navEl.style.display = S.tab==='game' ? 'none' : '';
  if(S.tab==='mybooks'&&S.stab==='learn') requestAnimationFrame(initFlashSwipe);
}

function showCalendar() {
  const now=new Date();
  renderCalendar(now.getFullYear(),now.getMonth(),'words');
}
function renderCalendar(year,month,tab) {
  const t=today();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthStr=year+'.'+(month+1<10?'0':'')+(month+1);
  const dayNames=['일','월','화','수','목','금','토'];
  let calHTML=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px">
    ${dayNames.map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:${d==='일'?'#DC2626':d==='토'?'#1E5FA5':'#9CA3AF'};padding:4px">${d}</div>`).join('')}
    ${Array(firstDay===0?6:firstDay-1).fill('<div></div>').join('')}`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=year+'-'+(month+1<10?'0':'')+(month+1)+'-'+(d<10?'0':'')+d;
    const log=S.studyLog[ds]||{words:0,quiz:0};
    const val=tab==='words'?log.words:log.quiz;
    const isToday=ds===t;
    const hasData=val>0;
    const dow=new Date(ds).getDay();
    calHTML+=`<div style="text-align:center;padding:2px">
      <div onclick="showDayDetail('${ds}')" style="width:32px;height:32px;border-radius:50%;background:${hasData?'#1E5FA5':isToday?'#EFF6FF':'transparent'};border:${isToday&&!hasData?'2px solid #1E5FA5':'none'};display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;cursor:pointer">
        <span style="font-size:11px;color:${hasData?'#fff':isToday?'#1E5FA5':dow===0?'#DC2626':dow===6?'#1E5FA5':'#374151'};font-weight:${isToday?'800':'400'}">${d}</span>
        ${hasData?`<span style="font-size:8px;color:rgba(255,255,255,.8)">${val}</span>`:''}
      </div>
    </div>`;
  }
  calHTML+='</div>';
  const todayLog=S.studyLog[t]||{words:0,quiz:0};
  const calMsg=tab==='words'?(todayLog.words>0?charMsg('studyDone'):charMsg('noStudyToday')):(todayLog.quiz>0?charMsg('studyDone'):charMsg('noQuizToday'));
  const prevY=month===0?year-1:year, prevM=month===0?11:month-1;
  const nextY=month===11?year+1:year, nextM=month===11?0:month+1;
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="max-height:85vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="renderCalendar(${prevY},${prevM},'${tab}')" style="background:#F3F4F6;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="font-size:16px;font-weight:800">${monthStr}</div>
      <button onclick="renderCalendar(${nextY},${nextM},'${tab}')" style="background:#F3F4F6;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">→</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button onclick="renderCalendar(${year},${month},'words')" style="flex:1;padding:8px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:${'words'===tab?'#1E5FA5':'#F3F4F6'};color:${'words'===tab?'#fff':'#6B7280'}">단어</button>
      <button onclick="renderCalendar(${year},${month},'quiz')" style="flex:1;padding:8px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:${'quiz'===tab?'#1E5FA5':'#F3F4F6'};color:${'quiz'===tab?'#fff':'#6B7280'}">퀴즈</button>
    </div>
    ${calHTML}
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:10px">
      ${charSVG(S.lid,48)}
      <div style="background:#F3F4F6;border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:13px;font-weight:600;color:#374151;flex:1">${calMsg}</div>
    </div>
    <button onclick="cm()" class="btn bgr" style="margin-top:12px">닫기</button>
  </div></div>`;
}

        🦋 헷갈리는 단어 ${wrongOnDay.length}개 다시 테스트

function switchBook(name) {
  if(name==='내 단어장'){
    S.currentBook='내 단어장'; S.idx=0; S.flip=false;
    sv(); cm(); go('mybooks');
    return;
  }
  const book = S.books.find(b=>b.name===name);
  if(!book) return;
  // 현재 단어장 저장
  saveCurrentBook();
  // 새 단어장으로 전환
  S.words=[...book.words];
  S.markMap={...book.markMap};
  S.srsMap={...book.srsMap};
  S.learned=new Set(book.learned||[]);
  S.currentBook=name;
  S.idx=0; S.flip=false;
  sv(); cm(); go('mybooks');
  toast(`📚 "${name}"으로 전환!`);
}

function saveCurrentBook() {
  if(S.currentBook==='내 단어장') return; // 기본 단어장은 S.words에 바로 저장
  const idx=S.books.findIndex(b=>b.name===S.currentBook);
  if(idx>=0){
    S.books[idx].words=[...S.words];
    S.books[idx].markMap={...S.markMap};
    S.books[idx].srsMap={...S.srsMap};
    S.books[idx].learned=[...S.learned];
  }
}

function createBook() {
  const name=document.getElementById('new-book-name')?.value.trim();
  if(!name){toast('단어장 이름을 입력하세요');return;}
  if(name==='내 단어장'||S.books.find(b=>b.name===name)){toast('이미 있는 이름');return;}
  S.books.push({name,words:[],markMap:{},srsMap:{},learned:[]});
  sv();
  toast(`✅ "${name}" 단어장 생성!`);
  cm();
  go('mybooks','books'); // 단어장 목록 화면 갱신
}

function deleteBook(name) {
  if(!confirm(`"${name}" 단어장을 삭제할까요?`)) return;
  S.books=S.books.filter(b=>b.name!==name);
  if(S.currentBook===name){
    S.currentBook='내 단어장'; S.idx=0;
  }
  sv();
}

function showStreamMode() {
  // 기존 타이머 정리
  if(window._streamTimer) { clearInterval(window._streamTimer); window._streamTimer=null; }

  let idx=0, speed=3000;
  const words = getCurrentBookWords ? getCurrentBookWords() : S.words;

  const render=()=>{
    const el=document.getElementById('mode-word');
    if(!el) return;
    const w=words[idx%words.length];
    el.innerHTML=`<div style="font-size:80px;margin-bottom:12px">${w.img||'📝'}</div>
      <div style="font-size:30px;font-weight:900;color:#60A5FA;font-family:monospace;margin-bottom:6px">${w.en}</div>
      <div style="font-size:18px;color:#E2E8F0;font-weight:700;margin-bottom:6px">${w.kr}</div>
      <div style="font-size:13px;color:#94A3B8;font-style:italic">"${w.ex||''}"</div>
      <div style="margin-top:10px;font-size:12px;color:#475569">${idx+1}/${words.length}</div>`;
  };

  const startTimer=()=>{
    render();
    if(window._streamTimer) clearInterval(window._streamTimer);
    window._streamTimer=setInterval(()=>{
      idx=(idx+1)%words.length;
      render();
    },speed);
  };

  const stopTimer=()=>{
    if(window._streamTimer) { clearInterval(window._streamTimer); window._streamTimer=null; }
  };

  const exitStream=()=>{
    stopTimer();
    cm();
  };

  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="background:#1A1A2E;border-radius:24px 24px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

      <button id="stream-exit-btn" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 14px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">✕ 종료</button>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="stream-prev" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏮</button>
      <button id="stream-play" style="background:#1E5FA5;border:none;border-radius:10px;padding:10px;flex:2;color:#fff;cursor:pointer;font-size:18px">⏸</button>
      <button id="stream-next" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏭</button>
    </div>
    <div style="margin-top:10px">
      <div style="font-size:12px;color:#6B7280;margin-bottom:6px;text-align:center">속도</div>
      <div style="display:flex;gap:6px;justify-content:center">
        ${[['느리게',5000],['보통',3000],['빠르게',1500]].map(([lb,s])=>`<button class="sp-btn" data-speed="${s}" style="background:${speed===s?'#1E5FA5':'rgba(255,255,255,.1)'};border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">${lb}</button>`).join('')}
      </div>
    </div>
  </div></div>`;

  // 이벤트 바인딩 (getElementById로 직접)
  let paused = false;

  document.getElementById('stream-exit-btn').onclick = exitStream;

  document.getElementById('stream-prev').onclick = ()=>{
    idx=(idx-1+words.length)%words.length;
    startTimer();
  };

  document.getElementById('stream-next').onclick = ()=>{
    idx=(idx+1)%words.length;
    startTimer();
  };

  document.getElementById('stream-play').onclick = function(){
    if(paused){
      paused=false;
      this.textContent='⏸';
      startTimer();
    } else {
      paused=true;
      this.textContent='▶';
      stopTimer();
      render();
    }
  };

  document.querySelectorAll('.sp-btn').forEach(btn=>{
    btn.onclick=function(){
      speed=+this.dataset.speed;
      document.querySelectorAll('.sp-btn').forEach(b=>b.style.background='rgba(255,255,255,.1)');
      this.style.background='#1E5FA5';
      if(!paused) startTimer();
    };
  });

  startTimer();
}

function srsFeedback(en, quality) {
  // SM-2 알고리즘 기반
  if(!S.srsData) S.srsData={};
  if(!S.srsData[en]) S.srsData[en]={reps:0,ef:2.5,interval:1};
  const d=S.srsData[en];

  if(quality<3) {
    // 틀린 경우: 내일 다시
    d.reps=0; d.interval=1;
    setMark(en,2); // 헷갈리는으로 마크
  } else {
    // 맞은 경우: SM-2 공식
    d.reps++;
    if(d.reps===1) d.interval=1;
    else if(d.reps===2) d.interval=6;
    else d.interval=Math.round(d.interval*d.ef);
    // EF 업데이트
    d.ef=Math.max(1.3, d.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    if(getMark(en)===2) setMark(en,0); // 헷갈리는 → 미분류
  }

  if(!S.srsReps) S.srsReps={};
  S.srsReps[en]=(S.srsReps[en]||0)+1;
  srsRate(en, d.interval);
}

function srsRate(en, days) {
  const next=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  S.srsMap[en]=next; sv();
}

  parts.push('</div></div>');
  return parts.join('');

function selectBookAndLearn(bookName) {
  // 단어장 전환
  if(bookName === '내 단어장') {
    S.currentBook = '내 단어장';
  } else {
    switchBook(bookName);
  }
  // 학습 방법 선택 화면으로
  S.stab = 'mode';
  go('mybooks','mode');
}

  html += '</div>';
  return html;

function startGameWithSettings(gameId) {
  const gs = S.gameSettings||{count:10,markFilter:-1,dir:0,autoMark:true,autoNext:false};

  // bookFilter로 선택된 단어장 우선, 없으면 현재 단어장
  let curWords, curMM;
  if(gs.bookFilter && gs.bookFilter!=='내 단어장') {
    const bk = (S.books||[]).find(b=>b.name===gs.bookFilter);
    curWords = bk ? (bk.words||[]) : getCurrentBookWords();
    curMM = bk ? (bk.markMap||{}) : getCurrentBookMarkMap();
  } else {
    curWords = getCurrentBookWords();
    curMM = getCurrentBookMarkMap();
  }

  if(!curWords.length) {
    toast('선택한 단어장에 단어가 없어요!');
    return;
  }

  let src = curWords;
  if(gs.markFilter>=0) {
    src = curWords.filter(w=>(curMM[w.en]||0)===gs.markFilter);
  }
  if(!src.length) src = curWords;
  startGameW(gameId, pick(src, Math.min(gs.count, src.length)));
}

// 깜빡이 시작
function startFlip() {
  const gs = S.gameSettings||{count:10};
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const src = pick(curWords, Math.min(gs.count, curWords.length));
  S._flipWords = src;
  S._flipIdx = 0;
  S.flip = false;
  S.tab = 'mybooks'; S.stab = 'learn'; go();
}

// 현재 선택된 단어장 단어 반환
function getCurrentBookWords() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.words;
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.words||[]) : S.words;
}

// 현재 선택된 단어장 마크맵 반환
function getCurrentBookMarkMap() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.markMap||{};
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.markMap||{}) : S.markMap||{};
}

function initFlashSwipe() {
  const card = document.getElementById('flash-card');
  if(!card) return;
  let sx=0, sy=0;
  card.addEventListener('touchstart', e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  card.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40) {
      e.stopPropagation();
      if(dx<0){S.idx++;S.flip=false;}
      else{S.idx=Math.max(0,S.idx-1);S.flip=false;}
      SFX.play('tap'); vib(20); go();
    }
  },{passive:true});
}

function startAutoPlay() {
  let playing=true, idx=S.idx;
  const next=()=>{
    if(!playing||idx>=S.words.length){playing=false;cm();return;}
    const w=S.words[idx];
    const u=new SpeechSynthesisUtterance(w.en+'. '+w.kr);
    u.lang='ko-KR'; u.rate=0.9;
    window.speechSynthesis.speak(u);
    S.idx=idx; S.flip=false; go();
    idx++;
    u.onend=()=>{if(playing)setTimeout(next,600);};
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="text-align:center">
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">▶ 자동 재생 중</div>
    <div style="font-size:13px;color:#9CA3AF;margin-bottom:14px">단어를 순서대로 읽어드려요</div>
    <button onclick="playing=false;window.speechSynthesis.cancel();cm()" class="btn bgr">⏹ 정지</button>
  </div></div>`;
  next();
}

async function extractFromText() {
  const inp = document.getElementById('url-extract-inp')?.value?.trim();
  if(!inp){toast('텍스트를 입력해주세요');return;}
  cm();

  try {
    // URL이면 먼저 내용 가져오기 (CORS 우회 불가, 텍스트 직접 처리)
    const isUrl = inp.startsWith('http://') || inp.startsWith('https://');
    const prompt = isUrl
      ? `이 URL의 내용을 알 수 없으므로, URL 자체에서 단어를 추측해서 JSON 배열로 반환: ${inp}\n형식: [{"en":"word","kr":"뜻"}] (5~10개)`
      : `아래 영어 텍스트에서 학습하기 좋은 단어 10~15개를 뽑아 JSON 배열로만 반환.\n형식: [{"en":"word","kr":"뜻"}]\n\n텍스트:\n${inp.slice(0,2000)}`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    showExtracted(JSON.parse(txt));
  } catch(e) { toast('추출 실패. 텍스트를 직접 입력해주세요'); }
  S.ai=false; go('mybooks','add');
}

async function aiEnrichWord(en) {
  const wi = S.words.find(x=>x.en===en);
  if(!wi) return;
  toast('AI 분석 중...');
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:`"${en}" 단어 정보 JSON으로만 반환. 형식: {"koSnd":"한국어발음(예:애플)","pos":"품사(예:명사/동사)","syn":"유의어 2개(쉼표구분)","tip":"한국어 암기팁"}`}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const p=JSON.parse(txt);
    if(p.koSnd) wi.koSnd=p.koSnd;
    if(p.pos) wi.pos=p.pos;
    if(p.syn) wi.syn=p.syn;
    if(p.tip&&!wi.tip) wi.tip=p.tip;
    sv();
    showWordDetail(en);
  } catch(e) { toast('AI 오류'); }
}

// 스트릭 관리
function getStreak() {
  const data = JSON.parse(localStorage.getItem('wd-streak')||'{"count":0,"lastDate":""}');
  const today = new Date().toISOString().slice(0,10);
  // 어제 했으면 스트릭 유지, 오늘 했으면 그대로, 그외 리셋
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(data.lastDate===today) return data;
  if(data.lastDate===yesterday) return {...data, todayDone:false};
  return {count:0, lastDate:'', todayDone:false};
}
function markStreakToday() {
  const today = new Date().toISOString().slice(0,10);
  const data = getStreak();
  if(data.lastDate===today) return; // 이미 오늘 완료
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const newCount = data.lastDate===yesterday ? data.count+1 : 1;
  localStorage.setItem('wd-streak', JSON.stringify({count:newCount, lastDate:today, todayDone:true}));
}

// 오늘의 미션 상태
function getTodayMissions() {
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('wd-missions-'+today)||'{}');
  return {
    newWords: saved.newWords||0,    // 새 단어 학습 수
    review:   saved.review||false,  // SRS 복습 완료
    quiz:     saved.quiz||0,        // 퀴즈 정답 수
  };
}
function saveMission(type, val) {
  const today = new Date().toISOString().slice(0,10);
  const data = getTodayMissions();
  if(type==='newWords') data.newWords = Math.max(data.newWords, val);
  if(type==='review') data.review = true;
  if(type==='quiz') data.quiz = Math.max(data.quiz, val);
  localStorage.setItem('wd-missions-'+today, JSON.stringify(data));
  // 미션 1개 이상 완료 시 스트릭
  if(data.newWords>0 || data.review || data.quiz>0) markStreakToday();
}

let _sysWordsCache = {};
async function loadSysWords(lvId) {
  if(_sysWordsCache[lvId]) return _sysWordsCache[lvId];
  try {
    const doc = await firebase.firestore().collection('system_words').doc(lvId).get();
    const words = doc.exists ? (doc.data().words||[]) : [];
    _sysWordsCache[lvId] = words;
    return words;
  } catch(e) { return []; }
}

// 학습한 단어 목록 (localStorage)
function getLearnedSysWords(lvId) {
  return JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]');
}
function markSysWordLearned(lvId, en) {
  const learned = getLearnedSysWords(lvId);
  if(!learned.includes(en)) {
    learned.push(en);
    localStorage.setItem('wd-sys-learned-'+lvId, JSON.stringify(learned));
  }
}

    <div style="width:42px;height:42px;border-radius:12px;background:${m3done?'#F0FDF4':'#F0FDF4'};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${m3done?'✅':'🎯'}</div>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700">레벨 퀴즈 ${MISSION_GOALS.quiz}문제</div>
      <div style="background:var(--border,#E5E7EB);border-radius:4px;height:4px;margin-top:6px">
        <div style="height:100%;background:#16A34A;border-radius:4px;width:${Math.min(missions.quiz/MISSION_GOALS.quiz*100,100)}%;transition:width .3s"></div>
      </div>
      <div style="font-size:11px;color:#9CA3AF;margin-top:3px">${missions.quiz}/${MISSION_GOALS.quiz}문제</div>
    </div>
    <span style="color:#9CA3AF">›</span>
  </div>`;

  html += '</div>';

  // 레벨 커리큘럼
  html += `<div style="background:var(--bg-card,#fff);border-radius:16px;border:1px solid var(--border,#E5E7EB);overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border,#E5E7EB)">
      <div style="font-size:14px;font-weight:800">🗺️ 레벨 커리큘럼</div>
    </div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">`;

  SYS_LEVEL_IDS.forEach(function(lid, i) {
    const info = SYS_LEVEL_INFO[lid];
    const isCur = lid === lvId;
    const isDone = SYS_LEVEL_IDS.indexOf(lvId) > i;
    let onclickFn;
    if(isCur) onclickFn = 'startSysLearn("newwords")';
    else if(isDone) onclickFn = 'toast("'+info.name+' ✅")';
    else onclickFn = 'toast("locked")';  
    const bg = isCur ? info.color+'18' : isDone ? '#F0FDF4' : 'var(--bg-sub,#F9FAFB)';
    const border = isCur ? info.color : isDone ? '#86EFAC' : 'var(--border,#E5E7EB)';
    const nameColor = isCur ? info.color : isDone ? '#16A34A' : 'var(--text2,#6B7280)';
    const grayFilter = (!isCur&&!isDone) ? 'filter:grayscale(1)' : '';
    let badge = '';
    if(isCur) badge = '<span style="background:'+info.color+';color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">NOW</span>';
    else if(isDone) badge = '<span style="color:#16A34A;font-size:16px">✓</span>';
    else badge = '<span style="color:#9CA3AF;font-size:14px">🔒</span>';
    html += '<div onclick="'+onclickFn+'" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:'+bg+';border:1.5px solid '+border+';cursor:pointer">';
    html += '<span style="font-size:24px;'+grayFilter+'">'+info.emoji+'</span>';
    html += '<div style="flex:1"><div style="font-size:13px;font-weight:700;color:'+nameColor+'">'+info.name+'</div></div>';
    html += badge+'</div>';
  });

  // 레벨업 테스트 버튼
  const nextLv = lvInfo.next;
  if(nextLv) {
    const nextInfo = SYS_LEVEL_INFO[nextLv];
    html += '<div onclick="startLevelUpTest()" style="background:linear-gradient(135deg,'+lvInfo.color+','+( nextInfo?.color||'#7C3AED')+')" style="border-radius:16px;padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px">';
    html += '<span style="font-size:28px">🏆</span>';
    html += '<div style="flex:1"><div style="font-size:14px;font-weight:800;color:#fff">레벨업 테스트</div>';
    html += '<div style="font-size:11px;color:rgba(255,255,255,.7)">'+lvInfo.name+' → '+(nextInfo?.name||'')+'  도전!</div></div>';
    html += '<span style="color:rgba(255,255,255,.7);font-size:18px">›</span></div>';
  }

  html += '</div></div>';
  return html;
}


// ── 게임 공통 ──
const GGRADS={quiz:'linear-gradient(135deg,#1E5FA5,#2563EB)',fill:'linear-gradient(135deg,#D97706,#F59E0B)',typing:'linear-gradient(135deg,#EC4899,#F472B6)',match:'linear-gradient(135deg,#7C3AED,#A855F7)',wordle:'linear-gradient(135deg,#16A34A,#22C55E)',wordfind:'linear-gradient(135deg,#0284C7,#38BDF8)',chain:'linear-gradient(135deg,#9333EA,#C084FC)',sentence:'linear-gradient(135deg,#E65100,#FB923C)',listen:'linear-gradient(135deg,#0F766E,#14B8A6)',ssort:'linear-gradient(135deg,#1D4ED8,#3B82F6)',wc:'linear-gradient(135deg,#BE185D,#EC4899)'};

function ghdr(title,prog){
  const grd=GGRADS[S.gameId]||GGRADS.quiz;
  return `<div style="background:${grd};padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0"><button onclick="SFX.stopBG();S.tab='mybooks';S.stab='mode';go()" style="background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;color:#fff">← 나가기</button><div style="font-size:14px;font-weight:800;color:#fff">${title}</div><div style="font-size:12px;color:rgba(255,255,255,.8)">${prog}</div></div>`;
}

function startGameW(id, ws) {
  SFX.playBG(); vib(30);
  const gs = S.gameSettings||{count:10};
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const src = ws || (curWords.length>=2 ? curWords : (DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  S.gameId=id; S.gDone=false; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput='';
  S.gResultMap={};
  const cnt=ws?ws.length:Math.min(gs.count||10, src.length);
  S.gWords=ws||pick(src,cnt);
  if(id==='quiz'||id==='typing') {
    S.gSavedGame={id,words:S.gWords,score:0,idx:0};
  }
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='wc'){const pool=src.filter(w=>w.en.length>=3);S.wcWord=pool.length?rnd(pool):src[0];S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;}
  if(id==='sentence'||id==='ssort'){const sts=[{kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing','yesterday']},{kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are','sad']},{kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach','Korean']}];S.sbS=rnd(sts);S.sbP=shuf([...S.sbS.words,...S.sbS.wrong.slice(0,2)]);S.sbC=[];S.sbAns=false;S.sbOk=false;if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}
  if(id==='flip') {
    S._flipWords = S.gWords;
    S._flipIdx = 0;
    S.flip = false;
    S.tab = 'mybooks'; S.stab = 'learn'; go();
    toast('⚡ 깜빡이 시작! '+S.gWords.length+'개 단어');
    return;
  }
  S.tab='game'; S.stab=null;
  const navEl=document.getElementById('nav');
  if(navEl) navEl.style.display='none';
  go();
}

function rGame(){if(S.gDone)return rGameDone();const map={quiz:rQ4,fill:rFill,wordfind:rWF,chain:rChain,match:rMatch,sentence:rSentence,scramble:rTyping,typing:rTyping,wordle:rWordle,wc:rWC,ssort:rSSorting,listen:rListen};return(map[S.gameId]||rGameDone)();}

function rGameDone(){
  SFX.stopBG();
  if(typeof saveGameScore==='function') saveGameScore(S.gScore);
  const tot=Math.max(S.gWords.length,1);
  const right=Math.round(S.gScore/100);
  const pct=Math.round(right/tot*100);
  const hp=pct>=70;
  if(hp){SFX.play('levelup');vib([100,50,100,50,200]);}else{SFX.play('wrong');vib([100,100,200]);}
  const lvInfo=lv(S.lid);
  const msg=pct>=100?['완벽해! 천재다! 🏆',lvInfo.id,'happy']:pct>=80?['아주 잘했어! 🎉',lvInfo.id,'happy']:pct>=60?['조금 더 할 수 있어! 💪',lvInfo.id,'normal']:['괜찮아! 다시 도전! 🔥',lvInfo.id,'sad'];
  // 레벨업 테스트 결과 처리
  if(window._levelUpTest) {
    window._levelUpTest = false;
    if(pct>=80) {
      const nextLvId = SYS_LEVEL_INFO[S.lid]?.next;
      if(nextLvId) {
        S.lid = nextLvId;
        S.xp = 0;
        sv();
        toast('🎉 레벨업! '+SYS_LEVEL_INFO[nextLvId].name+'이 됐어요!');
      }
    }
  }
  // 미션 퀴즈 저장
  if(S.gameId==='quiz') saveMission('quiz', right);
  const navEl=document.getElementById('nav');
  if(navEl) navEl.style.display='flex';
  return `<div class="pad" style="text-align:center">
    ${charSVG(msg[1],80,msg[2])}
    <div style="font-size:22px;font-weight:900;margin:12px 0 6px">${msg[0]}</div>
    <div style="font-size:14px;color:#6B7280;margin-bottom:16px">${right}/${tot}개 정답 · ${pct}%</div>
    <div style="background:${hp?'#F0FDF4':'#FFF1F2'};border-radius:16px;padding:16px;margin-bottom:16px">
      <div style="font-size:36px;font-weight:900;color:${hp?'#16A34A':'#DC2626'}">${pct}%</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn bb" onclick="SFX.stopBG();startGameW(S.gameId,null)" style="flex:1">다시 하기</button>
      <button class="btn bgr" onclick="SFX.stopBG();S.tab='mybooks';S.stab='mode';go()">단어장으로</button>
    </div>
  </div>`;
}

function rQ4(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const pool=S.gWords.length>=4?S.gWords:(getCurrentBookWords().length>=4?getCurrentBookWords():(DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  const cs=shuf([w,...pick(pool.filter(x=>x.en!==w.en),3)]);
  return ghdr('🎯 뜻 맞추기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'맞아! 🎉':'아쉬워! 💪'):'이 단어의 뜻은?',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#1E5FA5"></div></div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:20px;padding:24px;text-align:center;border:3px solid #BFDBFE">
      ${S.showImg!==false?`<div style="font-size:72px;margin-bottom:8px">${w.img||'📝'}</div>`:''}
      <div style="font-size:28px;font-weight:900;color:#1E5FA5;font-family:monospace">${w.en}</div>
      <div style="font-size:13px;color:#64748B;margin-top:4px">${w.ph||''}</div>
    </div>
    <div class="g2">${cs.map(c=>{let bg='var(--bg-card,#fff)',col='var(--text1,#111)',bd='var(--border,#E5E7EB)';if(S.gAns){if(c.en===w.en){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}else if(S.gRes==='ng'){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}}return `<button onclick="${S.gAns?'':'ansQ(\''+c.en+'\',\''+w.en+'\')'}" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:13px;font-weight:700;cursor:${S.gAns?'default':'pointer'};transition:all .2s;font-family:inherit">${c.kr}</button>`;}).join('')}
    </div>
  </div>`;
}
function ansQ(c,ok2){
  S.gAns=true; S.gRes=c===ok2?'ok':'ng';
  if(c===ok2){S.gScore+=100;ok();S.gResultMap[ok2]=true;}
  else{ng();S.gResultMap[ok2]=false;}
  logStudy('quiz'); go();
  const delay=S.gameSettings?.autoNext?600:900;
  setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;if(S.gIdx>=S.gWords.length)S.gDone=true;go();},delay);
}

function rFill(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const pool=S.gWords.length>=4?S.gWords:(getCurrentBookWords().length>=4?getCurrentBookWords():(DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  const cs=shuf([w,...pick(pool.filter(x=>x.en!==w.en),3)]);
  return ghdr('📝 빈칸 채우기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'완벽해! 🎉':'아쉬워! 💪'):'빈칸에 들어갈 단어는?',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#D97706"></div></div>
    <div style="background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-radius:20px;padding:20px;text-align:center;border:3px solid #FDE68A">
      ${S.showImg!==false?`<div style="font-size:52px;margin-bottom:6px">${w.img||'📝'}</div>`:''}
      <div style="font-size:15px;color:#111;font-style:italic;line-height:2">"${(w.ex||w.en+'.').replace(w.en,'_______')}"</div>
      <div style="font-size:13px;color:#D97706;margin-top:8px;font-weight:700">뜻: ${w.kr}</div>
    </div>
    <div class="g2">${cs.map(c=>{let bg='var(--bg-card,#fff)',col='var(--text1,#111)',bd='var(--border,#E5E7EB)';if(S.gAns){if(c.en===w.en){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}else if(S.gRes==='ng'){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}}return `<button onclick="${S.gAns?'':'ansQ(\''+c.en+'\',\''+w.en+'\')'}" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:13px;font-weight:700;cursor:${S.gAns?'default':'pointer'};font-family:monospace">${c.en}</button>`;}).join('')}
    </div>
  </div>`;
}

function rTyping(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const isSc=S.gameId==='scramble';
  return ghdr(isSc?'🔀 스크램블':'✏️ 받아쓰기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'정답! 🎉':'오답! 💪'):'영단어를 입력해봐!',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div style="background:linear-gradient(135deg,#FDF2F8,#FCE7F3);border-radius:20px;padding:24px;text-align:center;border:3px solid #F9A8D4">
      ${S.showImg!==false?`<div style="font-size:72px;margin-bottom:8px">${w.img||'📝'}</div>`:''}
      <div style="font-size:22px;font-weight:800;color:#374151">${w.kr}</div>
      ${w.ph?`<div style="font-size:13px;color:#9CA3AF;margin-top:4px">${w.ph}</div>`:''}
      ${w.ex?`<div style="font-size:12px;color:#9CA3AF;font-style:italic;margin-top:8px">"${w.ex.replace(w.en,'_____')}"</div>`:''}
    </div>
    <input id="ti" value="${S.gInput}" oninput="S.gInput=this.value" onkeydown="if(event.key==='Enter')chkT('${w.en}')" placeholder="영단어 입력..." style="border:2px solid ${S.gRes==='ok'?'#16A34A':S.gRes==='ng'?'#DC2626':'#BFDBFE'};font-size:17px;font-family:monospace;font-weight:700">
    <button class="btn" onclick="chkT('${w.en}')" ${S.gAns?'disabled':''} style="background:#EC4899;color:#fff">확인</button>
  </div>`;
}
function chkT(ok2){const v=(document.getElementById('ti')?.value||'').trim().toLowerCase();const r=v===ok2.toLowerCase();S.gAns=true;S.gRes=r?'ok':'ng';if(r){S.gScore+=100;ok();S.gResultMap[ok2]=true;}else{ng();toast('❌ 정답: '+ok2);S.gResultMap[ok2]=false;}logStudy('quiz');go();setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;S.gInput='';if(S.gIdx>=S.gWords.length)S.gDone=true;go();},1000);}

function rMatch(){
  const all=S.mMatched.size>=S.mPairs.length*2;
  if(all&&!S.gDone){S.gDone=true;S.gScore=S.mScore;setTimeout(()=>go(),300);}
  return ghdr('⚡ 스피드 매칭',`${S.mMatched.size/2}/${S.mPairs.length}`)+`<div class="pad">
    ${cbrow(all?'완벽해! 🎉':'단어와 뜻을 탭해서 짝 맞추자!',S.lid,all?'happy':'normal')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="display:flex;flex-direction:column;gap:6px">${S.mEn.map(en=>{const done=S.mMatched.has('en:'+en);const sel=S.mEn0===en;return `<button onclick="selMatch('en','${en.replace(/'/g,"\\'")}',this)" style="background:${done?'#F0FDF4':sel?'#EFF6FF':'var(--bg-card,#fff)'};border:2px solid ${done?'#86EFAC':sel?'#1E5FA5':'var(--border,#E5E7EB)'};border-radius:12px;padding:12px 8px;font-size:13px;font-weight:700;cursor:pointer;font-family:monospace;color:${done?'#16A34A':'var(--text1,#111)'};text-decoration:${done?'line-through':'none'}">${en}</button>`;}).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:6px">${S.mKr.map(kr=>{const done=S.mMatched.has('kr:'+kr);const sel=S.mKr0===kr;return `<button onclick="selMatch('kr','${kr.replace(/'/g,"\\'")}',this)" style="background:${done?'#F0FDF4':sel?'#EFF6FF':'var(--bg-card,#fff)'};border:2px solid ${done?'#86EFAC':sel?'#1E5FA5':'var(--border,#E5E7EB)'};border-radius:12px;padding:12px 8px;font-size:13px;font-weight:700;cursor:pointer;color:${done?'#16A34A':'var(--text1,#111)'};text-decoration:${done?'line-through':'none'}">${kr}</button>`;}).join('')}</div>
    </div>
  </div>`;
}
function selMatch(type,val,el){
  if(type==='en') S.mEn0=val;
  else S.mKr0=val;
  if(S.mEn0&&S.mKr0){
    const pair=S.mPairs.find(p=>p.en===S.mEn0);
    if(pair&&pair.kr===S.mKr0){
      S.mMatched.add('en:'+S.mEn0);S.mMatched.add('kr:'+S.mKr0);
      S.mScore+=100;ok();
    } else {ng();}
    S.mEn0=null;S.mKr0=null;
  }
  go();
}

function rChain(){
  const prompts=['And then...','Suddenly...','After that...','Finally...'];
  return ghdr('문장 이어가기',`${S.chIdx}/4`)+`<div class="pad">
    ${cbrow(S.chDone?'멋진 이야기 완성! 🎉':rnd(['이야기를 이어봐! ✍️','창의적으로! 😊','영어로 도전! 💪']),S.lid,S.chDone?'happy':'normal')}
    ${S.chIdx===0&&!S.chDone?`<div style="background:#FFF8E1;border-radius:12px;padding:10px 14px;font-size:12px;color:#E65100;margin-bottom:8px;line-height:1.7">💡 제시된 문장에 이어지는 내용을 영어로 써주세요. 4번 이어쓰면 하나의 이야기가 완성돼요!</div>`:''}
    <div style="background:linear-gradient(135deg,#FDF4FF,#F3E8FF);border-radius:20px;padding:16px;border:2px solid #E9D5FF"><div style="font-size:12px;color:#9CA3AF;margin-bottom:6px">📖 지금까지의 이야기</div><div style="font-size:14px;color:#111;line-height:1.9;white-space:pre-wrap">${S.chStory}</div></div>
    ${S.chDone?`<div class="card" style="background:#F0FDF4;border-color:#86EFAC;text-align:center">${charSVG(S.lid,56,'happy')}<div style="font-size:15px;font-weight:800;color:#15803D;margin:8px 0">이야기 완성! 🎊</div><button class="btn bb" onclick="SFX.stopBG();S.gDone=true;go()">완료</button></div>`:`
    <div style="background:#EFF6FF;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:#1E5FA5">${prompts[S.chIdx]||'마무리해봐!'}</div>

function buildWF(src){
  const wordCount=Math.min((src||S.gWords||[]).length,8);
  const pickWords=pick((src||S.gWords).map(w=>w.en.toUpperCase().replace(/\s/g,'_')),wordCount);
  const sz=Math.max(8,Math.ceil(Math.sqrt(pickWords.reduce((a,w)=>a+w.length,0)*2)));
  const gridSz=Math.min(sz,12);
  const grid=Array.from({length:gridSz},()=>Array(gridSz).fill(''));
  const placed=[];
  const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  pickWords.forEach(w=>{
    for(let t=0;t<100;t++){
      const dir=Math.floor(Math.random()*2);
      const dr=[0,1][dir],dc=[1,0][dir];
      const r=Math.floor(Math.random()*(gridSz-dr*(w.length-1)));
      const c=Math.floor(Math.random()*(gridSz-dc*(w.length-1)));
      if(r+dr*(w.length-1)>=gridSz||c+dc*(w.length-1)>=gridSz)continue;
      let ok=true;const cells=[];
      for(let i=0;i<w.length;i++){const cr=r+dr*i,cc=c+dc*i;if(grid[cr][cc]&&grid[cr][cc]!==w[i]){ok=false;break;}cells.push(`${cr},${cc}`);}
      if(ok){cells.forEach((k,i)=>{const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=w[i];});placed.push({word:w,cells});break;}
    }
  });
  for(let r=0;r<gridSz;r++)for(let c=0;c<gridSz;c++)if(!grid[r][c])grid[r][c]=alpha[Math.floor(Math.random()*26)];
  S.wfGrid=grid;S.wfWords=placed;S.wfFound=new Set();S.wfSel=[];S.wfGridSz=gridSz;
}
function rWF(){
  if(!S.wfGrid.length)buildWF(S.gWords);
  const sz=S.wfGrid.length;
  const foundCells=new Set(S.wfWords.filter(w=>S.wfFound.has(w.word)).flatMap(w=>w.cells));
  const all=S.wfFound.size>=S.wfWords.length;
  if(all&&!S.gDone){S.gDone=true;S.gScore=S.wfFound.size*100;setTimeout(()=>go(),300);}
  return ghdr('🔍 단어 찾기',`${S.wfFound.size}/${S.wfWords.length}`)+`<div class="pad">
    ${cbrow(all?'모두 찾았어! 🎉':'격자에서 단어를 찾아 순서대로 탭!',S.lid,all?'happy':'normal')}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${S.wfWords.map(w=>{const ww=S.gWords.find(x=>x.en.toUpperCase()===w.word);return `<span style="padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;font-family:monospace;background:${S.wfFound.has(w.word)?'#DCFCE7':'var(--btn-gray,#F3F4F6)'};color:${S.wfFound.has(w.word)?'#16A34A':'var(--text1,#374151)'};text-decoration:${S.wfFound.has(w.word)?'line-through':'none'}">${ww?.img||'📝'} ${w.word}</span>`;}).join('')}</div>
    <div style="display:flex;justify-content:center;overflow-x:auto"><div class="wf-grid" style="grid-template-columns:repeat(${sz},1fr)">${S.wfGrid.map((row,r)=>row.map((cell,c)=>{const k=`${r},${c}`;const isSel=S.wfSel.includes(k);const isFnd=foundCells.has(k);return `<div class="wf-cell ${isFnd?'fnd':isSel?'sel':''}" onclick="selWF(${r},${c})">${cell}</div>`;}).join('')).join('')}</div></div>
    ${S.wfSel.length?`<button class="btn bgr" onclick="S.wfSel=[];go()" style="font-size:13px">선택 취소</button>`:''}
  </div>`;
}
function selWF(r,c){const k=`${r},${c}`;const foundCells=new Set(S.wfWords.filter(w=>S.wfFound.has(w.word)).flatMap(w=>w.cells));if(foundCells.has(k))return;if(S.wfSel.includes(k)){S.wfSel=S.wfSel.filter(x=>x!==k);}else{S.wfSel.push(k);}S.wfWords.forEach(wd=>{if(S.wfFound.has(wd.word))return;const m=wd.cells.every(c2=>S.wfSel.includes(c2))&&S.wfSel.every(c2=>wd.cells.includes(c2));if(m){S.wfFound.add(wd.word);S.wfSel=[];ok();toast('✅ "'+wd.word+'"!');}});go();}

function scoreW(g,t){const r=Array(t.length).fill('absent'),tA=[...t],gA=[...g];gA.forEach((c,i)=>{if(c===tA[i]){r[i]='correct';tA[i]=gA[i]=null;}});gA.forEach((c,i)=>{if(!c)return;const j=tA.indexOf(c);if(j>-1){r[i]='present';tA[j]=null;}});return r;}

    ${S.wOver?`<div style="text-align:center;background:${S.wWon?'#F0FDF4':'#FFF1F2'};border-radius:14px;padding:14px;width:100%"><div style="font-size:15px;font-weight:800;color:${S.wWon?'#16A34A':'#DC2626'}">${S.wWon?'🎉 정답!':'정답: '+S.wWord.en}</div><button class="btn bb" onclick="S.gDone=true;S.gScore=S.wWon?(7-S.wGuess.length)*100:0;go()" style="margin-top:10px">완료</button></div>`:`
    <input id="wi" value="${S.wIn}" oninput="S.wIn=this.value.slice(0,${LEN})" onkeydown="if(event.key==='Enter')subW('${W}')" placeholder="${LEN}글자 입력..." style="font-size:18px;font-family:monospace;font-weight:700;text-transform:lowercase;width:100%" maxlength="${LEN}">
    <button class="btn" onclick="subW('${W}')" style="background:#D97706;color:#fff;width:100%">제출</button>`}

}

  </div>`);

  if(!hw){
    parts.push(`<div style="background:#FFF7ED;border-radius:16px;border:1.5px solid #FDE68A;padding:14px;text-align:center;margin-bottom:12px">
      <div style="font-size:13px;color:#D97706;font-weight:600">📚 "${curBookName}"에 단어가 2개 이상 있어야 게임을 시작할 수 있어요!</div>
      <button class="btn bb" onclick="S.stab='add';go('mybooks','add')" style="margin-top:10px">단어 추가하러 가기</button>
    </div>`);
  }

  if(srsToday>0){
    parts.push(`<div style="background:#FFF8E1;border-radius:14px;padding:12px 16px;border:1.5px solid #FFE082;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-size:13px;color:#E65100;font-weight:700">📖 오늘 복습할 단어 ${srsToday}개</div>
      <button onclick="startMode('srs')" style="background:#E65100;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer">지금 복습</button>
    </div>`);
  }

  parts.push('<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:8px">');
  mainGames.forEach(g=>{
    parts.push(`<div onclick="${hw?`showGameSettings('${g.id}')`:'toast(\'단어를 먼저 추가해주세요!\')'}" style="background:${g.bg};border-radius:18px;padding:18px;cursor:${hw?'pointer':'default'};opacity:${hw?1:.5};display:flex;align-items:center;gap:14px">
      <div style="font-size:40px">${g.ic}</div>
      <div><div style="font-size:16px;font-weight:800;color:#fff">${g.nm}</div><div style="font-size:12px;color:rgba(255,255,255,.75)">${g.dc}</div></div>
      <div style="margin-left:auto;font-size:22px;color:rgba(255,255,255,.6)">›</div>
    </div>`);
  });
  parts.push('</div>');

  parts.push(showWrongNoteBtn());

  parts.push(`<div style="border-top:1.5px solid var(--border,#E5E7EB);padding-top:14px">
    <div style="font-size:13px;font-weight:700;color:var(--text3,#9CA3AF);margin-bottom:10px">더 많은 게임</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${moreGames.map(g=>`<button onclick="${hw?`showGameSettings('${g.id}')`:'toast(\'단어를 먼저 추가해주세요!\')'}" style="background:var(--bg-card,#fff);border:1.5px solid var(--border,#E5E7EB);border-radius:14px;padding:14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text1,#374151);text-align:center;font-family:inherit;opacity:${hw?1:.5}">
        <div style="font-size:24px;margin-bottom:5px">${g.ic}</div>${g.nm}
      </button>`).join('')}
    </div>
  </div>`);

  parts.push(`<div style="border-top:1.5px solid var(--border,#E5E7EB);padding-top:14px">
    <div style="font-size:13px;font-weight:700;color:var(--text3,#9CA3AF);margin-bottom:10px">🎧 암기 모드</div>
    <div style="display:flex;gap:8px">
      ${[['🎤','쉐도잉',"startMode('shadow')",['#FDF2F8','#EC4899']],['🗣️','말하기',"startMode('speak')",['#FDF4FF','#7C3AED']],['📖','SRS',"startMode('srs')",['#FFF8E1','#E65100']],['😴','수면',"startMode('sleep')",['#F9FAFB','#6B7280']]].map(([ic,lb,fn,[bg,c]])=>`
      <button onclick="${fn}" style="flex:1;background:${bg};border:1.5px solid ${c}33;border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center">
        <div style="font-size:22px;margin-bottom:3px">${ic}</div>
        <div style="font-size:11px;font-weight:700;color:${c}">${lb}</div>
      </button>`).join('')}
    </div>
  </div>`);

  parts.push('</div>');
  return parts.join('');
}
function rGames(){return rGameCenter();}

// syncProfileToFirebase 누락 함수
async function syncProfileToFirebase() {
  try {
    const user = firebase.auth().currentUser;
    if(!user) return;
    await firebase.firestore().collection('users').doc(user.uid).set({
      name: S.name||'',
      lid: S.lid||'egg',
      xp: S.xp||0,
      streak: getStreak().count||0,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, {merge:true});
  } catch(e) {}
}

// startSysLearn - 시스템 학습 시작
async function startSysLearn(type) {
  const lvId = S.lid || 'egg';
  let words = [];
  try {
    const doc = await firebase.firestore().collection('system_words').doc(lvId).get();
    words = doc.exists ? (doc.data().words||[]) : [];
  } catch(e) {}

  if(!words.length) {
    document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:30px 20px">
      <div style="font-size:48px;margin-bottom:12px">📭</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:8px">시스템 단어장이 비어있어요</div>
      <div style="font-size:13px;color:#9CA3AF;margin-bottom:16px">관리자 페이지에서 레벨별 단어를 등록해주세요</div>
      <button onclick="cm()" class="btn bb">확인</button>
    </div></div>`;
    return;
  }

  if(type==='newwords') {
    const learned = JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]');
    const newW = words.filter(w=>!learned.includes(w.en)).slice(0,5);
    if(!newW.length){toast('이 레벨 단어를 모두 학습했어요! 🎉');return;}
    S._flipWords = newW; S._flipIdx = 0; S._sysLvId = lvId;
    S.flip = false; S.tab = 'mybooks'; S.stab = 'learn'; go();
  } else if(type==='srsreview') {
    showSRSMode();
    setTimeout(()=>saveMission('review',true), 1000);
  } else if(type==='quiz') {
    const learned = JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]');
    const quizW = words.filter(w=>learned.includes(w.en));
    if(quizW.length < 4){toast('퀴즈를 위해 새 단어를 먼저 4개 이상 학습해주세요!');return;}
    startGameW('quiz', pick(quizW, Math.min(5, quizW.length)));
  }
}

async function startLevelUpTest() {
  const lvId = S.lid || 'egg';
  let words = [];
  try {
    const doc = await firebase.firestore().collection('system_words').doc(lvId).get();
    words = doc.exists ? (doc.data().words||[]) : [];
  } catch(e) {}
  if(words.length < 4){toast('레벨업 테스트를 위한 단어가 부족해요!');return;}
  const testW = pick(words, Math.min(10, words.length));
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
    <div style="font-size:48px;margin-bottom:12px">🏆</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:6px">레벨업 테스트</div>
    <div style="font-size:13px;color:#9CA3AF;margin-bottom:16px">${testW.length}문제 · 80% 이상 정답 시 레벨업!</div>
    <div style="display:flex;gap:8px">
      <button onclick="cm();window._levelUpTest=true;startGameW('quiz',JSON.parse(this.dataset.words))" data-words='${JSON.stringify(testW).replace(/'/g,"&#39;")}' style="flex:1;background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">시작하기</button>
      <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">취소</button>
    </div>
  </div></div>`;
}
