<html lang="ko">
<head>

<style>
/* ── 꽃밭 테마 배경 ── */
:root {
  --bg: #FFFBF0;
  --bg2: #FFF8E7;
  --bg-card: #FFFEF8;
  --bg-sub: #FFF9ED;
  --border: #F0E6C8;
  --text1: #3D2C00;
  --text2: #6B5200;
  --text3: #A08040;
  --accent: #F6D860;
  --accent2: #F0C840;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1505;
    --bg2: #221C08;
    --bg-card: #2A2210;
    --bg-sub: #221C08;
    --border: #3D3010;
    --text1: #F5E6C0;
    --text2: #D4B870;
    --text3: #9A8040;
  }
  body { background: var(--bg) !important; }
  #app { background: var(--bg) !important; }
}
body { background: var(--bg) !important; }
#app { background: var(--bg) !important; }
.pad { background: var(--bg) !important; }
/* 카드 기본 배경 */
.modal { background: var(--bg-card) !important; }
/* nav 배경 */
.nav { background: var(--bg-card) !important; border-top: 1.5px solid var(--border) !important; }
/* 헤더 유지 (성향색) */

/* 캐릭터 미세 움직임 */
@keyframes comboFlash {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.5); }
  30%  { opacity:1; transform:translate(-50%,-60%) scale(1.2); }
  70%  { opacity:1; transform:translate(-50%,-70%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-90%) scale(.9); }
}
@keyframes bfAppear {
  0%   { opacity:0; transform:scale(0.5) rotate(-10deg); }
  60%  { opacity:1; transform:scale(1.1) rotate(3deg); }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes float {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  33%      { transform: translateY(-5px) rotate(0.5deg); }
  66%      { transform: translateY(-3px) rotate(-0.5deg); }
}
@keyframes float-sad {
  0%,100% { transform: translateY(0px) rotate(-1deg) scale(0.98); }
  50%      { transform: translateY(-2px) rotate(1deg) scale(0.97); }
}
@keyframes float-angry {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  20%      { transform: translateY(-1px) rotate(1.5deg); }
  40%      { transform: translateY(1px) rotate(-1.5deg); }
  60%      { transform: translateY(-1px) rotate(1deg); }
  80%      { transform: translateY(0px) rotate(-1deg); }
}
@keyframes float-happy {
  0%,100% { transform: translateY(0px) scale(1) rotate(0deg); }
  25%      { transform: translateY(-7px) scale(1.02) rotate(1deg); }
  50%      { transform: translateY(-5px) scale(1.01) rotate(-0.5deg); }
  75%      { transform: translateY(-8px) scale(1.02) rotate(0.5deg); }
}
@keyframes float-danger {
  0%,100% { transform: translateY(0px) scale(0.96) rotate(-1deg); }
  50%      { transform: translateY(2px) scale(0.95) rotate(1deg); }
}
@keyframes wiggle {
  0%,100% { transform: rotate(0deg); }
  25%      { transform: rotate(-2deg); }
  75%      { transform: rotate(2deg); }
}
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.025); }
}
@keyframes antenna-wave {
  0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
  50%      { transform: rotate(3deg); transform-origin: bottom center; }
}
@keyframes tail-wag {
  0%,100% { transform: rotate(0deg); }
  33%      { transform: rotate(2deg); }
  66%      { transform: rotate(-2deg); }
}
.char-float        { animation: float 3.5s ease-in-out infinite; }
.char-float-happy  { animation: float-happy 2.8s ease-in-out infinite; }
.char-float-sad    { animation: float-sad 5s ease-in-out infinite; }
.char-float-angry  { animation: float-angry 1.6s ease-in-out infinite; }
.char-float-danger { animation: float-danger 6s ease-in-out infinite; }
.char-wiggle       { animation: wiggle 2.5s ease-in-out infinite; }
.char-breathe      { animation: breathe 4s ease-in-out infinite; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg,#FFFBF0);display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:430px;height:100%;height:100svh;height:-webkit-fill-available;background:var(--bg,#FFFBF0);display:flex;flex-direction:column;overflow:hidden;position:relative}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;width:100%;position:relative}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;box-sizing:border-box}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
/* ── 테마: 크림 라이트 (기본) ── */
body, body.theme-light {
  --bg:       #FAF8F5;
  --bg-card:  #FFFFFF;
  --bg-sub:   #F2F0EC;
  --bg-input: #FFFFFF;
  --bg-nav:   #FFFFFF;
  --text1:    #1A1A2E;
  --text2:    #4A5568;
  --text3:    #9CA3AF;
  --border:   #E8E4DE;
  --border2:  #D1CCC4;
  --btn-gray: #F2F0EC;
  --btn-gray-t:#4A5568;
  --shadow:   rgba(0,0,0,0.06);
}
body{background:var(--bg);color:var(--text1)}
#app{background:var(--bg)!important}
.body,.pad{background:var(--bg)!important}
.card{background:var(--bg-card)!important;border-color:var(--border)!important}
.nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
.stabs{background:var(--bg-sub)!important}
.bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
input,select,textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
.bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
.modal{background:var(--bg-card)!important}
.mbg .modal{background:var(--bg-card)!important}

/* ── 테마: 차콜 다크 ── */
body.theme-dark {
  --bg:       #1A1A1A;
  --bg-card:  #242424;
  --bg-sub:   #1F1F1F;
  --bg-input: #2C2C2C;
  --bg-nav:   #242424;
  --text1:    #ECECEC;
  --text2:    #A0AEC0;
  --text3:    #64748B;
  --border:   #333333;
  --border2:  #444444;
  --btn-gray: #2C2C2C;
  --btn-gray-t:#A0AEC0;
  --shadow:   rgba(0,0,0,0.4);
}
body.theme-dark{background:var(--bg)!important;color:var(--text1)!important}
body.theme-dark #app{background:var(--bg)!important}
body.theme-dark .hd{background:linear-gradient(135deg,#111,#1E3A5F)!important}
body.theme-dark .body,body.theme-dark .pad{background:var(--bg)!important}
body.theme-dark .card{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
body.theme-dark .stabs{background:var(--bg-sub)!important}
body.theme-dark .st{color:var(--text3)!important}
body.theme-dark .st.on .st-lb{color:#60A5FA!important}
body.theme-dark .bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
body.theme-dark .modal{background:var(--bg-card)!important;color:var(--text1)!important}
body.theme-dark .mbg .modal{background:var(--bg-card)!important}
body.theme-dark h2,body.theme-dark h3,body.theme-dark div{color:inherit}
body.theme-dark .logo{color:#ECECEC!important}

/* ── 폰트 크기 ── */
body.fs-sm{font-size:13px!important}
body.fs-md{font-size:15px!important}
body.fs-lg{font-size:17px!important}
</style>

const SFX = {
  ctx: null,
  init() { try { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  play(type) {
    try {
      this.init(); const c = this.ctx;
      const g = c.createGain(); g.connect(c.destination);
      const o = c.createOscillator(); o.connect(g);
      if(type==='correct') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);
        [523,659,784].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.4);
      } else if(type==='wrong') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
        o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+.15);
        o.type='sawtooth'; o.start(c.currentTime); o.stop(c.currentTime+.3);
      } else if(type==='levelup') {
        [523,659,784,1047].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.3,c.currentTime+i*.12);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.12+.3);
          oo.start(c.currentTime+i*.12); oo.stop(c.currentTime+i*.12+.3);
        });
      } else if(type==='flip'||type==='tap') {
        g.gain.setValueAtTime(.1,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.08);
        o.frequency.value=type==='flip'?800:600; o.start(c.currentTime); o.stop(c.currentTime+.08);
      } else if(type==='combo') {
        g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.5);
        [659,784,988,1047].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.5);
      } else if(type==='achievement') {
        [523,523,659,784,659,784,988].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.25,c.currentTime+i*.1);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.1+.25);
          oo.start(c.currentTime+i*.1); oo.stop(c.currentTime+i*.1+.25);
        });
      } else if(type==='swipe_ok') {
        g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25);
        [784,988].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.25);
      } else if(type==='swipe_ng') {
        g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25);
        [440,330].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.25);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};
const vib = p => { try { if('vibrate' in navigator) navigator.vibrate(p); } catch(e){} };
const ok = () => {
  SFX.play('correct'); vib([50,0,50]);
  S._combo = (S._combo||0)+1;
  S._maxCombo = Math.max(S._maxCombo||0, S._combo);
  // 콤보 보너스 XP + 연출
  if(S._combo===3)  { addXP(10,true); showComboFlash(3,  '+10XP'); }
  if(S._combo===5)  { addXP(20,true); showComboFlash(5,  '+20XP 🔥'); SFX.play('combo'); }
  if(S._combo===10) { addXP(50,true); showComboFlash(10, '+50XP ⚡'); }

};

  SFX.play('wrong'); vib([100,50,100]);
  if(S._combo>=3) toast('콤보 끊김 😢 ('+S._combo+'연속)');
  S._combo = 0;
  // 오답 노트 추가
  const gw = S.gWords?.[S.gIdx];
  if(gw && !(S._wrongWords||[]).some(w=>w.en===gw.en)) {
    if(!S._wrongWords) S._wrongWords=[];
    S._wrongWords.unshift({...gw, wrongAt:Date.now()});
    if(S._wrongWords.length>50) S._wrongWords.pop();
    sv();
  }
};

function checkAttend() {

  if(S.attendPopupShown === t) return; // 오늘 이미 표시

function logStudy(type) {
  // 하루 공부시간 누적 (매 단어학습마다 약 0.1분 추가)
  const todayKey = new Date().toISOString().slice(0,10);
  if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
  if(type==='words') S._dailyStudiedMin = (S._dailyStudiedMin||0) + 0.1; // 단어당 6초
  else if(type==='quiz') S._dailyStudiedMin = (S._dailyStudiedMin||0) + 0.05;
  // 목표 달성 체크
  const goal = S._dailyGoalMin||30;
  const studied = S._dailyStudiedMin||0;
  if(Math.floor(studied) > Math.floor(studied-0.1) && Math.floor(studied) > 0) {
    const pct = Math.round(studied/goal*100);
    const milestone = Math.floor(pct/10)*10;
    if(!S._dailyXpGiven) S._dailyXpGiven={};
    if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
      S._dailyXpGiven[milestone]=true;
      const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
      addXP(xpReward);
      const msg = milestone===100
        ? '🏆 목표 100% 달성! +200XP 🎉'
        : milestone===50
        ? '🎉 목표 50% 달성! +80XP'
        : `⭐ 목표 ${milestone}% 달성! +30XP`;
      toast(msg);
      if(milestone===100) vib([100,50,100,50,200]);
      else vib(50);
    }
  }
  // 헤더 미니 카드 업데이트
  if(typeof updHD==='function') updHD();
  // XP 지급
  if(type==='words') { addXP(10, true); checkXpUsable(); }
  else if(type==='quiz') { addXP(5, true); }
  const t = today();
  if(!S.studyLog[t]) S.studyLog[t] = {words:0, quiz:0};
  S.studyLog[t][type]++;
  updStreak();
  // 단어 학습 → 배부름 직접 연결 (10개마다 +1)
  if(type==='words') {
    const todayWords = S.studyLog[t].words;
    if(todayWords % 10 === 0) {
      S._petFull = Math.min(10, (S._petFull||5) + 1);
      if(todayWords % 30 === 0) {
        // 30개마다 기분도 +1
        S._petHappy = Math.min(10, (S._petHappy||5) + 1);
      }
      toast('🐛 벌거지가 배불러했어! 배부름 +1 (현재 '+(S._petFull||5)+'/10)');
      vib([50,30,50]);
    }
  }
  sv();
}

function buildSentenceFromWords(wordList) {
  const candidates=(wordList||S.gWords||[]).filter(w=>w.ex&&w.ex.trim().length>3);
  let chosen=candidates.length>0?rnd(candidates):null;
  if(chosen){
    const sentence=chosen.ex.replace(/[.,!?;:]/g,'').trim();
    const words=sentence.split(/\s+/).filter(w=>w.length>0);
    if(words.length>=3){
      const wrongPool=(wordList||S.gWords||[])
        .filter(w=>w.en!==chosen.en)
        .map(w=>w.en.split(/\s+/)[0])
        .filter(w=>!words.map(x=>x.toLowerCase()).includes(w.toLowerCase()))
        .slice(0,3);
      S.sbS={kr:chosen.kr+'(예문)',en:sentence,words};
      S.sbP=shuf([...words,...wrongPool].slice(0,words.length+2));
      S.sbC=[];S.sbAns=false;S.sbOk=false;return;
    }
  }
  const fallback=[
    {kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing']},
    {kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are']},
    {kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach']},
  ];
  const st=rnd(fallback);
  S.sbS=st;S.sbP=shuf([...st.words,...st.wrong]);S.sbC=[];S.sbAns=false;S.sbOk=false;
}

function shareWordBook(bookName) {
  const words=bookName==='내 단어장'?S.words:((S.books||[]).find(b=>b.name===bookName)?.words||[]);
  if(!words.length){toast('단어가 없어요');return;}
  const data=JSON.stringify({name:bookName,words:words.slice(0,200)});
  const encoded=btoa(unescape(encodeURIComponent(data)));
  const url=location.origin+location.pathname+'?share='+encoded;
  if(navigator.share){navigator.share({title:'Vocabug - '+bookName,text:bookName+' 단어장 ('+words.length+'개)',url});}
  else{navigator.clipboard?.writeText(url).then(()=>toast('링크 복사 완료!')).catch(()=>toast('복사됨'));}
}

function importSharedBook(btn) {
  const data=JSON.parse(btn.dataset.book.replace(/&quot;/g,'"'));

  while(S.books.find(b=>b.name===name)||name==='내 단어장')name=data.name+'('+( ++cnt)+')';
  S.books.push({name,words:data.words,markMap:{},srsMap:{},learned:[]});

function getTodayWord() {
  const t = new Date().toISOString().slice(0,10);
  const key = 'wd-today-word-' + t;
  let cached = localStorage.getItem(key);
  if(cached) return JSON.parse(cached);
  const pool = (S._sysWords||[]).length ? S._sysWords : S.words;
  if(!pool.length) return null;
  // 날짜 기반 시드로 항상 같은 단어
  let seed = t.replace(/-/g,'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const word = pool[seed % pool.length];
  localStorage.setItem(key, JSON.stringify(word));
  return word;
}

const GAME_XP = {
  quiz:     {base:10, perfect:20},
  fill:     {base:10, perfect:20},
  typing:   {base:15, perfect:25},
  listen:   {base:15, perfect:25},
  match:    {base:10, perfect:20},
  sentence: {base:20, perfect:35},
  wordfind: {base:10, perfect:20},
  wordle:   {base:30, perfect:60},
  chain:    {base:15, perfect:25},
  wc:       {base:10, perfect:20},
  ssort:    {base:15, perfect:25},
};

function saveGameScore(score) {
  if(!S.bestScores) S.bestScores={};
  const gid = S.gameId;
  if(!gid) return;
  // 최고 점수 저장
  if(!S.bestScores[gid] || score > S.bestScores[gid]) {
    S.bestScores[gid] = score;
  }
  // XP 계산
  const xpTable = GAME_XP[gid] || {base:10, perfect:20};
  const words = (S.gWords||[]).length || 1;
  const right = Math.round(score/100);
  const pct = Math.round(right/words*100);
  let xpGain = xpTable.base;
  if(pct===100) xpGain = xpTable.perfect;
  else if(pct>=80) xpGain = Math.round(xpTable.base*1.5);
  // 연속 보너스
  const streak = S.streak||0;
  let mult = streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  xpGain = Math.round(xpGain * mult);
  if(xpGain>0) {
    earnXP(xpGain, '게임 완료');
  }
  sv();
}

// 테스트 결과 XP
function earnTestXP(pct) {
  let xp = 0;
  if(pct===100) xp=120;
  else if(pct>=90) xp=80;
  else if(pct>=80) xp=50;
  else if(pct>=60) xp=30;
  const streak=S.streak||0;
  const mult=streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  xp = Math.round(xp*mult);
  if(xp>0) earnXP(xp, '테스트 통과');
}

function downloadButterflyCard(bId) {
  const b = BUTTERFLY_LIST.find(x=>x.id===bId);
  if(!b) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d');
  // 배경
  ctx.fillStyle = b.bg || '#F9FAFB';
  ctx.roundRect(0,0,400,560,20);
  ctx.fill();
  // 헤더 색상 배경
  ctx.fillStyle = b.color || '#7C3AED';
  ctx.roundRect(0,0,400,200,20);
  ctx.fill();
  ctx.fillRect(0,180,400,20);
  // 나비 이모지
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦋', 200, 120);
  // 이름
  ctx.fillStyle = 'white';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(b.name, 200, 165);
  ctx.font = '14px sans-serif';
  ctx.fillText(b.en, 200, 188);
  // 정보
  ctx.fillStyle = '#374151';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(b.rare + ' · ' + b.score + '점', 20, 230);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#6B7280';
  ctx.fillText('서식지: ' + (b.habitat||'-'), 20, 255);
  ctx.fillText('상태: ' + (b.status||'-'), 20, 275);
  // 이야기
  ctx.fillStyle = '#374151';
  ctx.font = '12px sans-serif';
  const words = (b.story||'').split(' ');
  let line='', y=310;
  words.forEach(w=>{
    const test=line+w+' ';
    if(ctx.measureText(test).width>360&&line){
      ctx.fillText(line,20,y); line=w+' '; y+=18;
    } else line=test;
  });
  if(line) ctx.fillText(line,20,y);
  // 보호 메시지
  ctx.fillStyle = '#16A34A';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🌿 ' + (b.protect||'').slice(0,50), 20, 460);
  // 앱 이름
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Butterfly Word', 200, 540);
  // 다운로드
  const a = document.createElement('a');
  a.download = 'butterfly-' + b.id + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('카드 저장됨! 🦋');
}

function buyPack(packId) {
  const pk = (S._marketPacks||[]).find(p=>p.id===packId);
  if(!pk) { toast('팩을 찾을 수 없어요'); return; }
  if(!S._ownedPacks) S._ownedPacks = [];
  if(S._ownedPacks.includes(packId)) { toast('이미 보유 중이에요'); return; }

  const words = pk.words||[];
  if(!words.length) { toast('단어가 없는 팩이에요'); return; }

  // 구매 확인
  if(!confirm(pk.name+' ('+words.length+'개 단어)를 내 단어장에 추가할까요?')) return;

  // 새 단어장으로 추가 (기존 단어장과 분리)
  if(!S.books) S.books = [];
  const existing = S.books.find(b=>b.name===pk.name);
  if(existing) {
    // 이미 같은 이름 단어장 있으면 업데이트
    const newW = words.filter(w=>!existing.words.find(x=>x.en===w.en));
    existing.words = [...existing.words, ...newW];
  } else {
    // 새 단어장 생성
    S.books.push({
      name: pk.name,
      emoji: pk.emoji||'📦',
      words: [...words],
      markMap: {},
      srsMap: {},
      learned: [],
      fromMarket: true,
      packId: packId,
    });
  }

  // 내 단어장에도 추가 (현재 단어장)
  const newWords = words.filter(w=>!S.words.find(x=>x.en===w.en));

  S._ownedPacks.push(packId);
  sv();

  // Firebase에 구매 이력 저장
  if(typeof db !== 'undefined' && S.user?.uid) {
    db.collection('user_packs').doc(S.user.uid).set(
      {owned: firebase.firestore.FieldValue.arrayUnion(packId)},
      {merge: true}
    ).catch(()=>{});
  }

  toast('✅ '+pk.name+' 추가! 단어장에서 확인하세요 📚');
  vib([100,50,100]);
  SFX.play('levelup');
  go('mybooks','market');
}

function removeButterflyFromCollection(bId) {

function changeNickname() {
  const v = document.getElementById('cnk')?.value.trim();
  if(!v) { toast('닉네임을 입력해주세요'); return; }
  if(v.length < 2 || v.length > 12) { toast('닉네임은 2~12자로 해주세요'); return; }

  // 복사왕 특수 처리
  if(v === '복사왕') {
    // 복사왕은 특수 계정만 사용 가능
    const uid = firebase?.auth?.()?.currentUser?.uid||'';
    if(!uid || uid !== '627everyday_admin') {
      toast('이 닉네임은 사용할 수 없어요 🚫'); return;
    }
    // 복사왕 → 나비 30종 전체 획득
    const allIds = BUTTERFLY_LIST.map(b=>b.id);
    localStorage.setItem('wd-butterflies', JSON.stringify(allIds));
    S.nick = v; sv();
    toast('👑 복사왕! 나비 30종 전체 획득!'); vib([100,50,200]);
    go(); return;
  }

  // 중복 체크 (Firestore)
  if(typeof db !== 'undefined') {
    db.collection('users').where('nick','==',v).get().then(snap=>{
      const taken = snap.docs.some(d=>d.id !== (firebase?.auth?.()?.currentUser?.uid||''));
      if(taken) { toast('이미 사용 중인 닉네임이에요 😅'); return; }
      S.nick=v; sv();
      // Firestore에도 업데이트
      const uid=firebase?.auth?.()?.currentUser?.uid;
      if(uid) db.collection('users').doc(uid).set({nick:v},{merge:true});
      toast('닉네임 변경! ✅'); go();
    }).catch(()=>{ S.nick=v; sv(); toast('닉네임 변경!'); go(); });
  } else {
    S.nick=v; sv(); toast('닉네임 변경!'); go();
  }
}

  const done = new Set(S._achievements||[]);

  ACHIEVEMENTS.forEach(a=>{

            stroke-dasharray="${2*Math.PI*70}" stroke-dashoffset="${2*Math.PI*70*(1-pct/100)}"
            stroke-linecap="round" style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">
          <div style="font-size:42px;font-weight:900;color:var(--text1,#3D2C00);font-family:monospace">${mm}:${ss}</div>
          <div style="font-size:11px;color:var(--text3,#A08040)">${running?'집중 중 🔥':'준비'}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
        ${[['5분',5],['10분',10],['25분',25]].map(([lb,m])=>`<button onclick="window._pomMins=${m};window._pomReset&&window._pomReset()" style="background:${mins===m&&secs===0?'#E65100':'var(--bg-sub,#FFF9ED)'};color:${mins===m&&secs===0?'#fff':'var(--text2,#6B5200)'};border:1.5px solid var(--border,#F0E6C8);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer">${lb}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="window._pomToggle&&window._pomToggle()" style="flex:2;background:${running?'#FEF2F2':'#E65100'};color:${running?'#DC2626':'#fff'};border:${running?'1.5px solid #FECDD3':'none'};border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer">${running?'⏸ 일시정지':'▶ 시작'}</button>
        <button onclick="window._pomReset&&window._pomReset()" style="flex:1;background:var(--bg-sub,#FFF9ED);color:var(--text2,#6B5200);border:1.5px solid var(--border,#F0E6C8);border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">🔄 초기화</button>
      </div>
      <button onclick="if(window._pomInterval)clearInterval(window._pomInterval);cm()" style="width:100%;background:none;border:none;color:var(--text3,#A08040);font-size:13px;cursor:pointer;padding:12px 0 0">닫기</button>
    </div></div>`;
  };
  window._pomReset = ()=>{
    if(interval)clearInterval(interval);
    running=false; interval=null;
    mins=window._pomMins||25; secs=0;
    render();
  };
  window._pomToggle = ()=>{
    if(running){
      clearInterval(interval); interval=null; running=false; render();
    } else {
      running=true;
      interval=setInterval(()=>{
        if(secs===0){if(mins===0){
          clearInterval(interval); running=false;
          SFX.play('levelup'); vib([200,100,200,100,400]);
          addXP(30); checkAchievements(); sv();
          toast('🍅 집중 완료! +30XP 획득!');
          render(); return;
        }mins--;secs=59;}else secs--;
        render();
      },1000);
      render();
    }
  };
  window._pomInterval=interval;
  window._pomMins=25;
  render();
}

function downloadWordCard(en) {
  const w = S.words.find(x=>x.en===en);
  if(!w) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 240;
  const ctx = canvas.getContext('2d');
  // 배경
  const grad = ctx.createLinearGradient(0,0,400,240);
  const petCol = PET_COLORS[getPetColor()]||PET_COLORS.green;
  grad.addColorStop(0, petCol.main);
  grad.addColorStop(1, petCol.main+'88');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,400,240,20);
  ctx.fill();
  // 앱 이름
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('🦋 Butterfly Word', 20, 30);
  // 이모지
  ctx.font = '48px sans-serif';
  ctx.fillText(w.img||'📝', 300, 80);
  // 영어 단어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.fillText(w.en, 24, 80);
  // 발음
  if(w.ph) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '16px sans-serif';
    ctx.fillText(w.ph, 24, 110);
  }
  // 한국어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(w.kr, 24, 150);
  // 예문
  if(w.ex) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px sans-serif';
    const ex = w.ex.length>40 ? w.ex.slice(0,40)+'...' : w.ex;
    ctx.fillText('"'+ex+'"', 24, 185);
  }
  // 마킹
  const mark = getMark(en);
  const markEmojis = ['○','✅','🦋'];
  ctx.font = '18px sans-serif';
  ctx.fillText(markEmojis[mark]||'○', 24, 220);
  // 날짜
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('ko-KR'), 300, 220);
  // 다운로드
  const a = document.createElement('a');
  a.download = en+'-card.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('📸 단어 카드 저장!');
}

async function loadMarketPacks() {
  if(typeof db === 'undefined') return;
  try {
    const snap = await db.collection('word_packs').orderBy('createdAt','desc').get();
    S._marketPacks = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(p=>p.active!==false);
    sv();
  } catch(e) {
    console.warn('마켓 로드 실패:', e.message);
  }
}

// ── 연속 학습 1시간 나비 보상 ──
function checkStudyHourReward() {
  if(!S._studyStartTime) return;
  const elapsed = Date.now() - S._studyStartTime;
  const hours = Math.floor(elapsed / 3600000);
  const lastReward = S._studyHourReward||0;
  if(hours > lastReward) {
    S._studyHourReward = hours;
    sv();
    // 가치 50점 이하 나비 랜덤 (일반⭐⭐ 또는 희귀⭐⭐⭐)
    const pool = BUTTERFLY_LIST.filter(b =>
      b.rare === '⭐⭐' || (b.rare === '⭐⭐⭐' && Math.random() < 0.3)
    );
    const bf = pool[Math.floor(Math.random()*pool.length)];
    if(!bf) return;
    setTimeout(()=>{
      const mr=document.getElementById('mr');
      if(!mr||mr.innerHTML.trim()) return;
      mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:24px">
        <div style="font-size:13px;font-weight:700;color:#E65100;margin-bottom:8px">🎉 ${hours}시간 연속 학습 보상!</div>
        <div style="animation:float-happy 2s ease-in-out infinite;display:inline-block;margin-bottom:10px">${getButterflyCharSVG(bf.id,80,true)}</div>
        <div style="font-size:18px;font-weight:900;margin-bottom:4px">${bf.name}</div>
        <div style="font-size:12px;color:#9CA3AF;margin-bottom:14px">${bf.rare} ${bf.rare==='⭐⭐⭐'?'희귀':'일반'}급</div>
        <div style="font-size:12px;color:#6B7280;margin-bottom:16px;line-height:1.6">열심히 공부하는 당신에게<br>특별한 나비를 선물합니다 🦋</div>
        <button onclick="cm();_claimHourButterfly('${bf.id}')" class="btn bb">🦋 내 도감에 추가</button>
      </div></div>`;
    }, 500);
  }
}

function _claimHourButterfly(bfId) {
  const bf = BUTTERFLY_LIST.find(b=>b.id===bfId);
  if(!bf) return;
  const key='wd-butterflies';
  const owned=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
  if(!owned.has(bfId)) {
    owned.add(bfId);
    localStorage.setItem(key, JSON.stringify([...owned]));
    showButterflyRoll(bf, null);
    checkAchievements();
  } else {
    toast('이미 보유한 나비예요! (+10XP)');
    addXP(10);
  }
}

function saveMyCharacter() {
  const size = 200;
  const svg = charSVG(S.lid, size, 'happy');
  const equipped = S._equipped||'';
  const accMap = {crown:'👑',star:'⭐',halo:'🌟',ribbon:'🎀',glasses:'👓',wings:'🪶'};
  const accEmoji = accMap[equipped]||'';
  const l = lv(S.lid);
  
  // SVG to Canvas
  const canvas = document.createElement('canvas');
  canvas.width = 300; canvas.height = 360;
  const ctx = canvas.getContext('2d');
  
  // 배경
  const grad = ctx.createLinearGradient(0,0,0,360);
  grad.addColorStop(0, l.bg||'#FFF9C4');
  grad.addColorStop(1, '#fff');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,300,360,20);
  ctx.fill();
  
  // 이름 배지
  ctx.fillStyle = l.color||'#F9A825';
  ctx.roundRect(75,10,150,30,15);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(l.emoji+' '+l.name, 150, 31);
  
  // 캐릭터 SVG 렌더
  const img = new Image();
  const svgBlob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = ()=>{
    ctx.drawImage(img, 50, 50, size, size);
    URL.revokeObjectURL(url);
    
    // 장식품
    if(accEmoji) {
      ctx.font = `${Math.round(size*0.3)}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(accEmoji, 150, 85);
    }
    
    // 닉네임
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(S.nick||'나의 캐릭터', 150, 285);
    
    // XP / 스트릭
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '13px sans-serif';
    ctx.fillText('⚡ '+S.xp+'XP  🔥 '+S.streak+'일', 150, 308);
    
    // 워터마크
    ctx.fillStyle = '#D1D5DB';
    ctx.font = '11px sans-serif';
    ctx.fillText('Butterfly Word', 150, 345);
    
    // 다운로드
    const a = document.createElement('a');
    a.download = 'butterfly_character.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('📸 캐릭터 이미지 저장됨!');
  };
  img.onerror = ()=>{ toast('이미지 생성 실패. 다시 시도해주세요.'); };
  img.src = url;
}

// ── 전역 학습 타이머 ──
const _LT = {
  elapsed: 0,       // 경과 초
  goal: 0,          // 목표 초 (0=무제한)
  running: false,
  interval: null,

  start() {
    if(this.running) return;
    this.running = true;
    if(!this._startTime) this._startTime = Date.now() - this.elapsed*1000;
    this.interval = setInterval(()=>{
      this.elapsed = Math.floor((Date.now()-this._startTime)/1000);
      this._updateUI();
      // 헤더 미니 카드도 업데이트
      if(typeof updHD==='function') updHD();
      // 하루 공부시간 연동 (1분마다)
      if(this.elapsed > 0 && this.elapsed % 60 === 0) {
        const todayKey = new Date().toISOString().slice(0,10);
        if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
        S._dailyStudiedMin = (S._dailyStudiedMin||0) + 1;
        const goal=S._dailyGoalMin||30, studied=S._dailyStudiedMin||0;
        const pct=Math.round(studied/goal*100);
        // 10%마다 XP 지급 (각 구간 1회만)
        if(!S._dailyXpGiven) S._dailyXpGiven={};
        const milestone = Math.floor(pct/10)*10;
        if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
          S._dailyXpGiven[milestone]=true;
          const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
          addXP(xpReward);
          const msg = milestone===100
            ? '🏆 목표 100% 달성! +200XP 🎉'
            : milestone===50
            ? '🎉 목표 50% 달성! +80XP'
            : `⭐ 목표 ${milestone}% 달성! +30XP`;
          toast(msg);
          if(milestone===100) vib([100,50,100,50,200]);
          else if(milestone===50) vib([50,30,100]);
          else vib(50);
        }
        const rem=Math.max(0,goal-studied);
        if(rem>0 && rem%10===0 && rem<goal) toast('⏱ 목표까지 '+rem+'분 남았어요!');
        sv();
      }
      // 세션 목표 달성
      if(this.goal > 0 && this.elapsed >= this.goal) {
        this.stop();
        toast('🎉 목표 시간 달성! 수고했어요!');
        vib([100,50,100,50,200]);
      }
    }, 1000);
  },

  stop() {
    this.running = false;
    clearInterval(this.interval);
    this.interval = null;
  },

  reset() {
    this.stop();
    this.elapsed = 0;
    this._startTime = null;
    this._updateUI();
  },

  fmt(s) {
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  },

  _updateUI() {
    document.querySelectorAll('._lt-display').forEach(el=>{
      const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
      const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:800;color:${color};font-family:monospace">${this.fmt(this.elapsed)}</div>
          ${this.goal>0?`<div style="font-size:10px;color:rgba(255,255,255,.4)">/ ${this.fmt(this.goal)}</div>`:''}
          <button onclick="showTimerSettings()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:3px 8px;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer">⏱</button>
        </div>
        ${this.goal>0?`<div style="background:rgba(255,255,255,.12);border-radius:2px;height:2px;overflow:hidden;margin-top:3px"><div style="height:100%;background:${color};width:${pct}%;transition:width .5s"></div></div>`:''}
      `;
    });
  },

  barHTML() {
    const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
    const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
    return `<div class="_lt-display" style="min-width:80px"></div>`;
  }
};

// ── Firebase 추가 나비 로드 ──
async function loadFirebaseButterflies() {
  try {
    if(typeof db === 'undefined') return;
    const snap = await db.collection('butterflies').get();
    if(snap.empty) return;
    snap.docs.forEach(doc => {
      const bf = doc.data();
      if(!bf.id || !bf.name) return;
      const existing = BUTTERFLY_LIST.find(b => b.id === bf.id);
      if(existing) {
        if(bf.svgCode) existing.svgCode = bf.svgCode;
      } else {
        BUTTERFLY_LIST.push({
          id: bf.id, name: bf.name, rare: bf.rare||'⭐⭐',
          color: bf.color||'#7C3AED', bg: '#F5F3FF',
          desc: bf.desc||'', svgCode: bf.svgCode||''
        });
      }
    });
  } catch(e) { console.warn('butterfly load failed', e); }
}

window._auto = window._auto || {
  loop: true,        // 무한 루프 (기본 ON)
  speed: 4000,       // 단어당 시간 (ms) - 스트리밍/오디오용
  shadowRate: 0.75,  // 쉐도잉 발음 속도
  read: 'en+kr',     // 읽기 모드: en/kr/ex/en+kr/en+ex/all
  voice: 'en-US',    // 영어 음성
};
function _autoSpeak(text, lang='en-US') {
  return new Promise(res => {
    if(!text) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = lang === 'ko-KR' ? 0.95 : (window._auto.shadowRate || 0.85);
    u.onend = res; u.onerror = res;
    setTimeout(res, 6000);
    speechSynthesis.speak(u);
  });
}
async function _autoReadWord(w) {
  const m = window._auto.read || 'en+kr';
  if(m === 'en') {
    await _autoSpeak(w.en, 'en-US');
  } else if(m === 'kr') {
    await _autoSpeak(w.kr, 'ko-KR');
  } else if(m === 'ex') {
    if(w.ex) await _autoSpeak(w.ex, 'en-US');
  } else if(m === 'en+kr') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,300));
    await _autoSpeak(w.kr, 'ko-KR');
  } else if(m === 'en+ex') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,300));
    if(w.ex) await _autoSpeak(w.ex, 'en-US');
  } else if(m === 'all') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,250));
    await _autoSpeak(w.kr, 'ko-KR');
    await new Promise(r=>setTimeout(r,250));
    if(w.ex) await _autoSpeak(w.ex, 'en-US');
  }
}

function addXP(n, silent=false) {
  const bonus = getStreakBonus();
  const actual = Math.round(n * bonus);
  S.xp = (S.xp||0) + actual;
  sv(); if(!silent) updHD();
  // XP 획득 토스트 (게임 중이 아닐 때만)
  if(!silent && actual>0) showXpGain(actual, bonus>1);
  // XP만 누적 - 레벨업은 사용자가 직접 나비탭에서 선택
  const ni=LEVELS.findIndex(l=>l.id===S.lid);
  const curLvData=LEVELS[ni];
  const next=LEVELS[ni+1];
  const needForNext = curLvData ? (curLvData.xp||100) : 100;
  if(next && (S.xp||0)>=needForNext && !S._lvNotified) {
    S._lvNotified=true;
    const isLast = next.isFinal;
    setTimeout(()=>toast(isLast
      ? '👑 나비의 신 레벨업 가능! 나비 뽑기까지 한 걸음! 🦋'
      : '⬆️ 레벨업 가능! 나비 탭에서 레벨업하세요'),800);
  }
}

function scheduleAlarms() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const l = lv(S.lid);

  // 기존 알람 제거
  if(window._alarmTimers) window._alarmTimers.forEach(t=>clearTimeout(t));
  window._alarmTimers = [];

  const now = new Date();
  const alarms = [
    {cfg:S.alStudy,  title:`${l.emoji} 공부 시작!`,   body:`오늘 목표 ${S._dailyGoalMin||30}분 중 ${Math.floor(S._dailyStudiedMin||0)}분 완료. 지금 시작해요!`},
    {cfg:S.alGoal,   title:`${l.emoji} 퀴즈 도전!`,   body:'퀴즈로 오늘 실력을 확인해봐요!'},
    {cfg:S.alStreak, title:`${l.emoji} 캐릭터 돌보기`, body:`${l.name}가 기다리고 있어요!`},
  ];

  alarms.forEach(({cfg, title, body}) => {
    if(!cfg || !cfg.on) return;
    const alarmTime = new Date();
    alarmTime.setHours(cfg.h, cfg.m, 0, 0);
    if(alarmTime <= now) alarmTime.setDate(alarmTime.getDate()+1); // 내일로
    const delay = alarmTime - now;
    const t = setTimeout(()=>{
      // 남은 공부시간 메시지
      const studied = S._dailyStudiedMin||0;
      const goal = S._dailyGoalMin||30;
      const remain = Math.max(0, goal-studied);
      const finalBody = remain>0
        ? body + ` 오늘 목표까지 ${Math.ceil(remain)}분 남았어요!`
        : body + ' 오늘 목표 이미 달성! 👑';
      new Notification(title, {body:finalBody, icon:'/icons/icon-192.png'});
      // 매일 반복
      scheduleAlarms();
    }, delay);
    window._alarmTimers.push(t);
  });
}

function startTest() {
  // 적응형 테스트: egg부터 시작, 3연속 정답→상승, 2오답→확정
  S.tQs = [];
  S.tIdx = 0;
  S.tScore = {};
  S.tAns = false;
  S.tRes = null;
  S.tCurChoices = null;
  S.tCorrectIdx = null;
  // 상태 초기화
  S.tLvIdx = 0;        // 현재 도전 레벨 인덱스
  S.tConsecRight = 0;  // 연속 정답 수
  S.tWrongCount = 0;   // 현재 레벨 오답 수
  S.tTotalQ = 0;       // 총 문제 수
  S.tLvResult = {};    // 레벨별 결과
  renderAdaptiveQ();
}

// ── 적응형 테스트 핵심 ──
function renderAdaptiveQ() {
  const lvId = LEVELS[S.tLvIdx]?.id;
  if(!lvId) { finishAdaptiveTest(); return; }
  const pool = TEST_POOL[lvId] || TEST_POOL.egg;
  const q = {...rnd(pool), lv: lvId};
  S.tCurrentQ = q;
  S.tTotalQ++;
  renderAdaptiveMCQ(q);
}

function renderAdaptiveMCQ(q) {
  const l = lv(q.lv);
  const lvIdx = S.tLvIdx;
  // 보기 순서 고정
  if(!S.tAns) {
    S.tCurChoices = shuf(q.c.map((c,i)=>({c,i})));
    S.tCorrectIdx = S.tCurChoices.findIndex(x=>x.i===q.a);
  }
  const cs = S.tCurChoices||[];
  const correctIdx = S.tCorrectIdx||0;
  window._tCorrect = correctIdx;
  window._tLv = q.lv;

  // 상단 진행 표시 (레벨 + 연속정답/오답)
  const consecDots = Array(3).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tConsecRight?'#16A34A':'#E5E7EB'};border:2px solid ${i<S.tConsecRight?'#86EFAC':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tConsecRight?'✓':''}</span>`
  ).join('');
  const wrongDots = Array(2).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tWrongCount?'#DC2626':'#E5E7EB'};border:2px solid ${i<S.tWrongCount?'#FECDD3':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tWrongCount?'✗':''}</span>`
  ).join('');

  document.getElementById('body').innerHTML=`<div class="pad">
    <div style="background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid #E5E7EB">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:#1E5FA5">${l.emoji} ${l.name} 도전 중</div>
        <div style="font-size:11px;color:#9CA3AF">${S.tTotalQ}번째 문제</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#16A34A;font-weight:700">정답</span>
          ${consecDots}
          <span style="font-size:11px;color:#9CA3AF">3개면 상승!</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#DC2626;font-weight:700">오답</span>
          ${wrongDots}
          <span style="font-size:11px;color:#9CA3AF">2개면 확정</span>
        </div>
      </div>
    </div>
    <div style="background:#F8F9FA;border-radius:20px;padding:32px 24px;text-align:center;border:1.5px solid #E5E7EB">
      ${S.showImg!==false?`<div style="font-size:64px;margin-bottom:12px">${q.img||'📝'}</div>`:''}
      <div style="font-size:32px;font-weight:900;color:#111;font-family:monospace">${q.q}</div>
    </div>
    <div class="g2">${cs.map((x,ri)=>{
      let bg='#fff',col='#374151',bd='#E5E7EB';
      if(S.tAns){
        if(ri===correctIdx){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}
        else if(ri===S.tRes){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}
      }
      return `<button onclick="tOptClick(${ri})" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600;cursor:${S.tAns?'default':'pointer'};width:100%;font-family:inherit;text-align:center">${x.c}</button>`;
    }).join('')}</div>`;
}

window.tOptClick = function(ri) {
  if(S.tAns) return;
  S.tAns = true;
  S.tRes = ri;
  const correct = window._tCorrect;
  const lvId = window._tLv;
  const isRight = ri === correct;

  if(isRight) {
    ok();
    S.tConsecRight++;
    S.tScore[lvId] = (S.tScore[lvId]||0) + 1;
  } else {
    ng();
    S.tConsecRight = 0;
    S.tWrongCount++;
  }

  renderAdaptiveMCQ(S.tCurrentQ);

  setTimeout(() => {
    S.tAns = false; S.tRes = null;
    S.tCurChoices = null; S.tCorrectIdx = null;

    if(S.tConsecRight >= 3) {
      // 레벨 통과 → 다음 레벨
      S.tLvResult[lvId] = 'pass';
      S.tLvIdx++;
      S.tConsecRight = 0;
      S.tWrongCount = 0;
      if(S.tLvIdx >= LEVELS.length) { finishAdaptiveTest(); return; }
      toast(`✅ ${lv(lvId).name} 통과! 다음 레벨로!`);
    } else if(S.tWrongCount >= 2) {
      // 레벨 확정
      S.tLvResult[lvId] = 'fail';
      finishAdaptiveTest(); return;
    }

    // 최대 24문제 제한
    if(S.tTotalQ >= 24) { finishAdaptiveTest(); return; }
    renderAdaptiveQ();
  }, 800);
};

function finishAdaptiveTest() {
  // 최종 레벨 결정
  let finalLvIdx = 0;
  LEVELS.forEach((l,i) => {
    if(S.tLvResult[l.id] === 'pass') finalLvIdx = i+1;
  });
  finalLvIdx = Math.min(finalLvIdx, LEVELS.length-1);
  const finalLv = LEVELS[finalLvIdx];

  S.lid = finalLv.id;
  S.xp = finalLv.min * 10;
  sv();
  localStorage.setItem('wd-tested', '1');
  S.tHistory.push({date:today(), lid:finalLv.id, totalQ:S.tTotalQ});
  localStorage.setItem('wd-th', JSON.stringify(S.tHistory));

  // 결과 화면
  const resultRows = LEVELS.map((l,i) => {
    const res = S.tLvResult[l.id];
    if(!res && i > finalLvIdx) return '';
    const icon = res==='pass'?'✅':res==='fail'?'❌':'—';
    const isFinal = i===finalLvIdx;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:${isFinal?'#EFF6FF':'#F8F9FA'};border:${isFinal?'2px solid #1E5FA5':'1px solid #E5E7EB'}">
      <span style="font-size:20px">${l.emoji}</span>
      <span style="flex:1;font-size:13px;font-weight:${isFinal?'800':'600'};color:${isFinal?'#1E5FA5':'#374151'}">${l.name}</span>
      <span style="font-size:16px">${icon}</span>
      ${isFinal?'<span style="font-size:11px;background:#1E5FA5;color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">확정!</span>':''}
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('body').innerHTML=`<div class="pad" style="padding-top:24px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:56px;margin-bottom:8px">${finalLv.emoji}</div>
      <div style="font-size:24px;font-weight:900;color:#111;margin-bottom:4px">테스트 완료!</div>
      <div style="font-size:14px;color:#6B7280">${S.tTotalQ}문제로 레벨을 찾았어요</div>
    </div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:18px;padding:18px;text-align:center;border:2px solid #1E5FA5;margin-bottom:14px">
      <div style="font-size:12px;color:#1E5FA5;font-weight:700;margin-bottom:4px">나의 레벨</div>
      <div style="font-size:22px;font-weight:900;color:#1E5FA5">${finalLv.emoji} ${finalLv.name}</div>
      <div style="font-size:12px;color:#6B7280;margin-top:4px">${finalLv.desc}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">${resultRows}</div>
    ${charSVG(finalLv.id,60,'happy')}
    <button class="btn bb" onclick="startApp()">학습 시작하기! 🚀</button>
  </div>`;
}

function startApp() {

  }
  document.getElementById('hd').style.display='';
  document.getElementById('nav').style.display='flex';
  updHD(); scheduleAlarms();
  loadWordsFromFirestore(S.lid);
  setTimeout(()=>checkAttend(), 1000);
  setTimeout(()=>syncProfileToFirebase(), 2000);
  setTimeout(async ()=>{
    await loadMarketPacks();
    loadFirebaseButterflies(); // Firebase 나비 로드
    // 날짜 초기화 (자정 지나면 공부시간 리셋)
    const _todayKey = new Date().toISOString().slice(0,10);
    if(S._dailyDate !== _todayKey) { S._dailyStudiedMin=0; S._dailyXpGiven={}; S._dailyDate=_todayKey; sv(); }
    // 알람 재설정
    if(typeof Notification!=='undefined' && Notification.permission==='granted') scheduleAlarms();
    // 광고 배너 설정 로드
    try {
      const adDoc = await db.collection('config').doc('ad_banner').get();
      if(adDoc.exists) { S._adConfig = adDoc.data(); sv(); }
    } catch(e) {}
    // 구매 이력 로드
    if(typeof db !== 'undefined' && S.user?.uid) {
      try {
        const doc = await db.collection('user_packs').doc(S.user.uid).get();
        if(doc.exists) {
          S._ownedPacks = doc.data().owned||[];
          sv();
        }
      } catch(e) {}
    }
  }, 3000); // 마켓 팩 + 구매이력 로드
  // 첫 실행 온보딩 투어
  if(!localStorage.getItem('wd-onboard')) {
    setTimeout(()=>showOnboarding(), 1500);
  }
  go('home');
}

function go(tab,sub) {
  console.log('[앱] go', tab||S.tab);
  if(tab&&tab!=='game'&&tab!=='ranking') {
    // 학습 탭을 직접 클릭(sub 없이)하면 항상 단어장 선택 첫 화면으로

    if(tab==='mybooks'&&!sub) S.stab='books';
    if(tab==='butterfly'&&!sub) S.stab=null;
    S.tab=tab;

  if(tab==='ranking') S.tab='ranking';
  if(tab==='game') S.tab='game';

function getLearnedSysWords(lvId) {
  return JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]').length;
}

function loadSysWords(lvId, cb) {
  if(typeof db==='undefined') {
    S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
    if(cb)cb(); return;
  }
  db.collection('system_words').where('level','==',lvId).get()
    .then(snap=>{
      S._sysWords=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(!S._sysWords.length) S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
      if(cb)cb();
    }).catch(()=>{
      S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
      if(cb)cb();
    });
}

function startLearnSession(mode) {
  S._studyStartTime = Date.now();
  if(!S._sysWords||!S._sysWords.length) {
    S._sysWords=DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg||[];
    loadSysWords(S.lid,null);
  }
  const words=S._sysWords;
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=words.filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0) {
    const mr=document.getElementById('mr');
    if(mr) mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">모든 단어 학습 완료!</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="cm();showLevelUpTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">🏆 레벨업 테스트</button>
        <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">닫기</button>
      </div></div></div>`;
    return;
  }
  if(!S._learnSessionStarted) {
    window._pickerRemaining=remaining;
    window._pickerMode=mode||'random';
    if(!S._learnTotalTarget) S._learnTotalTarget=remaining.length;
    _showAmountPicker();
    return;
  }
  _doLearnSession(mode, S._learnSessionPool||remaining);
}

function _doLearnSession(mode, pool) {
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=(pool||S._learnSessionPool||[]).filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0){S._learnSessionStarted=false;checkLearnComplete();return;}
  const sessionWords=shuf(remaining.slice(0,5));
  let gameId=mode;
  if(!mode||mode==='random'){
    const last=S._lastLearnGame||'';
    const avail=LEARN_GAMES.filter(g=>g!==last);
    gameId=avail[Math.floor(Math.random()*avail.length)];
  }
  S._lastLearnGame=gameId; S._learnMode=mode||'random';
  S._learnSessionWords=sessionWords; S._inLearnSession=true;
  startGameW(gameId,sessionWords);
}

function finishLearnSession(resultMap) {
  S._inLearnSession=false;
  const sw=S._learnSessionWords||[];
  const wrong=sw.filter(w=>resultMap[w.en]===false);
  const correct=sw.filter(w=>resultMap[w.en]!==false);
  if(correct.length>0){
    const key='wd-sys-learned-'+S.lid;
    const learned=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
    correct.forEach(w=>learned.add(w.en));
    localStorage.setItem(key,JSON.stringify([...learned]));
    S._learnDoneCount=(S._learnDoneCount||0)+correct.length;
    setTimeout(checkMiniQuiz,300);
  }
  // 정답률 기반 XP
  const total2 = sw.length||1;
  const pct2 = Math.round(correct.length/total2*100);
  let xpAmt = 10;
  if(pct2>=100) { xpAmt=120; S._hadPerfect=true; sv(); }
  else if(pct2>=90) xpAmt=80;
  else if(pct2>=80) xpAmt=50;
  else if(pct2>=60) xpAmt=30;
  addXP(xpAmt); checkXpUsable();
  logStudy('quiz');
  // 학습 시간 추적
  if(S._studyStartTime) {
    const mins = Math.round((Date.now()-S._studyStartTime)/60000);
    S._totalStudyMins = (S._totalStudyMins||0) + mins;
    S._studyStartTime = null;
  }
  sv();
  checkAchievements();
  checkStudyHourReward();
  // 세션 완료 캐릭터 반응
  setTimeout(()=>{
    const pet=getPetState();
    const nextActions=['🎯 퀴즈로 확인해봐요!','🎮 게임으로 복습해봐요!','🔥 SRS 복습도 해봐요!'];
    const nextAct = nextActions[Math.floor(Math.random()*nextActions.length)];
    toast('🐛 오늘도 수고했어! +'+xpAmt+'XP ・ '+nextAct);
    vib([100,50,100]);
  },300);
  const mr=document.getElementById('mr');
  if(!mr) return;
  mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:18px;font-weight:800;margin-bottom:16px;text-align:center">📊 학습 결과</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:#F0FDF4;border-radius:14px;padding:16px;text-align:center;border:1.5px solid #86EFAC">
        <div style="font-size:32px;font-weight:900;color:#16A34A">${correct.length}</div>
        <div style="font-size:12px;color:#16A34A;font-weight:700;margin-top:4px">✅ 맞음</div></div>
      <div style="background:${wrong.length?'#FEF2F2':'#F9FAFB'};border-radius:14px;padding:16px;text-align:center;border:1.5px solid ${wrong.length?'#FECACA':'#E5E7EB'}">

function _reLearn(words) {
  if(!words||!words.length){checkLearnComplete();return;}
  S._learnSessionWords=words; S._inLearnSession=true;
  const gameId=S._learnMode==='random'?LEARN_GAMES[Math.floor(Math.random()*LEARN_GAMES.length)]:(S._learnMode||'quiz');
  startGameW(gameId,words);
}

function checkMiniQuiz() {
  // 5개 학습마다 즉석 미니퀴즈
  const done = S._learnDoneCount||0;
  if(done>0 && done%5===0 && S.words.length>=4) {
    const w = S.words[Math.min(S.idx, S.words.length-1)];
    if(!w) return;
    const wrong = S.words.filter(x=>x.en!==w.en).sort(()=>Math.random()-.5).slice(0,3);
    const choices = [w,...wrong].sort(()=>Math.random()-.5);
    const mr=document.getElementById('mr');
    if(!mr) return;
    // 다른 모달이 열려있으면 건너뜀
    if(mr.innerHTML.trim() !== '') return;
    mr.innerHTML=`<div class="mbg"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:20px">
      <div style="font-size:11px;font-weight:700;color:#A08040;margin-bottom:8px">⚡ 미니 퀴즈! (${done}개 학습)</div>
      <div style="font-size:22px;font-weight:900;color:#1E5FA5;font-family:monospace;margin-bottom:16px">${w.en}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${choices.map(ch=>`<button onclick="
          const isOk='${ch.en}'==='${w.en}';
          if(isOk){ok();addXP(5,true);document.getElementById('mr').innerHTML='';toast('정답! +5XP ⚡');}
          else{ng();document.getElementById('mr').innerHTML='<div class=\'mbg\'><div class=\'modal\' style=\'text-align:center;padding:20px\'><div style=\'font-size:48px\'>❌</div><div style=\'font-size:14px;font-weight:700;margin:10px 0\'>정답은 ${w.kr}</div><button onclick=\'cm()\' class=\'btn bb\'>확인</button></div></div>';}
        " style="background:var(--bg-sub,#FFF9ED);border:1.5px solid var(--border,#F0E6C8);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text1,#3D2C00)">${ch.kr}</button>`).join('')}
      </div>
      <button onclick="cm()" style="margin-top:10px;background:none;border:none;color:var(--text3,#A08040);font-size:12px;cursor:pointer">건너뛰기</button>
    </div></div>`;
  }
}

function checkLearnComplete() {
  const pool=S._learnSessionPool||S._sysWords||[];
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=pool.filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0){
    const mr=document.getElementById('mr');
    if(mr) mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:56px;margin-bottom:12px">🎊</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">모든 단어 완료!</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="cm();showLevelUpTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">🏆 레벨업 테스트</button>
        <button onclick="cm();go('learn')" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">닫기</button>
      </div></div></div>`;
    S._learnSessionStarted=false;
  } else {
    _doLearnSession(S._learnMode||'random',pool);
  }
}

  const passRate=S._levelTestPassRate||100;

      <div style="font-size:18px;font-weight:800">레벨업 테스트</div>
      <div style="font-size:13px;color:#9CA3AF;margin-top:4px">${lvInfo.emoji} ${lvInfo.name} → ${nextLv?.emoji||'⚡'} ${nextLv?.name||'최고 레벨'}</div></div>

      <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer">취소</button>

function _startLevelTest() {
  const words=S._sysWords||DEFAULT_WORDS[S.lid]||[];
  const testWords=shuf([...words]).slice(0,Math.min(20,words.length));
  S._levelTestWords=testWords; S._inLevelTest=true; S._inLearnSession=false;
  startGameW('quiz',testWords);
}


function _doLevelUp() {
  const curLvIdx = LEVELS.findIndex(l=>l.id===S.lid);
  const nextLv = LEVELS[curLvIdx+1];

  // 이미 최고 레벨
  if(!nextLv) { toast('이미 나비의 신이에요! 👑'); return; }

  // 현재 레벨 xp 충족 여부 확인
  const curLv = LEVELS[curLvIdx];
  const needXp = curLv.xp || 100;
  if((S.xp||0) < needXp) {
    toast('XP '+needXp+'개 필요해요. 현재 '+(S.xp||0)+'XP');
    return;
  }

  // 레벨업 진행 (한 단계만)
  const prevId = S.lid;
  S.lid = nextLv.id;
  const needXp2 = curLv.xp || 100;
  S.xp = Math.max(0, (S.xp||0) - needXp2); // 초과 XP 보존
  S._lvNotified = false;
  S._sysWords = null;
  S._learnSessionStarted = false;
  S._learnTotalTarget = 0;
  S._learnDoneCount = 0;
  sv();
  loadSysWords(S.lid, null);

  // 마지막 단계(나비의 신)일 때만 나비 뽑기
  if(nextLv.isFinal) {
    showLevelUpFlash(()=>{
      const butterfly = rollButterfly();
      showButterflyRoll(butterfly, ()=>{
        // 나비 뽑기 후 리셋 → 알부터 다시 시작 (도감 반복 수집)
        setTimeout(()=>{
          const mr = document.getElementById('mr');
          if(mr) mr.innerHTML += '';
          const myBf=getMyButterflies();
          const totalBf=BUTTERFLY_LIST.length;
          const pct=Math.round(myBf.length/totalBf*100);
          document.getElementById('mr').innerHTML = `<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:24px">
            <div style="font-size:48px;margin-bottom:8px">👑</div>
            <div style="font-size:17px;font-weight:900;color:#B71C1C;margin-bottom:6px">나비의 신 달성!</div>
            <div style="font-size:13px;color:#6B7280;margin-bottom:12px;line-height:1.7">🔄 다시 알부터! 새 나비를 수집하세요 · 도감: ${myBf.length}/${totalBf}종 (${pct}%)</div>
            <div style="background:#FFF8E1;border-radius:12px;padding:10px;margin-bottom:14px;text-align:left">
              ${pct===100?'<div style="font-size:13px;font-weight:700;color:#16A34A;text-align:center">🏆 도감 완성! 진정한 나비의 신!</div>':
                pct>=50?`<div style="font-size:12px;color:#E65100">🦋 ${totalBf-myBf.length}종 더 모으면 도감 완성!<br>다시 시작해서 새 나비를 뽑아요</div>`:
                `<div style="font-size:12px;color:#E65100">🦋 아직 ${totalBf-myBf.length}종이 남았어요!<br>다시 알부터 시작해서 수집해요</div>`}
            </div>
            <button onclick="resetToEgg();cm();go()" class="btn bb" style="margin-bottom:8px">🥚 다시 시작하기</button>
            <button onclick="S.stab=null;go('butterfly');cm()" class="btn" style="background:#F5F3FF;color:#7C3AED;border:1.5px solid #E9D5FF">📚 나비탭으로</button>
          </div></div>`;
        }, 2000);
      });
    });
  } else {
    // 일반 레벨업 연출
    showLevelUpFlash(()=>{
      const mr = document.getElementById('mr');
      if(!mr) return;
      mr.innerHTML = `<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:28px 20px">
        <div style="font-size:56px;margin-bottom:10px;animation:float-happy 2s ease-in-out infinite;display:inline-block">${nextLv.emoji}</div>
        <div style="font-size:22px;font-weight:900;color:#111;margin-bottom:6px">레벨 업! 🎉</div>
        <div style="font-size:17px;font-weight:700;color:${nextLv.color};margin-bottom:8px">${nextLv.name}</div>
        <div style="font-size:13px;color:#9CA3AF;margin-bottom:20px">${nextLv.desc} 단계가 열렸어요!</div>
        <div style="margin-bottom:20px">${charSVG(nextLv.id,80,'happy')}</div>
        <div style="background:#FFF8E1;border-radius:12px;padding:10px;margin-bottom:16px;font-size:12px;color:#E65100">
          다음: ${LEVELS[curLvIdx+2]?LEVELS[curLvIdx+2].emoji+' '+LEVELS[curLvIdx+2].name:'👑 나비의 신!'}까지
          ${LEVELS[curLvIdx+2]?'XP '+LEVELS[curLvIdx+1].xp+'개 필요':'XP '+nextLv.xp+'개 모으면 나비 뽑기!'}
        </div>
        <button class="btn bb" onclick="cm();go()">신나는데요! 🚀</button>
      </div></div>`;
    });
  }
}

function resetToEgg() {
  S.lid = 'egg';
  S.xp = 0;
  S._lvNotified = false;
  S._sysWords = null;
  S._learnSessionStarted = false;
  sv();
  loadSysWords('egg', null);
  toast('🥚 다시 알부터 시작!');
}

function showLevelUpFlash(cb) {
  // 진동
  vib([100,50,100,50,200,100,400]);
  // SFX
  SFX.play('levelup');
  // 빛 이펙트 오버레이
  const el=document.createElement('div');
  el.id='levelup-flash';
  el.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,0);z-index:9998;pointer-events:none;transition:background .15s';
  document.body.appendChild(el);
  // 파티클 생성 (나비 이모지 + 원형 혼합)
  const emojis=['🦋','✨','🌸','⭐⭐','🎉','💫','🌟','🎊'];
  const colors=['#FDE68A','#A78BFA','#6EE7B7','#FCA5A5','#93C5FD','#FCD34D','#F9A825','#E65100'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    const angle=(i/20)*360+Math.random()*18;
    const dist=60+Math.random()*160;
    const isEmoji=i%3===0;
    const size=isEmoji?20:(4+Math.random()*12);
    p.style.cssText=`position:fixed;left:50%;top:45%;width:${size}px;height:${size}px;border-radius:${isEmoji?'0':'50%'};background:${isEmoji?'transparent':colors[i%colors.length]};font-size:${size}px;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(0);transition:all ${.5+Math.random()*.4}s ease-out;opacity:1;display:flex;align-items:center;justify-content:center`;
    if(isEmoji) p.textContent=emojis[i%emojis.length];
    document.body.appendChild(p);
    setTimeout(()=>{
      p.style.transform=`translate(calc(-50% + ${Math.cos(angle*Math.PI/180)*dist}px),calc(-50% + ${Math.sin(angle*Math.PI/180)*dist}px)) scale(1) rotate(${Math.random()*360}deg)`;
      p.style.opacity='0';
    },30+i*20);
    setTimeout(()=>p.remove(),1200);
  }
  setTimeout(()=>{el.style.background='rgba(255,255,255,0.85)';},50);
  setTimeout(()=>{el.style.background='rgba(255,255,255,0)';},300);
  setTimeout(()=>{el.remove();if(cb)cb();},600);
}

            <div style="font-size:12px;font-weight:800;color:${col}">${nm}</div>

  // ── 게임 목록 ──
  html += `<div style="background:var(--bg-card,#FFFEF8);border-radius:18px;border:1.5px solid var(--border,#F0E6C8);padding:16px">

    {id:'wc',ic:'🔡',nm:'단어 완성',c:'#BE185D',bg:'#FDF2F8'},

      ${best?`<div style="font-size:9px;color:#9CA3AF;margin-top:2px">🏆 ${best}%</div>`:'<div style="font-size:9px;color:'+g.c+';font-weight:700;margin-top:2px">도전해봐!</div>'}
    </div>`;
  });
  html += `</div></div>`;

  // ── 반려나비 도감 (나비 + 캐릭터 수집) ──
  const butterflies = getMyButterflies();
  const myCol = getMyCollection();
  html += `<div style="background:var(--bg-card,#FFFEF8);border-radius:18px;border:1.5px solid var(--border,#F0E6C8);padding:16px">

  const pMsgs = ['전 세계 나비의 30%가 멸종위기에 처해 있어요 🌿', '나비를 보호하는 가장 좋은 방법은 꽃을 심는 것이에요 🌸', '도시 개발로 매년 수많은 나비들이 서식지를 잃고 있어요', '나비는 생태계 건강의 지표예요. 나비가 사라지면 생태계도 무너져요', '정원에 토종 꽃을 심어 나비들의 쉼터를 만들어주세요 🌺', '농약 사용을 줄이면 나비를 지킬 수 있어요 🌱', '기후변화로 나비의 이주 시기와 경로가 변하고 있어요'];

// 벌거지 상태 계산
function getPetState() {
  const today = new Date().toISOString().slice(0,10);
  const log = S.studyLog||{};
  const dates = Object.keys(log).sort().reverse();
  const lastStudy = dates[0];
  let daysSince = 0;
  if(lastStudy){const diff=new Date(today)-new Date(lastStudy);daysSince=Math.floor(diff/(1000*60*60*24));}
  else{daysSince=99;}
  const todayDone = log[today]?.words>0||log[today]?.quiz>0;
  const col = PET_COLORS[getPetColor()]||PET_COLORS.green;
  const full = S._petFull||0;
  const happy = S._petHappy||0;
  // 수치가 낮으면 상태 악화
  const lowStats = full<=2 || happy<=2;
  if(todayDone && !lowStats) {
    const _happyMoods=['오늘도 열심히 했어! 나 점점 자라! 🐛','공부하니까 빛나는 것 같아! ✨','오늘 정말 잘했어! 최고야 👍','단어 외울수록 나 커져! 계속해줘!'];
    return {emoji:'😄',mood:_happyMoods[Math.floor(Math.random()*_happyMoods.length)],bg1:col.main,bg2:col.main,color:col.main};
  }
  const _happyMoods=['오늘도 열심히 했어! 나 점점 자라! 🐛','공부하니까 빛나는 것 같아! ✨','오늘 정말 잘했어! 최고야 👍','단어 외울수록 나 커져! 계속해줘!'];
  return {emoji:'😄',mood:_happyMoods[Math.floor(Math.random()*_happyMoods.length)],bg1:col.main,bg2:col.main,color:col.main};
  const _normalMoods=['오늘 아직 공부 안 했지? 같이 해보자!','나 배고파... 공부하면 밥 줄 거지? 🥺','오늘도 같이 공부하자! 화이팅!','단어 하나만 더 외우면 안 될까? 😊'];
  if(daysSince===0 && !lowStats) return {emoji:'😊',mood:_normalMoods[Math.floor(Math.random()*_normalMoods.length)],bg1:col.main,bg2:col.main,color:col.main};
  if(full<=2 && happy<=2) return {emoji:'😢',mood:'"배고프고 심심해... 나 좀 돌봐줘..."',bg1:'#D97706',bg2:'#B45309',color:'#D97706'};
  if(daysSince===1) return {emoji:'😐',mood:'"어제도 안 왔잖아... 나 혼자 있었어"',bg1:'#6B7280',bg2:'#4B5563',color:'#6B7280'};
  if(daysSince===2) return {emoji:'😢',mood:'"이틀이나 공부 안 하면 나 점점 작아져..."',bg1:'#D97706',bg2:'#B45309',color:'#D97706'};
  if(daysSince===3) return {emoji:'😤',mood:'"3일이나 혼자였어. 진짜 삐졌어."',bg1:'#DC2626',bg2:'#B91C1C',color:'#DC2626'};
  return {emoji:'💀',mood:'"...기억나? 나 여기 있어..."',bg1:'#374151',bg2:'#1F2937',color:'#374151'};
}

function getNextEvolution() {
  const curIdx = LEVELS.findIndex(l=>l.id===S.lid);
  return LEVELS[Math.min(curIdx+1, LEVELS.length-1)];
}

function getMyButterflies() {
  return JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
}

function rollButterfly() {
  const owned = getMyButterflies();
  const available = BUTTERFLY_LIST.filter(b=>!owned.includes(b.id));
  if(available.length===0) return null;

  // ── 확률 설계 ──
  // ⭐⭐⭐⭐ 전설 (score>=80)  : 0.001%  → weight 0.001
  // ⭐⭐⭐   영웅 (score>=65)  : 1%      → weight 1
  // ⭐⭐     희귀 (score>=40)  : 20%     → weight 20
  // ⭐       일반 (score<40)   : 78.999% → weight 78.999
  // 총합 100이 되도록 맞춤
  // 전설급은 랜덤 0~100000 중 1 이하일 때만 (0.001%)

  const LEGEND_CHANCE = 0.00001; // 0.001%
  const HERO_CHANCE   = 0.01;    // 1%
  const RARE_CHANCE   = 0.20;    // 20%
  // 나머지 ~79%는 일반

  const roll = Math.random(); // 0~1

  let targetRare;
  if(roll < LEGEND_CHANCE) targetRare = '⭐⭐⭐⭐⭐';
  else if(roll < LEGEND_CHANCE + HERO_CHANCE) targetRare = '⭐⭐⭐⭐';
  else if(roll < LEGEND_CHANCE + HERO_CHANCE + RARE_CHANCE) targetRare = '⭐⭐⭐';
  else targetRare = '⭐⭐';

  // 해당 등급 중 미획득 나비 필터
  let pool = available.filter(b=>b.rare===targetRare);
  // 해당 등급 없으면 일반으로 폴백
  if(!pool.length) pool = available.filter(b=>b.rare==='⭐⭐');
  if(!pool.length) pool = available; // 최후 폴백
  
  const chosen = pool[Math.floor(Math.random()*pool.length)];
  owned.push(chosen.id);
  localStorage.setItem('wd-butterflies', JSON.stringify(owned));
  return chosen;
}

function switchBook(name) {
  if(name==='내 단어장'){
    S.currentBook='내 단어장'; S.idx=0; S.flip=false;
    sv(); cm(); go('mybooks');
    return;
  }
  const book = S.books.find(b=>b.name===name);
  if(!book) return;
  // 현재 단어장 저장
  saveCurrentBook();
  // 새 단어장으로 전환
  S.words=[...book.words];
  S.markMap={...book.markMap};
  S.srsMap={...book.srsMap};
  S.learned=new Set(book.learned||[]);
  S.currentBook=name;
  S.idx=0; S.flip=false;
  sv(); cm(); go('mybooks');
  toast(`📚 "${name}"으로 전환!`);
}

function saveCurrentBook() {
  if(S.currentBook==='내 단어장') return; // 기본 단어장은 S.words에 바로 저장
  const idx=S.books.findIndex(b=>b.name===S.currentBook);
  if(idx>=0){
    S.books[idx].words=[...S.words];
    S.books[idx].markMap={...S.markMap};
    S.books[idx].srsMap={...S.srsMap};
    S.books[idx].learned=[...S.learned];
  }
}

function createBook() {
  const name=document.getElementById('new-book-name')?.value.trim();
  if(!name){toast('단어장 이름을 입력하세요');return;}
  if(name==='내 단어장'||S.books.find(b=>b.name===name)){toast('이미 있는 이름');return;}
  S.books.push({name,words:[],markMap:{},srsMap:{},learned:[]});
  sv();
  toast(`✅ "${name}" 단어장 생성!`);
  showBooksModal();
}

function deleteBook(name) {
  if(!confirm(`"${name}" 단어장을 삭제할까요?`)) return;
  S.books=S.books.filter(b=>b.name!==name);
  if(S.currentBook===name){
    S.currentBook='내 단어장'; S.idx=0;
  }
  sv();
}

function srsFeedback(en, quality) {
  // SM-2 알고리즘 기반
  if(!S.srsData) S.srsData={};
  if(!S.srsData[en]) S.srsData[en]={reps:0,ef:2.5,interval:1};
  const d=S.srsData[en];

  if(quality<3) {
    // 틀린 경우: 내일 다시
    d.reps=0; d.interval=1;
    setMark(en,2); // 헷갈리는으로 마크
  } else {
    // 맞은 경우: SM-2 공식
    d.reps++;
    if(d.reps===1) d.interval=1;
    else if(d.reps===2) d.interval=6;
    else d.interval=Math.round(d.interval*d.ef);
    // EF 업데이트
    d.ef=Math.max(1.3, d.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    if(getMark(en)===2) setMark(en,0); // 헷갈리는 → 미분류
  }

  if(!S.srsReps) S.srsReps={};
  S.srsReps[en]=(S.srsReps[en]||0)+1;
  srsRate(en, d.interval);
}

function srsRate(en, days) {
  const next=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  S.srsMap[en]=next; sv();
}

  </div>`;
  const tabs=`<div class="stabs">${[['learn','📚','플래시카드'],['quiz3','🎯','퀴즈'],['modes','🎧','암기모드'],['add','➕','단어추가'],['list','📋','단어목록']].map(([id,ic,lb])=>
    `<div class="st ${S.stab===id?'on':''}" onclick="go('mybooks','${id}')"><span class="st-ic">${ic}</span><span class="st-lb ${S.stab===id?'on':''}">${lb}</span></div>`).join('')}</div>`;
  if(S.stab==='learn') return booksBar+tabs+rLearn();
  if(S.stab==='quiz3') return booksBar+tabs+rQuiz3();
  if(S.stab==='modes') return booksBar+tabs+rModes();
  if(S.stab==='market') return rMarket();
  if(S.stab==='add')   return booksBar+tabs+rAdd();
  if(S.stab==='list')  return booksBar+tabs+rList();
  return booksBar+tabs+rList();
}

function selectBookAndLearn(bookName) {
  if(bookName === '내 단어장') {
    S.currentBook = '내 단어장';
  } else {
    switchBook(bookName);
  }
  // 바로 플래시카드로 이동 (단순화)
  S.stab = 'learn';
  S.idx = 0; S.flip = false;
  go('mybooks','learn');
}

  html += '<span style="font-size:16px;color:var(--text3,#9CA3AF)">›</span></div>';

  html += '</div>';
  return html;

function startGameWithSettings(gameId) {
  S._prevTab = S.tab; // 현재 탭 저장 → 나가기 시 복귀
  const gs = S.gameSettings||{count:10,markFilter:-1,dir:0,autoMark:true,autoNext:false};

  // 현재 선택된 단어장 + 시스템 단어장 모두 포함
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const sysW = S._sysWords||[];
  const allWords = curWords.length ? curWords : sysW;

  if(!allWords.length) {
    toast('단어가 없어요! 단어장에 단어를 추가하거나 마켓에서 가져와주세요.');
    go('mybooks','market');
    return;
  }

  const _mm = getCurrentBookMarkMap ? getCurrentBookMarkMap() : (S.markMap||{});
  let src = allWords;
  if(gs.markFilter === -2) {
    src = allWords.filter(w=>(_mm[w.en]||0) !== 1); // 외운단어 제외
  } else if(gs.markFilter>=0) {
    src = allWords.filter(w=>(_mm[w.en]||0) === gs.markFilter);
  }
  if(!src.length) src = allWords;
  startGameW(gameId, pick(src, Math.min(gs.count, src.length)));
}

// 현재 선택된 단어장 단어 반환
function getCurrentBookWords() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.words;
  // 일반 단어장 + 마켓 단어장 모두 검색
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  if(bk && (bk.words||[]).length) return bk.words;
  // S.words에서 찾기 (내 단어장 기본)
  return S.words.length ? S.words : [];
}

// 현재 선택된 단어장 마크맵 반환
function getCurrentBookMarkMap() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.markMap||{};
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.markMap||{}) : S.markMap||{};
}
