<style>
/* 모달 컨테이너가 비어있으면 클릭을 통과시킴 (빈 모달이 화면 클릭을 가로채는 버그 방지) */
#mr:empty { pointer-events: none !important; }
/* ── 꽃밭 테마 배경 ── */
:root {
  /* ── 라이트 테마 (기본) ── */
  --bg: #F8FAFC;
  --bg2: #F1F5F9;
  --bg-card: #FFFFFF;
  --bg-sub: #F3F4F6;
  --bg-nav: #FFFFFF;
  --bg-page: #F8FAFC;
  --border: #E5E7EB;
  --text1: #111827;
  --text2: #374151;
  --text3: #9CA3AF;
  --accent: #111827;
  --accent2: #374151;
  --point: #1E5FA5;
  /* 학습/게임 패널 */
  --panel-bg: #F4F6F8;
  --panel-card: #FFFFFF;
  --panel-border: #E2E8F0;
  --panel-text1: #0F172A;
  --panel-text2: #475569;
  --panel-text3: #94A3B8;
  --panel-muted: #FFFFFF;
  /* 헤더 */
  --hd-bg: linear-gradient(160deg,#2E7D32 0%,#388E3C 40%,#43A047 100%);
  --hd-title: #FFFFFF;
  --hd-sub: rgba(255,255,255,.85);
  --hd-xp: #1565C0;
  --hd-border: rgba(255,255,255,.8);
}
/* ── 다크 테마 ── */
[data-theme="dark"] {
  --bg: #0D0D14;
  --bg2: #12121A;
  --bg-card: #1A1A26;
  --bg-sub: #16161E;
  --bg-nav: #12121A;
  --bg-page: #0D0D14;
  --border: rgba(255,255,255,.08);
  --text1: #F1F5F9;
  --text2: #CBD5E1;
  --text3: #64748B;
  --accent: #F1F5F9;
  --accent2: #CBD5E1;
  --point: #60A5FA;
  --panel-bg: #0D0D14;
  --panel-card: #1A1A26;
  --panel-border: rgba(255,255,255,.07);
  --panel-text1: #F1F5F9;
  --panel-text2: #94A3B8;
  --panel-text3: #64748B;
  --panel-muted: rgba(255,255,255,.04);
  --hd-bg: linear-gradient(160deg,#0A0A14 0%,#0F0F1E 100%);
  --hd-title: #F1F5F9;
  --hd-sub: #94A3B8;
  --hd-xp: #FCD34D;
  --hd-border: var(--panel-muted,rgba(0,0,0,.06));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1505;
    --bg2: #221C08;
    --bg-card: #2A2210;
    --bg-sub: #221C08;
    --border: #3D3010;
    --text1: #F5E6C0;
    --text2: #D4B870;
    --text3: #9A8040;
  }
  body { background: var(--bg) !important; }
  #app { background: var(--bg) !important; }
}
body { background: var(--bg) !important; }
#app { background: var(--bg) !important; }
.pad { background: var(--bg) !important; }
/* 카드 기본 배경 */
.modal { background: var(--bg-card) !important; }
/* nav 배경 */
.nav { background: var(--bg-card) !important; border-top: 1.5px solid var(--border) !important; }
/* 헤더 유지 (성향색) */

/* 캐릭터 미세 움직임 */
@keyframes comboFlash {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.5); }
  30%  { opacity:1; transform:translate(-50%,-60%) scale(1.2); }
  70%  { opacity:1; transform:translate(-50%,-70%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-90%) scale(.9); }
}
@keyframes bfAppear {
  0%   { opacity:0; transform:scale(0.5) rotate(-10deg); }
  60%  { opacity:1; transform:scale(1.1) rotate(3deg); }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes float {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  33%      { transform: translateY(-5px) rotate(0.5deg); }
  66%      { transform: translateY(-3px) rotate(-0.5deg); }
}
@keyframes float-sad {
  0%,100% { transform: translateY(0px) rotate(-1deg) scale(0.98); }
  50%      { transform: translateY(-2px) rotate(1deg) scale(0.97); }
}
@keyframes float-angry {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  20%      { transform: translateY(-1px) rotate(1.5deg); }
  40%      { transform: translateY(1px) rotate(-1.5deg); }
  60%      { transform: translateY(-1px) rotate(1deg); }
  80%      { transform: translateY(0px) rotate(-1deg); }
}
@keyframes float-happy {
  0%,100% { transform: translateY(0px) scale(1) rotate(0deg); }
  25%      { transform: translateY(-7px) scale(1.02) rotate(1deg); }
  50%      { transform: translateY(-5px) scale(1.01) rotate(-0.5deg); }
  75%      { transform: translateY(-8px) scale(1.02) rotate(0.5deg); }
}
@keyframes float-danger {
  0%,100% { transform: translateY(0px) scale(0.96) rotate(-1deg); }
  50%      { transform: translateY(2px) scale(0.95) rotate(1deg); }
}
@keyframes wiggle {
  0%,100% { transform: rotate(0deg); }
  25%      { transform: rotate(-2deg); }
  75%      { transform: rotate(2deg); }
}
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.025); }
}
@keyframes antenna-wave {
  0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
  50%      { transform: rotate(3deg); transform-origin: bottom center; }
}
@keyframes tail-wag {
  0%,100% { transform: rotate(0deg); }
  33%      { transform: rotate(2deg); }
  66%      { transform: rotate(-2deg); }
}
.char-float        { animation: float 3.5s ease-in-out infinite; }
.char-float-happy  { animation: float-happy 2.8s ease-in-out infinite; }
.char-float-sad    { animation: float-sad 5s ease-in-out infinite; }
.char-float-angry  { animation: float-angry 1.6s ease-in-out infinite; }
.char-float-danger { animation: float-danger 6s ease-in-out infinite; }
.char-wiggle       { animation: wiggle 2.5s ease-in-out infinite; }
.char-breathe      { animation: breathe 4s ease-in-out infinite; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg,var(--bg,#FFFFFF));display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:430px;height:100%;height:100svh;height:-webkit-fill-available;background:var(--bg,var(--bg,#FFFFFF));display:flex;flex-direction:column;overflow:hidden;position:relative}
.hd{background:var(--hd-bg,linear-gradient(160deg,#2E7D32 0%,#388E3C 40%,#43A047 100%));padding:calc(env(safe-area-inset-top,0px) + 4px) 0 0!important;flex-shrink:0;box-shadow:0 1px 0 var(--hd-border,rgba(255,255,255,.8)),0 4px 20px rgba(0,0,0,.08);position:relative;overflow:visible;border-bottom:1px solid var(--hd-border,rgba(0,0,0,.06))}
.hd-row{display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin-bottom:2px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:visible;-webkit-overflow-scrolling:touch;width:100%;position:relative;padding-bottom:70px}
.body::-webkit-scrollbar{display:none}
/* ── 나비 날갯짓 애니메이션 ── */
@keyframes bf-fly {
  0%,100%{transform:translateY(0) rotate(-15deg) scaleX(1);}
  25%{transform:translateY(-4px) rotate(-20deg) scaleX(.85);}
  50%{transform:translateY(-7px) rotate(-12deg) scaleX(1);}
  75%{transform:translateY(-3px) rotate(-18deg) scaleX(.9);}
}
@keyframes bf-fly2 {
  0%,100%{transform:translateY(0) rotate(8deg) scaleX(1);}
  30%{transform:translateY(-5px) rotate(12deg) scaleX(.8);}
  60%{transform:translateY(-8px) rotate(5deg) scaleX(1);}
  80%{transform:translateY(-2px) rotate(10deg) scaleX(.88);}
}
@keyframes bf-drift {
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(3px);}
}
.hd-bf1{animation:bf-fly 2.8s ease-in-out infinite,bf-drift 4s ease-in-out infinite;display:inline-block;transform-origin:center;}
.hd-bf2{animation:bf-fly2 3.3s ease-in-out infinite,bf-drift 5s ease-in-out infinite reverse;display:inline-block;transform-origin:center;}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2;transition:transform .15s}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.ni.on{background:rgba(30,95,165,.10);border-radius:12px}
.ni.on .ni-ic{transform:scale(1.25);filter:drop-shadow(0 1px 2px rgba(30,95,165,.4))}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px 16px 120px;display:flex;flex-direction:column;gap:12px;width:100%;box-sizing:border-box}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:flex-end;justify-content:center;pointer-events:all}
@keyframes float-bf{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-4px) rotate(1deg)}50%{transform:translateY(-2px) rotate(-1deg)}75%{transform:translateY(-5px) rotate(2deg)}}
@keyframes float-char{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03)}}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
/* ── 테마: 크림 라이트 (기본) ── */
body, body.theme-light {
  --bg:       #FAF8F5;
  --bg-card:  #FFFFFF;
  --bg-sub:   #F2F0EC;
  --bg-input: #FFFFFF;
  --bg-nav:   #FFFFFF;
  --text1:    #1A1A2E;
  --text2:    #4A5568;
  --text3:    #9CA3AF;
  --border:   #E8E4DE;
  --border2:  #D1CCC4;
  --btn-gray: #F2F0EC;
  --btn-gray-t:#4A5568;
  --shadow:   rgba(0,0,0,0.06);
}
body{background:var(--bg);color:var(--text1)}
#app{background:var(--bg)!important}
.body,.pad{background:var(--bg)!important}
.card{background:var(--bg-card)!important;border-color:var(--border)!important}
.nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
.stabs{background:var(--bg-sub)!important}
.bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
input,select,textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
.bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
.modal{background:var(--bg-card)!important}
.mbg .modal{background:var(--bg-card)!important}

/* ── 테마: 차콜 다크 ── */
body.theme-dark {
  --bg:       #1A1A1A;
  --bg-card:  #242424;
  --bg-sub:   #1F1F1F;
  --bg-input: #2C2C2C;
  --bg-nav:   #242424;
  --text1:    #ECECEC;
  --text2:    #A0AEC0;
  --text3:    #64748B;
  --border:   #333333;
  --border2:  #444444;
  --btn-gray: #2C2C2C;
  --btn-gray-t:#A0AEC0;
  --shadow:   rgba(0,0,0,0.4);
}
body.theme-dark{background:var(--bg)!important;color:var(--text1)!important}
body.theme-dark #app{background:var(--bg)!important}
body.theme-dark .hd{background:linear-gradient(135deg,#111,#1E3A5F)!important}
body.theme-dark .body,body.theme-dark .pad{background:var(--bg)!important}
body.theme-dark .card{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
body.theme-dark .stabs{background:var(--bg-sub)!important}
body.theme-dark .st{color:var(--text3)!important}
body.theme-dark .st.on .st-lb{color:#60A5FA!important}
body.theme-dark .bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
body.theme-dark .modal{background:var(--bg-card)!important;color:var(--text1)!important}
body.theme-dark .mbg .modal{background:var(--bg-card)!important}
body.theme-dark h2,body.theme-dark h3,body.theme-dark div{color:inherit}
body.theme-dark .logo{color:#ECECEC!important}

/* ── 폰트 크기 ── */
body.fs-sm{font-size:13px!important}
body.fs-md{font-size:15px!important}
body.fs-lg{font-size:17px!important}
@keyframes hd-flutter{0%{transform:rotate(-7deg) translateY(0px) scale(1);}20%{transform:rotate(5deg) translateY(-5px) scale(1.04);}40%{transform:rotate(-6deg) translateY(1px) scale(0.97);}60%{transform:rotate(6deg) translateY(-4px) scale(1.03);}80%{transform:rotate(-4deg) translateY(1px) scale(0.98);}100%{transform:rotate(-7deg) translateY(0px) scale(1);}}</style>

<body>
<div id="app">
  <div class="hd" id="hd" style="display:none">
    <div class="hd-row" style="display:flex;align-items:center;justify-content:flex-start;gap:0;padding:4px 20px 4px 110px;position:relative;min-height:52px">
      <div id="hd-char-icon" onclick="showLevelModal()" style="width:72px;height:72px;border-radius:14px;overflow:hidden;cursor:pointer;flex-shrink:0;position:absolute;left:24px;bottom:-6px"></div>
      <div style="text-align:left">
        <div style="font-size:18px;font-weight:900;color:var(--hd-title,#FFFFFF);letter-spacing:-.3px;line-height:1.2">Butterfly Word</div>
        <div style="font-size:10px;color:var(--hd-sub,rgba(255,255,255,.85));font-weight:500;margin-top:3px">단어를 외울수록 애벌레가 자라나요 🐛</div>
      </div>
      <button id="poke-btn" onclick="showFriends()" style="display:none">👉 <span id="poke-cnt">0</span></button>
      <div class="lbadge" id="lbadge" style="display:none"></div>

(function(){
  function syncMrPointer(){
    var mr = document.getElementById('mr');
    if(!mr) return;
    mr.style.pointerEvents = (mr.innerHTML.trim().length > 0) ? 'auto' : 'none';
  }
  function initMrObserver(){
    var mr = document.getElementById('mr');
    if(!mr){ setTimeout(initMrObserver, 100); return; }
    syncMrPointer();
    try {
      var obs = new MutationObserver(syncMrPointer);
      obs.observe(mr, { childList: true, subtree: true });
    } catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMrObserver);
  else initMrObserver();
})();

        [440,330].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.25);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};

function charSVG(id, sz=64, mood='normal') {

    shine: 'chars/shine.png',
    small: 'chars/small.png',
    big:   'chars/big.png',
    god:   'chars/god.png',
  };

function checkAttend() {
  const t = today();
  // 오늘 안보기 선택했으면 무조건 스킵
  if(S._noPopupToday === t) return;
  // 오늘 이미 팝업 표시했으면 스킵 (localStorage 기반)
  const shown = localStorage.getItem('wd-aps') || '';
  if(shown === t) return;
  // 출석 처리
  if(!S.attendDates.includes(t)) {
    S.attendDates.push(t);
  }
  // 카운트를 실제 출석일 수와 항상 동기화 (불일치 방지)
  S.attendCount = S.attendDates.length;
  sv();
  // 팝업 표시 여부 저장 (새로고침해도 유지)
  localStorage.setItem('wd-aps', t);
  S.attendPopupShown = t;
  // 팝업은 출석 여부와 무관하게 항상 표시
  showAttendPopup();
}

function logStudy(type) {
  // 하루 공부시간 누적 (매 단어학습마다 약 0.1분 추가)
  const todayKey = new Date().toISOString().slice(0,10);
  if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
  if(type==='words') S._dailyStudiedMin = Math.round(((S._dailyStudiedMin||0) + 0.1)*10)/10;
  else if(type==='quiz') S._dailyStudiedMin = Math.round(((S._dailyStudiedMin||0) + 0.05)*10)/10;
  // 목표 달성 체크
  const goal = S._dailyGoalMin||30;
  const studied = S._dailyStudiedMin||0;
  if(Math.floor(studied) > Math.floor(studied-0.1) && Math.floor(studied) > 0) {
    const pct = Math.round(studied/goal*100);
    const milestone = Math.floor(pct/10)*10;
    if(!S._dailyXpGiven) S._dailyXpGiven={};
    if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
      S._dailyXpGiven[milestone]=true;
      const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
      addXP(xpReward);
      const msg = milestone===100
        ? '🏆 목표 100% 달성! +200XP 🎉'
        : milestone===50
        ? '🎉 목표 50% 달성! +80XP'
        : `⭐ 목표 ${milestone}% 달성! +30XP`;
      toast(msg);
      if(milestone===100) vib([100,50,100,50,200]);
      else vib(50);
    }
  }
  // 헤더 미니 카드 업데이트
  if(typeof updHD==='function') updHD();
  // XP 지급
  const t = today();
  if(!S.studyLog[t]) S.studyLog[t] = {words:0, quiz:0, min:0};
  if(!S.studyLog[t].min) S.studyLog[t].min = 0;
  const _prevCount = S.studyLog[t][type] || 0;
  S.studyLog[t][type]++;
  // XP 지급 (카운트 증가 후 판단)
  if(type==='words') {
    // XP는 외웠음 버튼을 눌렀을 때만 지급 (아래 _doMark, _markBtn 참조)
    checkXpUsable();
  }
  else if(type==='quiz') { addXP(xp('quiz_correct'), true); }
  if(type==='words') { S.studyLog[t].min = Math.round(((S.studyLog[t].min||0)+0.1)*10)/10; S._totalStudyMins = Math.round(((S._totalStudyMins||0)+0.1)*10)/10; }
  else if(type==='quiz') { S.studyLog[t].min = Math.round(((S.studyLog[t].min||0)+0.05)*10)/10; S._totalStudyMins = Math.round(((S._totalStudyMins||0)+0.05)*10)/10; }
  updStreak();
  // 단어 학습 → 배부름 직접 연결 (10개마다 +1)
  if(type==='words') {
    const todayWords = S.studyLog[t].words;
    if(todayWords % 10 === 0) {
      S._petFull = Math.min(10, (S._petFull||5) + 1);
      if(todayWords % 30 === 0) {
        // 30개마다 기분도 +1
        S._petHappy = Math.min(10, (S._petHappy||5) + 1);
      }
      // 벌거지 배부름 토스트 제거됨
      vib([50,30,50]);
    }
  }
  sv();
}

function buildSentenceFromWords(wordList) {
  const candidates=(wordList||S.gWords||[]).filter(w=>w.ex&&w.ex.trim().length>3);
  let chosen=candidates.length>0?rnd(candidates):null;
  if(chosen){
    const sentence=chosen.ex.replace(/[.,!?;:]/g,'').trim();
    const words=sentence.split(/\s+/).filter(w=>w.length>0);
    if(words.length>=3){
      const wrongPool=(wordList||S.gWords||[])
        .filter(w=>w.en!==chosen.en)
        .map(w=>w.en.split(/\s+/)[0])
        .filter(w=>!words.map(x=>x.toLowerCase()).includes(w.toLowerCase()))
        .slice(0,3);
      S.sbS={kr:chosen.kr+'(예문)',en:sentence,words};
      S.sbP=shuf([...words,...wrongPool].slice(0,words.length+2));
      S.sbC=[];S.sbAns=false;S.sbOk=false;return;
    }
  }
  const fallback=[
    {kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing']},
    {kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are']},
    {kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach']},
  ];
  const st=rnd(fallback);
  S.sbS=st;S.sbP=shuf([...st.words,...st.wrong]);S.sbC=[];S.sbAns=false;S.sbOk=false;
}

function shareWordBook(bookName) {
  const words=bookName==='내 단어장'?S.words:((S.books||[]).find(b=>b.name===bookName)?.words||[]);
  if(!words.length){toast('단어가 없어요');return;}

  if(navigator.share){navigator.share({title:'Vocabug - '+bookName,text:bookName+' 단어장 ('+words.length+'개)',url});}
  else{navigator.clipboard?.writeText(url).then(()=>toast('링크 복사 완료!')).catch(()=>toast('복사됨'));}
}

function getTodayWord() {
  const t = new Date().toISOString().slice(0,10);
  const key = 'wd-today-word-' + t;
  let cached = localStorage.getItem(key);
  if(cached) return JSON.parse(cached);
  const pool = (S._sysWords||[]).length ? S._sysWords : S.words;
  if(!pool.length) return null;
  // 날짜 기반 시드로 항상 같은 단어
  let seed = t.replace(/-/g,'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const word = pool[seed % pool.length];
  localStorage.setItem(key, JSON.stringify(word));
  return word;
}

function savePartialGameScore() {
  const gid = S.gameId;
  if(!gid) return;
  // 이미 완료 저장된 게임이면 중복 저장 방지 (rGameDone이 처리함)
  if(S._gameScoreSaved) return;
  // 실제 진행한 문제 = gResultMap 기록 수 (정확). 없으면 gIdx로 폴백
  const _rm = S.gResultMap || {};
  const _rmKeys = Object.keys(_rm);
  let _wc, _r, _w;
  if(_rmKeys.length > 0) {
    _wc = _rmKeys.length;
    _r = _rmKeys.filter(k => _rm[k] !== false).length;
    _w = _rmKeys.filter(k => _rm[k] === false).length;
  } else {
    _wc = S.gIdx || 0;
    if(_wc <= 0) return;
    _r = Math.max(0, Math.min(_wc, Math.round((S.gScore||0)/100)));
    _w = Math.max(0, _wc - _r);
  }
  if(_wc <= 0) return;
  const _t = new Date(Date.now()+9*3600000).toISOString().slice(0,10);
  if(!S.gameDailyCount) S.gameDailyCount={};
  if(!S.gameDailyCount[_t]) S.gameDailyCount[_t]={};
  const _prev = S.gameDailyCount[_t][gid] || {words:0,right:0,wrong:0};
  if(typeof _prev === 'number') {
    S.gameDailyCount[_t][gid] = {words:_prev+_wc, right:_r, wrong:_w};
  } else {
    S.gameDailyCount[_t][gid] = {words:(_prev.words||0)+_wc, right:(_prev.right||0)+_r, wrong:(_prev.wrong||0)+_w};
  }
  if(!S.gamePlayCount) S.gamePlayCount={};
  S.gamePlayCount[gid] = (S.gamePlayCount[gid]||0) + _wc;
  localStorage.setItem('wd-gdc', JSON.stringify(S.gameDailyCount));
  localStorage.setItem('wd-gpc', JSON.stringify(S.gamePlayCount));
  S._gameScoreSaved = true;
}

function saveGameScore(score) {
  if(!S.bestScores) S.bestScores={};
  const gid = S.gameId;
  if(!gid) return;
  // 최고 점수 저장
  if(!S.bestScores[gid] || score > S.bestScores[gid]) {
    S.bestScores[gid] = score;
    localStorage.setItem('wd-bs', JSON.stringify(S.bestScores));
  }
  // 게임별 단어 수: gResultMap 기록이 있으면 그 수, 없으면 gWords 길이
  const _rm = S.gResultMap || {};
  const _rmKeys = Object.keys(_rm);
  const _wc = _rmKeys.length > 0 ? _rmKeys.length : ((S.gWords||[]).length || 0);
  // 맞은/틀린 수: 정답 기록(gResultMap)이 있으면 정확히 계산, 없으면 점수 기반 추정
  let _right, _wrong;
  if(_rmKeys.length > 0) {
    // 정확: gResultMap에서 true=정답, false=오답 집계
    _right = _rmKeys.filter(k => _rm[k] !== false).length;
    _wrong = _rmKeys.filter(k => _rm[k] === false).length;
  } else {
    // 폴백: 점수 기반 추정 (정답당 100점 가정), 범위 보정
    _right = Math.max(0, Math.min(_wc, Math.round(score/100)));
    _wrong = Math.max(0, _wc - _right);
  }
  if(!S.gamePlayCount) S.gamePlayCount={};
  S.gamePlayCount[gid] = (S.gamePlayCount[gid]||0) + _wc;
  const _gt = new Date(Date.now()+9*3600000).toISOString().slice(0,10);
  if(!S.gameDailyCount) S.gameDailyCount={};
  if(!S.gameDailyCount[_gt]) S.gameDailyCount[_gt]={};
  const _prev = S.gameDailyCount[_gt][gid] || {words:0,right:0,wrong:0};
  if(typeof _prev === 'number') {
    S.gameDailyCount[_gt][gid] = {words:_prev+_wc, right:_right, wrong:_wrong};
  } else {
    S.gameDailyCount[_gt][gid] = {words:(_prev.words||0)+_wc, right:(_prev.right||0)+_right, wrong:(_prev.wrong||0)+_wrong};
  }
  localStorage.setItem('wd-gpc', JSON.stringify(S.gamePlayCount));
  localStorage.setItem('wd-gdc', JSON.stringify(S.gameDailyCount));
  // XP 계산
  const xpTable = GAME_XP[gid] || {base:10, perfect:20};
  const words = (S.gWords||[]).length || 1;
  const right = _right;
  const pct = Math.round(right/words*100);
  let xpGain = xpTable.base;
  if(pct===100) xpGain = xpTable.perfect;
  else if(pct>=80) xpGain = Math.round(xpTable.base*1.5);
  const streak = S.streak||0;
  const _spd1 = (window._XPC?.streak_per_day??0.02);
  let mult = 1.0 + streak * _spd1;
  xpGain = Math.round(xpGain * mult);
  if(xpGain>0) earnXP(xpGain, '게임 완료');
  sv();
}

  if(!amount || amount<=0) return;

// 테스트 결과 XP
function earnTestXP(pct) {
  let base = 0;
  if(pct===100) base=xp('test_100');
  else if(pct>=90) base=xp('test_90');
  else if(pct>=80) base=xp('test_80');
  else if(pct>=60) base=xp('test_60');
  const streak=S.streak||0;
  const _spd2 = (window._XPC?.streak_per_day??0.02);
  const mult=1.0 + streak * _spd2;
  const total = Math.round(base*mult);
  if(total>0) earnXP(total, '테스트 통과');
}

function downloadButterflyCard(bId) {
  const b = BUTTERFLY_LIST.find(x=>x.id===bId);
  if(!b) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d');
  // 배경
  ctx.fillStyle = b.bg || '#F9FAFB';
  ctx.roundRect(0,0,400,560,20);
  ctx.fill();
  // 헤더 색상 배경
  ctx.fillStyle = b.color || '#7C3AED';
  ctx.roundRect(0,0,400,200,20);
  ctx.fill();
  ctx.fillRect(0,180,400,20);
  // 나비 이모지
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦋', 200, 120);
  // 이름
  ctx.fillStyle = 'white';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(b.name, 200, 165);
  ctx.font = '14px sans-serif';
  ctx.fillText(b.en, 200, 188);
  // 정보
  ctx.fillStyle = '#374151';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(b.rare + ' · ' + b.score + '점', 20, 230);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#6B7280';
  ctx.fillText('서식지: ' + (b.habitat||'-'), 20, 255);
  ctx.fillText('상태: ' + (b.status||'-'), 20, 275);
  // 이야기
  ctx.fillStyle = '#374151';
  ctx.font = '12px sans-serif';
  const words = (b.story||'').split(' ');
  let line='', y=310;
  words.forEach(w=>{
    const test=line+w+' ';
    if(ctx.measureText(test).width>360&&line){
      ctx.fillText(line,20,y); line=w+' '; y+=18;
    } else line=test;
  });
  if(line) ctx.fillText(line,20,y);
  // 보호 메시지
  ctx.fillStyle = '#16A34A';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🌿 ' + (b.protect||'').slice(0,50), 20, 460);
  // 앱 이름
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Butterfly Word', 200, 540);
  // 다운로드
  const a = document.createElement('a');
  a.download = 'butterfly-' + b.id + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('카드 저장됨! 🦋');
}

    html += '</div>';
    if(hasMore) {
      const remaining = total - shownCount;

  if(!S._ownedPacks) S._ownedPacks = [];
  if(S._ownedPacks.includes(packId)) { toast('이미 보유 중이에요'); return; }
  // 단어 아직 안 로드됐으면 먼저 로드
  if(!pk.words || !pk.words.length) {
    const wordCount = pk._wordCount || pk.count || 0;
    document.getElementById('mr').innerHTML = `<div class="mbg"><div class="modal" style="text-align:center">
      <div style="font-size:32px;margin-bottom:12px">⏳</div>

        <div style="height:100%;width:60%;background:#1E5FA5;border-radius:10px;animation:pulse 1s infinite"></div>
      </div>
    </div></div>`;

    <div style="font-size:36px;margin-bottom:12px">${pk.emoji||'📦'}</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">${pk.name}</div>
    <div style="font-size:13px;color:var(--text3,#6B7280);margin-bottom:20px">${words.length}개 단어를 내 단어장에 추가할까요?</div>
    <div style="display:flex;gap:8px">
      <button onclick="cm()" style="flex:1;padding:12px;background:var(--bg-sub,#F3F4F6);border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--text2,#374151)">취소</button>
      <button onclick="cm();_doBuyPack('${packId}')" style="flex:1;padding:12px;background:#1E5FA5;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">추가</button>
    </div>
  </div></div>`;
}

function _doBuyPack(packId) {
  const pk = (S._marketPacks||[]).find(p=>p.id===packId);
  if(!pk) return;
  const words = pk.words||[];
  if(!S._ownedPacks) S._ownedPacks = [];
  if(!S.books) S.books = [];
  const existing = S.books.find(b=>b.name===pk.name);
  if(existing) {
    const newW = words.filter(w=>!existing.words.find(x=>x.en===w.en));
    existing.words = [...existing.words, ...newW];
  } else {
    S.books.push({ name:pk.name, emoji:pk.emoji||'📦', words:[...words], markMap:{}, srsMap:{}, learned:[], fromMarket:true, packId:packId });
  }
  S._ownedPacks.push(packId);
  if(typeof db !== 'undefined' && S.user?.uid) {
    db.collection('user_packs').doc(S.user.uid).set({owned:S._ownedPacks},{merge:true}).catch(()=>{});
  }
  sv();
  toast('✅ '+pk.name+' 추가! 단어장에서 확인하세요 📚');
  vib([100,50,100]);
  SFX.play('levelup');
  go('mybooks','market');
}

  S._ownedPacks = S._ownedPacks.filter(id=>id!==packId);
  if(S.books) S.books = S.books.filter(b=>b.packId!==packId && b.name!==name);

    db.collection('user_packs').doc(S.user.uid).set({owned: S._ownedPacks}, {merge: true}).catch(()=>{});

function changeNickname() {
  const v = document.getElementById('cnk')?.value.trim();
  if(!v) { toast('닉네임을 입력해주세요'); return; }
  if(v.length < 2 || v.length > 12) { toast('닉네임은 2~12자로 해주세요'); return; }

  // 복사왕 특수 처리
  if(v === '복사왕') {
    // 복사왕은 특수 계정만 사용 가능
    const uid = firebase?.auth?.()?.currentUser?.uid||'';
    if(!uid || uid !== '627everyday_admin') {
      toast('이 닉네임은 사용할 수 없어요 🚫'); return;
    }
    // 복사왕 → 나비 30종 전체 획득
    const allIds = BUTTERFLY_LIST.map(b=>b.id);
    localStorage.setItem('wd-butterflies', JSON.stringify(allIds));
    S.nick = v; sv();
    toast('👑 복사왕! 나비 30종 전체 획득!'); vib([100,50,200]);
    go(); return;
  }

  // 중복 체크 (Firestore)
  if(typeof db !== 'undefined') {
    db.collection('users').where('nick','==',v).get().then(snap=>{
      const taken = snap.docs.some(d=>d.id !== (firebase?.auth?.()?.currentUser?.uid||''));
      if(taken) { toast('이미 사용 중인 닉네임이에요 😅'); return; }
      S.nick=v; sv();
      // Firestore에도 업데이트
      const uid=firebase?.auth?.()?.currentUser?.uid;
      if(uid) db.collection('users').doc(uid).set({nick:v},{merge:true});
      toast('닉네임 변경! ✅'); go();
    }).catch(()=>{ S.nick=v; sv(); toast('닉네임 변경!'); go(); });
  } else {
    S.nick=v; sv(); toast('닉네임 변경!'); go();
  }
}

        <button onclick="window._pomToggle&&window._pomToggle()" style="flex:2;background:${running?'#FEF2F2':'#E65100'};color:${running?'#DC2626':'#fff'};border:${running?'1.5px solid #FECDD3':'none'};border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer">${running?'⏸ 일시정지':'▶ 시작'}</button>
        <button onclick="window._pomReset&&window._pomReset()" style="flex:1;background:var(--bg-sub,var(--bg-sub,#F3F4F6));color:var(--text2,var(--text2,#374151));border:1.5px solid var(--border,var(--border,#E5E7EB));border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">🔄 초기화</button>
      </div>
      <button onclick="if(window._pomInterval)clearInterval(window._pomInterval);cm()" style="width:100%;background:none;border:none;color:var(--text3,var(--text3,#9CA3AF));font-size:13px;cursor:pointer;padding:12px 0 0">닫기</button>
    </div></div>`;
  };
  window._pomReset = ()=>{
    if(interval)clearInterval(interval);
    running=false; interval=null;
    mins=window._pomMins||25; secs=0;
    render();
  };
  window._pomToggle = ()=>{
    if(running){
      clearInterval(interval); interval=null; running=false; render();
    } else {
      running=true;
      interval=setInterval(()=>{
        if(secs===0){if(mins===0){
          clearInterval(interval); running=false;
          SFX.play('levelup'); vib([200,100,200,100,400]);

      },1000);

  window._pomMins=25;
  render();
}

function downloadWordCard(en) {
  const w = S.words.find(x=>x.en===en);
  if(!w) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 240;
  const ctx = canvas.getContext('2d');
  // 배경
  const grad = ctx.createLinearGradient(0,0,400,240);
  const petCol = PET_COLORS[getPetColor()]||PET_COLORS.green;
  grad.addColorStop(0, petCol.main);
  grad.addColorStop(1, petCol.main+'88');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,400,240,20);
  ctx.fill();
  // 앱 이름
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('🦋 Butterfly Word', 20, 30);
  // 이모지
  ctx.font = '48px sans-serif';
  ctx.fillText(w.img||'📝', 300, 80);
  // 영어 단어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.fillText(w.en, 24, 80);
  // 발음
  if(w.ph) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '16px sans-serif';
    ctx.fillText(w.ph, 24, 110);
  }
  // 한국어
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(w.kr, 24, 150);
  // 예문
  if(w.ex) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px sans-serif';
    const ex = w.ex.length>40 ? w.ex.slice(0,40)+'...' : w.ex;
    ctx.fillText('"'+ex+'"', 24, 185);
  }
  // 마킹
  const mark = getMark(en);
  const markEmojis = ['○','✅','🦋'];
  ctx.font = '18px sans-serif';
  ctx.fillText(markEmojis[mark]||'○', 24, 220);
  // 날짜
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('ko-KR'), 300, 220);
  // 다운로드
  const a = document.createElement('a');
  a.download = en+'-card.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('📸 단어 카드 저장!');
}

async function loadMarketPacks() {
  const localPacks = typeof WORD_PACKS !== 'undefined' ? WORD_PACKS : [];
  if(typeof db === 'undefined') { S._marketPacks = localPacks; return; }
  const done = (packs) => {
    S._marketPacks = packs.length ? packs : localPacks.length ? localPacks : [];
    S._marketPacksFullLoaded = new Set();
    console.log('[마켓] 완료:', S._marketPacks.length+'개');
  };
  try {
    const snap = await Promise.race([
      db.collection('packs').get(),
      new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))
    ]);
    const fbPacks = snap.docs
      .map(d=>{ const data=d.data(); const wc=(data.words||[]).length||data.count||0; const {words,...meta}=data; return {id:d.id,...meta,_wordCount:wc,words:[]}; })
      .filter(p=>p.active!==false&&p.name);
    const fbIds = new Set(fbPacks.map(p=>p.id));
    const localOnly = localPacks.filter(p=>!fbIds.has(p.id));
    done([...fbPacks, ...localOnly]);
  } catch(e) {
    console.warn('[마켓] 실패, 로컬:', e.message);
    done(localPacks);
  }
}
async function loadPackWords(packId) {
  if(!S._marketPacksFullLoaded) S._marketPacksFullLoaded = new Set();
  if(S._marketPacksFullLoaded.has(packId)) return true;
  const pk = (S._marketPacks||[]).find(p=>p.id===packId);
  if(!pk) return false;
  if(pk.words && pk.words.length > 0) { S._marketPacksFullLoaded.add(packId); return true; }
  try {
    const doc = await db.collection('packs').doc(packId).get();
    if(doc.exists) {
      pk.words = doc.data().words || [];
      S._marketPacksFullLoaded.add(packId);
      return true;
    }
  } catch(e) { console.warn('팩 로드 실패:', packId, e.message); }
  return false;
}

function checkStudyHourReward() {
  if(!S._studyStartTime) return;
  const elapsed = Date.now() - S._studyStartTime;
  const hours = Math.floor(elapsed / 3600000);
  const lastReward = S._studyHourReward||0;
  if(hours > lastReward) {
    S._studyHourReward = hours;
    sv();
    // 가치 50점 이하 나비 랜덤 (일반⭐⭐ 또는 희귀⭐⭐⭐)

  ctx.fillStyle = l.color||'#F9A825';
  ctx.roundRect(75,10,150,30,15);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(l.emoji+' '+l.name, 150, 31);
  
  // 캐릭터 SVG 렌더
  const img = new Image();
  const svgBlob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = ()=>{
    ctx.drawImage(img, 50, 50, size, size);
    URL.revokeObjectURL(url);
    
    // 장식품
    if(accEmoji) {
      ctx.font = `${Math.round(size*0.3)}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(accEmoji, 150, 85);
    }
    
    // 닉네임
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(S.nick||'나의 캐릭터', 150, 285);
    
    // XP / 스트릭
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '13px sans-serif';
    ctx.fillText('⚡ '+S.xp+'XP  🔥 '+S.streak+'일', 150, 308);
    
    // 워터마크
    ctx.fillStyle = '#D1D5DB';
    ctx.font = '11px sans-serif';
    ctx.fillText('Butterfly Word', 150, 345);
    
    // 다운로드
    const a = document.createElement('a');
    canvas.toBlob((blob)=>{
      if(!blob){ toast('이미지 생성 실패'); return; }
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `butterfly_${l.name}_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      toast('📸 캐릭터 이미지 저장됨!');
    }, 'image/png');
  };
  img.onerror = ()=>{ toast('이미지 생성 실패. 다시 시도해주세요.'); };
  img.src = url;
}

// ── 전역 학습 타이머 ──
const _LT = {
  elapsed: 0,       // 경과 초
  goal: 0,          // 목표 초 (0=무제한)
  running: false,
  interval: null,

  start() {
    if(this.running) return;
    this.running = true;
    if(!this._startTime) this._startTime = Date.now() - this.elapsed*1000;
    this.interval = setInterval(()=>{
      this.elapsed = Math.floor((Date.now()-this._startTime)/1000);
      this._updateUI();
      // 헤더 미니 카드도 업데이트
      // updHD는 XP/공부바만 업데이트 (hd 전체 재렌더 방지)
      if(typeof updHD==='function') {
        const _t2=new Date(Date.now()+9*3600000).toISOString().slice(0,10);
        const _tl2=(S.studyLog||{})[_t2]||{};
        const _studied=_tl2.min||0;
        const _goal=S._dailyGoalMin||60;
        const _pct=_goal>0?Math.min(100,Math.round(_studied/_goal*100)):0;
        const xpLbl=document.getElementById('xp-label');
        if(xpLbl) { const nx=(S.xp||0)+' XP'; if(xpLbl.textContent!==nx) xpLbl.textContent=nx; }
        const xpFill=document.getElementById('xpfill');
        if(xpFill) { const nw=Math.min(100,Math.round((S.xp||0)/((typeof LEVELS!=='undefined'?LEVELS.find(lx=>lx.id===S.lid):null)?.xp||100)*100))+'%'; if(xpFill.style.width!==nw) xpFill.style.width=nw; }
        const txtEl=document.getElementById('study-mini-text');
        const nt=_studied.toFixed(1)+' / '+_goal+'분';
        if(txtEl && txtEl.textContent!==nt) txtEl.textContent=nt;
        const fillEl=document.getElementById('study-mini-fill');
        const nfW=_pct+'%';
        if(fillEl && fillEl.style.width!==nfW) fillEl.style.width=nfW;
        const pctEl=document.getElementById('study-mini-pct');
        const np=_pct+'%';
        if(pctEl && pctEl.textContent!==np) pctEl.textContent=np;
        // 오늘 요약 우측 업데이트
        const sumEl=document.getElementById('hd-today-sum');
        if(sumEl) { const _w=_tl2.words||0; const _mStr=_studied>=1?Math.round(_studied)+'분':_studied>0?Math.round(_studied*60)+'초':'0'; const ns=`<div style="font-size:13px;font-weight:900;color:var(--hd-xp,#1565C0);line-height:1">${_w.toLocaleString()}단어</div><div style="font-size:9px;color:var(--hd-sub,#2E7D32);margin-top:2px">${_mStr} 학습</div>`; if(sumEl.innerHTML!==ns) sumEl.innerHTML=ns; }
      }
      // 하루 공부시간 연동 (1분마다)
      if(this.elapsed > 0 && this.elapsed % 60 === 0) {
        const todayKey = new Date().toISOString().slice(0,10);
        if(S._dailyDate !== todayKey) { S._dailyStudiedMin=0; S._dailyDate=todayKey; }
        S._dailyStudiedMin = (S._dailyStudiedMin||0) + 1;
        const goal=S._dailyGoalMin||30, studied=S._dailyStudiedMin||0;
        const pct=Math.round(studied/goal*100);
        // 10%마다 XP 지급 (각 구간 1회만)
        if(!S._dailyXpGiven) S._dailyXpGiven={};
        const milestone = Math.floor(pct/10)*10;
        if(milestone>0 && milestone<=100 && !S._dailyXpGiven[milestone]) {
          S._dailyXpGiven[milestone]=true;
          const xpReward = milestone===100 ? 200 : milestone===50 ? 80 : 30;
          addXP(xpReward);
          const msg = milestone===100
            ? '🏆 목표 100% 달성! +200XP 🎉'
            : milestone===50
            ? '🎉 목표 50% 달성! +80XP'
            : `⭐ 목표 ${milestone}% 달성! +30XP`;
          toast(msg);
          if(milestone===100) vib([100,50,100,50,200]);
          else if(milestone===50) vib([50,30,100]);
          else vib(50);
        }
        const rem=Math.max(0,goal-studied);
        if(rem>0 && rem%10===0 && rem<goal) toast('⏱ 목표까지 '+rem+'분 남았어요!');
        sv();
      }
      // 세션 목표 달성
      if(this.goal > 0 && this.elapsed >= this.goal) {
        this.stop();
        toast('🎉 목표 시간 달성! 수고했어요!');
        vib([100,50,100,50,200]);
      }
    }, 1000);
  },

  stop() {
    this.running = false;
    clearInterval(this.interval);
    this.interval = null;
  },

  reset() {
    this.stop();
    this.elapsed = 0;
    this._startTime = null;
    this._updateUI();
  },

  fmt(s) {
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  },

  _updateUI() {
    document.querySelectorAll('._lt-display').forEach(el=>{
      const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
      const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:800;color:${color};font-family:monospace">${this.fmt(this.elapsed)}</div>
          ${this.goal>0?`<div style="font-size:10px;color:var(--panel-text3,#9CA3AF)">/ ${this.fmt(this.goal)}</div>`:''}
          <button onclick="showTimerSettings()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:3px 8px;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer">⏱</button>
        </div>
        ${this.goal>0?`<div style="background:rgba(255,255,255,.12);border-radius:2px;height:2px;overflow:hidden;margin-top:3px"><div style="height:100%;background:${color};width:${pct}%;transition:width .5s"></div></div>`:''}
      `;
    });
  },

  barHTML() {
    const pct = this.goal>0 ? Math.min(100, Math.round(this.elapsed/this.goal*100)) : 0;
    const color = this.goal>0 && pct>=100 ? '#34D399' : this.goal>0 && pct>=80 ? '#FBBF24' : '#63B3ED';
    return `<div class="_lt-display" style="min-width:80px"></div>`;
  }
};

// ── 암기 체크 버튼 XP 처리 ──
window._markBtnXP = function(wordEn, val) {
  const prevMark = getMark(wordEn);
  setMark(wordEn, val);
  // 외웠음(1)으로 새로 표시할 때만 XP 지급
  if(val === 1 && prevMark !== 1) {
    const _t = typeof today==='function'?today():new Date().toISOString().slice(0,10);
    const _pc = S.studyLog?.[_t]?.words || 0;
    if(_pc === 0) addXP(xp('daily_first'));
    else addXP(xp('word_learn'));
    logStudy('words');
  }
};

// ── 암기 체크 버튼 ──
function _markBtn(wordEn) {
  const m = getMark(wordEn);
  const safe = wordEn.replace(/'/g,"\\'");
  const isMemorized = m === 1;
  const memoBg = isMemorized ? 'rgba(34,197,94,.85)' : 'rgba(255,255,255,.1)';
  const memoColor = isMemorized ? '#fff' : 'rgba(255,255,255,.6)';
  const memoShadow = isMemorized ? '0 3px 12px rgba(34,197,94,.4)' : 'none';

async function loadFirebaseButterflies() {
  try {
    if(typeof db === 'undefined') return;
    const snap = await db.collection('butterflies').get();
    if(snap.empty) return;
    snap.docs.forEach(doc => {
      const bf = doc.data();
      if(!bf.id || !bf.name) return;
      const existing = BUTTERFLY_LIST.find(b => b.id === bf.id);
      if(existing) {
        if(bf.svgCode) existing.svgCode = bf.svgCode;
      } else {
        BUTTERFLY_LIST.push({
          id: bf.id, name: bf.name, rare: bf.rare||'⭐⭐',
          color: bf.color||'#7C3AED', bg: '#F5F3FF',
          desc: bf.desc||'', svgCode: bf.svgCode||''
        });
      }
    });
  } catch(e) { console.warn('butterfly load failed', e); }
}

function getMark(en) {

  return mm[en]||0;
}
function toggleFav(en) {
  if(!Array.isArray(S.favorites)) S.favorites = S.favorites ? [...S.favorites] : [];
  const i = S.favorites.indexOf(en);
  if(i>=0) S.favorites.splice(i,1);
  else S.favorites.push(en);
  sv();
}

function setMark(en, val) {
  // 현재 단어장 markMap에 저장
  if(S.currentBook && S.currentBook !== '내 단어장') {
    const bk = (S.books||[]).find(b=>b.name===S.currentBook);
    if(bk) {
      if(!bk.markMap) bk.markMap = {};
      bk.markMap[en] = val; S.markMap[en] = val;
    } else {
      S.markMap[en] = val;
    }
  } else {
    S.markMap[en] = val;
  }
  // 외운 단어 → learned에도 추가
  if(val===1) S.learned.add(en);
  else if(val===2) S.learned.delete(en);
  sv();
}
function cycleMark(en) {
  const cur = getMark(en);
  const next = (cur+1)%3;
  setMark(en, next);
  return next;
}

window._auto = window._auto || {
  loop: true,        // 무한 루프 (기본 ON)
  speed: 4000,       // 단어당 시간 (ms) - 스트리밍/오디오용
  shadowRate: 0.75,  // 쉐도잉 발음 속도
  read: 'en+kr',     // 읽기 모드: en/kr/ex/en+kr/en+ex/all
  voice: 'en-US',    // 영어 음성
};
function _autoSpeak(text, lang='en-US', rateOverride) {
  return new Promise(res => {
    if(!text) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rateOverride != null ? rateOverride : (lang === 'ko-KR' ? 0.95 : (window._auto.shadowRate || 0.85));
    u.onend = res; u.onerror = res;
    setTimeout(res, 6000);
    speechSynthesis.speak(u);
  });
}
async function _autoReadWord(w) {
  const m = window._auto.read || 'en+kr';
  const exCount = parseInt(window._auto?.exCount||0);
  const exList = w.exList && w.exList.length ? w.exList : (w.ex ? [w.ex] : []);
  const exToRead = exList.slice(0, exCount);

  const speakExamples = async () => {
    for(const ex of exToRead) {
      await new Promise(r=>setTimeout(r,250));
      await _autoSpeak(ex, 'en-US');
    }
  };

  if(m === 'spell') {
    // 영단어 먼저 읽고 → 그 다음 철자를 한 글자씩 읽어줌
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,350));
    const letters = (w.en||'').split('');
    for(const ch of letters) {
      if(!window._autoPlaying && window._autoPlaying !== undefined) {}
      const say = /[a-zA-Z]/.test(ch) ? ch.toUpperCase() : ch;
      await _autoSpeak(say, 'en-US', 1.6);
      await new Promise(r=>setTimeout(r,60));
    }
    await speakExamples();
  } else if(m === 'en') {
    await _autoSpeak(w.en, 'en-US');
    await speakExamples();
  } else if(m === 'kr') {
    await _autoSpeak(w.kr, 'ko-KR');
  } else if(m === 'ex') {
    if(exToRead.length) { for(const ex of exToRead) await _autoSpeak(ex, 'en-US'); }
    else if(w.ex) await _autoSpeak(w.ex, 'en-US');
  } else if(m === 'kr_first') {
    // 한글 먼저 → N초 후 영어 발음
    await _autoSpeak(w.kr, 'ko-KR');
    const delay = (window._auto.krFirstDelay||3) * 1000;
    await new Promise(r=>setTimeout(r,delay));
    // 카드 뒤집기 (영어 표시)
    const cardReveal = document.getElementById('auto-kr-reveal');
    if(cardReveal) cardReveal.style.display='block';
    const krOnly = document.getElementById('auto-kr-only');
    if(krOnly) krOnly.style.display='none';
    await _autoSpeak(w.en, 'en-US');
    await speakExamples();
  } else if(m === 'en+kr') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,300));
    await _autoSpeak(w.kr, 'ko-KR');
    await speakExamples();
  } else if(m === 'en+ex') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,300));
    await speakExamples();
  } else if(m === 'all') {
    await _autoSpeak(w.en, 'en-US');
    await new Promise(r=>setTimeout(r,250));
    await _autoSpeak(w.kr, 'ko-KR');
    await speakExamples();
  }
}

// ── Wake Lock (화면 꺼짐 방지) ──
window._wakeLock = null;
window._requestWakeLock = async function() {
  try {
    if('wakeLock' in navigator) {
      window._wakeLock = await navigator.wakeLock.request('screen');
      window._wakeLock.addEventListener('release', () => { window._wakeLock = null; });
    }
  } catch(e) {}
};
window._releaseWakeLock = function() {
  try { if(window._wakeLock) { window._wakeLock.release(); window._wakeLock = null; } } catch(e) {}
};

// ── 화면 잠금 (주머니 모드) ──
window._autoLocked = false;
window._toggleAutoLock = function() {
  window._autoLocked = !window._autoLocked;
  const overlay = document.getElementById('auto-lock-overlay');
  if(window._autoLocked) {
    // 오버레이 생성 - 터치/클릭 전부 차단
    if(!overlay) {
      const el = document.createElement('div');
      el.id = 'auto-lock-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:9999;background:transparent;touch-action:none;-webkit-user-select:none;user-select:none;';
      // 길게 누르면 잠금 해제
      let _lockTimer = null;
      let _lockProgress = null;
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        _lockProgress = document.getElementById('lock-progress');
        if(_lockProgress) _lockProgress.style.transition = 'width 5s linear'; 
        if(_lockProgress) _lockProgress.style.width = '100%';
        _lockTimer = setTimeout(() => { window._toggleAutoLock(); }, 5000);
      }, {passive:false});
      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        clearTimeout(_lockTimer);
        if(_lockProgress) { _lockProgress.style.transition='none'; _lockProgress.style.width='0%'; }
      }, {passive:false});
      el.addEventListener('touchmove', (e) => { e.preventDefault(); }, {passive:false});
      el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); }, {passive:false});
      document.body.appendChild(el);
    } else {
      overlay.style.display = '';
    }
    toast('🔒 화면 잠금 ON · 길게 눌러서 해제');
  } else {
    if(overlay) overlay.style.display = 'none';
    toast('🔓 화면 잠금 해제');
  }
  window._autoRender && window._autoRender();
}

function showAutoMode() {
  const rawWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  if(!rawWords || !rawWords.length) { toast('단어가 없어요!'); return; }

  // _auto 초기화 (없을 때만)
  if(!window._auto) window._auto = {
    loop:true, speed:4000, shadowRate:0.85, read:'en+kr', voice:'en-US',
    range:-1, unit:'all', display:'both', shadow:false, exCount:0
  };
  const A = window._auto;

  // ── 학습범위 필터링 ──
  let words = [...rawWords];
  const range = parseInt(A.range ?? -1);
  if(range === 0) {
    words = words.filter(w => (getMark(w.en)||0) === 0);
    if(!words.length) { toast('미학습 단어가 없어요!'); words = [...rawWords]; }
  } else if(range === 1) {
    words = words.filter(w => getMark(w.en) === 1);
    if(!words.length) { toast('외웠음 표시 단어가 없어요!'); words = [...rawWords]; }
  } else if(range === 2) {
    words = words.filter(w => getMark(w.en) === 2);
    if(!words.length) { toast('복습 표시 단어가 없어요!'); words = [...rawWords]; }
  }

  // ── 정렬 ──
  const sort = S.autoSort||'default';
  if(sort==='alpha') words.sort((a,b)=>a.en.localeCompare(b.en));
  else if(sort==='alpha_kr') words.sort((a,b)=>a.kr.localeCompare(b.kr));
  else if(sort==='mark') words.sort((a,b)=>getMark(b.en)-getMark(a.en));
  else if(sort==='random') { for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];} }

  // ── 학습단위 ──
  const unit = A.unit||'all';
  if(unit !== 'all') {
    const n = parseInt(unit);
    if(!isNaN(n) && n > 0) words = words.slice(0, n);
  }

  const mr = document.getElementById('mr');
  if(!mr) return;

  // 상태 초기화
  window._autoIdx = 0;
  window._autoPlaying = false;
  window._autoWords = words;

  // 자동학습 외웠음 처리: 해당 단어를 목록에서 제거하고 다음 단어로 진행, 0개면 완료

        if(_btns[_i].textContent.indexOf("외웠음")>=0){
          _btns[_i].style.background="#22C55E";
          _btns[_i].style.color="#fff";
          _btns[_i].style.borderColor="#22C55E";
          break;
        }
      }
    } catch(e){}
    setTimeout(function(){

  const ni=LEVELS.findIndex(l=>l.id===S.lid);

// studyLog 기반 streak 재계산 (진실의 원천)
function recalcStreak() {
  const sl = S.studyLog || {};
  const dates = Object.keys(sl).sort().reverse(); // 최신순
  if(dates.length === 0) return;

  // 연속 날짜 계산
  let streak = 0;
  const today_ = new Date(Date.now() + 9*3600000).toISOString().slice(0,10);
  const yesterday_ = new Date(Date.now() + 9*3600000 - 86400000).toISOString().slice(0,10);

  // 오늘 또는 어제부터 시작
  const start = dates[0] === today_ || dates[0] === yesterday_ ? dates[0] : null;
  if(!start) return; // 최근 학습이 어제/오늘이 아니면 streak 유지하지 않음

  let check = start;
  for(const d of dates) {
    if(d === check) {
      streak++;
      // 하루 전으로
      const prev = new Date(new Date(check).getTime() - 86400000).toISOString().slice(0,10);
      check = prev;
    } else {
      break;
    }
  }

  const oldStreak = S.streak || 0;
  if(streak > oldStreak) {
    // studyLog가 더 많은 연속일을 보여주면 업데이트
    S.streak = streak;
    S.lastDate = dates[0]; // 마지막 학습일
    localStorage.setItem('wd-st', streak);
    localStorage.setItem('wd-dt', dates[0]);
    console.log('[recalcStreak] streak 재계산:', oldStreak, '->', streak);
  }
}

function scheduleAlarms() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const l = lv(S.lid);

  // 기존 알람 제거
  if(window._alarmTimers) window._alarmTimers.forEach(t=>clearTimeout(t));
  window._alarmTimers = [];

  const now = new Date();
  const alarms = [
    {cfg:S.alStudy,  title:`${l.emoji} 공부 시작!`,   body:`오늘 목표 ${S._dailyGoalMin||30}분 중 ${Math.floor(S._dailyStudiedMin||0)}분 완료. 지금 시작해요!`},
    {cfg:S.alGoal,   title:`${l.emoji} 퀴즈 도전!`,   body:'퀴즈로 오늘 실력을 확인해봐요!'},
    {cfg:S.alStreak, title:`${l.emoji} 캐릭터 돌보기`, body:`${l.name}가 기다리고 있어요!`},
  ];

  alarms.forEach(({cfg, title, body}) => {
    if(!cfg || !cfg.on) return;
    const alarmTime = new Date();
    alarmTime.setHours(cfg.h, cfg.m, 0, 0);
    if(alarmTime <= now) alarmTime.setDate(alarmTime.getDate()+1); // 내일로
    const delay = alarmTime - now;
    const t = setTimeout(()=>{
      // 게임 중이면 알람 발동 안 함 (게임 끝난 후 재스케줄)
      if(S._gameRunning && !S.gDone) { scheduleAlarms(); return; }
      // 남은 공부시간 메시지
      const studied = S._dailyStudiedMin||0;
      const goal = S._dailyGoalMin||30;
      const remain = Math.max(0, goal-studied);
      const finalBody = remain>0
        ? body + ` 오늘 목표까지 ${Math.ceil(remain)}분 남았어요!`
        : body + ' 오늘 목표 이미 달성! 👑';
      new Notification(title, {body:finalBody, icon:'/icons/icon-192.png'});
      // 매일 반복
      scheduleAlarms();
    }, delay);
    window._alarmTimers.push(t);
  });
}

function startTest() {
  // 적응형 테스트: egg부터 시작, 연속 정답→상승, 오답→확정
  S.tQs = [];
  S.tIdx = 0;
  S.tScore = {};
  S.tAns = false;
  S.tRes = null;
  S.tCurChoices = null;
  S.tCorrectIdx = null;
  // 상태 초기화
  S.tLvIdx = 0;        // 현재 도전 레벨 인덱스
  S.tConsecRight = 0;  // 연속 정답 수
  S.tWrongCount = 0;   // 현재 레벨 오답 수
  S.tTotalQ = 0;       // 총 문제 수
  S.tLvResult = {};    // 레벨별 결과
  S._testUsed = {};    // 레벨별 출제된 단어 추적 (중복 차단)
  // 관리자 단어(system_words)를 모든 레벨에 대해 미리 로드 → 레벨테스트 출제에 사용
  loadTestWords(() => { renderAdaptiveQ(); });
}

// system_words를 레벨테스트용으로 로드 (관리자 페이지 단어 사용)
function loadTestWords(cb) {
  if(typeof db==='undefined') { if(cb)cb(); return; }
  window._testWordsByLevel = window._testWordsByLevel || {};
  const fetch = db.collection('system_words').get()
    .then(snap=>{
      const byLv = {};
      snap.docs.forEach(d=>{
        const w = d.data();
        if(!w || !w.en || !w.level) return;
        const meaning = (w.meanings && w.meanings[0]) || w.kr;
        if(!meaning) return;
        (byLv[w.level] = byLv[w.level] || []).push({ en: w.en, kr: meaning, img: w.img||'📘' });
      });
      window._testWordsByLevel = byLv;
    }).catch(()=>{});
  const timeout = new Promise(res => setTimeout(res, 4000));
  Promise.race([fetch, timeout]).finally(()=>{ if(cb)cb(); });
}

// ── 적응형 테스트 핵심 ──
function renderAdaptiveQ() {
  const lvId = LEVELS[S.tLvIdx]?.id;
  if(!lvId) { finishAdaptiveTest(); return; }
  S._testUsed = S._testUsed || {};
  S._testUsed[lvId] = S._testUsed[lvId] || [];
  const usedSet = new Set(S._testUsed[lvId]);

  // 관리자 단어(system_words) 우선 사용, 없으면 기존 TEST_POOL 폴백
  const sysPool = (window._testWordsByLevel && window._testWordsByLevel[lvId]) || [];
  let q = null;

  if(sysPool.length >= 4) {
    // 아직 출제 안 된 단어만 후보로
    let candidates = sysPool.filter(w => !usedSet.has(w.en));
    if(candidates.length === 0) {
      // 이 레벨 단어를 다 썼으면 → 레벨 통과 처리하고 다음 레벨로
      S.tLvResult[lvId] = 'pass';
      S.tLvIdx++;
      S.tConsecRight = 0;
      S.tWrongCount = 0;
      return renderAdaptiveQ();
    }
    const word = rnd(candidates);
    S._testUsed[lvId].push(word.en);
    // 오답 3개: 같은 레벨의 다른 단어 뜻에서 추출
    const others = sysPool.filter(w => w.en !== word.en && w.kr !== word.kr);
    const wrongs = shuf(others).slice(0,3).map(w => w.kr);
    // 후보가 부족하면 채우기
    while(wrongs.length < 3) wrongs.push('(다른 뜻)');
    const choices = [word.kr, ...wrongs];
    const shuffled = shuf(choices.map((c,i)=>({c, orig:i})));
    const correctNewIdx = shuffled.findIndex(x=>x.orig===0);
    q = { q: word.en, c: shuffled.map(x=>x.c), a: correctNewIdx, img: word.img, lv: lvId };
  } else {
    // 폴백: 하드코딩 TEST_POOL (중복 차단 적용)
    const pool = (TEST_POOL[lvId] || TEST_POOL.egg).filter(w => !usedSet.has(w.q));
    const usable = pool.length ? pool : (TEST_POOL[lvId] || TEST_POOL.egg);
    const picked = rnd(usable);
    S._testUsed[lvId].push(picked.q);
    q = {...picked, lv: lvId};
  }

  S.tCurrentQ = q;
  S.tTotalQ++;
  renderAdaptiveMCQ(q);
}

function renderAdaptiveMCQ(q) {
  const l = lv(q.lv);
  const lvIdx = S.tLvIdx;
  // 보기 순서 고정
  if(!S.tAns) {
    S.tCurChoices = shuf(q.c.map((c,i)=>({c,i})));
    S.tCorrectIdx = S.tCurChoices.findIndex(x=>x.i===q.a);
  }
  const cs = S.tCurChoices||[];
  const correctIdx = S.tCorrectIdx||0;
  window._tCorrect = correctIdx;
  window._tLv = q.lv;

  // 상단 진행 표시 (레벨 + 연속정답/오답)
  const consecDots = Array(3).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tConsecRight?'#16A34A':'#E5E7EB'};border:2px solid ${i<S.tConsecRight?'#86EFAC':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tConsecRight?'✓':''}</span>`
  ).join('');
  const wrongDots = Array(2).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tWrongCount?'#DC2626':'#E5E7EB'};border:2px solid ${i<S.tWrongCount?'#FECDD3':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tWrongCount?'✗':''}</span>`
  ).join('');

  document.getElementById('body').innerHTML=`<div class="pad">
    <div style="background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid #E5E7EB">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:#1E5FA5">${typeof charSVGAnimated==="function"?"<span style='display:inline-block;vertical-align:middle'>"+charSVGAnimated(l.id,16,"normal")+"</span>":l.emoji} ${l.name} 도전 중</div>
        <div style="font-size:11px;color:var(--text3,#9CA3AF)">${S.tTotalQ}번째 문제</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#16A34A;font-weight:700">정답</span>
          ${consecDots}
          <span style="font-size:11px;color:var(--text3,#9CA3AF)">3개면 상승!</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#DC2626;font-weight:700">오답</span>
          ${wrongDots}
          <span style="font-size:11px;color:var(--text3,#9CA3AF)">2개면 확정</span>
        </div>
      </div>
    </div>
    <div style="background:#F8F9FA;border-radius:20px;padding:32px 24px;text-align:center;border:1.5px solid #E5E7EB">
      ${S.showImg!==false?`<div style="font-size:64px;margin-bottom:12px">${q.img||'📝'}</div>`:''}
      <div style="font-size:32px;font-weight:900;color:#111;font-family:monospace">${q.q}</div>
    </div>
    <div class="g2">${cs.map((x,ri)=>{
      let bg='#fff',col='#374151',bd='#E5E7EB';
      if(S.tAns){
        if(ri===correctIdx){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}
        else if(ri===S.tRes){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}
      }
      return `<button onclick="tOptClick(${ri})" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600;cursor:${S.tAns?'default':'pointer'};width:100%;font-family:inherit;text-align:center">${x.c}</button>`;
    }).join('')}</div>`;
}

window.tOptClick = function(ri) {
  if(S.tAns) return;
  S.tAns = true;
  S.tRes = ri;
  const correct = window._tCorrect;
  const lvId = window._tLv;
  const isRight = ri === correct;

  if(isRight) {
    ok();
    S.tConsecRight++;
    S.tScore[lvId] = (S.tScore[lvId]||0) + 1;
  } else {
    ng();
    S.tConsecRight = 0;
    S.tWrongCount++;
  }

  renderAdaptiveMCQ(S.tCurrentQ);

  setTimeout(() => {
    S.tAns = false; S.tRes = null;
    S.tCurChoices = null; S.tCorrectIdx = null;

    if(S.tConsecRight >= (window._LTC?.lt_passStreak||3)) {
      // 레벨 통과 → 다음 레벨
      S.tLvResult[lvId] = 'pass';
      S.tLvIdx++;
      S.tConsecRight = 0;
      S.tWrongCount = 0;
      if(S.tLvIdx >= LEVELS.length) { finishAdaptiveTest(); return; }
      toast(`✅ ${lv(lvId).name} 통과! 다음 레벨로!`);
    } else if(S.tWrongCount >= (window._LTC?.lt_failWrong||2)) {
      // 레벨 확정
      S.tLvResult[lvId] = 'fail';
      finishAdaptiveTest(); return;
    }

    // 최대 문항 수 제한
    if(S.tTotalQ >= (window._LTC?.lt_maxQ||10)) { finishAdaptiveTest(); return; }
    renderAdaptiveQ();
  }, 800);
};

function finishAdaptiveTest() {
  // 최종 레벨 결정
  let finalLvIdx = 0;
  LEVELS.forEach((l,i) => {
    if(S.tLvResult[l.id] === 'pass') finalLvIdx = i+1;
  });
  finalLvIdx = Math.min(finalLvIdx, LEVELS.length-1);
  const finalLv = LEVELS[finalLvIdx];

  S.lid = finalLv.id;
  // 레벨테스트 XP: 맞힌 문항당 2XP + 통과한 레벨마다 10XP 보너스
  let _testCorrect = 0;
  Object.keys(S.tScore||{}).forEach(k => { _testCorrect += (S.tScore[k]||0); });
  let _passCount = 0;
  LEVELS.forEach(l => { if(S.tLvResult[l.id]==='pass') _passCount++; });
  const _testXp = _testCorrect * 2 + _passCount * 10;
  addXP(_testXp);
  sv();
  localStorage.setItem('wd-tested', '1');
  S.tHistory.push({date:today(), lid:finalLv.id, totalQ:S.tTotalQ});
  localStorage.setItem('wd-th', JSON.stringify(S.tHistory));

  // 결과 화면
  const resultRows = LEVELS.map((l,i) => {
    const res = S.tLvResult[l.id];
    if(!res && i > finalLvIdx) return '';
    const icon = res==='pass'?'✅':res==='fail'?'❌':'—';
    const isFinal = i===finalLvIdx;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:${isFinal?'#EFF6FF':'#F8F9FA'};border:${isFinal?'2px solid #1E5FA5':'1px solid #E5E7EB'}">
      <span style="display:inline-block">${typeof charSVGAnimated==='function'?charSVGAnimated(l.id,28,'normal'):'<span style="font-size:20px">'+l.emoji+'</span>'}</span>
      <span style="flex:1;font-size:13px;font-weight:${isFinal?'800':'600'};color:${isFinal?'#1E5FA5':'#374151'}">${l.name}</span>
      <span style="font-size:16px">${icon}</span>
      ${isFinal?'<span style="font-size:11px;background:#1E5FA5;color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">확정!</span>':''}
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('body').innerHTML=`<div class="pad" style="padding-top:24px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:56px;margin-bottom:8px">${finalLv.emoji}</div>
      <div style="font-size:24px;font-weight:900;color:#111;margin-bottom:4px">테스트 완료!</div>
      <div style="font-size:14px;color:#6B7280">${S.tTotalQ}문제로 레벨을 찾았어요</div>
    </div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:18px;padding:18px;text-align:center;border:2px solid #1E5FA5;margin-bottom:14px">
      <div style="font-size:12px;color:#1E5FA5;font-weight:700;margin-bottom:4px">나의 레벨</div>
      <div style="font-size:22px;font-weight:900;color:#1E5FA5">${finalLv.emoji} ${finalLv.name}</div>
      <div style="font-size:12px;color:#6B7280;margin-top:4px">${finalLv.desc}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">${resultRows}</div>
    ${charSVG(finalLv.id,60,'happy')}
    <button class="btn bb" onclick="startApp()">학습 시작하기! 🚀</button>
  </div>`;
}

function cleanDummyWords() {
  const dummyKeys = ['포함된 문장','단어','한국어뜻','발음기호','형태','한국어','예문','한국어뜻'];
  const before = S.words.length;
  S.words = S.words.filter(w => w.en && w.kr && !dummyKeys.includes(w.en) && w.en.length < 80);
  // books도 정리
  (S.books||[]).forEach(bk => {
    if(bk.words) bk.words = bk.words.filter(w => w.en && w.kr && !dummyKeys.includes(w.en) && w.en.length < 80);
  });
  const removed = before - S.words.length;
  if(removed > 0) { sv(); toast(`🧹 더미 데이터 ${removed}개 제거 완료`); go(); }
  else toast('정리할 더미 데이터 없음');
}

function renderBFDogamGrid() {
  const grid = document.getElementById('bf-dogam-grid');
  if(!grid) return;
  const bfs = typeof getMyButterflies==='function' ? getMyButterflies() : [];
  const list = typeof BUTTERFLY_LIST!=='undefined' ? BUTTERFLY_LIST : [];
  const sorted = [...list].sort((a,b)=>{
    const ao=bfs.includes(a.id), bo=bfs.includes(b.id);
    if(ao&&!bo)return -1; if(!ao&&bo)return 1;
    return (b.score||0)-(a.score||0);
  });
  grid.innerHTML = sorted.map(b=>{
    const owned = bfs.includes(b.id);

function getLearnedSysWords(lvId) {
  return JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]').length;
}

function loadSysWords(lvId, cb) {
  if(typeof db==='undefined') {
    S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
    if(cb)cb(); return;
  }
  // Firestore에서 시스템 단어 로드 시도, 실패하면 앱 내장 단어 사용
  const timeout = new Promise(res => setTimeout(res, 3000)); // 3초 타임아웃
  const fetch = db.collection('system_words').where('level','==',lvId).get()
    .then(snap=>{
      const words = snap.docs.map(d=>({...d.data(),id:d.id}));
      S._sysWords = words.length ? words : (DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[]);
    }).catch(()=>{
      S._sysWords = DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
    });
  Promise.race([fetch, timeout]).finally(()=>{ if(cb)cb(); });
}

function startLearnSession(mode) {
  S._studyStartTime = Date.now();
  if(!S._sysWords||!S._sysWords.length) {
    S._sysWords=DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg||[];
    loadSysWords(S.lid,null);
  }
  const words=S._sysWords;
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=words.filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0) {
    const mr=document.getElementById('mr');
    if(mr) mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">모든 단어 학습 완료!</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="cm();showLevelUpTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">🏆 레벨업 테스트</button>
        <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">닫기</button>

}

function _doLearnSession(mode, pool) {
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=(pool||S._learnSessionPool||[]).filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0){S._learnSessionStarted=false;checkLearnComplete();return;}
  const sessionWords=shuf(remaining.slice(0,5));
  let gameId=mode;
  if(!mode||mode==='random'){
    const last=S._lastLearnGame||'';
    const avail=LEARN_GAMES.filter(g=>g!==last);
    gameId=avail[Math.floor(Math.random()*avail.length)];
  }
  S._lastLearnGame=gameId; S._learnMode=mode||'random';
  S._learnSessionWords=sessionWords; S._inLearnSession=true;
  startGameW(gameId,sessionWords);
}

function finishLearnSession(resultMap) {
  S._inLearnSession=false;
  const sw=S._learnSessionWords||[];
  const wrong=sw.filter(w=>resultMap[w.en]===false);
  const correct=sw.filter(w=>resultMap[w.en]!==false);
  if(correct.length>0){
    const key='wd-sys-learned-'+S.lid;
    const learned=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
    correct.forEach(w=>learned.add(w.en));
    localStorage.setItem(key,JSON.stringify([...learned]));
    S._learnDoneCount=(S._learnDoneCount||0)+correct.length;
    setTimeout(checkMiniQuiz,300);
  }
  // 단어당 1XP + 만점시 5XP 보너스
  const total2 = sw.length||1;

  let xpAmt = sw.length * 1;
  if(pct2>=100) { xpAmt += 5; S._hadPerfect=true; sv(); }
  addXP(xpAmt); checkXpUsable();
  // quiz 카운트를 푼 문제 수만큼 증가
  { const _t=today(); if(!S.studyLog[_t]) S.studyLog[_t]={words:0,quiz:0,min:0}; S.studyLog[_t].quiz=(S.studyLog[_t].quiz||0)+(sw.length||1); updStreak(); }
  // 학습 시간 추적
  if(S._studyStartTime) {
    const mins = Math.round((Date.now()-S._studyStartTime)/60000);
    S._totalStudyMins = (S._totalStudyMins||0) + mins;
    S._studyStartTime = null;
  }
  sv();
  checkAchievements();
  checkStudyHourReward();
  // 세션 완료 캐릭터 반응
  setTimeout(()=>{
    const pet=getPetState();
    const nextActions=['🎯 퀴즈로 확인해봐요!','🎮 게임으로 복습해봐요!','🔥 SRS 복습도 해봐요!'];
    const nextAct = nextActions[Math.floor(Math.random()*nextActions.length)];
    toast('🐛 오늘도 수고했어! +'+xpAmt+'XP ・ '+nextAct);
    vib([100,50,100]);
  },300);
  const mr=document.getElementById('mr');
  if(!mr) return;
  mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:18px;font-weight:800;margin-bottom:16px;text-align:center">📊 학습 결과</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:#F0FDF4;border-radius:14px;padding:16px;text-align:center;border:1.5px solid #86EFAC">

        <div style="font-size:12px;color:${wrong.length?'#DC2626':'#9CA3AF'};font-weight:700;margin-top:4px">❌ 틀림</div></div>
    </div>

      <div style="font-size:12px;font-weight:700;color:#DC2626;margin-bottom:8px">❌ 틀린 단어</div>
<div style="display:flex;flex-direction:column;gap:4px">${wrong.map(w=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border-radius:8px"> <span>${w.img||'📝'}</span><span style="font-size:13px;font-weight:700;font-family:monospace">${w.en}</span> <span style="font-size:12px;color:#6B7280">= ${w.kr}</span></div>`).join('')}</div></div>

function _reLearn(words) {
  if(!words||!words.length){checkLearnComplete();return;}
  S._learnSessionWords=words; S._inLearnSession=true;
  const gameId=S._learnMode==='random'?LEARN_GAMES[Math.floor(Math.random()*LEARN_GAMES.length)]:(S._learnMode||'quiz');
  startGameW(gameId,words);
}

function checkMiniQuiz() {
  // 5개 학습마다 즉석 미니퀴즈
  const done = S._learnDoneCount||0;
  if(done>0 && done%5===0 && S.words.length>=4) {
    const w = S.words[Math.min(S.idx, S.words.length-1)];
    if(!w) return;
    const wrong = S.words.filter(x=>x.en!==w.en).sort(()=>Math.random()-.5).slice(0,3);
    const choices = [w,...wrong].sort(()=>Math.random()-.5);
    const mr=document.getElementById('mr');
    if(!mr) return;

    if(mr.innerHTML.trim() !== '') return;
    mr.innerHTML=`<div class="mbg"><div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:20px">

function resetToEgg() {
  S.lid = 'egg';
  // XP는 유지 (S.xp = 0 제거 - 누적 XP 보존)
  S._lvNotified = false;
  S._sysWords = null;
  S._learnSessionStarted = false;
  sv();
  loadSysWords('egg', null);
  toast('🥚 다시 알부터 시작! (XP 유지됨)');
}

function showLevelUpFlash(cb) {
  if(!window._popupOn || !window._popupOn('levelUpFlash')) { if(typeof cb==='function') cb(); return; }
  // 진동
  vib([100,50,100,50,200,100,400]);
  // SFX
  SFX.play('levelup');
  // 빛 이펙트 오버레이
  const el=document.createElement('div');
  el.id='levelup-flash';
  el.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,0);z-index:9998;pointer-events:none;transition:background .15s';
  document.body.appendChild(el);
  // 파티클 생성 (나비 이모지 + 원형 혼합)
  const emojis=['🦋','✨','🌸','⭐⭐','🎉','💫','🌟','🎊'];
  const colors=['#FDE68A','#A78BFA','#6EE7B7','#FCA5A5','#93C5FD','#FCD34D','#F9A825','#E65100'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    const angle=(i/20)*360+Math.random()*18;
    const dist=60+Math.random()*160;
    const isEmoji=i%3===0;
    const size=isEmoji?20:(4+Math.random()*12);
    p.style.cssText=`position:fixed;left:50%;top:45%;width:${size}px;height:${size}px;border-radius:${isEmoji?'0':'50%'};background:${isEmoji?'transparent':colors[i%colors.length]};font-size:${size}px;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(0);transition:all ${.5+Math.random()*.4}s ease-out;opacity:1;display:flex;align-items:center;justify-content:center`;
    if(isEmoji) p.textContent=emojis[i%emojis.length];
    document.body.appendChild(p);
    setTimeout(()=>{
      p.style.transform=`translate(calc(-50% + ${Math.cos(angle*Math.PI/180)*dist}px),calc(-50% + ${Math.sin(angle*Math.PI/180)*dist}px)) scale(1) rotate(${Math.random()*360}deg)`;
      p.style.opacity='0';
    },30+i*20);
    setTimeout(()=>p.remove(),1200);
  }
  setTimeout(()=>{el.style.background='rgba(255,255,255,0.85)';},50);
  setTimeout(()=>{el.style.background='rgba(255,255,255,0)';},300);
  setTimeout(()=>{el.remove();if(cb)cb();},600);
}

// ── Firebase에서 나비 데이터 머지 (관리자 등록/수정 반영) ──
// 호출 규칙:
//   - Firebase에 같은 id의 문서가 있으면 그 데이터로 기존 항목을 덮어씀
//   - Firebase에만 있는 id(b31+ 등 신규)는 새로 추가
//   - Firebase 로드 실패해도 기존 30종은 그대로 유지
async function loadButterfliesFromFirebase() {
  if (typeof db === 'undefined' || !db) return;
  try {
    const snap = await db.collection('butterflies').get();
    if (snap.empty) return;
    const cloudMap = {};
    snap.docs.forEach(d => { cloudMap[d.id] = { id: d.id, ...d.data() }; });

    // 기존 BUTTERFLY_LIST 항목을 cloud 데이터로 머지
    for (let i = 0; i < BUTTERFLY_LIST.length; i++) {
      const local = BUTTERFLY_LIST[i];
      const cloud = cloudMap[local.id];
      if (cloud) {
        // cloud 필드가 비어있지 않으면 덮어쓰기, 빈 값이면 local 유지
        const merged = { ...local };
        Object.keys(cloud).forEach(k => {
          const v = cloud[k];
          if (v !== undefined && v !== null && v !== '') merged[k] = v;
        });
        BUTTERFLY_LIST[i] = merged;
        delete cloudMap[local.id];
      }
    }
    // cloud에만 있는 신규 나비 추가
    Object.values(cloudMap).forEach(bf => {
      if (bf && bf.id) BUTTERFLY_LIST.push(bf);
    });
    console.log('[나비] Firebase 머지 완료. 총', BUTTERFLY_LIST.length, '종');
    // 도감/나비밭 화면이 열려있으면 다시 그리기
    try { if (typeof S !== 'undefined' && document.getElementById('main-inner')) {
      const cur = (typeof currentTab !== 'undefined') ? currentTab : null;
      if (cur === 'dogam' && typeof showDogam === 'function') showDogam();
      else if (cur === 'garden' && typeof showGarden === 'function') showGarden();
    } } catch(_){}
  } catch (e) {
    console.warn('[나비] Firebase 로드 실패, 내장 데이터 사용:', e.message);
  }
}

  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return '#'+[Math.max(0,r-40),Math.max(0,g-40),Math.max(0,b-40)].map(v=>v.toString(16).padStart(2,'0')).join('');}
  catch(e){return hex;}
}
