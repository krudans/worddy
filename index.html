<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#1E5FA5;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;max-height:100dvh;background:#F5F7FF;display:flex;flex-direction:column;overflow:hidden}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@keyframes correct-flash{0%{background:#fff}50%{background:#F0FDF4}100%{background:#fff}}
@keyframes wrong-flash{0%{background:#fff}50%{background:#FFF1F2}100%{background:#fff}}
.bounce-anim{animation:bounce 0.5s ease}
.shake-anim{animation:shake 0.4s ease}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
/* 게임 이미지 카드 */
.game-img-card{border-radius:20px;overflow:hidden;position:relative;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-img-card:active{transform:scale(.97)}
.game-img-bg{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.game-img-label{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.game-title{font-size:13px;font-weight:800;margin-bottom:2px}
.game-desc{font-size:10px;opacity:.8}
/* 진행 링 */
.progress-ring{transform:rotate(-90deg)}
/* 단어 카드 (이미지 스타일) */
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;overflow:hidden;border:3px solid}
/* 정답 이펙트 */
.correct-effect{animation:correct-flash .4s ease}
.wrong-effect{animation:wrong-flash .4s ease}
/* 음성 웨이브 */
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.wave-bar:nth-child(2){animation-delay:.1s}
.wave-bar:nth-child(3){animation-delay:.2s}
.wave-bar:nth-child(4){animation-delay:.3s}
.wave-bar:nth-child(5){animation-delay:.4s}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
</style>

// ── 음향 & 진동 시스템 ──
const SFX = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  play(type) {
    try {
      this.init();
      const c = this.ctx;
      const gain = c.createGain();
      gain.connect(c.destination);
      const osc = c.createOscillator();
      osc.connect(gain);
      if (type === 'correct') {
        gain.gain.setValueAtTime(0.3, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.4);
        osc.frequency.setValueAtTime(523, c.currentTime);
        osc.frequency.setValueAtTime(659, c.currentTime + 0.1);
        osc.frequency.setValueAtTime(784, c.currentTime + 0.2);
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.4);
      } else if (type === 'wrong') {
        gain.gain.setValueAtTime(0.3, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.3);
        osc.frequency.setValueAtTime(300, c.currentTime);
        osc.frequency.setValueAtTime(200, c.currentTime + 0.15);
        osc.type = 'sawtooth';
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.3);
      } else if (type === 'levelup') {
        [523,659,784,1047].forEach((f,i) => {
          const o = c.createOscillator();
          const g = c.createGain();
          o.connect(g); g.connect(c.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.3, c.currentTime + i*0.1);
          g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + i*0.1 + 0.3);
          o.start(c.currentTime + i*0.1);
          o.stop(c.currentTime + i*0.1 + 0.3);
        });
      } else if (type === 'flip') {
        gain.gain.setValueAtTime(0.1, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.1);
        osc.frequency.value = 800;
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.1);
      } else if (type === 'tap') {
        gain.gain.setValueAtTime(0.15, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.08);
        osc.frequency.value = 600;
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.08);
      }
    } catch(e) {}
  },
  bgMusic: null,
  playBG() {
    try {
      this.init();
      if (this.bgMusic) return;
      const c = this.ctx;
      const notes = [261, 329, 392, 329, 261, 329, 392, 523];
      let i = 0;
      const playNote = () => {
        const o = c.createOscillator();
        const g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value = notes[i % notes.length];
        o.type = 'sine';
        g.gain.setValueAtTime(0.05, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
        o.start(c.currentTime);
        o.stop(c.currentTime + 0.4);
        i++;
      };
      this.bgMusic = setInterval(playNote, 600);
    } catch(e) {}
  },
  stopBG() {
    if (this.bgMusic) { clearInterval(this.bgMusic); this.bgMusic = null; }
  }
};

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

const p2 = n => String(n).padStart(2,'0');

function load() {
  S.lid = localStorage.getItem('wd-l')||'egg';

  S.lastDate = localStorage.getItem('wd-dt')||'';
  S.nick = localStorage.getItem('wd-nk')||'';
  S.words = JSON.parse(localStorage.getItem('wd-w')||'null')||[...WDB[S.lid]||WDB.egg];

  S.dList = JSON.parse(localStorage.getItem('wd-dl')||'[]');
  S.goal = localStorage.getItem('wd-gl')||null;
  S.goalTotal = +(localStorage.getItem('wd-glt')||0);
}
function sv() {
  localStorage.setItem('wd-l',S.lid); localStorage.setItem('wd-xp',S.xp);
  localStorage.setItem('wd-st',S.streak); localStorage.setItem('wd-dt',S.lastDate);
  localStorage.setItem('wd-nk',S.nick);
  localStorage.setItem('wd-w',JSON.stringify(S.words));
  localStorage.setItem('wd-lrn',JSON.stringify([...S.learned]));
  localStorage.setItem('wd-dl',JSON.stringify(S.dList));
  if(S.goal) localStorage.setItem('wd-gl',S.goal);

}

function addXP(n) {
  S.xp=Math.min(100,S.xp+n); updHD();
  const ni=LEVELS.findIndex(l=>l.id===S.lid);

  if(next&&S.xp>=next.min){
    S.lid=next.id; S.xp=next.min;
    S.words=[...WDB[next.id]||WDB.egg]; S.learned.clear(); S.idx=0;
    sv(); updHD(); SFX.play('levelup'); vibrate([100,50,100,50,200]);

function updStreak() {
  const td=today(); if(S.lastDate===td)return;

  S.lastDate=td; sv();
}

function startTest() {
  S.tQs=[...TQ]; S.tIdx=0; S.tScore={};

function renderTQ() {
  if(S.tIdx>=S.tQs.length){finishTest();return;}
  const q=S.tQs[S.tIdx], l=lv(q.lv), prog=S.tIdx+1;
  document.getElementById('body').innerHTML=`<div class="pad">
    ${cbrow(`${prog}번 문제! 집중해봐! 💪`,'egg')}
    <div style="display:flex;align-items:center;gap:8px">

      <span style="font-size:12px;color:#9CA3AF">${prog}/${S.tQs.length}</span>
    </div>
    <div style="background:${l.bg};border:2px solid ${l.color}44;border-radius:20px;padding:24px;text-align:center">
      <div style="font-size:64px;margin-bottom:8px">${q.img}</div>
      <div style="font-size:11px;font-weight:700;color:${l.color};margin-bottom:6px">${l.emoji} ${l.name}</div>
      <div style="font-size:28px;font-weight:900;color:${l.color};font-family:monospace">${q.q}</div>

    </div>
    <div class="g2">${q.c.map((c,i)=>{
      let cls='topt';
      if(S.tAns){if(i===q.a)cls+=' ok';else if(S.tRes===i)cls+=' ng';}
      return `<div class="${cls}" onclick="${S.tAns?'':'ansT('+i+')'}">${c}</div>`;
    }).join('')}</div>
  </div>`;
}

function ansT(i) {
  const q=S.tQs[S.tIdx]; S.tAns=true; S.tRes=i;
  if(i===q.a){S.tScore[q.lv]=(S.tScore[q.lv]||0)+1; SFX.play('correct'); vibrate(50);}
  else{SFX.play('wrong'); vibrate([50,50,100]);}
  renderTQ();
  setTimeout(()=>{S.tIdx++;S.tAns=false;S.tRes=null;renderTQ();},700);
}

function finishTest() {
  let final='egg';
  for(const l of LEVELS){if((S.tScore[l.id]||0)>=3)final=l.id;else break;}
  S.lid=final; S.xp=lv(final).min;

async function handleFile(input,type) {
  const file=input.files[0]; if(!file) return;
  S.ai=true; go('study','add');
  try {
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type.includes('pdf')?'image/png':file.type,data:b64}},{type:'text',text:'이미지에서 영어 단어들을 찾아 JSON 배열로만 반환. 형식: [{"en":"word","kr":"뜻"}]. 관사/전치사 제외.'}]}]})});
    const d=await resp.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    showExtracted(JSON.parse(txt));
  } catch(e) { toast('추출 실패. 다시 시도해주세요.'); }
  S.ai=false; go('study','add');
}

function showExtracted(words) {
  let sel=new Set(words.map((_,i)=>i));
  const renderL=()=>{
    const el=document.getElementById('ext-list');
    if(!el) return;
    el.innerHTML=words.map((w,i)=>`<div onclick="togW(${i})" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
      <div style="width:24px;height:24px;border-radius:50%;background:${sel.has(i)?'#16A34A':'#E5E7EB'};display:flex;align-items:center;justify-content:center;font-size:12px;color:${sel.has(i)?'#fff':'#9CA3AF'};flex-shrink:0">${sel.has(i)?'✓':''}</div>
      <span style="font-weight:700;font-family:monospace;color:#1E5FA5">${w.en}</span>
      <span style="color:#6B7280">${w.kr}</span>
    </div>`).join('');
  };
  window.togW=i=>{sel.has(i)?sel.delete(i):sel.add(i);renderL();};
  window.svExt=()=>{const add=words.filter((_,i)=>sel.has(i));add.forEach(w=>{if(!S.words.find(x=>x.en===w.en))S.words.push({...w,ph:'',pos:'',ex:w.en+'.',tip:w.en+' = '+w.kr,meanings:[w.kr],img:'📝'});});sv();cm();toast(`✅ ${add.length}개 추가!`);go('study','add');};
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:16px;font-weight:800">추출 단어 ${words.length}개</div>
      <div style="display:flex;gap:8px">
        <button onclick="words.forEach((_,i)=>{sel.add(i)});renderL?renderL():null" style="background:none;border:none;font-size:12px;color:#1E5FA5;cursor:pointer">전체선택</button>
        <button onclick="sel.clear();document.getElementById('ext-list').innerHTML=''" style="background:none;border:none;font-size:12px;color:#DC2626;cursor:pointer">전체해제</button>
      </div>
    </div>
    <div id="ext-list" style="max-height:280px;overflow-y:auto"></div>
    <button class="btn bg" onclick="svExt()" style="margin-top:12px">선택 단어 저장</button>
    <button class="btn bgr" onclick="cm()" style="margin-top:8px">닫기</button>
  </div></div>`;
  renderL();
}

function startGameW(id,ws) {
  SFX.playBG();
  vibrate(30);
  const src=ws||(S.words.length>=2?S.words:(WDB[S.lid]||WDB.egg));
  S.gameId=id; S.gDone=false; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput='';
  S.gWords=pick(src,Math.min(8,src.length));
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='sentence'||id==='ssort'){const sts=[{kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing','yesterday']},{kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are','sad']},{kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach','Korean']}];S.sbS=rnd(sts);S.sbP=shuf([...S.sbS.words,...S.sbS.wrong.slice(0,2)]);S.sbC=[];S.sbAns=false;S.sbOk=false;if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}
  S.tab='game'; go();
}

function rGame() {
  if(S.gDone) return rGameDone();
  const map={quiz:rQ4,fill:rFill,wordfind:rWF,chain:rChain,match:rMatch,sentence:rSentence,scramble:rTyping,typing:rTyping,wordle:rWordle,ssort:rSSorting,listen:rListen};
  return (map[S.gameId]||rGameDone)();
}

function buildWF(src){

  parts.push(`<div style="text-align:center;padding:16px 0"><div style="margin-bottom:12px">${charSVG(S.lid,80)}</div><div style="font-size:20px;font-weight:900;color:#111;margin-bottom:4px">${S.nick}</div><div style="display:inline-block;background:${l.bg};color:${l.color};border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700">${l.emoji} ${l.name} · ${l.desc}</div></div>`);
  parts.push(`<div class="g2">`);
  [['📖',S.words.length+'개','단어장','#1E5FA5'],['✅',S.learned.size+'개','완료','#16A34A'],['🔥',S.streak+'일','연속','#D97706'],['📝',S.dList.length+'개','일기','#880E4F']].forEach(([ic,v,lb,c])=>{
    parts.push(`<div class="card" style="text-align:center;padding:12px"><div style="font-size:22px;margin-bottom:4px">${ic}</div><div style="font-size:20px;font-weight:900;color:${c}">${v}</div><div style="font-size:11px;color:#9CA3AF">${lb}</div></div>`);
  });
  parts.push(`</div>`);
  parts.push(`<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px">🦋 성장 단계</div><div style="display:flex;justify-content:space-around">`);
  LEVELS.forEach(lx=>{
    parts.push(`<div style="text-align:center;opacity:${lx.min<=S.xp?1:.3}"><div style="font-size:${lx.id===S.lid?'22px':'16px'}">${lx.emoji}</div><div style="font-size:9px;color:${lx.id===S.lid?lx.color:'#D1D5DB'};font-weight:${lx.id===S.lid?'700':'400'}">${lx.name.split(' ')[0]}</div></div>`);
  });
  parts.push(`</div></div>`);
  parts.push(`<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px">🔔 알림 설정</div>`);
  [['alS','📖','공부 알림'],['alD','✍️','일기 알림']].forEach(([k,ic,nm])=>{
    parts.push(`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6"><span style="font-size:18px">${ic}</span><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#111">${nm}</div><div style="font-size:11px;color:#9CA3AF">${p2(S[k].h)}:${p2(S[k].m)}</div></div><button class="toggle ${S[k].on?'on':''}" onclick="S.${k}.on=!S.${k}.on;go()"><div class="tk"></div></button></div>`);
  });
  parts.push(`<button onclick="if('Notification'in window)Notification.requestPermission().then(p=>{if(p==='granted')toast('🔔 알림 허용!')})" style="background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#1E5FA5;width:100%;margin-top:10px">🔔 알림 권한 허용</button></div>`);
  parts.push(`<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">✏️ 닉네임 변경</div><div style="display:flex;gap:8px"><input id="cnk" placeholder="새 닉네임" value="${S.nick}" style="flex:1"><button onclick="const v=document.getElementById('cnk')?.value.trim();if(v){S.nick=v;sv();toast('닉네임 변경!');go();}" style="background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer">변경</button></div></div>`);
  parts.push(`<button class="btn" onclick="if(confirm('레벨 테스트 재시작?')){localStorage.removeItem('wd-tested');showTestIntro();}" style="background:#FFF8E1;color:#E65100;border:1.5px solid #FFE082">📝 레벨 재테스트</button>`);
  parts.push(`<button class="btn bgr" onclick="if(confirm('로그아웃?')){auth.signOut();}">로그아웃</button>`);
  parts.push(`</div>`);
  return parts.join('');
}

// ── 시작 ──
</script>
</body>
</html>
