function rDiary() {
  if(S.dView==='write') return rDiaryWrite();
  if(S.dView==='read') return rDiaryRead();
  // 기본: 달력 화면
  return rDiaryCalendar();
}

function rDiaryCalendar() {
  const now = new Date();
  // 항상 현재 달로 초기화 (null이면)
  if(S.dCalYear===null||S.dCalYear===undefined) S.dCalYear=now.getFullYear();
  if(S.dCalMonth===null||S.dCalMonth===undefined) S.dCalMonth=now.getMonth();
  const calYear = S.dCalYear;
  const calMonth = S.dCalMonth;
  const todayStr = today();

  // 해당 월 일기 날짜 세트
  const diaryDates = new Set(S.dList.map(d=>d.date));

  // 달력 계산
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = `${calYear}년 ${calMonth+1}월`;

  // 이번 달 통계
  const monthDiaries = S.dList.filter(d=>{
    const dm = new Date(d.date);
    return dm.getFullYear()===calYear && dm.getMonth()===calMonth;
  });
  const moodCount = {};
  monthDiaries.forEach(d=>{ moodCount[d.mood]=(moodCount[d.mood]||0)+1; });
  const topMoods = Object.entries(moodCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const parts = [];
  parts.push('<div style="display:flex;flex-direction:column;height:100%">');

  // 헤더
  parts.push(`<div style="background:#fff;border-bottom:1.5px solid #E5E7EB;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <button onclick="S.dCalMonth=${calMonth===0?11:calMonth-1};if(${calMonth===0})S.dCalYear=${calYear-1};go()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#374151;padding:4px 8px">‹</button>
    <div style="font-size:17px;font-weight:900;color:#111">${monthName}</div>
    <button onclick="S.dCalMonth=${calMonth===11?0:calMonth+1};if(${calMonth===11})S.dCalYear=${calYear+1};go()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#374151;padding:4px 8px">›</button>
  </div>`);

  parts.push('<div style="flex:1;overflow-y:auto;padding:14px">');

  // 달력
  parts.push(`<div style="background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:14px;margin-bottom:14px">`);

  // 요일 헤더
  parts.push('<div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px">');
  ['일','월','화','수','목','금','토'].forEach((d,i)=>{
    const c = i===0?'#DC2626':i===6?'#1E5FA5':'#9CA3AF';
    parts.push(`<div style="text-align:center;font-size:12px;font-weight:700;color:${c};padding:4px 0">${d}</div>`);
  });
  parts.push('</div>');

  // 날짜 그리드
  parts.push('<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">');

  // 빈 칸
  for(let i=0;i<firstDay;i++) parts.push('<div></div>');

  for(let d=1;d<=daysInMonth;d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const hasDiary = diaryDates.has(dateStr);
    const isFuture = dateStr>todayStr;
    const diary = hasDiary ? S.dList.find(x=>x.date===dateStr) : null;
    const dayOfWeek = (firstDay+d-1)%7;
    const textColor = isFuture?'#D1D5DB':dayOfWeek===0?'#DC2626':dayOfWeek===6?'#1E5FA5':'#374151';

    parts.push(`<div onclick="${isFuture?'':hasDiary?`S.dView='read';S.dReadId=${diary?.id};go()`:`S.dView='write';S.dWriteDate='${dateStr}';go()`}" style="position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px;cursor:${isFuture?'default':'pointer'};border-radius:10px;${isToday?'background:#EFF6FF;border:1.5px solid #1E5FA5':''}" ontouchstart="${isFuture?'':'this.style.background=\'#F3F4F6\''}" ontouchend="${isFuture?'':'this.style.background=\''+(isToday?'#EFF6FF':'')+"'"}">
      <div style="font-size:13px;font-weight:${isToday?'900':'500'};color:${isToday?'#1E5FA5':textColor}">${d}</div>
      ${hasDiary?`<div style="font-size:11px;line-height:1">${diary?.mood||'📝'}</div>`:`<div style="width:5px;height:5px;border-radius:50%;background:${isFuture?'transparent':'#E5E7EB'};margin-top:2px"></div>`}
    </div>`);
  }
  parts.push('</div></div>');

  // 범례
  parts.push(`<div style="display:flex;gap:12px;font-size:11px;color:#9CA3AF;margin-bottom:14px;padding:0 4px">
    <div style="display:flex;align-items:center;gap:4px"><div style="width:14px;height:14px;border-radius:4px;background:#EFF6FF;border:1.5px solid #1E5FA5"></div>오늘</div>
    <div style="display:flex;align-items:center;gap:4px"><span>😊</span>일기 쓴 날</div>
    <div style="display:flex;align-items:center;gap:4px"><div style="width:5px;height:5px;border-radius:50%;background:#E5E7EB"></div>안 쓴 날</div>
  </div>`);

  // 이번 달 통계
  if(monthDiaries.length > 0) {
    parts.push(`<div style="background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">📊 ${calMonth+1}월 기록</div>
      <div style="display:flex;gap:12px;align-items:center">
        <div style="text-align:center;background:#EFF6FF;border-radius:12px;padding:10px 16px">
          <div style="font-size:22px;font-weight:900;color:#1E5FA5">${monthDiaries.length}</div>
          <div style="font-size:11px;color:#9CA3AF">작성일</div>
        </div>
        <div style="flex:1">
          <div style="font-size:12px;color:#6B7280;margin-bottom:6px">기분 분포</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${topMoods.map(([mood,cnt])=>`<div style="display:flex;align-items:center;gap:4px"><span style="font-size:16px">${mood}</span><span style="font-size:12px;font-weight:700;color:#374151">${cnt}회</span></div>`).join('')}
          </div>
        </div>
      </div>
    </div>`);
  }

  // 오늘 일기 쓰기 버튼
  const todayDiary = S.dList.find(d=>d.date===todayStr);
  parts.push(`<button onclick="S.dView='write';S.dWriteDate='${todayStr}';go()" class="btn bb" style="width:100%;padding:15px;font-size:15px">
    ${todayDiary?'📖 오늘 일기 수정하기':'✏️ 오늘 일기 쓰기'}
  </button>`);

  parts.push('</div></div>');
  return parts.join('');
}

  </div>`);
  parts.push('</div>');
  return parts.join('');

  if((S.dPhotos||[]).length<3)_ph+='<label style="width:80px;height:80px;border-radius:10px;border:2px dashed var(--border,#E5E7EB);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#9CA3AF"><span style="font-size:24px">📷</span><span style="font-size:10px;font-weight:700">사진 추가</span><input type="file" accept="image/*" style="display:none" onchange="addDiaryPhoto(this)"></label>';

  if(S.dHelp) parts.push('<div style="background:#FDF4FF;border-radius:14px;border:1.5px solid #E9D5FF;padding:14px"><div style="font-size:12px;font-weight:800;color:#7C3AED;margin-bottom:10px">✨ AI 문법 코치</div><div style="font-size:13px;color:#4C1D95;line-height:1.9;white-space:pre-wrap">'+S.dHelp+'</div></div>');

  } else {
    parts.push('<button class="btn bg" onclick="svDiary()">💾 일기 저장</button>');

  parts.push('</div>');

}

async function trDiary(){
  if(!S.dText.trim()){toast('일기를 먼저 써주세요');return;}
  S.ai=true; go();
  const ws=S.words.slice(0,8).map(w=>w.en).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:'한국어 일기를 자연스러운 영어로 번역. 가능하면 이 단어 포함: '+ws+'. 번역만 출력.\n"'+S.dText+'"'}]})});
    const d=await r.json(); S.dTr=d.content?.[0]?.text?.trim()||'';
  }catch(e){toast('AI 오류. API 키가 필요해요.');}
  S.ai=false; go();
}

async function dHelpFn(){
  const text=(S.dTr||S.dText).trim();
  if(!text){toast('일기를 먼저 써주세요');return;}

function addDiaryPhoto(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=600; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      if(!S.dPhotos)S.dPhotos=[];
      if(S.dPhotos.length>=3){toast('사진은 최대 3장');return;}
      S.dPhotos.push(canvas.toDataURL('image/jpeg',0.7)); go();
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}

function createBookcase() {
  const icon = document.getElementById('bc-icon')?.value.trim()||'📁';
  const name = document.getElementById('bc-name')?.value.trim();
  if(!name){toast('책장 이름을 입력하세요','err');return;}
  const selected = [...document.querySelectorAll('#bc-books-select button.selected')].map(b=>b.textContent);
  if(!S.bookcase) S.bookcase = [];
  S.bookcase.push({name, icon, bookNames: selected});
  sv();
  toast(`✅ "${name}" 책장 생성!`);
  showBookcaseModal();
}

function deleteBookcase(idx) {
  if(!confirm('책장을 삭제할까요? 단어장은 유지돼요')) return;
  S.bookcase.splice(idx, 1);
  sv();
  showBookcaseModal();
}

// 폰트 적용 함수
function applyFont() {
  const fonts = {
    'default': "system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif",
    'noto': "'Noto Sans KR',sans-serif",
    'gothic': "'Nanum Gothic',sans-serif",
    'round': "'Nanum Rounded',sans-serif",
  };
  const f = fonts[S.fontFamily||'default'];
  document.body.style.fontFamily = f;
  // 나눔 폰트 동적 로드
  if(S.fontFamily==='gothic'||S.fontFamily==='round') {
    const id = 'nanum-font-link';
    if(!document.getElementById(id)) {
      const link = document.createElement('link');
      link.id = id; link.rel = 'stylesheet';

// CSV 불러오기 (앱 설정에서)
function importCSVApp(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const start = lines[0].toLowerCase().includes('en') ? 1 : 0;
    const newWords = [];
    lines.slice(start).forEach(line => {
      const p = line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
      if(p.length>=2&&p[0]&&p[1]) {
        if(!S.words.find(w=>w.en.toLowerCase()===p[0].toLowerCase())) {
          newWords.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});
        }
      }
    });
    if(!newWords.length){toast('추가할 새 단어가 없어요');return;}
    S.words.push(...newWords);
    sv(); cm();
    toast(`✅ ${newWords.length}개 불러오기 완료!`,'ok');
    go();
  };
  reader.readAsText(file, 'UTF-8');
}

// 구글 드라이브 백업
async function syncGoogleDrive() {
  try {
    // Google Identity Services로 토큰 요청
    if(!window.google?.accounts) {
      // GIS 라이브러리 동적 로드
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://accounts.google.com/gsi/client';
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }
    toast('구글 드라이브 연동 중...');
    // 백업 데이터 준비
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      words: S.words,
      markMap: S.markMap,
      srsMap: S.srsMap,
      dList: S.dList,
      books: S.books,
      streak: S.streak,
      attendDates: S.attendDates,
      lid: S.lid,
      nick: S.nick,
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});

    // Google OAuth2 토큰 요청
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: '959781543804-wordday.apps.googleusercontent.com',
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (tokenResp) => {
        if(tokenResp.error) { toast('구글 로그인 실패: '+tokenResp.error,'err'); return; }
        // 파일 업로드
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({
          name: `Vocabug_backup_${new Date().toISOString().slice(0,10)}.json`,
          mimeType: 'application/json',
          parents: ['appDataFolder']
        })], {type:'application/json'}));
        form.append('file', blob);
        const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method:'POST',
          headers:{Authorization:`Bearer ${tokenResp.access_token}`},
          body: form,
        });
        if(resp.ok) {
          const now = new Date().toLocaleString('ko-KR');
          localStorage.setItem('wd-gdrive-sync', now);
          toast('☁️ 구글 드라이브 백업 완료!','ok');
          showAppSettings('backup');
        } else {
          toast('업로드 실패: '+resp.status,'err');
        }
      },
    });
    tokenClient.requestAccessToken();
  } catch(e) {
    // 드라이브 API 불가 시 로컬 파일로 대체
    toast('드라이브 연결 실패. 로컬 파일로 저장할게요.');
    showDataBackup();
  }
}

async function addFriendByCode() {
  const code = document.getElementById('friend-code-inp')?.value?.trim()?.toUpperCase();
  if(!code||code.length<8){toast('8자리 코드를 입력해주세요');return;}
  if(code === (S.user?.uid?.slice(0,8)?.toUpperCase())){toast('본인 코드예요!');return;}
  try {
    // Firebase에서 해당 코드 사용자 찾기
    const snap = await db.collection('users').where('code','==',code).limit(1).get();
    if(snap.empty){toast('해당 코드의 사용자를 찾을 수 없어요');return;}
    const friendData = snap.docs[0].data();
    const friendUid = snap.docs[0].id;
    if(!S.friends) S.friends=[];
    if(S.friends.find(f=>f.uid===friendUid)){toast('이미 친구예요!');return;}
    S.friends.push({uid:friendUid, nick:friendData.nick||'친구', lid:friendData.lid||'egg', streak:friendData.streak||0, code});
    sv();
    toast(`✅ ${friendData.nick||'친구'} 추가 완료!`);
    showFriends();
  } catch(e){toast('검색 실패. 잠시 후 다시 시도해주세요');}
}

        <div style="font-size:11px;color:#9CA3AF;margin-top:6px">CSV: 엑셀에서 편집 가능 · JSON: 전체 데이터 백업</div>
      </div>

      <div style="background:#EFF6FF;border-radius:14px;padding:14px">
        <div style="font-size:13px;font-weight:800;color:#1E5FA5;margin-bottom:8px">📥 가져오기</div>

          <button onclick="document.getElementById('json-import').click()" style="flex:1;background:#fff;color:#1E5FA5;border:1.5px solid #BFDBFE;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">JSON 복원</button>
        </div>
        <input type="file" id="csv-import" accept=".csv,.txt" style="display:none" onchange="importCSV(this)">
        <input type="file" id="json-import" accept=".json" style="display:none" onchange="importJSON(this)">
        <div style="font-size:11px;color:#9CA3AF;margin-top:6px">CSV 형식: 영단어,뜻 (한 줄에 하나)</div>
      </div>
    </div>

    <div style="background:#F9FAFB;border-radius:12px;padding:12px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:6px">📊 현재 데이터</div>
      <div style="font-size:12px;color:#6B7280;line-height:1.8">
        단어장: ${S.words.length}개 · 외운 단어: ${Object.values(S.markMap).filter(v=>v===1).length}개<br>
        일기: ${S.dList.length}개 · 출석: ${S.attendCount}일
      </div>
    </div>
    <button onclick="cm()" class="btn bgr">닫기</button>
  </div></div>`;
}

function exportCSV() {
  const rows = ['영단어,한국어뜻,발음기호,예문,암기팁,마크'];
  S.words.forEach(w => {
    const mark = ['미분류','외운','헷갈리는'][getMark(w.en)||0];
    rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.tip||'',mark].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vocabug_단어장_${today()}.csv`;
  a.click();
  toast('✅ CSV 내보내기 완료!');
}

function exportJSON() {
  const data = {
    version: 2,
    exportDate: today(),
    words: S.words,
    markMap: S.markMap,
    srsMap: S.srsMap,
    srsData: S.srsData||{},
    studyLog: S.studyLog,
    attendDates: S.attendDates,
    attendCount: S.attendCount,
    dList: S.dList,
    books: S.books,
    nick: S.nick,
    lid: S.lid,
    xp: S.xp,
    streak: S.streak,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vocabug_백업_${today()}.json`;
  a.click();
  toast('✅ JSON 백업 완료!');
}

function importCSV(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l=>l.trim());
    let cnt = 0;
    // 헤더 스킵
    const start = lines[0].toLowerCase().includes('영단어') ? 1 : 0;
    lines.slice(start).forEach(line => {
      const parts = line.split(',').map(p=>p.trim().replace(/^"|"$/g,'').replace(/""/g,'"'));
      if(parts.length>=2) {
        const en=parts[0], kr=parts[1], ph=parts[2]||'', ex=parts[3]||'', tip=parts[4]||'';
        if(en&&kr&&!S.words.find(w=>w.en.toLowerCase()===en.toLowerCase())) {
          S.words.push({en,kr,ph,ex:ex||en+'.',tip:tip||en+' = '+kr,meanings:[kr],img:'📝'});
          cnt++;
        }
      }
    });
    sv(); cm(); toast(`✅ ${cnt}개 단어 가져오기 완료!`); go('mybooks','list');
  };
  reader.readAsText(file, 'UTF-8');
}

function importJSON(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.words) { toast('올바른 JSON 파일이 아니에요'); return; }
      if(!confirm(`백업 파일에서 ${data.words.length}개 단어를 복원할까요?\n현재 데이터와 합쳐집니다.`)) return;
      let cnt = 0;
      (data.words||[]).forEach(w => {
        if(!S.words.find(x=>x.en.toLowerCase()===w.en.toLowerCase())) {
          S.words.push(w); cnt++;
        }
      });
      // 마크/SRS 병합
      Object.assign(S.markMap, data.markMap||{});
      Object.assign(S.srsMap, data.srsMap||{});
      Object.assign(S.studyLog, data.studyLog||{});
      sv(); cm(); toast(`✅ ${cnt}개 단어 복원 완료!`); go('mybooks','list');
    } catch(err) { toast('파일을 읽을 수 없어요'); }
  };
  reader.readAsText(file);
}

function reqNotif(){
  if(!('Notification' in window)){toast('이 브라우저는 알림을 지원하지 않아요');return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){toast('🔔 알림 허용! 알람이 작동해요');scheduleAlarms();}
    else toast('알림이 차단되어 있어요. 브라우저 설정에서 허용해주세요');
  });
}
