<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#1E5FA5;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;max-height:100dvh;background:#F5F7FF;display:flex;flex-direction:column;overflow:hidden}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
</style>
</head>

const SFX = {
  ctx: null,
  init() { try { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  play(type) {
    try {
      this.init(); const c = this.ctx;
      const g = c.createGain(); g.connect(c.destination);
      const o = c.createOscillator(); o.connect(g);
      if(type==='correct') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);
        [523,659,784].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.4);
      } else if(type==='wrong') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
        o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+.15);
        o.type='sawtooth'; o.start(c.currentTime); o.stop(c.currentTime+.3);
      } else if(type==='levelup') {
        [523,659,784,1047].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.3,c.currentTime+i*.12);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.12+.3);
          oo.start(c.currentTime+i*.12); oo.stop(c.currentTime+i*.12+.3);
        });
      } else if(type==='flip'||type==='tap') {
        g.gain.setValueAtTime(.1,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.08);
        o.frequency.value=type==='flip'?800:600; o.start(c.currentTime); o.stop(c.currentTime+.08);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};
const vib = p => { try { if('vibrate' in navigator) navigator.vibrate(p); } catch(e){} };
const ok = () => { SFX.play('correct'); vib([50,0,50]); };

function scheduleAlarms() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const l = lv(S.lid);
  const msg = rnd(l.alarm);
  const alarms = [
    {cfg:S.alStudy, title:`${l.emoji} WordDay 공부 알람`, body:msg},
    {cfg:S.alDiary, title:`${l.emoji} WordDay 일기 알람`, body:'오늘 일기 아직 안 썼지? 얼른!'},
    {cfg:S.alGoal, title:`${l.emoji} WordDay 목표 알람`, body:'오늘 목표 아직 미완료! 빨리!'},
    {cfg:S.alStreak, title:`${l.emoji} WordDay 스트릭 알람`, body:`${S.streak}일 연속 기록이 끊기기 직전!`},
  ];
  alarms.forEach(({cfg, title, body}) => {
    if(!cfg.on) return;
    const now = new Date();
    const target = new Date();
    target.setHours(cfg.h, cfg.m, 0, 0);
    if(target <= now) target.setDate(target.getDate()+1);
    const delay = target - now;
    if('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({type:'SCHEDULE_ALARM', title, body, delay, tag:title});
    }
  });
}

function startTest() {
  // 각 레벨에서 랜덤으로 5문제씩 추출 (앞 40문제)
  S.tQs = [];
  LEVELS.forEach(l => {
    const pool = TEST_POOL[l.id]||[];
    S.tQs.push(...pick(pool,Math.min(5,pool.length)).map(q=>({...q,lv:l.id,type:'mc'})));
  });
  // 뒤 20문제: 게임 혼합형
  const gameQs = [
    {type:'fill',lv:'egg'},{type:'fill',lv:'baby'},{type:'scramble',lv:'crown'},{type:'scramble',lv:'coco'},
    {type:'wc',lv:'shine'},{type:'wc',lv:'small'},{type:'listen',lv:'baby'},{type:'listen',lv:'crown'},
    {type:'sentence',lv:'egg'},{type:'sentence',lv:'baby'},{type:'match',lv:'egg'},{type:'match',lv:'baby'},
    {type:'chain',lv:'coco'},{type:'wordle',lv:'baby'},{type:'wordle',lv:'crown'},
    {type:'mc',lv:'big'},{type:'mc',lv:'god'},{type:'fill',lv:'shine'},{type:'scramble',lv:'big'},{type:'wc',lv:'god'},
  ];
  S.tQs.push(...shuf(gameQs));
  S.tIdx=0; S.tScore={}; LEVELS.forEach(l=>S.tScore[l.id]=0);
  renderTQ();
}

function renderTQ() {
  if(S.tIdx>=S.tQs.length){finishTest();return;}
  const q=S.tQs[S.tIdx];
  // 게임형 문제는 단순 MC로 처리
  if(q.type!=='mc') {
    const pool=TEST_POOL[q.lv]||TEST_POOL.egg;
    const base=rnd(pool);
    renderMCQ({...base,lv:q.lv});
    return;
  }
  renderMCQ(q);
}

function renderMCQ(q) {
  const l=lv(q.lv), prog=S.tIdx+1;
  // 보기 순서 랜덤
  const cs = shuf(q.c.map((c,i)=>({c,i})));

    <div style="display:flex;align-items:center;gap:8px">

    </div>
    <div style="background:${l.bg};border:2px solid ${l.color}44;border-radius:20px;padding:24px;text-align:center">
      <div style="font-size:64px;margin-bottom:8px">${q.img||'📝'}</div>

    </div>
    <div class="g2">${cs.map((x,ri)=>{
      let cls='topt';
      if(S.tAns){if(ri===correctIdx)cls+=' ok';else if(S.tRes===ri)cls+=' ng';}
      return `<div class="${cls}" onclick="${S.tAns?'':'ansT('+ri+','+correctIdx+',\''+q.lv+'\')'}">${x.c}</div>`;
    }).join('')}</div>
  </div>`;
}

function ansT(sel, correct, lvId) {
  S.tAns=true; S.tRes=sel;
  if(sel===correct){S.tScore[lvId]=(S.tScore[lvId]||0)+1;ok();}else ng();
  renderMCQ(S.tQs[S.tIdx]); // 색상 업데이트
  setTimeout(()=>{S.tIdx++;S.tAns=false;S.tRes=null;renderTQ();},800);
}

  let final='egg';

function rHome() {
  const l=lv(S.lid), tot=S.words.length, done=S.learned.size;
  const pct=tot?Math.round(done/tot*100):0;
  let dday='',tgoal=0,goalDateStr='';
  if(S.goal){
    const diff=Math.ceil((new Date(S.goal)-new Date())/86400000);
    const rem=tot-done; tgoal=diff>0?Math.ceil(rem/diff):rem;
    dday='D-'+Math.max(0,diff);
    goalDateStr=new Date(S.goal).toLocaleDateString('ko-KR');
  }
  const srsToday=Object.entries(S.srsMap).filter(([en,d])=>new Date(d)<=new Date()).length;
  const parts=[];
  parts.push(`<div class="pad">`);
  // 캐릭터+인삿말
  parts.push(cbrow(rnd([`안녕, ${S.nick}! 오늘도 같이 공부하자! 💪`,`${done}개 완료! 정말 잘하고 있어! ✨`,`${l.name} 레벨! 더 높이 올라가자! 🚀`,`오늘도 화이팅! ${l.emoji}`]),S.lid));
  // 레벨 카드
  parts.push(`<div style="background:linear-gradient(135deg,${l.color},${l.color}CC);border-radius:20px;padding:18px;color:#fff">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div><div style="font-size:12px;opacity:.7">${S.nick}의 레벨</div>
        <div style="font-size:20px;font-weight:900">${l.emoji} ${l.name}</div>
        <div style="font-size:11px;opacity:.6;margin-top:2px">${l.desc} · 🔥${S.streak}일 연속</div>
      </div>
      <div style="text-align:right"><div style="font-size:28px;font-weight:900">${pct}%</div>
        <div style="font-size:11px;opacity:.7">${done}/${tot}단어</div></div>
    </div>
    <div style="background:rgba(255,255,255,.25);border-radius:4px;height:7px;overflow:hidden">
      <div style="height:100%;background:#fff;border-radius:4px;width:${pct}%"></div>
    </div>
  </div>`);
  // 오늘 학습 현황
  const studyDone=done>0, gameDone=S.gScore>0;
  parts.push(`<div class="card">
    <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">📚 오늘의 학습 현황</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      ${[['학습',studyDone?'✅':'○',studyDone?'#16A34A':'#9CA3AF'],['게임',gameDone?'✅':'○',gameDone?'#16A34A':'#9CA3AF'],['일기',S.dList[0]?.date===today()?'✅':'○',S.dList[0]?.date===today()?'#16A34A':'#9CA3AF']].map(([lb,ic,c])=>`<div style="text-align:center;background:#F9FAFB;border-radius:12px;padding:10px"><div style="font-size:20px;margin-bottom:2px">${ic}</div><div style="font-size:11px;color:${c};font-weight:700">${lb}</div></div>`).join('')}
    </div>
    ${srsToday>0?`<div style="background:#FFF8E1;border-radius:10px;padding:8px 12px;font-size:12px;color:#E65100;font-weight:600">📖 오늘 복습할 단어 ${srsToday}개 있어요!</div>`:''}
  </div>`);
  // 목표 카드
  if(S.goal) {
    parts.push(`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:14px;font-weight:800;color:#111">🎯 암기 목표</div>
        <div style="display:flex;gap:6px">
          <span class="tag" style="background:#EFF6FF;color:#1E5FA5">${dday}</span>
          <span class="tag" style="background:#F3F4F6;color:#6B7280">${goalDateStr}</span>
        </div>
      </div>
      <div style="font-size:13px;color:#6B7280;margin-bottom:8px">오늘 목표: <strong style="color:#1E5FA5">${tgoal}단어</strong> · 전체 진행률</div>
      <div class="pb"><div class="pf" style="width:${pct}%;background:#1E5FA5"></div></div>
      <div style="display:flex;justify-content:space-around;margin-top:10px">
        ${[['오늘',tgoal+'개'],['남은 단어',(tot-done)+'개'],['완료',done+'개']].map(([lb,v])=>`<div style="text-align:center"><div style="font-size:14px;font-weight:900;color:#1E5FA5">${v}</div><div style="font-size:10px;color:#9CA3AF">${lb}</div></div>`).join('')}
      </div>
    </div>`);
  } else {
    parts.push(`<div class="card" onclick="showGoal()" style="cursor:pointer;background:#EFF6FF;border-color:#BFDBFE;text-align:center;padding:14px">
      <div style="font-size:13px;font-weight:700;color:#1E5FA5">🎯 암기 목표 설정하기</div>
      <div style="font-size:11px;color:#9CA3AF;margin-top:3px">완료 날짜를 정해보세요!</div>
    </div>`);
  }
  // 주간 일정
  parts.push(`<div class="card">
    <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">📅 이번 주 학습</div>
    <div style="display:flex;justify-content:space-around">
      ${DAYS.map((d,i)=>{const a=i<=(new Date().getDay()||7)-1;
        return `<div style="text-align:center"><div style="width:30px;height:30px;border-radius:50%;background:${a?l.color:'#E5E7EB'};display:flex;align-items:center;justify-content:center;font-size:12px;color:${a?'#fff':'#9CA3AF'};margin:0 auto 4px">${a?'✓':''}</div><div style="font-size:10px;color:#9CA3AF">${d}</div></div>`;}).join('')}
    </div>
  </div>`);
  // 상황별 암기 모드
  parts.push(`<div class="card">
    <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">🎧 상황별 암기 모드</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
      ${[['🚇','이동 중','스트리밍','startMode(\'stream\')','#1E5FA5','#EFF6FF'],['🏃','운동 중','오디오','startMode(\'audio\')','#16A34A','#F0FDF4'],['😴','자기 전','수면 모드','startMode(\'sleep\')','#7C3AED','#FDF4FF'],['📚','집중 공부','SRS 암기','startMode(\'srs\')','#E65100','#FFF8E1']].map(([ic,sit,nm,fn,c,bg])=>
        `<div onclick="${fn}" style="background:${bg};border-radius:14px;padding:12px;cursor:pointer;transition:transform .1s" ontouchstart="this.style.transform='scale(.97)'" ontouchend="this.style.transform=''">
          <div style="font-size:24px;margin-bottom:4px">${ic}</div>
          <div style="font-size:11px;color:${c};font-weight:700">${nm}</div>
          <div style="font-size:10px;color:#9CA3AF">${sit}</div>
        </div>`).join('')}
    </div>
  </div>`);
  // 바로가기
  parts.push(`<div class="g2">
    <div class="gc" onclick="go('study','learn')" style="background:#F0FDF4;border-color:#86EFAC"><div style="font-size:36px;margin-bottom:6px">📚</div><div style="font-size:13px;font-weight:800;color:#16A34A">오늘 학습</div><div style="font-size:11px;color:#9CA3AF">플래시카드</div></div>
    <div class="gc" onclick="go('games')" style="background:#EDE7F6;border-color:#B39DDB"><div style="font-size:36px;margin-bottom:6px">🎮</div><div style="font-size:13px;font-weight:800;color:#6A1B9A">게임 센터</div><div style="font-size:11px;color:#9CA3AF">12종 게임</div></div>
  </div>`);
  parts.push(`</div>`);
  return parts.join('');
}

// ── 목표 설정 ──
function showGoal() {
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:17px;font-weight:800;color:#111;margin-bottom:16px">🎯 암기 목표 설정</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button id="tab-date" onclick="goalTab('date')" style="flex:1;padding:10px;border-radius:10px;background:#1E5FA5;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer">📅 날짜 지정</button>
      <button id="tab-period" onclick="goalTab('period')" style="flex:1;padding:10px;border-radius:10px;background:#F3F4F6;color:#6B7280;border:none;font-size:13px;font-weight:700;cursor:pointer">📆 기간 선택</button>
    </div>
    <div id="goal-date-view">
      <input type="date" id="gd" style="margin-bottom:10px" min="${today()}">
    </div>
    <div id="goal-period-view" style="display:none">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
        ${[7,14,30,60,90,180].map(d=>{const dt=new Date(Date.now()+d*86400000).toISOString().slice(0,10);
          return `<button onclick="document.getElementById('gd').value='${dt}';goalTab('date')" style="background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#1E5FA5">${d}일</button>`;}).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:13px;color:#6B7280">직접 입력:</span>
        <input id="custom-days" type="number" placeholder="45" style="width:80px;text-align:center" min="1" max="365">
        <span style="font-size:13px;color:#6B7280">일</span>
        <button onclick="const d=+document.getElementById('custom-days').value;if(d>0){const dt=new Date(Date.now()+d*86400000).toISOString().slice(0,10);document.getElementById('gd').value=dt;goalTab('date');}" style="background:#1E5FA5;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer">적용</button>
      </div>
    </div>
    <div id="goal-calc" style="background:#F0FDF4;border-radius:12px;padding:10px;margin:10px 0;font-size:12px;color:#16A34A;display:none"></div>
    <button class="btn bb" onclick="svGoal()">목표 설정</button>
    <button class="btn bgr" onclick="cm()" style="margin-top:8px">닫기</button>
  </div></div>`;
  document.getElementById('gd').addEventListener('change',e=>{
    const diff=Math.ceil((new Date(e.target.value)-new Date())/86400000);
    const tgoal=diff>0?Math.ceil(S.words.length/diff):0;
    const calc=document.getElementById('goal-calc');
    if(diff>0){calc.style.display='block';calc.textContent=`D-${diff} · 하루 목표 ${tgoal}단어`;}
  });
}
function goalTab(t) {
  document.getElementById('goal-date-view').style.display=t==='date'?'block':'none';
  document.getElementById('goal-period-view').style.display=t==='period'?'block':'none';
  document.getElementById('tab-date').style.background=t==='date'?'#1E5FA5':'#F3F4F6';
  document.getElementById('tab-date').style.color=t==='date'?'#fff':'#6B7280';
  document.getElementById('tab-period').style.background=t==='period'?'#1E5FA5':'#F3F4F6';
  document.getElementById('tab-period').style.color=t==='period'?'#fff':'#6B7280';
}
function svGoal(){const d=document.getElementById('gd')?.value;if(!d){toast('날짜를 선택하세요');return;}S.goal=d;S.goalTotal=S.words.length;sv();cm();go('home');toast('목표 설정 완료!');}

// ── 상황별 암기 모드 ──
function startMode(type) {
  if(!S.words.length){toast('단어가 없어요!');return;}
  if(type==='stream') showStreamMode();
  else if(type==='audio') showAudioMode();
  else if(type==='sleep') showSleepMode();
  else if(type==='srs') showSRSMode();
}

function showStreamMode() {
  let idx=0, speed=3000, timer=null;
  const render=()=>{
    const w=S.words[idx%S.words.length];
    document.getElementById('mode-word').innerHTML=`<div style="font-size:80px;margin-bottom:12px">${w.img||'📝'}</div>
      <div style="font-size:30px;font-weight:900;color:#1E5FA5;font-family:monospace;margin-bottom:6px">${w.en}</div>
      <div style="font-size:18px;color:#374151;font-weight:700;margin-bottom:6px">${w.kr}</div>
      <div style="font-size:13px;color:#6B7280;font-style:italic">"${w.ex}"</div>
      <div style="margin-top:10px;font-size:12px;color:#D1D5DB">${idx+1}/${S.words.length}</div>`;
  };
  const start=()=>{render();timer=setInterval(()=>{idx=(idx+1)%S.words.length;render();},speed);};
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="background:#1A1A2E;border-radius:24px 24px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:14px;font-weight:800;color:#fff">🚇 스트리밍 모드</div>
      <button onclick="clearInterval(timer);cm()" style="background:rgba(255,255,255,.1);border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px">종료</button>
    </div>
    <div id="mode-word" style="text-align:center;padding:20px 0;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="clearInterval(timer);idx=(idx-1+S.words.length)%S.words.length;render();start()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏮</button>
      <button onclick="clearInterval(timer);timer=null;this.textContent=timer?'⏸':'▶';if(!timer)start();else{clearInterval(timer);timer=null;}" id="play-btn" style="background:#1E5FA5;border:none;border-radius:10px;padding:10px;flex:2;color:#fff;cursor:pointer;font-size:18px">⏸</button>
      <button onclick="clearInterval(timer);idx=(idx+1)%S.words.length;render();start()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏭</button>
    </div>
    <div style="margin-top:10px">
      <div style="font-size:12px;color:#6B7280;margin-bottom:6px;text-align:center">속도</div>
      <div style="display:flex;gap:6px;justify-content:center">
        ${[['느리게',5000],['보통',3000],['빠르게',1500]].map(([lb,s])=>`<button onclick="clearInterval(timer);speed=${s};start();document.querySelectorAll('.sp-btn').forEach(b=>b.style.background='rgba(255,255,255,.1)');this.style.background='#1E5FA5'" class="sp-btn" style="background:${speed===s?'#1E5FA5':'rgba(255,255,255,.1)'};border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">${lb}</button>`).join('')}
      </div>
    </div>
  </div></div>`;
  start();
}

function showAudioMode() {
  let idx=0, playing=false, timer=null;
  const speakWord=(w)=>{
    return new Promise(res=>{
      try{
        window.speechSynthesis.cancel();
        const sayEn=new SpeechSynthesisUtterance(w.en); sayEn.lang='en-US'; sayEn.rate=0.85;
        const sayKr=new SpeechSynthesisUtterance(w.kr); sayKr.lang='ko-KR'; sayKr.rate=0.9;
        const sayEx=new SpeechSynthesisUtterance(w.ex); sayEx.lang='en-US'; sayEx.rate=0.8;
        sayEx.onend=()=>setTimeout(res,500);
        window.speechSynthesis.speak(sayEn);
        window.speechSynthesis.speak(sayKr);
        window.speechSynthesis.speak(sayEx);
      }catch(e){res();}
    });
  };
  const playNext=async()=>{
    if(!playing) return;
    const w=S.words[idx%S.words.length];
    document.getElementById('audio-word').innerHTML=`<div style="font-size:64px;margin-bottom:8px">${w.img||'🔊'}</div>
      <div style="font-size:26px;font-weight:900;color:#fff;font-family:monospace">${w.en}</div>
      <div style="font-size:16px;color:rgba(255,255,255,.8);margin-top:4px">${w.kr}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:8px;font-style:italic">${w.ex}</div>
      <div style="margin-top:8px;font-size:12px;color:rgba(255,255,255,.4)">${idx+1}/${S.words.length}</div>`;
    await speakWord(w);
    idx=(idx+1)%S.words.length;
    if(playing) playNext();
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="background:linear-gradient(160deg,#1A1A2E,#16213E);border-radius:24px 24px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:14px;font-weight:800;color:#fff">🏃 오디오 모드</div>
      <button onclick="playing=false;window.speechSynthesis.cancel();cm()" style="background:rgba(255,255,255,.1);border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px">종료</button>
    </div>
    <div style="text-align:center;padding:10px 0">
      <div class="wave" style="justify-content:center;margin-bottom:16px">${[1,2,3,4,5].map(i=>`<div class="wave-bar" style="background:#1E5FA5;height:20px;animation-delay:${i*.1}s"></div>`).join('')}</div>
    </div>
    <div id="audio-word" style="text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="playing=false;window.speechSynthesis.cancel();idx=(idx-1+S.words.length)%S.words.length;playing=true;playNext()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:12px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏮</button>
      <button id="audio-play-btn" onclick="if(playing){playing=false;window.speechSynthesis.cancel();this.textContent='▶';}else{playing=true;this.textContent='⏸';playNext();}" style="background:#1E5FA5;border:none;border-radius:10px;padding:12px;flex:2;color:#fff;cursor:pointer;font-size:20px;font-weight:700">⏸</button>
      <button onclick="playing=false;window.speechSynthesis.cancel();idx=(idx+1)%S.words.length;playing=true;playNext()" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:12px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏭</button>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:10px">화면이 꺼져도 계속 재생돼요</div>
  </div></div>`;
  playing=true; playNext();
}

function showSleepMode() {
  let idx=0, sleepTimer=null, autoTimer=null;
  const render=()=>{
    const w=S.words[idx%S.words.length];
    document.getElementById('sleep-word').innerHTML=`<div style="font-size:56px;margin-bottom:12px;opacity:.6">${w.img||'✨'}</div>
      <div style="font-size:26px;font-weight:900;color:rgba(255,255,255,.9);font-family:monospace">${w.en}</div>
      <div style="font-size:16px;color:rgba(255,255,255,.5);margin-top:6px">${w.kr}</div>`;
  };
  const start=(mins)=>{
    clearInterval(sleepTimer); clearTimeout(autoTimer);
    render();
    sleepTimer=setInterval(()=>{idx=(idx+1)%S.words.length;render();},5000);
    if(mins) autoTimer=setTimeout(()=>{clearInterval(sleepTimer);cm();},mins*60000);
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="background:#0D0D1A;border-radius:24px 24px 0 0;padding-bottom:40px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="font-size:14px;font-weight:800;color:rgba(255,255,255,.6)">😴 수면 모드</div>
      <button onclick="clearInterval(sleepTimer);clearTimeout(autoTimer);cm()" style="background:rgba(255,255,255,.05);border:none;border-radius:8px;padding:6px 12px;color:rgba(255,255,255,.5);cursor:pointer;font-size:12px">종료</button>
    </div>
    <div id="sleep-word" style="text-align:center;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div>

async function handleFile(input){
  const file=input.files[0];if(!file)return;
  S.ai=true;go('study','add');
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:'이미지에서 영어 단어들을 찾아 JSON 배열로만 반환. 형식: [{"en":"word","kr":"뜻"}]'}]}]})});
    const d=await resp.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    showExtracted(JSON.parse(txt));
  }catch(e){toast('추출 실패. API 키가 필요해요.');}
  S.ai=false;go('study','add');
}
function showExtracted(words){
  let sel=new Set(words.map((_,i)=>i));
  const rl=()=>{const el=document.getElementById('ext-list');if(!el)return;el.innerHTML=words.map((w,i)=>`<div onclick="togW(${i})" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6;cursor:pointer"><div style="width:24px;height:24px;border-radius:50%;background:${sel.has(i)?'#16A34A':'#E5E7EB'};display:flex;align-items:center;justify-content:center;font-size:12px;color:${sel.has(i)?'#fff':'#9CA3AF'};flex-shrink:0">${sel.has(i)?'✓':''}</div><span style="font-weight:700;font-family:monospace;color:#1E5FA5">${w.en}</span><span style="color:#6B7280">${w.kr}</span></div>`).join('');};
  window.togW=i=>{sel.has(i)?sel.delete(i):sel.add(i);rl();};
  window.svExt=()=>{const add=words.filter((_,i)=>sel.has(i));add.forEach(w=>{if(!S.words.find(x=>x.en===w.en))S.words.push({...w,ph:'',ex:w.en+'.',tip:w.en+' = '+w.kr,meanings:[w.kr],img:'📝'});});sv();cm();toast(`✅ ${add.length}개 추가!`);go('study','add');};
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:16px;font-weight:800">추출 단어 ${words.length}개</div></div><div id="ext-list" style="max-height:280px;overflow-y:auto"></div><button class="btn bg" onclick="svExt()" style="margin-top:12px">선택 단어 저장</button><button class="btn bgr" onclick="cm()" style="margin-top:8px">닫기</button></div></div>`;
  rl();
}

function startGameW(id, ws) {
  SFX.playBG(); vib(30);
  const src=ws||(S.words.length>=2?S.words:(DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  S.gameId=id; S.gDone=false; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput='';
  S.gWords=pick(src,Math.min(8,src.length));
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='wc'){const pool=src.filter(w=>w.en.length>=3);S.wcWord=pool.length?rnd(pool):src[0];S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;}
  if(id==='sentence'||id==='ssort'){const sts=[{kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing','yesterday']},{kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are','sad']},{kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach','Korean']}];S.sbS=rnd(sts);S.sbP=shuf([...S.sbS.words,...S.sbS.wrong.slice(0,2)]);S.sbC=[];S.sbAns=false;S.sbOk=false;if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}
  S.tab='game'; go();
}

function ghdr(title,prog){const grd=GGRADS[S.gameId]||GGRADS.quiz;return `<div style="background:${grd};padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0"><button onclick="SFX.stopBG();go('games')" style="background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;color:#fff">← 나가기</button><div style="font-size:14px;font-weight:800;color:#fff">${title}</div><div style="font-size:12px;color:rgba(255,255,255,.8)">${prog}</div></div>`;}

    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#1E5FA5"></div></div>

}
function ansQ(c,ok2){S.gAns=true;S.gRes=c===ok2?'ok':'ng';if(c===ok2){S.gScore+=100;ok();}else ng();go();setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;if(S.gIdx>=S.gWords.length)S.gDone=true;go();},900);}

function rFill(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}

function rTyping(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const isSc=S.gameId==='scramble';
  const sc=shuf([...w.en]).join('');

    ${cbrow(S.gAns?(S.gRes==='ok'?'완벽해! 🎉':'아쉬워! 💪'):isSc?'섞인 철자를 올바르게 써봐!':'뜻을 보고 영단어를 써봐!',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#EC4899"></div></div>
    <div style="background:${grad};border-radius:20px;padding:24px;text-align:center">
      <div style="font-size:72px;margin-bottom:8px">${w.img||'📝'}</div>

    <button class="btn" onclick="chkT('${w.en}')" ${S.gAns?'disabled':''} style="background:#EC4899;color:#fff">확인</button>

function chkT(ok2){const v=(document.getElementById('ti')?.value||'').trim().toLowerCase();const r=v===ok2.toLowerCase();S.gAns=true;S.gRes=r?'ok':'ng';if(r){S.gScore+=100;ok();}else{ng();toast('❌ 정답: '+ok2);}go();setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;S.gInput='';if(S.gIdx>=S.gWords.length)S.gDone=true;go();},1000);}

// 단어 완성하기
function rWC(){
  if(!S.wcWord){S.gDone=true;return rGame();}
  const w=S.wcWord;
  const visibleWord=S.wcLetters.map((l,i)=>{
    if(!l.hidden||S.wcGuessed.has(i)) return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:#1E5FA5;margin:0 2px;border-bottom:3px solid #1E5FA5;padding:0 4px">${l.letter.toUpperCase()}</span>`;
    return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:transparent;margin:0 2px;border-bottom:3px solid ${S.wcWrong>=6?'#DC2626':'#BFDBFE'};padding:0 4px">_</span>`;
  }).join('');
  const allDone=S.wcLetters.every((l,i)=>!l.hidden||S.wcGuessed.has(i));
  if(allDone){S.gScore+=Math.max(0,(6-S.wcWrong)*20);ok();setTimeout(()=>{const pool=(S.words.length>=2?S.words:DEFAULT_WORDS[S.lid]).filter(ww=>ww.en.length>=3);S.wcWord=rnd(pool);S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;S.gIdx++;if(S.gIdx>=S.gWords.length){S.gDone=true;}go();},800);}
  const alpha='abcdefghijklmnopqrstuvwxyz'.split('');
  const usedWrong=new Set([...S.wcGuessed].filter(i=>!S.wcLetters[i]?.hidden).map(()=>null));
  return ghdr('🔡 단어 완성하기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.wcWrong>=6?'아쉬워! 다음엔 꼭!':allDone?'맞췄어! 🎉':'빈칸의 글자를 채워봐! 🔡',S.lid,allDone?'happy':S.wcWrong>=6?'sad':'normal')}
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:20px;padding:20px;text-align:center;border:3px solid #BFDBFE">
      <div style="font-size:64px;margin-bottom:8px">${w.img||'📝'}</div>
      <div style="font-size:14px;color:#6B7280;margin-bottom:8px">뜻: <strong style="color:#1E5FA5">${w.kr}</strong></div>
      <div style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0">${visibleWord}</div>
      <div style="font-size:12px;color:#9CA3AF;margin-top:8px">오답: ${S.wcWrong}/6</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">
      ${alpha.map(letter=>{const guessedIdx=S.wcLetters.findIndex((l,i)=>l.letter===letter&&l.hidden&&S.wcGuessed.has(i));const isCorrect=guessedIdx>=0;const isWrong=[...S.wcGuessed].some(i=>S.wcLetters[i]?.letter===letter&&!S.wcLetters[i]?.hidden)||(!isCorrect&&[...Array(26)].some((_,i)=>S.wcGuessed.has&&false));
        return `<button onclick="guessWC('${letter}')" style="width:32px;height:36px;background:${isCorrect?'#DCFCE7':isWrong?'#FEE2E2':'#fff'};border:1.5px solid ${isCorrect?'#86EFAC':isWrong?'#FECDD3':'#E5E7EB'};border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;color:${isCorrect?'#16A34A':isWrong?'#DC2626':'#111'}">${letter.toUpperCase()}</button>`;}).join('')}
    </div>
  </div>`;
}
function guessWC(letter){
  SFX.play('tap');vib(20);
  const hits=S.wcLetters.reduce((acc,l,i)=>{if(l.letter===letter&&l.hidden&&!S.wcGuessed.has(i)){acc.push(i);}return acc;},[]);
  if(hits.length>0){hits.forEach(i=>S.wcGuessed.add(i));ok();}
  else{S.wcWrong++;ng();if(S.wcWrong>=6){setTimeout(()=>{S.gIdx++;if(S.gIdx>=S.gWords.length)S.gDone=true;const pool=(S.words.length>=2?S.words:DEFAULT_WORDS[S.lid]).filter(ww=>ww.en.length>=3);S.wcWord=rnd(pool);S.wcLetters=S.wcWord.en.split('').map((l,i2)=>{const hide=Math.random()<.5&&i2>0&&i2<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;go();},1000);}  }
  go();
}

function rMatch(){
  const all=S.mMatched.size>=S.mPairs.length*2;
  if(all&&!S.gDone){S.gDone=true;S.gScore=S.mScore;setTimeout(()=>go(),300);}
  return ghdr('⚡ 스피드 매칭',`${S.mMatched.size/2}/${S.mPairs.length}`)+`<div class="pad">
    ${cbrow(all?'완벽해! 🎉':'단어와 뜻을 탭해서 짝 맞추자!',S.lid,all?'happy':'normal')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

    tw.forEach(w=>{
      const u=(S.dTr||S.dText).toLowerCase().includes(w.en.toLowerCase());
      parts.push('<button onclick="S.dText=(S.dText+\' \'+\'' + w.en + '\').trim();go()" style="padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:' + (u?'#DCFCE7':'#F3F4F6') + ';color:' + (u?'#16A34A':'#374151') + ';border:1.5px solid ' + (u?'#86EFAC':'#E5E7EB') + '">' + (w.img||'') + ' ' + (u?'✓ ':'') + w.en + '</button>');
    });
    parts.push('</div></div>');
  }
  parts.push('<textarea id="dt" placeholder="한국어 또는 영어로 오늘 하루를 써보세요..." style="min-height:110px;resize:none;line-height:1.7" oninput="S.dText=this.value">' + (S.dText||'') + '</textarea>');
  parts.push('<div style="display:flex;gap:8px">');
  parts.push('<button class="btn bb" onclick="trDiary()" ' + (S.ai?'disabled':'') + ' style="flex:1">' + (S.ai?'번역 중...':'🌐 영어로 번역') + '</button>');
  parts.push('<button onclick="dHelpFn()" ' + (S.ai?'disabled':'') + ' style="background:#FDF4FF;border:1.5px solid #E9D5FF;border-radius:14px;padding:14px;font-size:13px;font-weight:700;cursor:pointer;color:#7C3AED;white-space:nowrap">✨ 교정</button>');
  parts.push('</div>');
  if(S.dTr){
    parts.push('<div class="card" style="background:#F0FDF4;border-color:#86EFAC"><div style="font-size:11px;font-weight:700;color:#16A34A;margin-bottom:5px">✅ AI 번역</div><div style="font-size:13px;color:#14532D;line-height:1.8">' + S.dTr + '</div></div>');
  }
  if(S.dHelp){
    parts.push('<div class="card" style="background:#FDF4FF;border-color:#E9D5FF"><div style="font-size:12px;color:#4C1D95;line-height:1.7;white-space:pre-wrap">' + S.dHelp + '</div></div>');
  }
  if(S.dSaved){
    parts.push('<div class="card" style="background:#F0FDF4;border-color:#86EFAC;text-align:center;padding:18px">' + charSVG(S.lid,50,'happy') + '<div style="font-size:15px;font-weight:800;color:#15803D;margin:8px 0">저장 완료! 🎉</div><button class="btn bb" onclick="S.dText=\'\';S.dTr=\'\';S.dHelp=\'\';S.dMood=\'😊\';S.dSaved=false;go()">새 일기 쓰기</button></div>');
  } else {
    parts.push('<button class="btn bg" onclick="svDiary()">💾 일기 저장</button>');
  }
  parts.push('</div>');
  return parts.join('');
}

async function trDiary(){
  if(!S.dText.trim()){toast('일기를 먼저 써주세요');return;}
  S.ai=true; go();
  const ws=S.words.slice(0,6).map(w=>w.en).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:'한국어 일기를 자연스러운 영어로 번역. 가능하면 단어 포함: '+ws+'. 번역만 출력.\n"'+S.dText+'"'}]})});
    const d=await r.json(); S.dTr=d.content?.[0]?.text?.trim()||'';
  }catch(e){toast('AI 오류. API 키가 필요해요.');}
  S.ai=false; go();
}
async function dHelpFn(){
  if(!(S.dTr||S.dText).trim()){toast('일기를 먼저 써주세요');return;}
  S.ai=true; go();
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:'영어 교정 및 자연스러운 표현 제안. 한국어로.\n"'+(S.dTr||S.dText)+'"'}]})});
    const d=await r.json(); S.dHelp=d.content?.[0]?.text?.trim()||'';
  }catch(e){toast('AI 오류.');}
  S.ai=false; go();
}
function svDiary(){
  if(!S.dText.trim()&&!S.dTr.trim()){toast('일기를 써주세요');return;}
  S.dList.unshift({date:today(),mood:S.dMood,kr:S.dText,en:S.dTr,id:Date.now()});
  if(S.dList.length>100) S.dList.pop();
  S.dSaved=true; addXP(10); sv(); go();
}
function rDiaryList(){
  const parts=[];
  parts.push('<div class="pad">');
  parts.push('<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:16px;font-weight:800;color:#111">📖 일기 목록</div><button onclick="S.dView=null;go()" style="background:#1E5FA5;color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer">✏️ 새 일기</button></div>');
  if(!S.dList.length){
    parts.push('<div class="card" style="text-align:center;padding:30px">'+charSVG(S.lid,50)+'<div style="font-size:14px;color:#9CA3AF;margin-top:10px">아직 일기가 없어요</div></div>');
  } else {
    S.dList.forEach(e=>{
      parts.push('<div class="card" onclick="vwDiary('+e.id+')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:13px;font-weight:700;color:#374151">'+e.date+' '+e.mood+'</div><button onclick="event.stopPropagation();if(confirm(\'삭제?\')){S.dList=S.dList.filter(d=>d.id!=='+e.id+');sv();go();}" style="background:none;border:none;color:#FCA5A5;font-size:16px;cursor:pointer">×</button></div><div style="font-size:13px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(e.kr||e.en||'(내용 없음)')+'</div></div>');
    });
  }
  parts.push('</div>');
  return parts.join('');
}
function vwDiary(id){
  const e=S.dList.find(d=>d.id===id); if(!e)return;
  document.getElementById('mr').innerHTML='<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-size:16px;font-weight:800">'+e.date+' '+e.mood+'</div><button onclick="cm()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#9CA3AF">×</button></div>'+(e.kr?'<div style="font-size:14px;color:#374151;line-height:1.8;margin-bottom:12px">'+e.kr+'</div>':'')+(e.en?'<div style="background:#F0FDF4;border-radius:12px;padding:14px"><div style="font-size:11px;font-weight:700;color:#16A34A;margin-bottom:6px">영어 번역</div><div style="font-size:13px;color:#14532D;line-height:1.8">'+e.en+'</div></div>':'')+'<button class="btn bgr" onclick="cm()" style="margin-top:14px">닫기</button></div></div>';
}

// ── 프로필 탭 ──
function rProfile(){
  const l=lv(S.lid);
  const parts=[];
  parts.push('<div class="pad">');
  // 캐릭터
  parts.push('<div style="text-align:center;padding:16px 0"><div style="margin-bottom:12px">'+charSVG(S.lid,80)+'</div><div style="font-size:20px;font-weight:900;color:#111;margin-bottom:4px">'+S.nick+'</div><div style="display:inline-block;background:'+l.bg+';color:'+l.color+';border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700">'+l.emoji+' '+l.name+' · '+l.desc+'</div></div>');
  // 통계
  parts.push('<div class="g2">');
  [['📖',S.words.length+'개','단어장','#1E5FA5'],['✅',S.learned.size+'개','완료','#16A34A'],['🔥',S.streak+'일','연속','#D97706'],['📝',S.dList.length+'개','일기','#880E4F']].forEach(([ic,v,lb,c])=>{
    parts.push('<div class="card" style="text-align:center;padding:12px"><div style="font-size:22px;margin-bottom:4px">'+ic+'</div><div style="font-size:20px;font-weight:900;color:'+c+'">'+v+'</div><div style="font-size:11px;color:#9CA3AF">'+lb+'</div></div>');
  });
  parts.push('</div>');
  // 성장 단계
  parts.push('<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px">🦋 성장 단계</div><div style="display:flex;justify-content:space-around">');
  LEVELS.forEach(lx=>{
    parts.push('<div style="text-align:center;opacity:'+(lx.min<=S.xp?1:.3)+'"><div style="font-size:'+(lx.id===S.lid?'22px':'16px')+'">'+lx.emoji+'</div><div style="font-size:9px;color:'+(lx.id===S.lid?lx.color:'#D1D5DB')+';font-weight:'+(lx.id===S.lid?'700':'400')+'">'+lx.name.split(' ')[0]+'</div></div>');
  });
  parts.push('</div></div>');
  // 학습 스타일
  if(S.studyStyle){
    parts.push('<div class="card" style="background:#EFF6FF;border-color:#BFDBFE"><div style="font-size:12px;color:#1E5FA5;font-weight:700;margin-bottom:4px">나의 학습 스타일</div><div style="font-size:15px;font-weight:800;color:#1E5FA5">📌 '+S.studyStyle+'</div><button onclick="S.surveyDone=false;S.surveyAns=[];sv();showSurvey()" style="background:none;border:none;font-size:12px;color:#9CA3AF;cursor:pointer;margin-top:6px">다시 설문하기</button></div>');
  }
  // 알람 설정
  parts.push('<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px">🔔 알람 설정</div>');
  [
    ['alStudy','📖','공부 알람'],
    ['alDiary','✍️','일기 알람'],
    ['alGoal','🎯','목표 미달성'],
    ['alStreak','🔥','연속학습 위기'],
  ].forEach(([k,ic,nm])=>{
    const cfg=S[k];
    parts.push('<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F3F4F6">');
    parts.push('<span style="font-size:18px">'+ic+'</span>');
    parts.push('<div style="flex:1"><div style="font-size:13px;font-weight:600;color:#111">'+nm+'</div>');
    parts.push('<div style="font-size:11px;color:#9CA3AF">'+p2(cfg.h)+':'+p2(cfg.m)+'</div></div>');
    parts.push('<button onclick="showAlarmEdit(\''+k+'\')" style="background:#EFF6FF;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#1E5FA5;margin-right:6px">시간</button>');
    parts.push('<button class="toggle '+(cfg.on?'on':'')+'" onclick="S.'+k+'.on=!S.'+k+'.on;sv();scheduleAlarms();go()"><div class="tk"></div></button>');
    parts.push('</div>');
  });
  parts.push('<button onclick="reqNotif()" style="background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#1E5FA5;width:100%;margin-top:10px">🔔 알림 권한 허용</button>');
  parts.push('</div>');
  // 목표 설정
  parts.push('<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">🎯 목표 날짜</div>');
  if(S.goal){
    const diff=Math.ceil((new Date(S.goal)-new Date())/86400000);
    parts.push('<div style="font-size:13px;color:#374151;margin-bottom:8px">목표일: <strong style="color:#1E5FA5">'+S.goal+'</strong> (D-'+Math.max(0,diff)+')</div>');
    parts.push('<div style="display:flex;gap:8px"><button onclick="showGoal()" style="flex:1;background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;color:#1E5FA5">수정</button><button onclick="S.goal=null;sv();go()" style="flex:1;background:#FFF1F2;border:1.5px solid #FECDD3;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;color:#DC2626">삭제</button></div>');
  } else {
    parts.push('<button onclick="showGoal()" class="btn bb">목표 날짜 설정하기</button>');
  }
  parts.push('</div>');
  // 테스트 기록
  if(S.tHistory.length){
    parts.push('<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">📊 테스트 기록</div>');
    S.tHistory.slice(0,5).forEach(h=>{
      const l2=lv(h.level);
      parts.push('<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3F4F6"><span style="font-size:18px">'+l2.emoji+'</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#111">'+l2.name+'</div><div style="font-size:11px;color:#9CA3AF">'+h.date+'</div></div><span class="tag" style="background:'+l2.bg+';color:'+l2.color+'">'+h.score+'/'+h.total+'점</span></div>');
    });
    parts.push('</div>');
  }
  // 닉네임 변경
  parts.push('<div class="card"><div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px">✏️ 닉네임 변경</div><div style="display:flex;gap:8px"><input id="cnk" placeholder="새 닉네임" value="'+S.nick+'" style="flex:1"><button onclick="const v=document.getElementById(\'cnk\')?.value.trim();if(v){S.nick=v;sv();toast(\'닉네임 변경!\');go();}" style="background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer">변경</button></div></div>');
  // 버튼들
  parts.push('<button class="btn" onclick="showTestIntro(true)" style="background:#FFF8E1;color:#E65100;border:1.5px solid #FFE082">📝 레벨 재테스트</button>');
  parts.push('<button class="btn bgr" onclick="if(confirm(\'로그아웃?\')){auth.signOut();}">로그아웃</button>');
  parts.push('</div>');
  return parts.join('');
}

function showAlarmEdit(key){
  const cfg=S[key];
  document.getElementById('mr').innerHTML='<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">'+
  '<div style="font-size:16px;font-weight:800;color:#111;margin-bottom:16px;text-align:center">⏰ 알람 시간 설정</div>'+
  '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px">'+
    '<div style="text-align:center">'+
      '<button onclick="S[\''+key+'\'].h=(S[\''+key+'\'].h+1)%24;document.getElementById(\'ah\').textContent=p2(S[\''+key+'\'].h)" style="background:#EFF6FF;border:none;border-radius:8px;padding:6px 20px;font-size:18px;cursor:pointer;color:#1E5FA5;font-weight:700">▲</button>'+
      '<div id="ah" style="font-size:40px;font-weight:900;color:#1E5FA5;min-width:70px;text-align:center;background:#EFF6FF;border-radius:12px;padding:10px;margin:6px 0">'+p2(cfg.h)+'</div>'+
      '<button onclick="S[\''+key+'\'].h=(S[\''+key+'\'].h-1+24)%24;document.getElementById(\'ah\').textContent=p2(S[\''+key+'\'].h)" style="background:#EFF6FF;border:none;border-radius:8px;padding:6px 20px;font-size:18px;cursor:pointer;color:#1E5FA5;font-weight:700">▼</button>'+
      '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">시</div>'+
    '</div>'+
    '<div style="font-size:32px;font-weight:900;color:#9CA3AF;margin-bottom:20px">:</div>'+
    '<div style="text-align:center">'+
      '<button onclick="S[\''+key+'\'].m=(S[\''+key+'\'].m+5)%60;document.getElementById(\'am\').textContent=p2(S[\''+key+'\'].m)" style="background:#EFF6FF;border:none;border-radius:8px;padding:6px 20px;font-size:18px;cursor:pointer;color:#1E5FA5;font-weight:700">▲</button>'+
      '<div id="am" style="font-size:40px;font-weight:900;color:#1E5FA5;min-width:70px;text-align:center;background:#EFF6FF;border-radius:12px;padding:10px;margin:6px 0">'+p2(cfg.m)+'</div>'+
      '<button onclick="S[\''+key+'\'].m=(S[\''+key+'\'].m-5+60)%60;document.getElementById(\'am\').textContent=p2(S[\''+key+'\'].m)" style="background:#EFF6FF;border:none;border-radius:8px;padding:6px 20px;font-size:18px;cursor:pointer;color:#1E5FA5;font-weight:700">▼</button>'+
      '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">분</div>'+
    '</div>'+
  '</div>'+
  '<button class="btn bb" onclick="sv();scheduleAlarms();cm();go()">저장</button>'+
  '<button class="btn bgr" onclick="cm()" style="margin-top:8px">취소</button>'+
  '</div></div>';
}

function reqNotif(){
  if(!('Notification' in window)){toast('이 브라우저는 알림을 지원하지 않아요');return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){toast('🔔 알림 허용! 알람이 작동해요');scheduleAlarms();}
    else toast('알림이 차단되어 있어요. 브라우저 설정에서 허용해주세요');
  });
}

</script>
