/* 캐릭터 미세 움직임 */
@keyframes float {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  33%      { transform: translateY(-5px) rotate(0.5deg); }
  66%      { transform: translateY(-3px) rotate(-0.5deg); }
}
@keyframes float-sad {
  0%,100% { transform: translateY(0px) rotate(-1deg) scale(0.98); }
  50%      { transform: translateY(-2px) rotate(1deg) scale(0.97); }
}
@keyframes float-angry {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  20%      { transform: translateY(-1px) rotate(1.5deg); }
  40%      { transform: translateY(1px) rotate(-1.5deg); }
  60%      { transform: translateY(-1px) rotate(1deg); }
  80%      { transform: translateY(0px) rotate(-1deg); }
}
@keyframes float-happy {
  0%,100% { transform: translateY(0px) scale(1) rotate(0deg); }
  25%      { transform: translateY(-7px) scale(1.02) rotate(1deg); }
  50%      { transform: translateY(-5px) scale(1.01) rotate(-0.5deg); }
  75%      { transform: translateY(-8px) scale(1.02) rotate(0.5deg); }
}
@keyframes float-danger {
  0%,100% { transform: translateY(0px) scale(0.96) rotate(-1deg); }
  50%      { transform: translateY(2px) scale(0.95) rotate(1deg); }
}
@keyframes wiggle {
  0%,100% { transform: rotate(0deg); }
  25%      { transform: rotate(-2deg); }
  75%      { transform: rotate(2deg); }
}
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.025); }
}
@keyframes antenna-wave {
  0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
  50%      { transform: rotate(3deg); transform-origin: bottom center; }
}
@keyframes tail-wag {
  0%,100% { transform: rotate(0deg); }
  33%      { transform: rotate(2deg); }
  66%      { transform: rotate(-2deg); }
}
.char-float        { animation: float 3.5s ease-in-out infinite; }
.char-float-happy  { animation: float-happy 2.8s ease-in-out infinite; }
.char-float-sad    { animation: float-sad 5s ease-in-out infinite; }
.char-float-angry  { animation: float-angry 1.6s ease-in-out infinite; }
.char-float-danger { animation: float-danger 6s ease-in-out infinite; }
.char-wiggle       { animation: wiggle 2.5s ease-in-out infinite; }
.char-breathe      { animation: breathe 4s ease-in-out infinite; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg,#FAF8F5);display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:430px;height:100%;height:100svh;height:-webkit-fill-available;background:var(--bg,#FAF8F5);display:flex;flex-direction:column;overflow:hidden;position:relative}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);cursor:pointer}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;width:100%}
.body::-webkit-scrollbar{display:none}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0}
.ni-ic{font-size:20px;line-height:1.2}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF}
.ni-lb.on{color:#1E5FA5;font-weight:800}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;box-sizing:border-box}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.bb{background:#1E5FA5;color:#fff}
.bg{background:#16A34A;color:#fff}
.bgr{background:#F3F4F6;color:#6B7280}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto}
.stabs::-webkit-scrollbar{display:none}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px}
.st.on{border-bottom-color:#1E5FA5}
.st-ic{font-size:16px}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF}
.st-lb.on{color:#1E5FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s}
.gc:active{transform:scale(.97)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px)}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave-anim{0%,100%{height:6px}50%{height:20px}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1E5FA5}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .tk{transform:translateX(20px)}
.game-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.game-card:active{transform:scale(.97)}
.word-card{border-radius:24px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:3px solid}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave-bar{width:4px;border-radius:2px;animation:wave-anim 0.8s ease-in-out infinite}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D}
.letter-key{display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;transition:all .15s}
.letter-key:active{background:#EFF6FF;transform:scale(.95)}
.letter-key.used{background:#F3F4F6;color:#9CA3AF;cursor:default}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5}
.mode-card{border-radius:20px;padding:18px;cursor:pointer;transition:transform .1s;border:2px solid transparent;text-align:center}
.mode-card:active{transform:scale(.97)}
.survey-opt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;transition:all .2s;text-align:left;width:100%;font-family:inherit}
.survey-opt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s}
/* ── 테마: 크림 라이트 (기본) ── */
body, body.theme-light {

.body,.pad{background:var(--bg)!important}

.modal{background:var(--bg-card)!important}
.mbg .modal{background:var(--bg-card)!important}

/* ── 테마: 차콜 다크 ── */
body.theme-dark {
  --bg:       #1A1A1A;
  --bg-card:  #242424;
  --bg-sub:   #1F1F1F;
  --bg-input: #2C2C2C;
  --bg-nav:   #242424;
  --text1:    #ECECEC;
  --text2:    #A0AEC0;
  --text3:    #64748B;
  --border:   #333333;
  --border2:  #444444;
  --btn-gray: #2C2C2C;
  --btn-gray-t:#A0AEC0;
  --shadow:   rgba(0,0,0,0.4);
}
body.theme-dark{background:var(--bg)!important;color:var(--text1)!important}
body.theme-dark #app{background:var(--bg)!important}
body.theme-dark .hd{background:linear-gradient(135deg,#111,#1E3A5F)!important}
body.theme-dark .body,body.theme-dark .pad{background:var(--bg)!important}
body.theme-dark .card{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .nav{background:var(--bg-nav)!important;border-top-color:var(--border)!important}
body.theme-dark .stabs{background:var(--bg-sub)!important}
body.theme-dark .st{color:var(--text3)!important}
body.theme-dark .st.on .st-lb{color:#60A5FA!important}
body.theme-dark .bubble{background:var(--bg-card)!important;color:var(--text1)!important;border-color:var(--border)!important}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:var(--bg-input)!important;border-color:var(--border)!important;color:var(--text1)!important}
body.theme-dark .bgr{background:var(--btn-gray)!important;color:var(--btn-gray-t)!important}
body.theme-dark .modal{background:var(--bg-card)!important;color:var(--text1)!important}
body.theme-dark .mbg .modal{background:var(--bg-card)!important}
body.theme-dark h2,body.theme-dark h3,body.theme-dark div{color:inherit}
body.theme-dark .logo{color:#ECECEC!important}

/* ── 폰트 크기 ── */
body.fs-sm{font-size:13px!important}
body.fs-md{font-size:15px!important}
body.fs-lg{font-size:17px!important}

// ── 음향 시스템 ──
const SFX = {
  ctx: null,
  init() { try { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
  play(type) {
    try {
      this.init(); const c = this.ctx;
      const g = c.createGain(); g.connect(c.destination);
      const o = c.createOscillator(); o.connect(g);
      if(type==='correct') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);
        [523,659,784].forEach((f,i)=>{o.frequency.setValueAtTime(f,c.currentTime+i*.1);});
        o.start(c.currentTime); o.stop(c.currentTime+.4);
      } else if(type==='wrong') {
        g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
        o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+.15);
        o.type='sawtooth'; o.start(c.currentTime); o.stop(c.currentTime+.3);
      } else if(type==='levelup') {
        [523,659,784,1047].forEach((f,i)=>{
          const oo=c.createOscillator(), gg=c.createGain();
          oo.connect(gg); gg.connect(c.destination);
          oo.frequency.value=f; gg.gain.setValueAtTime(.3,c.currentTime+i*.12);
          gg.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.12+.3);
          oo.start(c.currentTime+i*.12); oo.stop(c.currentTime+i*.12+.3);
        });
      } else if(type==='flip'||type==='tap') {
        g.gain.setValueAtTime(.1,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.08);
        o.frequency.value=type==='flip'?800:600; o.start(c.currentTime); o.stop(c.currentTime+.08);
      }
    } catch(e){}
  },
  bgTimer: null,
  bgIdx: 0,
  playBG() {
    try {
      this.init();
      if(this.bgTimer) return;
      const notes=[261,329,392,329,261,329,392,523];
      const play=()=>{
        const c=this.ctx,o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=notes[this.bgIdx%notes.length]; o.type='sine';
        g.gain.setValueAtTime(.04,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
        o.start(c.currentTime); o.stop(c.currentTime+.4);
        this.bgIdx++;
      };
      this.bgTimer=setInterval(play,600);
    } catch(e){}
  },
  stopBG() { if(this.bgTimer){clearInterval(this.bgTimer);this.bgTimer=null;} }
};
const vib = p => { try { if('vibrate' in navigator) navigator.vibrate(p); } catch(e){} };
const ok = () => { SFX.play('correct'); vib([50,0,50]); };
const ng = () => { SFX.play('wrong'); vib([100,50,100]); };

const shuf = a => [...a].sort(()=>Math.random()-.5);

// ── 출석 체크 & 학습 기록 ──
function checkAttend() {
  const t = today();
  if(S.attendPopupShown === t) return; // 오늘 이미 표시
  S.attendPopupShown = t;
  if(!S.attendDates.includes(t)) {
    S.attendDates.push(t);
    S.attendCount++;
    sv();
    showAttendPopup();
  }
}

function logStudy(type) {
  // XP 지급
  if(type==='words') { addXP(5, true); checkXpUsable(); }
  else if(type==='quiz') { addXP(2, true); }
  // type: 'words' or 'quiz'
  const t = today();
  if(!S.studyLog[t]) S.studyLog[t] = {words:0, quiz:0};
  S.studyLog[t][type]++;
  updStreak(); // 학습 시 streak 자동 업데이트
  sv();
}

function buildSentenceFromWords(wordList) {
  const candidates=(wordList||S.gWords||[]).filter(w=>w.ex&&w.ex.trim().length>3);
  let chosen=candidates.length>0?rnd(candidates):null;
  if(chosen){
    const sentence=chosen.ex.replace(/[.,!?;:]/g,'').trim();
    const words=sentence.split(/\s+/).filter(w=>w.length>0);
    if(words.length>=3){
      const wrongPool=(wordList||S.gWords||[])
        .filter(w=>w.en!==chosen.en)
        .map(w=>w.en.split(/\s+/)[0])
        .filter(w=>!words.map(x=>x.toLowerCase()).includes(w.toLowerCase()))
        .slice(0,3);
      S.sbS={kr:chosen.kr+'(예문)',en:sentence,words};
      S.sbP=shuf([...words,...wrongPool].slice(0,words.length+2));
      S.sbC=[];S.sbAns=false;S.sbOk=false;return;
    }
  }
  const fallback=[
    {kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing']},
    {kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are']},
    {kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach']},
  ];
  const st=rnd(fallback);
  S.sbS=st;S.sbP=shuf([...st.words,...st.wrong]);S.sbC=[];S.sbAns=false;S.sbOk=false;
}

function shareWordBook(bookName) {
  const words=bookName==='내 단어장'?S.words:((S.books||[]).find(b=>b.name===bookName)?.words||[]);
  if(!words.length){toast('단어가 없어요');return;}

  if(navigator.share){navigator.share({title:'Vocabug - '+bookName,text:bookName+' 단어장 ('+words.length+'개)',url});}

}

function getTodayWord() {
  const t = new Date().toISOString().slice(0,10);
  const key = 'wd-today-word-' + t;
  let cached = localStorage.getItem(key);
  if(cached) return JSON.parse(cached);
  const pool = (S._sysWords||[]).length ? S._sysWords : S.words;
  if(!pool.length) return null;
  // 날짜 기반 시드로 항상 같은 단어
  let seed = t.replace(/-/g,'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const word = pool[seed % pool.length];
  localStorage.setItem(key, JSON.stringify(word));
  return word;
}

const GAME_XP = {
  quiz:     {base:10, perfect:20},
  fill:     {base:10, perfect:20},
  typing:   {base:15, perfect:25},
  listen:   {base:15, perfect:25},
  match:    {base:10, perfect:20},
  sentence: {base:20, perfect:35},
  wordfind: {base:10, perfect:20},
  wordle:   {base:30, perfect:60},
  chain:    {base:15, perfect:25},
  wc:       {base:10, perfect:20},
  ssort:    {base:15, perfect:25},
};

function saveGameScore(score) {
  if(!S.bestScores) S.bestScores={};
  const gid = S.gameId;
  if(!gid) return;
  // 최고 점수 저장
  if(!S.bestScores[gid] || score > S.bestScores[gid]) {
    S.bestScores[gid] = score;
  }
  // XP 계산
  const xpTable = GAME_XP[gid] || {base:10, perfect:20};
  const words = (S.gWords||[]).length || 1;
  const right = Math.round(score/100);
  const pct = Math.round(right/words*100);
  let xpGain = xpTable.base;
  if(pct===100) xpGain = xpTable.perfect;
  else if(pct>=80) xpGain = Math.round(xpTable.base*1.5);
  // 연속 보너스
  const streak = S.streak||0;
  let mult = streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  xpGain = Math.round(xpGain * mult);
  if(xpGain>0) {
    earnXP(xpGain, '게임 완료');
  }
  sv();
}

// 테스트 결과 XP
function earnTestXP(pct) {
  let xp = 0;
  if(pct===100) xp=120;
  else if(pct>=90) xp=80;
  else if(pct>=80) xp=50;
  else if(pct>=60) xp=30;
  const streak=S.streak||0;
  const mult=streak>=30?2.0:streak>=7?1.5:streak>=3?1.2:1.0;
  xp = Math.round(xp*mult);
  if(xp>0) earnXP(xp, '테스트 통과');
}

function downloadButterflyCard(bId) {
  const b = BUTTERFLY_LIST.find(x=>x.id===bId);
  if(!b) return;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d');
  // 배경
  ctx.fillStyle = b.bg || '#F9FAFB';
  ctx.roundRect(0,0,400,560,20);
  ctx.fill();
  // 헤더 색상 배경
  ctx.fillStyle = b.color || '#7C3AED';
  ctx.roundRect(0,0,400,200,20);
  ctx.fill();
  ctx.fillRect(0,180,400,20);
  // 나비 이모지
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦋', 200, 120);
  // 이름
  ctx.fillStyle = 'white';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(b.name, 200, 165);
  ctx.font = '14px sans-serif';
  ctx.fillText(b.en, 200, 188);
  // 정보
  ctx.fillStyle = '#374151';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(b.rare + ' · ' + b.score + '점', 20, 230);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#6B7280';
  ctx.fillText('서식지: ' + (b.habitat||'-'), 20, 255);
  ctx.fillText('상태: ' + (b.status||'-'), 20, 275);
  // 이야기
  ctx.fillStyle = '#374151';
  ctx.font = '12px sans-serif';
  const words = (b.story||'').split(' ');
  let line='', y=310;
  words.forEach(w=>{
    const test=line+w+' ';
    if(ctx.measureText(test).width>360&&line){
      ctx.fillText(line,20,y); line=w+' '; y+=18;
    } else line=test;
  });
  if(line) ctx.fillText(line,20,y);
  // 보호 메시지
  ctx.fillStyle = '#16A34A';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🌿 ' + (b.protect||'').slice(0,50), 20, 460);
  // 앱 이름
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Butterfly Word', 200, 540);
  // 다운로드
  const a = document.createElement('a');
  a.download = 'butterfly-' + b.id + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('카드 저장됨! 🦋');
}

function addXP(n, silent=false) {
  const bonus = getStreakBonus();
  const actual = Math.round(n * bonus);
  S.xp = (S.xp||0) + actual;
  sv(); if(!silent) updHD();
  // XP 획득 토스트 (게임 중이 아닐 때만)
  if(!silent && actual>0) showXpGain(actual, bonus>1);
  const ni=LEVELS.findIndex(l=>l.id===S.lid), next=LEVELS[ni+1];
  if(next&&S.xp>=next.min) {
    S.lid=next.id; S.xp=next.min;
    S.words=[...DEFAULT_WORDS[next.id]||DEFAULT_WORDS.egg]; S.learned.clear(); S.idx=0;
    sv(); updHD(); SFX.play('levelup'); vib([100,50,100,50,200]);

function updStreak() {
  const td=today(); if(S.lastDate===td) return;
  // 매일 배부름/기분 감소
  S._petFull = Math.max(0, (S._petFull||0)-1);
  S._petHappy = Math.max(0, (S._petHappy||0)-1);
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.lastDate===yd) S.streak++; else S.streak=1;
  S.lastDate=td; sv();
}

async function loadWordsFromFirestore(lid) {
  try {
    const doc = await db.collection('words').doc(lid).get();
    if(doc.exists) {
      const data = doc.data();
      if(data.list && data.list.length > 0) {
        S.words = data.list;
        sv(); go();
        toast(`✅ ${data.list.length}개 단어 로드 완료!`);
      }
    }
  } catch(e) { /* Firestore 없으면 기본 단어 사용 */ }
}

function scheduleAlarms() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const l = lv(S.lid);
  const msg = rnd(l.alarm);
  const alarms = [
    {cfg:S.alStudy, title:`${l.emoji} Vocabug 공부 알람`, body:msg},
    {cfg:S.alDiary, title:`${l.emoji} Vocabug 일기 알람`, body:'오늘 일기 아직 안 썼지? 얼른!'},
    {cfg:S.alGoal, title:`${l.emoji} Vocabug 목표 알람`, body:'오늘 목표 아직 미완료! 빨리!'},
    {cfg:S.alStreak, title:`${l.emoji} Vocabug 스트릭 알람`, body:`${S.streak}일 연속 기록이 끊기기 직전!`},
  ];
  alarms.forEach(({cfg, title, body}) => {
    if(!cfg.on) return;
    const now = new Date();
    const target = new Date();
    target.setHours(cfg.h, cfg.m, 0, 0);
    if(target <= now) target.setDate(target.getDate()+1);
    const delay = target - now;
    if('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({type:'SCHEDULE_ALARM', title, body, delay, tag:title});
    }
  });
}

function startTest() {
  // 적응형 테스트: egg부터 시작, 3연속 정답→상승, 2오답→확정
  S.tQs = [];
  S.tIdx = 0;
  S.tScore = {};
  S.tAns = false;
  S.tRes = null;
  S.tCurChoices = null;
  S.tCorrectIdx = null;
  // 상태 초기화
  S.tLvIdx = 0;        // 현재 도전 레벨 인덱스
  S.tConsecRight = 0;  // 연속 정답 수
  S.tWrongCount = 0;   // 현재 레벨 오답 수
  S.tTotalQ = 0;       // 총 문제 수
  S.tLvResult = {};    // 레벨별 결과
  renderAdaptiveQ();
}

// ── 적응형 테스트 핵심 ──
function renderAdaptiveQ() {
  const lvId = LEVELS[S.tLvIdx]?.id;
  if(!lvId) { finishAdaptiveTest(); return; }
  const pool = TEST_POOL[lvId] || TEST_POOL.egg;
  const q = {...rnd(pool), lv: lvId};
  S.tCurrentQ = q;
  S.tTotalQ++;
  renderAdaptiveMCQ(q);
}

function renderAdaptiveMCQ(q) {
  const l = lv(q.lv);
  const lvIdx = S.tLvIdx;
  // 보기 순서 고정
  if(!S.tAns) {
    S.tCurChoices = shuf(q.c.map((c,i)=>({c,i})));
    S.tCorrectIdx = S.tCurChoices.findIndex(x=>x.i===q.a);
  }
  const cs = S.tCurChoices||[];
  const correctIdx = S.tCorrectIdx||0;
  window._tCorrect = correctIdx;
  window._tLv = q.lv;

  // 상단 진행 표시 (레벨 + 연속정답/오답)
  const consecDots = Array(3).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tConsecRight?'#16A34A':'#E5E7EB'};border:2px solid ${i<S.tConsecRight?'#86EFAC':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tConsecRight?'✓':''}</span>`
  ).join('');
  const wrongDots = Array(2).fill(0).map((_,i)=>
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${i<S.tWrongCount?'#DC2626':'#E5E7EB'};border:2px solid ${i<S.tWrongCount?'#FECDD3':'#D1D5DB'};font-size:10px;line-height:14px;text-align:center">${i<S.tWrongCount?'✗':''}</span>`
  ).join('');

  document.getElementById('body').innerHTML=`<div class="pad">
    <div style="background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid #E5E7EB">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:#1E5FA5">${l.emoji} ${l.name} 도전 중</div>
        <div style="font-size:11px;color:#9CA3AF">${S.tTotalQ}번째 문제</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#16A34A;font-weight:700">정답</span>
          ${consecDots}
          <span style="font-size:11px;color:#9CA3AF">3개면 상승!</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:11px;color:#DC2626;font-weight:700">오답</span>
          ${wrongDots}
          <span style="font-size:11px;color:#9CA3AF">2개면 확정</span>
        </div>
      </div>
    </div>
    <div style="background:#F8F9FA;border-radius:20px;padding:32px 24px;text-align:center;border:1.5px solid #E5E7EB">
      ${S.showImg!==false?`<div style="font-size:64px;margin-bottom:12px">${q.img||'📝'}</div>`:''}
      <div style="font-size:32px;font-weight:900;color:#111;font-family:monospace">${q.q}</div>
    </div>
    <div class="g2">${cs.map((x,ri)=>{
      let bg='#fff',col='#374151',bd='#E5E7EB';
      if(S.tAns){
        if(ri===correctIdx){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}
        else if(ri===S.tRes){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}
      }
      return `<button onclick="tOptClick(${ri})" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600;cursor:${S.tAns?'default':'pointer'};width:100%;font-family:inherit;text-align:center">${x.c}</button>`;
    }).join('')}</div>`;
}

window.tOptClick = function(ri) {
  if(S.tAns) return;
  S.tAns = true;
  S.tRes = ri;
  const correct = window._tCorrect;
  const lvId = window._tLv;
  const isRight = ri === correct;

  if(isRight) {
    ok();
    S.tConsecRight++;
    S.tScore[lvId] = (S.tScore[lvId]||0) + 1;
  } else {
    ng();
    S.tConsecRight = 0;
    S.tWrongCount++;
  }

  renderAdaptiveMCQ(S.tCurrentQ);

  setTimeout(() => {
    S.tAns = false; S.tRes = null;
    S.tCurChoices = null; S.tCorrectIdx = null;

    if(S.tConsecRight >= 3) {
      // 레벨 통과 → 다음 레벨
      S.tLvResult[lvId] = 'pass';
      S.tLvIdx++;
      S.tConsecRight = 0;
      S.tWrongCount = 0;
      if(S.tLvIdx >= LEVELS.length) { finishAdaptiveTest(); return; }
      toast(`✅ ${lv(lvId).name} 통과! 다음 레벨로!`);
    } else if(S.tWrongCount >= 2) {
      // 레벨 확정
      S.tLvResult[lvId] = 'fail';
      finishAdaptiveTest(); return;
    }

    // 최대 24문제 제한
    if(S.tTotalQ >= 24) { finishAdaptiveTest(); return; }
    renderAdaptiveQ();
  }, 800);
};

function finishAdaptiveTest() {
  // 최종 레벨 결정
  let finalLvIdx = 0;
  LEVELS.forEach((l,i) => {
    if(S.tLvResult[l.id] === 'pass') finalLvIdx = i+1;
  });
  finalLvIdx = Math.min(finalLvIdx, LEVELS.length-1);
  const finalLv = LEVELS[finalLvIdx];

  S.lid = finalLv.id;
  S.xp = finalLv.min * 10;
  sv();
  localStorage.setItem('wd-tested', '1');
  S.tHistory.push({date:today(), lid:finalLv.id, totalQ:S.tTotalQ});
  localStorage.setItem('wd-th', JSON.stringify(S.tHistory));

  // 결과 화면
  const resultRows = LEVELS.map((l,i) => {
    const res = S.tLvResult[l.id];
    if(!res && i > finalLvIdx) return '';
    const icon = res==='pass'?'✅':res==='fail'?'❌':'—';
    const isFinal = i===finalLvIdx;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:${isFinal?'#EFF6FF':'#F8F9FA'};border:${isFinal?'2px solid #1E5FA5':'1px solid #E5E7EB'}">
      <span style="font-size:20px">${l.emoji}</span>
      <span style="flex:1;font-size:13px;font-weight:${isFinal?'800':'600'};color:${isFinal?'#1E5FA5':'#374151'}">${l.name}</span>
      <span style="font-size:16px">${icon}</span>
      ${isFinal?'<span style="font-size:11px;background:#1E5FA5;color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">확정!</span>':''}
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('body').innerHTML=`<div class="pad" style="padding-top:24px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:56px;margin-bottom:8px">${finalLv.emoji}</div>
      <div style="font-size:24px;font-weight:900;color:#111;margin-bottom:4px">테스트 완료!</div>
      <div style="font-size:14px;color:#6B7280">${S.tTotalQ}문제로 레벨을 찾았어요</div>
    </div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:18px;padding:18px;text-align:center;border:2px solid #1E5FA5;margin-bottom:14px">
      <div style="font-size:12px;color:#1E5FA5;font-weight:700;margin-bottom:4px">나의 레벨</div>
      <div style="font-size:22px;font-weight:900;color:#1E5FA5">${finalLv.emoji} ${finalLv.name}</div>
      <div style="font-size:12px;color:#6B7280;margin-top:4px">${finalLv.desc}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">${resultRows}</div>
    ${charSVG(finalLv.id,60,'happy')}
    <button class="btn bb" onclick="startApp()">학습 시작하기! 🚀</button>
  </div>`;
}

      </div>

      <div style="font-size:20px;font-weight:900;color:${s.color};margin-bottom:8px">${s.title}</div>
      <div style="font-size:14px;color:#6B7280;line-height:1.8;margin-bottom:20px">${s.desc}</div>

function go(tab,sub) {
  if(tab&&tab!=='game'&&tab!=='ranking') {
    // 학습 탭을 직접 클릭(sub 없이)하면 항상 단어장 선택 첫 화면으로
    if(tab==='study'&&!sub) S.stab='books';
    if(tab==='mybooks'&&!sub) S.stab='books';
    S.tab=tab;
  }
  if(tab==='ranking') S.tab='ranking';
  if(tab==='game') S.tab='game';
  if(sub) S.stab=sub;
  // 상단 헤더 벌거지 미니 상태
  const hdrEl=document.getElementById('hdr');
  if(hdrEl) {
    const pet=getPetState();
    const lvI=lv(S.lid);
    hdrEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:100%">
      <div style="font-size:18px;font-weight:900;color:#fff;letter-spacing:-0.5px">Butterfly Word</div>

        <span style="font-size:12px;font-weight:700;color:#fff">${lvI.name}</span>
      </div>
    </div>`;
  }
  const nav=document.getElementById('nav');
  // nav 표시 제어
  // 게임 실행 중에만 nav 숨김 (게임탭 메뉴화면은 nav 보임)
  const inGame = (S.tab==='game'||S.tab==='butterfly') && S.gameId && S.gDone===false && S._gameRunning===true;
  nav.style.display = inGame ? 'none' : 'flex';
  // hd 복원
  const hdEl = document.getElementById('hd');
  if(hdEl && hdEl.style.display==='none') hdEl.style.display='';
  nav.innerHTML=TABS.map(t=>`<button class="ni" onclick="go('${t.id}')"><span class="ni-ic">${t.ic}</span><span class="ni-lb ${S.tab===t.id?'on':''}">${t.lb}</span>${S.tab===t.id?'<div class="dot"></div>':''}</button>`).join('');
  const map={home:rHome,mybooks:rStudy,learn:rLearnTab,study:rStudy,butterfly:(S._gameRunning&&S.gameId&&!S.gDone)?rGame:rGameTab,game:(S._gameRunning&&S.gameId&&!S.gDone)?rGame:rGameTab,profile:rProfile};
  const body=document.getElementById('body');
  body.innerHTML=(map[S.tab]||rHome)();
  body.scrollTop=0;
  if((S.tab==='mybooks'||S.tab==='study')&&S.stab==='learn') requestAnimationFrame(initFlashSwipe);
}

function getLearnedSysWords(lvId) {
  return JSON.parse(localStorage.getItem('wd-sys-learned-'+lvId)||'[]').length;
}

function loadSysWords(lvId, cb) {
  if(typeof db==='undefined') {
    S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
    if(cb)cb(); return;
  }
  db.collection('system_words').where('level','==',lvId).get()
    .then(snap=>{
      S._sysWords=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(!S._sysWords.length) S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
      if(cb)cb();
    }).catch(()=>{
      S._sysWords=DEFAULT_WORDS[lvId]||DEFAULT_WORDS.egg||[];
      if(cb)cb();
    });
}

function startLearnSession(mode) {
  if(!S._sysWords||!S._sysWords.length) {
    S._sysWords=DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg||[];
    loadSysWords(S.lid,null);
  }
  const words=S._sysWords;
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=words.filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0) {
    const mr=document.getElementById('mr');
    if(mr) mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">모든 단어 학습 완료!</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="cm();showLevelUpTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">🏆 레벨업 테스트</button>
        <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">닫기</button>
      </div></div></div>`;
    return;
  }
  if(!S._learnSessionStarted) {
    window._pickerRemaining=remaining;
    window._pickerMode=mode||'random';
    if(!S._learnTotalTarget) S._learnTotalTarget=remaining.length;
    _showAmountPicker();
    return;
  }
  _doLearnSession(mode, S._learnSessionPool||remaining);
}

function _showAmountPicker() {
  const remaining=window._pickerRemaining||[];
  const total=remaining.length;
  const opts=[{lb:'전체 (기본)',v:total},{lb:'30개',v:Math.min(30,total)},{lb:'50개',v:Math.min(50,total)},{lb:'100개',v:Math.min(100,total)}];
  const cur=S._learnTotalTarget||total;
  let mr=document.getElementById('mr');
  if(!mr){mr=document.createElement('div');mr.id='mr';document.getElementById('app').appendChild(mr);}
  const html=`<div class="mbg" id="ap-bg"><div class="modal" id="ap-modal">
    <div style="font-size:17px;font-weight:800;margin-bottom:6px">📖 오늘 학습 분량</div>
    <div style="font-size:12px;color:#9CA3AF;margin-bottom:16px">남은 단어 ${total}개 중 선택하세요</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
      ${opts.map((o,i)=>`<div data-ai="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;border:2px solid ${cur===o.v?'#1E5FA5':'var(--border,#E5E7EB)'};background:${cur===o.v?'#EFF6FF':'var(--bg-sub,#F9FAFB)'};cursor:pointer">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:18px;height:18px;border-radius:50%;background:${cur===o.v?'#1E5FA5':'transparent'};border:2px solid ${cur===o.v?'#1E5FA5':'#D1D5DB'};flex-shrink:0"></div>
          <span style="font-size:14px;font-weight:700;color:${cur===o.v?'#1E5FA5':'var(--text1,#374151)'}">${o.lb}</span>
        </div>
        <span style="font-size:12px;font-weight:700;color:${cur===o.v?'#1E5FA5':'#9CA3AF'}">${o.v}개</span>
      </div>`).join('')}
    </div>
    <button id="ap-start" style="width:100%;background:#1E5FA5;color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer">🚀 학습 시작</button>
  </div></div>`;
  mr.innerHTML=html;
  document.getElementById('ap-bg').addEventListener('click',cm);
  document.getElementById('ap-modal').addEventListener('click',e=>e.stopPropagation());
  opts.forEach((o,i)=>{
    const el=mr.querySelector(`[data-ai="${i}"]`);
    if(el) el.addEventListener('click',e=>{e.stopPropagation();S._learnTotalTarget=o.v;_showAmountPicker();});
  });
  document.getElementById('ap-start').addEventListener('click',e=>{
    e.stopPropagation(); cm();
    const r=window._pickerRemaining||[];
    const t=S._learnTotalTarget||r.length;
    S._learnSessionPool=r.slice(0,t);
    S._learnDoneCount=0; S._learnSessionStarted=true;
    _doLearnSession(window._pickerMode,S._learnSessionPool);
  });
}

function _doLearnSession(mode, pool) {
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=(pool||S._learnSessionPool||[]).filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0){S._learnSessionStarted=false;checkLearnComplete();return;}
  const sessionWords=shuf(remaining.slice(0,5));
  let gameId=mode;
  if(!mode||mode==='random'){
    const last=S._lastLearnGame||'';
    const avail=LEARN_GAMES.filter(g=>g!==last);
    gameId=avail[Math.floor(Math.random()*avail.length)];
  }
  S._lastLearnGame=gameId; S._learnMode=mode||'random';
  S._learnSessionWords=sessionWords; S._inLearnSession=true;
  startGameW(gameId,sessionWords);
}

function finishLearnSession(resultMap) {
  S._inLearnSession=false;
  const sw=S._learnSessionWords||[];
  const wrong=sw.filter(w=>resultMap[w.en]===false);
  const correct=sw.filter(w=>resultMap[w.en]!==false);
  if(correct.length>0){
    const key='wd-sys-learned-'+S.lid;
    const learned=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
    correct.forEach(w=>learned.add(w.en));
    localStorage.setItem(key,JSON.stringify([...learned]));
    S._learnDoneCount=(S._learnDoneCount||0)+correct.length;
  }
  addXP(correct.length*3); logStudy('words'); sv();
  const mr=document.getElementById('mr');
  if(!mr) return;
  mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:18px;font-weight:800;margin-bottom:16px;text-align:center">📊 학습 결과</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:#F0FDF4;border-radius:14px;padding:16px;text-align:center;border:1.5px solid #86EFAC">
        <div style="font-size:32px;font-weight:900;color:#16A34A">${correct.length}</div>
        <div style="font-size:12px;color:#16A34A;font-weight:700;margin-top:4px">✅ 맞음</div></div>
      <div style="background:${wrong.length?'#FEF2F2':'#F9FAFB'};border-radius:14px;padding:16px;text-align:center;border:1.5px solid ${wrong.length?'#FECACA':'#E5E7EB'}">
        <div style="font-size:32px;font-weight:900;color:${wrong.length?'#DC2626':'#9CA3AF'}">${wrong.length}</div>
        <div style="font-size:12px;color:${wrong.length?'#DC2626':'#9CA3AF'};font-weight:700;margin-top:4px">❌ 틀림</div></div>
    </div>
    ${wrong.length?`<div style="background:#FEF2F2;border-radius:12px;padding:12px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:#DC2626;margin-bottom:8px">❌ 틀린 단어</div>
      <div style="display:flex;flex-direction:column;gap:4px">${wrong.map(w=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border-radius:8px">
        <span>${w.img||'📝'}</span><span style="font-size:13px;font-weight:700;font-family:monospace">${w.en}</span>
        <span style="font-size:12px;color:#6B7280">= ${w.kr}</span></div>`).join('')}</div></div>
      <div style="display:flex;gap:8px">
        <button onclick="cm();_reLearn(${JSON.stringify(wrong).replace(/"/g,'&quot;')})" style="flex:2;background:#DC2626;color:#fff;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">🔄 다시 학습</button>
        <button onclick="cm();checkLearnComplete()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">건너뛰기</button>
      </div>`:`<button onclick="cm();checkLearnComplete()" style="width:100%;background:#16A34A;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer">✅ 완료! 다음으로</button>`}
  </div></div>`;
}

function _reLearn(words) {
  if(!words||!words.length){checkLearnComplete();return;}
  S._learnSessionWords=words; S._inLearnSession=true;
  const gameId=S._learnMode==='random'?LEARN_GAMES[Math.floor(Math.random()*LEARN_GAMES.length)]:(S._learnMode||'quiz');
  startGameW(gameId,words);
}

function checkLearnComplete() {
  const pool=S._learnSessionPool||S._sysWords||[];
  const learnedSet=new Set(JSON.parse(localStorage.getItem('wd-sys-learned-'+S.lid)||'[]'));
  const remaining=pool.filter(w=>!learnedSet.has(w.en));
  if(remaining.length===0){
    const mr=document.getElementById('mr');
    if(mr) mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:56px;margin-bottom:12px">🎊</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">모든 단어 완료!</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="cm();showLevelUpTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">🏆 레벨업 테스트</button>
        <button onclick="cm();go('learn')" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">닫기</button>
      </div></div></div>`;
    S._learnSessionStarted=false;
  } else {
    _doLearnSession(S._learnMode||'random',pool);
  }
}

function showLevelUpTest() {
  const words=S._sysWords||DEFAULT_WORDS[S.lid]||[];
  if(!words.length){toast('시스템 단어가 없어요');return;}
  const passRate=S._levelTestPassRate||100;
  const lvInfo=lv(S.lid);
  const curLvIdx=LEVELS.findIndex(l=>l.id===S.lid);
  const nextLv=LEVELS[Math.min(curLvIdx+1,LEVELS.length-1)];
  const mr=document.getElementById('mr');
  if(!mr)return;
  mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:48px;margin-bottom:8px">🏆</div>
      <div style="font-size:18px;font-weight:800">레벨업 테스트</div>
      <div style="font-size:13px;color:#9CA3AF;margin-top:4px">${lvInfo.emoji} ${lvInfo.name} → ${nextLv?.emoji||'⚡'} ${nextLv?.name||'최고 레벨'}</div></div>
    <div style="background:#F5F3FF;border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:#7C3AED;line-height:1.7">
      📝 총 ${words.length}개 중 랜덤 20개 출제<br>🎯 통과 기준: <strong>${passRate}%</strong> 이상</div>
    <div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px">통과 기준</div>
      <div style="display:flex;gap:6px">${[70,80,90,100].map(r=>`<button onclick="S._levelTestPassRate=${r};showLevelUpTest()" style="flex:1;padding:8px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:${passRate===r?'#7C3AED':'#F3F4F6'};color:${passRate===r?'#fff':'#374151'}">${r}%</button>`).join('')}</div></div>
    <div style="display:flex;gap:8px">
      <button onclick="cm();_startLevelTest()" style="flex:2;background:#7C3AED;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer">🚀 테스트 시작</button>
      <button onclick="cm()" style="flex:1;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer">취소</button>
    </div></div></div>`;
}

function _startLevelTest() {
  const words=S._sysWords||DEFAULT_WORDS[S.lid]||[];
  const testWords=shuf([...words]).slice(0,Math.min(20,words.length));
  S._levelTestWords=testWords; S._inLevelTest=true; S._inLearnSession=false;
  startGameW('quiz',testWords);
}


function _doLevelUp() {
  const curLvIdx=LEVELS.findIndex(l=>l.id===S.lid);
  const nextLv=LEVELS[Math.min(curLvIdx+1,LEVELS.length-1)];
  if(!nextLv||nextLv.id===S.lid){toast('이미 최고 레벨!');return;}
  S.lid=nextLv.id; S._sysWords=null; S._learnSessionStarted=false;
  S._learnTotalTarget=0; S._learnDoneCount=0;
  addXP(500, true); sv();
  loadSysWords(S.lid, null);
  // 레벨업 화면 이펙트
  showLevelUpFlash(()=>{
    const butterfly=rollButterfly(S.xp||0);
    cm();
    showButterflyRoll(butterfly);
  });
}

function showLevelUpFlash(cb) {
  // 진동
  vib([100,50,100,50,200,100,400]);
  // SFX
  SFX.play('levelup');
  // 빛 이펙트 오버레이
  const el=document.createElement('div');
  el.id='levelup-flash';
  el.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,0);z-index:9998;pointer-events:none;transition:background .15s';
  document.body.appendChild(el);
  // 파티클 생성
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    const angle=Math.random()*360;
    const dist=80+Math.random()*120;
    const size=6+Math.random()*10;
    const colors=['#FDE68A','#A78BFA','#6EE7B7','#FCA5A5','#93C5FD','#FCD34D'];
    p.style.cssText=`position:fixed;left:50%;top:50%;width:${size}px;height:${size}px;border-radius:50%;background:${colors[i%colors.length]};z-index:9999;pointer-events:none;transform:translate(-50%,-50%);transition:all .6s ease-out;opacity:1`;
    document.body.appendChild(p);
    setTimeout(()=>{
      p.style.transform=`translate(calc(-50% + ${Math.cos(angle*Math.PI/180)*dist}px),calc(-50% + ${Math.sin(angle*Math.PI/180)*dist}px))`;
      p.style.opacity='0';
    },50);
    setTimeout(()=>p.remove(),700);
  }
  setTimeout(()=>{el.style.background='rgba(255,255,255,0.85)';},50);
  setTimeout(()=>{el.style.background='rgba(255,255,255,0)';},300);
  setTimeout(()=>{el.remove();if(cb)cb();},600);
}

// 벌거지 상태 계산
function getPetState() {
  const today = new Date().toISOString().slice(0,10);
  const log = S.studyLog||{};
  const dates = Object.keys(log).sort().reverse();
  const lastStudy = dates[0];
  let daysSince = 0;
  if(lastStudy){const diff=new Date(today)-new Date(lastStudy);daysSince=Math.floor(diff/(1000*60*60*24));}
  else{daysSince=99;}
  const todayDone = log[today]?.words>0||log[today]?.quiz>0;
  const col = PET_COLORS[getPetColor()]||PET_COLORS.green;
  const full = S._petFull||0;
  const happy = S._petHappy||0;
  // 수치가 낮으면 상태 악화
  const lowStats = full<=2 || happy<=2;
  if(todayDone && !lowStats) return {emoji:'😄',mood:'"오늘도 열심히 했어! 나 좀 더 자란 것 같아! 🐛"',bg1:col.main,bg2:col.main,color:col.main};
  if(daysSince===0 && !lowStats) return {emoji:'😊',mood:'"오늘 아직 공부 안 했지? 같이 해보자!"',bg1:col.main,bg2:col.main,color:col.main};
  if(full<=2 && happy<=2) return {emoji:'😢',mood:'"배고프고 심심해... 나 좀 돌봐줘..."',bg1:'#D97706',bg2:'#B45309',color:'#D97706'};
  if(daysSince===1) return {emoji:'😐',mood:'"어제도 안 왔잖아... 나 혼자 있었어"',bg1:'#6B7280',bg2:'#4B5563',color:'#6B7280'};
  if(daysSince===2) return {emoji:'😢',mood:'"이틀이나 공부 안 하면 나 점점 작아져..."',bg1:'#D97706',bg2:'#B45309',color:'#D97706'};

function getMyButterflies() {
  return JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
}

function rollButterfly(bonusXp=0) {
  const owned = getMyButterflies();
  const available = BUTTERFLY_LIST.filter(b=>!owned.includes(b.id));
  if(available.length===0) return null;

  // 점수 기반 가중치 (높은 XP로 레벨업할수록 희귀 나비 확률 UP)
  const rarityBoost = bonusXp>=200?3:bonusXp>=100?1.5:1;
  const weights = available.map(b=>{
    if(b.score>=80) return Math.round(3*rarityBoost);
    if(b.score>=65) return Math.round(12*rarityBoost);
    if(b.score>=40) return 35;
    return 50;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let rand = Math.random()*total;
  let chosen = available[0];
  for(let i=0;i<available.length;i++){
    rand -= weights[i];
    if(rand<=0){chosen=available[i];break;}
  }
  owned.push(chosen.id);
  localStorage.setItem('wd-butterflies', JSON.stringify(owned));
  return chosen;
}

        {ic:'📖',lb:'SRS 복습',fn:"startMode('srs')"},
        {ic:'🎤',lb:'쉐도잉',fn:"startMode('shadow')"},
        {ic:'📅',lb:'캘린더',fn:'showCalendar()'},
      ].map(b=>`<div onclick="${b.fn}" style="background:#fff;border-radius:14px;border:1.5px solid #E5E7EB;padding:12px;text-align:center;cursor:pointer" ontouchstart="this.style.background='#F3F4F6'" ontouchend="this.style.background='#fff'">

}

    ${Array(firstDay===0?6:firstDay-1).fill('<div></div>').join('')}`;
  for(let d=1;d<=daysInMonth;d++){

        ${hasData?`<span style="font-size:8px;color:rgba(255,255,255,.8)">${val}</span>`:''}
      </div>

    </div>

      <button onclick="renderCalendar(${year},${month},'words')" style="flex:1;padding:8px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:${'words'===tab?'#1E5FA5':'#F3F4F6'};color:${'words'===tab?'#fff':'#6B7280'}">단어</button>

function switchBook(name) {
  if(name==='내 단어장'){
    S.currentBook='내 단어장'; S.idx=0; S.flip=false;
    sv(); cm(); go('mybooks');
    return;
  }
  const book = S.books.find(b=>b.name===name);
  if(!book) return;
  // 현재 단어장 저장
  saveCurrentBook();
  // 새 단어장으로 전환
  S.words=[...book.words];
  S.markMap={...book.markMap};
  S.srsMap={...book.srsMap};
  S.learned=new Set(book.learned||[]);
  S.currentBook=name;
  S.idx=0; S.flip=false;
  sv(); cm(); go('mybooks');
  toast(`📚 "${name}"으로 전환!`);
}

function saveCurrentBook() {
  if(S.currentBook==='내 단어장') return; // 기본 단어장은 S.words에 바로 저장
  const idx=S.books.findIndex(b=>b.name===S.currentBook);
  if(idx>=0){
    S.books[idx].words=[...S.words];
    S.books[idx].markMap={...S.markMap};
    S.books[idx].srsMap={...S.srsMap};
    S.books[idx].learned=[...S.learned];
  }
}

function createBook() {
  const name=document.getElementById('new-book-name')?.value.trim();
  if(!name){toast('단어장 이름을 입력하세요');return;}
  if(name==='내 단어장'||S.books.find(b=>b.name===name)){toast('이미 있는 이름');return;}
  S.books.push({name,words:[],markMap:{},srsMap:{},learned:[]});
  sv();
  toast(`✅ "${name}" 단어장 생성!`);
  showBooksModal();
}

function deleteBook(name) {
  if(!confirm(`"${name}" 단어장을 삭제할까요?`)) return;
  S.books=S.books.filter(b=>b.name!==name);
  if(S.currentBook===name){
    S.currentBook='내 단어장'; S.idx=0;
  }
  sv();
}

function showStreamMode() {
  // 기존 타이머 정리
  if(window._streamTimer) { clearInterval(window._streamTimer); window._streamTimer=null; }

  let idx=0, speed=3000;
  const words = getCurrentBookWords ? getCurrentBookWords() : S.words;

  const render=()=>{
    const el=document.getElementById('mode-word');
    if(!el) return;
    const w=words[idx%words.length];
    el.innerHTML=`<div style="font-size:80px;margin-bottom:12px">${w.img||'📝'}</div>
      <div style="font-size:30px;font-weight:900;color:#60A5FA;font-family:monospace;margin-bottom:6px">${w.en}</div>
      <div style="font-size:18px;color:#E2E8F0;font-weight:700;margin-bottom:6px">${w.kr}</div>
      <div style="font-size:13px;color:#94A3B8;font-style:italic">"${w.ex||''}"</div>
      <div style="margin-top:10px;font-size:12px;color:#475569">${idx+1}/${words.length}</div>`;
  };

  const startTimer=()=>{
    render();
    if(window._streamTimer) clearInterval(window._streamTimer);
    window._streamTimer=setInterval(()=>{
      idx=(idx+1)%words.length;
      render();
    },speed);
  };

  const stopTimer=()=>{
    if(window._streamTimer) { clearInterval(window._streamTimer); window._streamTimer=null; }
  };

  const exitStream=()=>{
    stopTimer();
    cm();
  };

  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="background:#1A1A2E;border-radius:24px 24px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:14px;font-weight:800;color:#fff">📻 스트리밍 모드</div>
      <button id="stream-exit-btn" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 14px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">✕ 종료</button>
    </div>
    <div id="mode-word" style="text-align:center;padding:20px 0;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="stream-prev" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏮</button>
      <button id="stream-play" style="background:#1E5FA5;border:none;border-radius:10px;padding:10px;flex:2;color:#fff;cursor:pointer;font-size:18px">⏸</button>
      <button id="stream-next" style="background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;flex:1;color:#fff;cursor:pointer;font-size:18px">⏭</button>
    </div>
    <div style="margin-top:10px">
      <div style="font-size:12px;color:#6B7280;margin-bottom:6px;text-align:center">속도</div>
      <div style="display:flex;gap:6px;justify-content:center">
        ${[['느리게',5000],['보통',3000],['빠르게',1500]].map(([lb,s])=>`<button class="sp-btn" data-speed="${s}" style="background:${speed===s?'#1E5FA5':'rgba(255,255,255,.1)'};border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">${lb}</button>`).join('')}
      </div>
    </div>
  </div></div>`;

  // 이벤트 바인딩 (getElementById로 직접)
  let paused = false;

  document.getElementById('stream-exit-btn').onclick = exitStream;

  document.getElementById('stream-prev').onclick = ()=>{
    idx=(idx-1+words.length)%words.length;
    startTimer();
  };

  document.getElementById('stream-next').onclick = ()=>{
    idx=(idx+1)%words.length;
    startTimer();
  };

  document.getElementById('stream-play').onclick = function(){
    if(paused){
      paused=false;
      this.textContent='⏸';
      startTimer();
    } else {
      paused=true;
      this.textContent='▶';
      stopTimer();
      render();
    }
  };

  document.querySelectorAll('.sp-btn').forEach(btn=>{
    btn.onclick=function(){
      speed=+this.dataset.speed;
      document.querySelectorAll('.sp-btn').forEach(b=>b.style.background='rgba(255,255,255,.1)');
      this.style.background='#1E5FA5';
      if(!paused) startTimer();
    };
  });

  startTimer();
}

function srsFeedback(en, quality) {
  // SM-2 알고리즘 기반
  if(!S.srsData) S.srsData={};
  if(!S.srsData[en]) S.srsData[en]={reps:0,ef:2.5,interval:1};
  const d=S.srsData[en];

  if(quality<3) {
    // 틀린 경우: 내일 다시
    d.reps=0; d.interval=1;
    setMark(en,2); // 헷갈리는으로 마크
  } else {
    // 맞은 경우: SM-2 공식
    d.reps++;
    if(d.reps===1) d.interval=1;
    else if(d.reps===2) d.interval=6;
    else d.interval=Math.round(d.interval*d.ef);
    // EF 업데이트
    d.ef=Math.max(1.3, d.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    if(getMark(en)===2) setMark(en,0); // 헷갈리는 → 미분류
  }

  if(!S.srsReps) S.srsReps={};
  S.srsReps[en]=(S.srsReps[en]||0)+1;
  srsRate(en, d.interval);
}

function srsRate(en, days) {
  const next=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  S.srsMap[en]=next; sv();
}

  if(S.stab==='quiz3') return booksBar+tabs+rQuiz3();
  if(S.stab==='modes') return booksBar+tabs+rModes();
  if(S.stab==='add')   return booksBar+tabs+rAdd();
  if(S.stab==='list')  return booksBar+tabs+rList();
  return booksBar+tabs+rList();
}

function startGameWithSettings(gameId) {
  const gs = S.gameSettings||{count:10,markFilter:-1,dir:0,autoMark:true,autoNext:false};

  // 현재 선택된 단어장의 단어 사용
  const curWords = getCurrentBookWords();

  if(!curWords.length) {
    toast('현재 단어장에 단어가 없어요! 단어를 먼저 추가해주세요.');
    return;
  }

  let src = curWords;
  if(gs.markFilter>=0) {
    src = curWords.filter(w=>{
      const mm = getCurrentBookMarkMap();
      return (mm[w.en]||0) === gs.markFilter;
    });
  }
  if(!src.length) src = curWords;
  startGameW(gameId, pick(src, Math.min(gs.count, src.length)));
}

// 현재 선택된 단어장 단어 반환
function getCurrentBookWords() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.words;
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.words||[]) : S.words;
}

// 현재 선택된 단어장 마크맵 반환
function getCurrentBookMarkMap() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.markMap||{};
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.markMap||{}) : S.markMap||{};
}

function initFlashSwipe() {
  const card = document.getElementById('flash-card');
  if(!card) return;
  let sx=0, sy=0;
  card.addEventListener('touchstart', e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  card.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40) {
      e.stopPropagation();
      if(dx<0){S.idx++;S.flip=false;}
      else{S.idx=Math.max(0,S.idx-1);S.flip=false;}
      SFX.play('tap'); vib(20); go();
    }
  },{passive:true});
}

function startAutoPlay() {
  let playing=true, idx=S.idx;
  const next=()=>{
    if(!playing||idx>=S.words.length){playing=false;cm();return;}
    const w=S.words[idx];
    const u=new SpeechSynthesisUtterance(w.en+'. '+w.kr);
    u.lang='ko-KR'; u.rate=0.9;
    window.speechSynthesis.speak(u);
    S.idx=idx; S.flip=false; go();
    idx++;
    u.onend=()=>{if(playing)setTimeout(next,600);};
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="text-align:center">
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">▶ 자동 재생 중</div>
    <div style="font-size:13px;color:#9CA3AF;margin-bottom:14px">단어를 순서대로 읽어드려요</div>
    <button onclick="playing=false;window.speechSynthesis.cancel();cm()" class="btn bgr">⏹ 정지</button>
  </div></div>`;
  next();
}

async function extractFromText() {

    const isUrl = inp.startsWith('http://') || inp.startsWith('https://');
    const prompt = isUrl
      ? `이 URL의 내용을 알 수 없으므로, URL 자체에서 단어를 추측해서 JSON 배열로 반환: ${inp}\n형식: [{"en":"word","kr":"뜻"}] (5~10개)`
      : `아래 영어 텍스트에서 학습하기 좋은 단어 10~15개를 뽑아 JSON 배열로만 반환.\n형식: [{"en":"word","kr":"뜻"}]\n\n텍스트:\n${inp.slice(0,2000)}`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    showExtracted(JSON.parse(txt));
  } catch(e) { toast('추출 실패. 텍스트를 직접 입력해주세요'); }
  S.ai=false; go('mybooks','add');
}

async function aiEnrichWord(en) {
  const wi = S.words.find(x=>x.en===en);
  if(!wi) return;
  toast('AI 분석 중...');
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:`"${en}" 단어 정보 JSON으로만 반환. 형식: {"koSnd":"한국어발음(예:애플)","pos":"품사(예:명사/동사)","syn":"유의어 2개(쉼표구분)","tip":"한국어 암기팁"}`}]})});
    const d=await r.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const p=JSON.parse(txt);
    if(p.koSnd) wi.koSnd=p.koSnd;
    if(p.pos) wi.pos=p.pos;
    if(p.syn) wi.syn=p.syn;
    if(p.tip&&!wi.tip) wi.tip=p.tip;
    sv();
    showWordDetail(en);
  } catch(e) { toast('AI 오류'); }
}

  const gs = S.gameSettings||{count:10};

  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const src = ws || (curWords.length>=2 ? curWords : (DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  S._prevTab=(S.tab==='butterfly'||S.tab==='game')?'butterfly':(S.tab||'home'); S.gameId=id; S.gDone=false; S._gameRunning=true; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput='';
  S.gResultMap={};
  // ws가 이미 지정됐으면 그대로, 아니면 count 적용
  const cnt=ws?ws.length:Math.min(gs.count||10, src.length);
  S.gWords=ws||pick(src,cnt);
  // 이어하기 저장 (quiz/typing만)
  if(id==='quiz'||id==='typing') {
    S.gSavedGame={id,words:S.gWords,score:0,idx:0};
  }
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='wc'){const pool=src.filter(w=>w.en.length>=3);S.wcWord=pool.length?rnd(pool):src[0];S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;}
  if(id==='sentence'||id==='ssort'){buildSentenceFromWords(ws||S.gWords);if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}

  // 깜빡이(flip)는 학습 탭 플래시카드 모드로 이동
  if(id==='flip') {
    // S.words를 덮어쓰지 않고 gWords를 임시로 참조
    S._flipWords = S.gWords; // 임시 저장
    S._flipIdx = 0;
    S.tab = 'study'; S.stab = 'learn'; go();
    toast(`⚡ 깜빡이 시작! ${S.gWords.length}개 단어`);
    return;
  }

  // game_center 탭에서 실행해도 game 탭으로 전환
  S.tab='butterfly'; S.stab=null; go();
}

function rGame(){if(S.gDone)return rGameDone();const map={quiz:rQ4,fill:rFill,wordfind:rWF,chain:rChain,match:rMatch,sentence:rSentence,scramble:rTyping,typing:rTyping,wordle:rWordle,wc:rWC,ssort:rSSorting,listen:rListen};return(map[S.gameId]||rGameDone)();}

function rGameDone(){
  SFX.stopBG();
  S._gameRunning=false;
  if(typeof saveGameScore==='function') saveGameScore(S.gScore);
  // 게임 완료 XP 지급
  if(!S._inLevelTest && !S._inLearnSession) {
    const gameXp = {quiz:30,fill:25,typing:35,match:20,sentence:40,listen:35,wordfind:25,wordle:50,wc:25,chain:30};
    const xpAmt = gameXp[S.gameId]||20;
    const pct = S.gWords.length>0 ? Math.round(S.gScore/100/S.gWords.length*100) : 0;
    const bonus = pct>=100?1.5:pct>=80?1.2:1.0;
    const finalXp = Math.round(xpAmt*bonus);
    addXP(finalXp);
    checkXpUsable();
  }
  // 레벨 테스트
  if(S._inLevelTest) {
    const rm={...(S.gResultMap||{})};
    S._inLevelTest=false; S._inLearnSession=false;
    const tw=S._levelTestWords||[];
    const correct=tw.filter(w=>rm[w.en]!==false).length;
    const total=tw.length;
    const pct=total>0?Math.round(correct/total*100):0;
    const passRate=S._levelTestPassRate||100;
    const passed=pct>=passRate;
    const curLvIdx=LEVELS.findIndex(l=>l.id===S.lid);
    const nextLv=LEVELS[Math.min(curLvIdx+1,LEVELS.length-1)];
    const lvInfo=lv(S.lid);
    S.tab='learn'; S.gDone=false;
    requestAnimationFrame(()=>{
      go('learn');
      requestAnimationFrame(()=>{
        const mr=document.getElementById('mr');
        if(!mr)return;
        mr.innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()" style="text-align:center">
      <div style="font-size:56px;margin-bottom:12px">${passed?'🎉':'😢'}</div>
      <div style="font-size:22px;font-weight:900;color:${passed?'#16A34A':'#DC2626'};margin-bottom:6px">${passed?'통과!':'아쉽게도 탈락...'}</div>
      <div style="font-size:32px;font-weight:900;color:${passed?'#16A34A':'#DC2626'};margin-bottom:4px">${pct}%</div>
      <div style="font-size:13px;color:#9CA3AF;margin-bottom:16px">${correct}/${total}개 정답 (기준: ${passRate}%)</div>
      ${passed?`<div style="background:#F0FDF4;border-radius:14px;padding:14px;margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:#16A34A">${lvInfo.emoji} ${lvInfo.name} → ${nextLv?.emoji||'⚡'} ${nextLv?.name||'최고'} 승급!</div></div>
        <button onclick="cm();_doLevelUp()" style="width:100%;background:#16A34A;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px">🎊 레벨업!</button>`
      :`<button onclick="cm();startLearnSession('random')" style="width:100%;background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px">📖 다시 학습</button>`}
      <button onclick="cm();go('learn')" style="width:100%;background:#F3F4F6;color:#6B7280;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer">학습 탭으로</button>
    </div></div>`;
      });
    });
    return '';
  }
  // 학습 세션
  if(S._inLearnSession) {
    const rm={...(S.gResultMap||{})};
    S._inLearnSession=false;
    S.tab='learn'; S.gDone=false;
    // 화면 전환 후 모달 표시
    requestAnimationFrame(()=>{
      go('learn');
      requestAnimationFrame(()=>finishLearnSession(rm));
    });
    return '';
  }
  const tot=Math.max(S.gWords.length,1);
  const right=Math.round(S.gScore/100);
  const pct=Math.round(right/tot*100);
  const hp=pct>=70;
  if(hp){SFX.play('levelup');vib([100,50,100,50,200]);}else{SFX.play('wrong');vib([100,100,200]);}
  const lvInfo=lv(S.lid);
  const msg=pct>=100?['완벽해! 천재다! 🏆',lvInfo.id,'happy']:
    pct>=80?['아주 잘했어! 🎉',lvInfo.id,'happy']:
    pct>=60?['조금 더 할 수 있어! 💪',lvInfo.id,'normal']:
    ['괜찮아! 다시 도전! 🔥',lvInfo.id,'sad'];

  // 최고점 업데이트
  if(!S.bestScores) S.bestScores={};
  const prevBest=S.bestScores[S.gameId]||0;
  const isNewBest=pct>prevBest;
  if(isNewBest){ S.bestScores[S.gameId]=pct; sv(); }

  // 자동 마킹: gameSettings.autoMark가 true일 때만
  const autoMark = S.gameSettings?.autoMark !== false;
  if(autoMark && S.gResultMap && Object.keys(S.gResultMap).length) {
    Object.entries(S.gResultMap).forEach(([en,isOk])=>{
      if(isOk) { if(getMark(en)!==1) setMark(en,1); }
      else setMark(en,2);
    });
  }

  return `<div class="pad" style="align-items:center;text-align:center;gap:16px">
    ${cbrow(msg[0],msg[1],msg[2])}
    <div style="width:140px;height:140px;border-radius:50%;background:${hp?'#F0FDF4':'#FFF1F2'};border:4px solid ${hp?'#16A34A':'#DC2626'};display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:48px;font-weight:900;color:${hp?'#16A34A':'#DC2626'};line-height:1">${pct}</div>
      <div style="font-size:14px;color:#9CA3AF;font-weight:700">${right}/${tot}</div>
    </div>
    <div style="display:flex;gap:8px;width:100%">
      ${[['✅',right+'개','정답','#16A34A'],['❌',(tot-right)+'개','오답','#DC2626'],['📊',pct+'%','정확도','#1E5FA5']].map(([ic,v,lb,c])=>`<div style="flex:1;background:#fff;border-radius:14px;border:1.5px solid #E5E7EB;padding:12px;text-align:center"><div style="font-size:18px">${ic}</div><div style="font-size:18px;font-weight:900;color:${c}">${v}</div><div style="font-size:10px;color:#9CA3AF">${lb}</div></div>`).join('')}
    </div>
    ${isNewBest&&pct>0?`<div style="background:linear-gradient(135deg,#FFF8E1,#FEF3C7);border-radius:14px;padding:10px 14px;width:100%;text-align:center">
      <div style="font-size:14px;font-weight:900;color:#E65100">🏆 신기록! ${pct}%</div>
      <div style="font-size:11px;color:#9CA3AF">이 게임 최고점을 갱신했어요!</div>
    </div>`:`<div style="font-size:12px;color:#9CA3AF;text-align:center">최고점: ${prevBest}%</div>`}
    ${S.gResultMap&&Object.keys(S.gResultMap).length?`<div style="background:#FFF8E1;border-radius:14px;padding:10px 14px;width:100%;text-align:left">
      <div style="font-size:12px;font-weight:700;color:#E65100;margin-bottom:6px">✅ 자동 마킹 완료</div>
      <div style="font-size:12px;color:#6B7280">맞은 단어 → 외운 단어, 틀린 단어 → 헷갈리는 단어로 자동 표시됐어요</div>
    </div>`:''}
    <div style="display:flex;gap:8px;width:100%;flex-wrap:wrap">
      <button class="btn bgr" onclick="SFX.stopBG();S._gameRunning=false;S.gDone=true;go(S._prevTab||'butterfly')" style="flex:1">다른 게임</button>
      <button class="btn bb" onclick="SFX.stopBG();startGameW(S.gameId,null)" style="flex:1">다시 하기</button>
      ${S.gSavedGame&&S.gIdx<S.gWords.length?`<button onclick="SFX.stopBG();S.gDone=false;go('game')" style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#16A34A;width:100%">▶ 이어하기 (${S.gIdx}/${S.gWords.length})</button>`:''}
    </div>
  </div>`;
}

const GGRADS={quiz:'linear-gradient(135deg,#1E5FA5,#2563EB)',fill:'linear-gradient(135deg,#D97706,#F59E0B)',wordfind:'linear-gradient(135deg,#16A34A,#22C55E)',chain:'linear-gradient(135deg,#7C3AED,#A855F7)',match:'linear-gradient(135deg,#0D9488,#14B8A6)',sentence:'linear-gradient(135deg,#E91E63,#F43F5E)',scramble:'linear-gradient(135deg,#EC4899,#F472B6)',wordle:'linear-gradient(135deg,#92400E,#D97706)',typing:'linear-gradient(135deg,#15803D,#16A34A)',wc:'linear-gradient(135deg,#0369A1,#0EA5E9)',ssort:'linear-gradient(135deg,#E65100,#F97316)',listen:'linear-gradient(135deg,#880E4F,#BE185D)'};
function ghdr(title,prog){const grd=GGRADS[S.gameId]||GGRADS.quiz;const right=Object.values(S.gResultMap||{}).filter(v=>v===true).length;const wrong=Object.values(S.gResultMap||{}).filter(v=>v===false).length;const scoreStr=(right>0||wrong>0)?`<span style="font-size:12px;font-weight:800;color:#86EFAC">✅${right}</span> <span style="font-size:12px;font-weight:800;color:#FECACA">❌${wrong}</span>`:`<span style="font-size:12px;color:rgba(255,255,255,.8)">${prog}</span>`;return `<div style="background:${grd};padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0"><button onclick="SFX.stopBG();go('mybooks','quiz3')" style="background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;color:#fff">← 나가기</button><div style="font-size:14px;font-weight:800;color:#fff">${title}</div><div>${scoreStr}</div></div>`;}

function rQ4(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const src=S.gWords.length>=4?S.gWords:(S.words.length>=4?S.words:(DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  const cs=(S.gAns&&S._gCs&&S._gCs.length)?S._gCs:(()=>{S._gCs=shuf([w,...pick(src.filter(x=>x.en!==w.en),3)]);return S._gCs;})();
  return ghdr('🎯 뜻 맞추기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'맞아! 🎉':'아쉬워! 💪'):'이 단어의 뜻은?',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#1E5FA5"></div></div>
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:20px;padding:24px;text-align:center;border:3px solid #BFDBFE">
      ${S.showImg!==false?`<div style="font-size:72px;margin-bottom:8px">${w.img||'📝'}</div>`:''}
      <div style="font-size:28px;font-weight:900;color:#1E5FA5;font-family:monospace">${w.en}</div>
      <div style="font-size:13px;color:#64748B;margin-top:4px">${w.ph||''}</div>
    </div>
    <div class="g2">${cs.map((ch,ci)=>{let bg='var(--bg-card,#fff)',col='var(--text1,#111)',bd='var(--border,#E5E7EB)';if(S.gAns){if(ch.en===w.en){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}else if(S.gRes==='ng'&&S._gLastAns===ci){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}}return `<button onclick="${S.gAns?'':`ansQIdx(${ci},${S.gIdx})`}" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:13px;font-weight:700;cursor:${S.gAns?'default':'pointer'};transition:all .2s;font-family:inherit">${ch.kr}</button>`;}).join('')}</div>
    </div>
  </div>`;
}
function ansQ(c,ok2){
  S.gAns=true; S.gRes=c===ok2?'ok':'ng';
  if(c===ok2){S.gScore+=100;ok();S.gResultMap[ok2]=true;}
  else{ng();S.gResultMap[ok2]=false;}
  logStudy('quiz'); go();
  const delay=S.gameSettings?.autoNext?600:900;
  setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;S._gCs=null;S._gLastAns=null;if(S.gIdx>=S.gWords.length)S.gDone=true;go();},delay);
}

function ansQIdx(ci,wIdx){
  const cs=S._gCs; const w=S.gWords[wIdx];
  if(!cs||!w)return;
  const chosen=cs[ci]; if(!chosen)return;
  S._gLastAns=ci;
  const isOk=chosen.en===w.en;
  S.gAns=true; S.gRes=isOk?'ok':'ng';
  if(isOk){S.gScore+=100;ok();S.gResultMap[w.en]=true;}
  else{ng();S.gResultMap[w.en]=false;}
  logStudy('quiz'); go();
  const delay=S.gameSettings?.autoNext?600:900;
  setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;S._gCs=null;S._gLastAns=null;if(S.gIdx>=S.gWords.length)S.gDone=true;go();},delay);
}

function rFill(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const src=S.gWords.length>=4?S.gWords:(S.words.length>=4?S.words:(DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  const cs=shuf([w,...pick(src.filter(x=>x.en!==w.en),3)]);
  return ghdr('📝 빈칸 채우기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'완벽해! 🎉':'아쉬워! 💪'):'빈칸에 들어갈 단어는?',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#D97706"></div></div>
    <div style="background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-radius:20px;padding:20px;text-align:center;border:3px solid #FDE68A">
      ${S.showImg!==false?`<div style="font-size:64px;margin-bottom:8px">${w.img||'📝'}</div>`:''}
      <div style="font-size:15px;color:#111;font-style:italic;line-height:2">"${w.ex.replace(w.en,'_______')}"</div>
      <div style="font-size:13px;color:#D97706;margin-top:8px;font-weight:700">뜻: ${w.kr}</div>
    </div>
    <div class="g2">${cs.map(c=>{let bg='#fff',col='#111',bd='#E5E7EB';if(S.gAns){if(c.en===w.en){bg='#F0FDF4';col='#16A34A';bd='#86EFAC';}else if(S.gRes==='ng'){bg='#FFF1F2';col='#DC2626';bd='#FECDD3';}}return `<button onclick="${S.gAns?'':'ansQ(\''+c.en+'\',\''+w.en+'\')'}" style="background:${bg};color:${col};border:2px solid ${bd};border-radius:14px;padding:14px 8px;font-size:13px;font-weight:700;cursor:${S.gAns?'default':'pointer'};font-family:monospace">${c.en}</button>`;}).join('')}
    </div>
  </div>`;
}

function rTyping(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const isSc=S.gameId==='scramble';
  const sc=shuf([...w.en]).join('');
  const grad=isSc?GGRADS.scramble:GGRADS.typing;
  return ghdr(isSc?'🔀 스크램블':'✏️ 문장 완성',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'완벽해! 🎉':'아쉬워! 💪'):isSc?'섞인 철자를 올바르게 써봐!':'뜻을 보고 영단어를 써봐!',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#EC4899"></div></div>
    <div style="background:${grad};border-radius:20px;padding:24px;text-align:center">
      <div style="font-size:72px;margin-bottom:8px">${w.img||'📝'}</div>
      ${isSc?`<div style="font-size:28px;font-weight:900;color:#fff;letter-spacing:8px;font-family:monospace">${sc}</div><div style="font-size:13px;color:rgba(255,255,255,.8);margin-top:6px">뜻: ${w.kr}</div>`
      :`<div style="font-size:22px;font-weight:800;color:#fff">${w.kr}</div><div style="font-size:12px;font-style:italic;color:rgba(255,255,255,.8);margin-top:8px">"${w.ex.replace(w.en,'_____')}"</div>`}
    </div>
    <input id="ti" value="${S.gInput}" oninput="S.gInput=this.value" onkeydown="if(event.key==='Enter')chkT('${w.en}')" placeholder="영단어 입력..." style="border:2px solid ${S.gRes==='ok'?'#16A34A':S.gRes==='ng'?'#DC2626':'#BFDBFE'};font-size:17px;font-family:monospace;font-weight:700">
    <button class="btn" onclick="chkT('${w.en}')" ${S.gAns?'disabled':''} style="background:#EC4899;color:#fff">확인</button>
  </div>`;
}
function chkT(ok2){const v=(document.getElementById('ti')?.value||'').trim().toLowerCase();const r=v===ok2.toLowerCase();S.gAns=true;S.gRes=r?'ok':'ng';if(r){S.gScore+=100;ok();S.gResultMap[ok2]=true;}else{ng();toast('❌ 정답: '+ok2);S.gResultMap[ok2]=false;}logStudy('quiz');go();setTimeout(()=>{S.gIdx++;S.gAns=false;S.gRes=null;S.gInput='';if(S.gIdx>=S.gWords.length)S.gDone=true;go();},1000);}

// 단어 완성하기
function rWC(){
  if(!S.wcWord){S.gDone=true;return rGame();}
  const w=S.wcWord;
  const visibleWord=S.wcLetters.map((l,i)=>{
    if(!l.hidden||S.wcGuessed.has(i)) return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:#1E5FA5;margin:0 2px;border-bottom:3px solid #1E5FA5;padding:0 4px">${l.letter.toUpperCase()}</span>`;
    return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:transparent;margin:0 2px;border-bottom:3px solid ${S.wcWrong>=6?'#DC2626':'#BFDBFE'};padding:0 4px">_</span>`;

function buildWF(src){
  // 단어 수에 따라 그리드 크기 결정
  const wordCount = Math.min((src||S.gWords||[]).length, 8);
  const pickWords = pick((src||S.gWords).map(w=>w.en.toUpperCase().replace(/\s/g,'_')), wordCount);
  const sz = Math.max(8, Math.ceil(Math.sqrt(pickWords.reduce((a,w)=>a+w.length,0)*2)));
  const gridSz = Math.min(sz, 12); // 최대 12×12
  const grid = Array.from({length:gridSz},()=>Array(gridSz).fill(''));
  const placed = [];
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  pickWords.forEach(w=>{
    for(let t=0;t<100;t++){
      const dir=Math.floor(Math.random()*2);
      const dr=[0,1][dir], dc=[1,0][dir];
      const r=Math.floor(Math.random()*(gridSz-dr*(w.length-1)));
      const c=Math.floor(Math.random()*(gridSz-dc*(w.length-1)));
      if(r+dr*(w.length-1)>=gridSz||c+dc*(w.length-1)>=gridSz) continue;
      let ok=true;
      const cells=[];
      for(let i=0;i<w.length;i++){
        const cr=r+dr*i, cc=c+dc*i;
        if(grid[cr][cc]&&grid[cr][cc]!==w[i]){ok=false;break;}
        cells.push(`${cr},${cc}`);
      }
      if(ok){
        cells.forEach((k,i)=>{const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=w[i];});
        placed.push({word:w,cells});
        break;
      }
    }
  });

  // 빈 칸 채우기
  for(let r=0;r<gridSz;r++)for(let c=0;c<gridSz;c++)
    if(!grid[r][c])grid[r][c]=alpha[Math.floor(Math.random()*26)];

  S.wfGrid=grid;
  S.wfWords=placed; // 실제 배치된 단어만
  S.wfFound=new Set();
  S.wfSel=[];
  S.wfGridSz=gridSz;
}
