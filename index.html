function getMyButterflies() {
  if(Array.isArray(S.myButterflies)) return S.myButterflies;
  return JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
}

function rollButterfly() {
  const owned = getMyButterflies();
  // 기존 보유 나비도 후보에 포함 (전체 나비 풀)
  const pool = BUTTERFLY_LIST.slice();
  if(pool.length === 0) return null;

  // ── score 기반 희소성 확률 ──
  // 최고점(100) 나비는 정확히 0.01%씩 고정 배정.
  // 나머지 확률(99.99%…)은 (101 - score)^2 가중치로 분배해
  // 점수가 높을수록 희귀, 낮을수록 흔하게 한다.
  //  예) 100점 = 0.01%, 95점 ≈ 0.06%, 50점대 ≈ 2.9%, 10점 ≈ 13.6%
  const TOP_PROB = 0.0001; // 100점 1종당 0.01%
  const topIdx = [], restIdx = [];
  pool.forEach((b,i) => { ((b.score||0) >= 100 ? topIdx : restIdx).push(i); });
  const restBudget = Math.max(0, 1 - topIdx.length * TOP_PROB); // 나머지가 나눠가질 확률
  const restWeights = restIdx.map(i => Math.pow(101 - (pool[i].score||50), 2));
  const restWsum = restWeights.reduce((a,c)=>a+c, 0) || 1;
  // 각 나비의 최종 확률 배열 (pool 인덱스 순서)
  const probs = new Array(pool.length).fill(0);
  topIdx.forEach(i => { probs[i] = TOP_PROB; });
  restIdx.forEach((poolI, k) => { probs[poolI] = restWeights[k] / restWsum * restBudget; });

  // 확률 룰렛 (probs 합 = 1)
  let r = Math.random();
  let chosen = pool[pool.length - 1];
  for(let i=0; i<pool.length; i++) {
    r -= probs[i];
    if(r <= 0) { chosen = pool[i]; break; }
  }

  // 보유 목록에 없으면 추가 (이미 있으면 중복 추가 안 함)
  if(!owned.includes(chosen.id)) {
    owned.push(chosen.id);
    localStorage.setItem('wd-butterflies', JSON.stringify(owned));
    S.myButterflies = owned;
    if(S.user && typeof db !== 'undefined') {
      try { db.collection('users').doc(S.user.uid).set({myButterflies: owned}, {merge:true}); } catch(e) {}
    }
  }
  // 이미 보유한 나비여도 chosen을 반환 (뽑기 결과로 표시)
  return chosen;
}

// ── 홈 XP 순위 렌더링 ──
async function getRankSnap(){
  try{
    const us = await db.collection('users').get();
    const arr = us.docs.map(function(d){
      const x=d.data()||{};
      const total = x._totalXp || x.xp || 0;
      const day = x.xp || 0;
      return {uid:d.id, nick:x.nick||'익명', streak:x.streak||0, day:day, week:total, month:total, total:total};
    });
    arr.sort(function(a,b){return b.total-a.total;});
    return arr;
  }catch(e){ return []; }
}

async function renderHomeRank() {
  const el = document.getElementById('home-rank-body');
  const myEl = document.getElementById('home-my-rank');
  if(!el) return;
  if(typeof db === 'undefined' || !S.user) {
    el.innerHTML = '<div style="text-align:center;padding:12px;color:#9CA3AF;font-size:11px">로그인 필요</div>';
    return;
  }
  const mode = window._homeRankMode || 'day';
  const modeColor = {day:'#1E5FA5',week:'#16A34A',month:'#7C3AED',total:'#E65100'}[mode];
  const modeLabel = {day:'오늘',week:'주간',month:'월간',total:'누적'}[mode];

  // 버튼 스타일 업데이트
  ['day','week','month','total'].forEach(m => {
    const btn = document.getElementById('hr-'+m);
    if(!btn) return;
    const c = {day:'#1E5FA5',week:'#16A34A',month:'#7C3AED',total:'#E65100'}[m];
    btn.style.background = m===mode ? c : '#fff';
    btn.style.color = m===mode ? '#fff' : '#9CA3AF';
    btn.style.borderColor = m===mode ? c : '#E5E7EB';
  });

  el.innerHTML = '<div style="text-align:center;padding:12px;color:#9CA3AF;font-size:11px">⏳ 불러오는 중...</div>';

  try {
    const _snapUsers = await getRankSnap();
    const all = [];
    const myUid = S.user?.uid || '';
    _snapUsers.forEach(function(u){
      const xp = (u[mode]||0);
      all.push({uid:u.uid, nick:u.nick||'익명', xp:xp, streak:u.streak||0});
    });
    all.sort((a,b)=>b.xp-a.xp);
    const top5 = all.slice(0,5);
    const maxXp = top5[0]?.xp||1;
    const myRank = all.findIndex(u=>u.uid===myUid)+1;
    const myEntry = all.find(u=>u.uid===myUid);

    // ── 이전 순위 로드 & 저장 ──
    const prevKey = 'wd-prev-rank-'+mode;
    let prevRankMap = {};
    try { prevRankMap = JSON.parse(localStorage.getItem(prevKey)||'{}'); } catch(e){}
    // 현재 순위를 저장 (다음 조회 때 비교용)
    const newRankMap = {};
    all.forEach((u,i) => { newRankMap[u.uid] = i+1; });
    localStorage.setItem(prevKey, JSON.stringify(newRankMap));

    // 단계 변화 뱃지 생성 함수
    const changeBadge = (uid, curRank) => {
      const prev = prevRankMap[uid];
      if(!prev) return '<span style="font-size:9px;color:#9CA3AF;font-weight:700;background:#F3F4F6;border-radius:4px;padding:1px 4px">NEW</span>';
      const diff = prev - curRank; // 양수=상승, 음수=하락
      if(diff === 0) return '<span style="font-size:10px;color:#9CA3AF">━</span>';
      if(diff > 0)   return `<span style="font-size:9px;color:#16A34A;font-weight:700;background:#F0FDF4;border-radius:4px;padding:1px 4px">▲${diff}</span>`;
      return             `<span style="font-size:9px;color:#DC2626;font-weight:700;background:#FFF5F5;border-radius:4px;padding:1px 4px">▼${Math.abs(diff)}</span>`;
    };

    const rankLabel = ['1위','2위','3위','4위','5위'];
    const rankColor = ['#F59E0B','#94A3B8','#92400E','#6B7280','#6B7280'];

    el.innerHTML = `<div style=\"text-align:center;padding:5px 8px;margin-bottom:6px;color:#9CA3AF;font-size:10px;background:#F9FAFB;border-radius:6px\">\uD83D\uDCC5 \uB7AD\uD0B9\uC740 \uC804\uC77C 24\uC2DC \uAE30\uC900\uC785\uB2C8\uB2E4</div>` + (top5.length === 0
      ? `<div style="text-align:center;padding:12px;color:#9CA3AF;font-size:11px">${modeLabel} XP 데이터 없음</div>`
      : top5.map((u,i) => {
          const bar = Math.round(u.xp/maxXp*100);
          const isMe = u.uid===myUid;
          const badge = changeBadge(u.uid, i+1);
          return `<div style="padding:7px 8px;border-radius:9px;background:${isMe?'#EFF6FF':'#F9FAFB'};margin-bottom:5px;border:1.5px solid ${isMe?'#BFDBFE':'transparent'}">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span style="font-size:11px;font-weight:900;color:${rankColor[i]};width:22px;text-align:center;flex-shrink:0">${rankLabel[i]}</span>
              ${badge}
              <span style="flex:1;font-size:12px;font-weight:700;color:${isMe?'#1E5FA5':'#111'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.nick}${isMe?' 👈':''}</span>
              <span style="font-size:12px;font-weight:800;color:${modeColor}">⚡${u.xp.toLocaleString()}</span>
            </div>
            <div style="background:#E5E7EB;border-radius:99px;height:4px;overflow:hidden">
              <div style="height:100%;background:${modeColor};border-radius:99px;width:${bar}%"></div>

// 드롭다운용: 화면 이동 없이 현재 책을 안전하게 전환 (활성 단어 동기화)
function _selectBook(name) {
  if(name === S.currentBook) return;
  saveCurrentBook(); // 현재 책 먼저 저장 (안전망 포함)
  if(name === '내 단어장') {
    // 내 단어장으로 전환: wd-w(내 단어장 백업)에서 활성 단어 복원
    try {
      const w = localStorage.getItem('wd-w');
      S.words = w ? JSON.parse(w) : [];
    } catch(e) { S.words = []; }
    const mk = localStorage.getItem('wd-mk'); S.markMap = mk ? JSON.parse(mk) : {};
    const lrn = localStorage.getItem('wd-lrn'); S.learned = new Set(lrn ? JSON.parse(lrn) : []);
    S.currentBook = name;
    S.idx = 0; S.flip = false;
    if(typeof sv === 'function') sv();
    return;
  }
  const book = (S.books||[]).find(b => b.name === name);
  if(!book) { S.currentBook = name; if(typeof sv === 'function') sv(); return; }
  S.words = [...(book.words||[])];
  S.markMap = {...(book.markMap||{})};
  S.srsMap = {...(book.srsMap||{})};
  S.learned = new Set(book.learned||[]);
  S.currentBook = name;
  S.idx = 0; S.flip = false;
  if(typeof sv === 'function') sv();
}

function switchBook(name) {
  if(name==='내 단어장'){
    S.currentBook='내 단어장'; S.idx=0; S.flip=false;
    sv(); cm(); go('mybooks');
    return;
  }
  const book = S.books.find(b=>b.name===name);
  if(!book) return;
  // 현재 단어장 저장
  saveCurrentBook();
  // 새 단어장으로 전환
  S.words=[...book.words];
  S.markMap={...book.markMap};
  S.srsMap={...book.srsMap};
  S.learned=new Set(book.learned||[]);
  S.currentBook=name;
  S.idx=0; S.flip=false;
  sv(); cm(); go('mybooks');
  toast(`📚 "${name}"으로 전환!`);
}

function saveCurrentBook() {
  if(S.currentBook==='내 단어장') return; // 기본 단어장은 S.words에 바로 저장
  const idx=S.books.findIndex(b=>b.name===S.currentBook);
  if(idx>=0){
    // 안전망: 활성 단어가 비어있는데 책에는 단어가 있었다면 덮어쓰지 않음 (데이터 손실 방지)
    const prevCount = (S.books[idx].words||[]).length;
    const curCount = (S.words||[]).length;
    if(curCount===0 && prevCount>0){
      console.warn('[saveCurrentBook] 빈 단어로 덮어쓰기 차단:', S.currentBook, prevCount+'개 보존');
      return;
    }
    S.books[idx].words=[...S.words];
    S.books[idx].markMap={...S.markMap};
    S.books[idx].srsMap={...S.srsMap};
    S.books[idx].learned=[...S.learned];
  }
}

function createBook() {
  const name=document.getElementById('new-book-name')?.value.trim();
  if(!name){toast('단어장 이름을 입력하세요');return;}
  if((S.books||[]).length>=10){toast('단어장은 최대 10개까지 만들 수 있어요 📚');return;}
  if(name==='내 단어장'||S.books.find(b=>b.name===name)){toast('이미 있는 이름');return;}
  S.books.push({name,words:[],markMap:{},srsMap:{},learned:[]});
  sv();
  toast(`✅ "${name}" 단어장 생성!`);
  showBooksModal();
}

function deleteBook(name) {
  // confirm 없이 바로 삭제 (showBookMenu에서 이미 확인 모달을 거침)
  S.books=S.books.filter(b=>b.name!==name);
  if(S.currentBook===name){
    S.currentBook='내 단어장'; S.idx=0;
  }
  sv();
}

    if(timerEl) timerEl.style.display='block';

      await new Promise(r=>setTimeout(r,1000));
    }
    if(timerEl) timerEl.style.display='none';

    // 3. 한국어 뜻
    if(statusEl) statusEl.textContent = '📖 뜻 확인';
    await new Promise(res=>{
      const u=new SpeechSynthesisUtterance(w.kr);

      u.onend=res; u.onerror=res;
      window.speechSynthesis.speak(u);
    });

    if(!document.getElementById('sd-status')) return;

    // 4. 다음 단어로
    await new Promise(r=>setTimeout(r,600));
    window._sdIdx++;
    if(window._sdIdx >= window._sdWords.length) {
      addXP&&addXP(xp&&xp('daily_first')||5);
      logStudy&&logStudy('words');
    }
    _sdRender();
    if(window._sdIdx < window._sdWords.length) {
      setTimeout(()=>_sdPlay(), 300);
    }
  };

  window._sdRender = _sdRender;
  window._sdPlay = _sdPlay;
  window._sdPlaying = true;
  _sdRender();
  setTimeout(()=>_sdPlay(), 500);
}

function srsFeedback(en, quality) {
  // SM-2 알고리즘 기반
  if(!S.srsData) S.srsData={};
  if(!S.srsData[en]) S.srsData[en]={reps:0,ef:2.5,interval:1};
  const d=S.srsData[en];

  if(quality<3) {
    // 틀린 경우: 내일 다시
    d.reps=0; d.interval=1;
    setMark(en,2); // 헷갈리는으로 마크
  } else {
    // 맞은 경우: SM-2 공식
    d.reps++;
    if(d.reps===1) d.interval=1;
    else if(d.reps===2) d.interval=6;
    else d.interval=Math.round(d.interval*d.ef);
    // EF 업데이트
    d.ef=Math.max(1.3, d.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    if(getMark(en)===2) setMark(en,0); // 헷갈리는 → 미분류
  }

  if(!S.srsReps) S.srsReps={};
  S.srsReps[en]=(S.srsReps[en]||0)+1;
  srsRate(en, d.interval);
}

function srsRate(en, days) {
  const next=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  S.srsMap[en]=next; sv();
}

      <div style="font-size:10px;color:#9CA3AF;margin-top:2px">시간</div>

  </div>`;

  html += '</div></div>';
  return html;

function startGameWithSettings(gameId) {
  S.gameId = gameId;
  S._prevTab = S.tab; // 현재 탭 저장 → 나가기 시 복귀
  const gs = S.gameSettings||{count:10,markFilter:-1,dir:0,autoMark:true,autoNext:false};

  // 현재 선택된 단어장 + 시스템 단어장 모두 포함
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const sysW = S._sysWords||[];
  const allWords = curWords.length ? curWords : sysW;

  if(!allWords.length) {
    toast('단어가 없어요! 단어장에 단어를 추가하거나 마켓에서 가져와주세요.');
    go('mybooks','market');
    return;
  }

  const _mm = getCurrentBookMarkMap ? getCurrentBookMarkMap() : (S.markMap||{});
  let src = allWords;
  if(gs.markFilter === -2) {
    src = allWords.filter(w=>(_mm[w.en]||0) !== 1); // 외운단어 제외
  } else if(gs.markFilter>=0) {
    src = allWords.filter(w=>(_mm[w.en]||0) === gs.markFilter);
  }
  if(!src.length) src = allWords;
  startGameW(gameId, pick(src, Math.min(gs.count, src.length)));
}

// 현재 선택된 단어장 단어 반환
function getCurrentBookWords() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.words;
  // 일반 단어장 + 마켓 단어장 모두 검색
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  if(bk && (bk.words||[]).length) return bk.words;
  // S.words에서 찾기 (내 단어장 기본)
  return S.words.length ? S.words : [];
}

// 현재 선택된 단어장 마크맵 반환
function getCurrentBookMarkMap() {
  if(!S.currentBook || S.currentBook==='내 단어장') return S.markMap||{};
  const bk = (S.books||[]).find(b=>b.name===S.currentBook);
  return bk ? (bk.markMap||{}) : S.markMap||{};
}



window._doMark = function(v) {
  const words = S._flipWords || [];
  const w = words[S.idx||0];
  if(!w) return;
  const prevMark = getMark(w.en);
  setMark(w.en, v);
  // 외웠음(1)으로 새로 표시할 때만 XP 지급
  if(v === 1 && prevMark !== 1) {
    const _pc = S.studyLog?.[typeof today==='function'?today():new Date().toISOString().slice(0,10)]?.words || 0;
    if(_pc === 0) addXP(xp('daily_first'));
    else addXP(xp('word_learn'));
    logStudy('words');
  }
  S.flip = false;
  S.idx = Math.min((S.idx||0)+1, Math.max(0, words.length-1));
  go();
};
function rLearn() {
  const sort = S.flashSort||'default';
  const filter = S.listMarkFilter??-1;
  let baseWords = typeof getCurrentBookWords==='function' ? [...getCurrentBookWords()] : [...S.words];
  if(sort==='alpha') baseWords.sort((a,b)=>a.en.localeCompare(b.en));

// 플래시카드 스와이프 제스처 등록
function initFlashSwipe() {
  const card = document.getElementById('flash-card');
  if(!card) return;
  let sx=0, sy=0;
  card.addEventListener('touchstart', function(e){
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  card.addEventListener('touchend', function(e){
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>50) {
      e.stopPropagation();
      const _fw = S._flipWords&&S._flipWords.length>0 ? S._flipWords : S.words;
      const w = _fw.length>0 ? _fw[Math.min(S.idx||0, _fw.length-1)] : null;
      if(!w) return;
      if(dx > 0) {
        // 오른쪽 스와이프 = ✅ 외웠음
        const _prevSM = getMark(w.en);
        setMark(w.en, 1);
        if(S.learned && !S.learned.has(w.en)) { S.learned.add(w.en); }
        // 외웠음으로 새로 표시할 때만 XP
        if(_prevSM !== 1) { const _t3=typeof today==='function'?today():new Date().toISOString().slice(0,10); const _pc3=S.studyLog?.[_t3]?.words||0; if(_pc3===0) addXP(xp('daily_first')); else addXP(xp('word_learn')); logStudy('words'); }
        SFX.play && SFX.play('swipe_ok');
        showSwipeHint('✅ 외웠음!', '#16A34A');
        checkAchievements && checkAchievements();
        checkLearnMilestone && checkLearnMilestone();
      } else {
        // 왼쪽 스와이프 = 🔁 복습 필요
        setMark(w.en, 2);
        SFX.play && SFX.play('swipe_ng');
        showSwipeHint('🔁 복습 필요', '#DC2626');
      }
      // 다음 단어로 이동
      S.flip = false;
      S.idx = Math.min((S.idx||0)+1, _fw.length-1);
      sv();
      go();
    }
  });
  // 시각적 힌트
  card.addEventListener('touchstart', function(){
    card.style.transition='none';
  },{passive:true});
}

function startAutoPlay() {
  let playing=true, idx=S.idx;
  const next=()=>{
    if(!playing||idx>=S.words.length){playing=false;cm();return;}
    const w=S.words[idx];
    const u=new SpeechSynthesisUtterance(w.en+'. '+w.kr);
    u.lang='ko-KR'; u.rate=0.9;
    window.speechSynthesis.speak(u);
    S.idx=idx; S.flip=false; go();
    idx++;
    u.onend=()=>{if(playing)setTimeout(next,600);};
  };
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal" style="text-align:center">
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">▶ 자동 재생 중</div>
    <div style="font-size:13px;color:#9CA3AF;margin-bottom:14px">단어를 순서대로 읽어드려요</div>
    <button onclick="playing=false;window.speechSynthesis.cancel();cm()" class="btn bgr">⏹ 정지</button>
  </div></div>`;
  next();
}

function nxtL(ok){
  const words = S.words;
  const w=words[Math.min(S.idx, words.length-1)];
  if(!w) return;
  if(ok&&!S.learned.has(w.en)){
    S.learned.add(w.en);setMark(w.en,1);srsRate(w.en,1);
    logStudy('words');checkAchievements();checkLearnMilestone();sv();
    SFX.play('correct');vib(50);
    const clrs=['#FDE68A','#6EE7B7','#93C5FD'];
    for(let ci=0;ci<6;ci++){const p=document.createElement('div');const ang=(ci/6)*360;p.style.cssText='position:fixed;left:50%;top:60%;width:8px;height:8px;border-radius:50%;background:'+clrs[ci%3]+';z-index:9999;pointer-events:none;transform:translate(-50%,-50%);transition:all .4s ease-out;opacity:1';document.body.appendChild(p);setTimeout(()=>{p.style.transform='translate(calc(-50% + '+Math.round(Math.cos(ang*Math.PI/180)*50)+'px),calc(-50% + '+Math.round(Math.sin(ang*Math.PI/180)*50)+'px))';p.style.opacity='0';},30);setTimeout(()=>p.remove(),500);}
  } else if(ok) {SFX.play('correct');vib(50);}
  S.idx++;
  S.flip=false;
  go();
}

// ── 이미지 파일 처리 (다중) ──
async function handleImgFiles(files) {
  if(!files||!files.length){toast('파일을 선택해주세요');return;}
  S.ai=true; go('mybooks','add');
  const allWords=[];
  for(const file of Array.from(files)) {
    try {
      if(!file.type.startsWith('image/')){toast('이미지 파일만 지원합니다');continue;}
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
      const _txt2 = await geminiVision('이 이미지에서 영어 단어를 모두 찾아 JSON 배열로만 반환하세요. 형식: [{"en":"word","kr":"한국어뜻"}] — 영어 단어가 없으면 []', b64, file.type, 1200);
      const words=parseGeminiJson(_txt2);
      words.forEach(w=>{if(!allWords.find(x=>x.en===w.en))allWords.push(w);});
    } catch(e){if(e.message!=='NO_KEY')toast(e.message||('이미지 분석 실패: '+file.name));}
  }
  S.ai=false;
  if(!allWords.length){toast('영어 단어를 찾지 못했어요');go('mybooks','add');return;}
  showExtracted(allWords);
  go('mybooks','add');
}

// ── PDF 파일 처리 ──
async function handlePdfFile(file) {
  if(!file){toast('파일을 선택해주세요');return;}
  if(file.size>10*1024*1024){toast('10MB 이하 PDF만 지원합니다');return;}
  S.ai=true; go('mybooks','add');
  try {
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const _txt3 = await geminiPdf('이 PDF에서 영어 단어를 최대 50개 추출해 JSON 배열로만 반환하세요. 학습 가치가 높은 단어를 우선 선택하세요. 형식: [{"en":"word","kr":"한국어뜻"}]', b64, 2000);
    const words=parseGeminiJson(_txt3);
    if(!words.length){toast('영어 단어를 찾지 못했어요');S.ai=false;go('mybooks','add');return;}
    S.ai=false;
    showExtracted(words);
    go('mybooks','add');
  } catch(e){
    S.ai=false; go('mybooks','add');
    if(e.message!=='NO_KEY') toast(e.message||'PDF 분석 실패. 텍스트 PDF인지 확인해주세요.');
  }
}

// ── 파일 일괄등록 (Excel/CSV) ──
async function handleBulkFile(file) {
  if(!file){toast('파일을 선택해주세요');return;}
  const ext=file.name.split('.').pop().toLowerCase();
  if(['csv','tsv','txt'].includes(ext)) {
    // CSV/TSV/TXT: 텍스트로 읽어서 파싱
    const text=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file,'UTF-8');});
    const words=[];
    text.split('\n').forEach((ln,i)=>{
      const p=ln.split(/[,\t=;]/);
      if(p.length<2)return;
      const en=p[0].replace(/^["']|["']$/g,'').trim();
      const kr=p[1].replace(/^["']|["']$/g,'').trim();
      // 헤더 스킵
      if(i===0&&(en.toLowerCase()==='english'||en.toLowerCase()==='word'||en.toLowerCase()==='단어'))return;
      if(en&&kr&&/[a-zA-Z]/.test(en))words.push({en,kr});
    });
    if(!words.length){toast('단어를 찾지 못했어요. 형식: A열=영어, B열=한국어');return;}
    showExtracted(words);
  } else if(['xlsx','xls'].includes(ext)) {
    // Excel: SheetJS 동적 로드 후 파싱, 실패시 AI 폴백
    try {
      // SheetJS 동적 로드 (필요할 때만)
      if(typeof XLSX==='undefined') {
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
      }
      const ab=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(file);});
      if(typeof XLSX==='undefined') throw new Error('SheetJS 로드 실패');
      const wb=XLSX.read(ab,{type:'arraybuffer'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      const words=[];
      rows.forEach((row,i)=>{
        if(!row||row.length<2)return;
        const en=String(row[0]||'').replace(/^"|"$/g,'').trim();
        const kr=String(row[1]||'').replace(/^"|"$/g,'').trim();
        if(i===0&&['english','word','단어','영어'].includes(en.toLowerCase()))return;
        if(en&&kr&&/[a-zA-Z]/.test(en))words.push({en,kr});
      });
      if(!words.length){toast('단어를 찾지 못했어요. A열=영어, B열=한국어 형식인지 확인해주세요.');return;}
      showExtracted(words);
    } catch(e){
      // AI 폴백 (SheetJS 실패 시)
      S.ai=true; go('mybooks','add');
      try {

const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta/models';
const GEMINI_MODEL = 'gemini-2.0-flash';
const GEMINI_PRO   = 'gemini-2.0-flash';  // 이미지/PDF도 flash로 처리

function getGeminiKey() {
  return S._geminiKey || localStorage.getItem('_geminiKey') || '';
}

function setGeminiKey(k) {
  S._geminiKey = k.trim();
  localStorage.setItem('_geminiKey', k.trim());
}

function promptGeminiKey() {
  const k = prompt('Gemini API 키를 입력하세요.\n(https://aistudio.google.com 에서 무료 발급)');
  if(k && k.trim()) { setGeminiKey(k); return k.trim(); }
  return null;
}

// ── Gemini API 공통 호출 ──
function _geminiErrMsg(d) {
  const msg = d?.error?.message || '';
  if(msg.includes('quota') || msg.includes('RESOURCE_EXHAUSTED')) {
    return 'AI 사용량 한도 도달. 잠시 후 다시 시도해주세요. (무료: 분당 15회)';
  }
  if(msg.includes('API_KEY_INVALID') || msg.includes('invalid') && msg.includes('key')) {
    return '🔑 API 키가 올바르지 않아요. 프로필에서 키를 다시 확인해주세요.';
  }
  return 'AI 오류: ' + (msg.slice(0,60) || '알 수 없는 오류');
}

async function _geminiCall(parts, maxTokens=800) {
  let key = getGeminiKey();
  if(!key) {
    document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
      <div style="font-size:17px;font-weight:900;margin-bottom:6px">🤖 Gemini API 키 필요</div>
      <div style="font-size:12px;color:#9CA3AF;margin-bottom:14px">AI 자동완성·이미지 분석·PDF 추출 기능을 쓰려면 Gemini API 키가 필요해요. 무료로 발급받을 수 있어요.</div>
      <input id="gkey-inp2" type="password" placeholder="AIzaSy..."
        style="width:100%;padding:11px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;font-family:monospace;outline:none;box-sizing:border-box;margin-bottom:10px">
      <a href="https://aistudio.google.com/app/apikey" target="_blank"
        style="display:block;text-align:center;font-size:12px;color:#1E5FA5;margin-bottom:14px;font-weight:600">🔗 Google AI Studio에서 무료 발급 →</a>
      <button onclick="const k=document.getElementById('gkey-inp2').value.trim();if(!k){toast('키를 입력');return;}setGeminiKey(k);cm();toast('키 저장됨! 다시 시도해주세요');" class="btn bb" style="margin-bottom:8px">저장</button>
      <button onclick="cm()" class="btn">닫기</button>
    </div></div>`;
    throw new Error('NO_KEY');
  }
  const url = `${GEMINI_BASE}/${GEMINI_MODEL}:generateContent?key=${key}`;
  const r = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{parts}], generationConfig:{maxOutputTokens:maxTokens} })
  });
  const d = await r.json();
  if(d.error) throw new Error(_geminiErrMsg(d));
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function geminiText(prompt, maxTokens=800) {
  return _geminiCall([{text:prompt}], maxTokens);
}

async function geminiVision(prompt, b64, mimeType, maxTokens=1200) {
  return _geminiCall([{inline_data:{mime_type:mimeType,data:b64}},{text:prompt}], maxTokens);
}

async function geminiPdf(prompt, b64, maxTokens=2000) {
  return geminiVision(prompt, b64, 'application/pdf', maxTokens);
}

function parseGeminiJson(text) {

function saveWordToCurrentBook(word) {
  const bookName = S.currentBook || '내 단어장';
  if(bookName === '내 단어장') {
    if(!S.words.find(w=>w.en.toLowerCase()===word.en.toLowerCase()))
      S.words.push(word);
  } else {
    const bk = (S.books||[]).find(b=>b.name===bookName);
    if(bk) {
      if(!bk.words) bk.words=[];
      if(!bk.words.find(w=>w.en.toLowerCase()===word.en.toLowerCase()))
        bk.words.push(word);
    } else {
      // 단어장이 없으면 기본 단어장에 저장
      if(!S.words.find(w=>w.en.toLowerCase()===word.en.toLowerCase()))
        S.words.push(word);
    }
  }
}

function wordExistsInCurrentBook(en) {

function saveWordEdit(oldEn) {
  const newEn = (document.getElementById('we-en')?.value||'').trim();
  const newKr = (document.getElementById('we-kr')?.value||'').trim();
  if(!newEn||!newKr) { toast('영단어와 뜻은 필수예요'); return; }
  const wi = S.words.find(x=>x.en===oldEn);
  if(!wi) return;
  // 영단어 바뀌면 markMap, srsMap 키도 업데이트
  if(newEn !== oldEn) {
    if(S.markMap[oldEn]!==undefined) { S.markMap[newEn]=S.markMap[oldEn]; delete S.markMap[oldEn]; }
    if(S.srsMap[oldEn]!==undefined) { S.srsMap[newEn]=S.srsMap[oldEn]; delete S.srsMap[oldEn]; }
    S.learned.delete(oldEn); if(S.learned.has(oldEn)) S.learned.add(newEn);
  }
  wi.en  = newEn;
  wi.kr  = newKr;
  wi.ph  = document.getElementById('we-ph')?.value||'';
  const _ex1=document.getElementById('we-ex')?.value||'';
  const _ex2=document.getElementById('we-ex2')?.value||'';
  const _ex3=document.getElementById('we-ex3')?.value||'';
  wi.ex=_ex1;wi.exList=[_ex1,_ex2,_ex3].filter(e=>e.trim());
  wi.tip = document.getElementById('we-tip')?.value||'';
  wi.img = document.getElementById('we-img')?.value||'📝';
  // books에도 동기화
  (S.books||[]).forEach(bk=>{
    const bwi = (bk.words||[]).find(x=>x.en===oldEn);
    if(bwi) { Object.assign(bwi, {en:wi.en,kr:wi.kr,ph:wi.ph,ex:wi.ex,tip:wi.tip,img:wi.img}); }
  });
  sv();
  cm();
  toast(`✅ "${newEn}" 수정 완료!`);
  go();
}

async function aiEnrichWord(en) {
  const wi = S.words.find(x=>x.en===en);
  if(!wi) return;
  toast('AI 분석 중...');
  try {
    const _txt9 = await geminiText(`"${en}" 단어 정보 JSON으로만 반환. 형식: {"koSnd":"한국어발음(예:애플)","pos":"품사(예:명사/동사)","syn":"유의어 2개(쉼표구분)","tip":"한국어 암기팁"}`, 200);
    const p=parseGeminiJson(_txt9);
    if(p.koSnd) wi.koSnd=p.koSnd;
    if(p.pos) wi.pos=p.pos;
    if(p.syn) wi.syn=p.syn;
    if(p.tip&&!wi.tip) wi.tip=p.tip;
    sv();
    showWordDetail(en);
  } catch(e) { toast('AI 오류'); }
}

function startGameW(id, ws) {
  SFX.playBG(); vib(30);
  const gs = S.gameSettings||{count:10};
  // ws가 지정되지 않으면 현재 단어장 단어 사용
  const curWords = getCurrentBookWords ? getCurrentBookWords() : S.words;
  const src = ws || (curWords.length>=2 ? curWords : (DEFAULT_WORDS[S.lid]||DEFAULT_WORDS.egg));
  S._prevTab=(S.tab==='game')?'game':(S.tab==='butterfly')?'butterfly':(S.tab||'home'); S.gameId=id; S.gDone=false; S._gameScoreSaved=false; S._gameRunning=true; S.gScore=0; S.gIdx=0; S.gAns=false; S.gRes=null; S.gInput=''; S._combo=0; S._maxCombo=0; S.wfFound=new Set(); S.wfGrid=null; S.wfWords=null;
  S.gResultMap={};
  // ws가 이미 지정됐으면 그대로, 아니면 count 적용
  const cnt=ws?ws.length:Math.min(gs.count||10, src.length);
  S.gWords=ws||pick(src,cnt);
  // 이어하기 저장 (quiz/typing만)
  if(id==='quiz'||id==='typing') {
    S.gSavedGame={id,words:S.gWords,score:0,idx:0};
  }
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;S.mWrongEn=null;S.mWrongKr=null;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);const wSrc=pool.length?pool:src;if(!wSrc||!wSrc.length){toast('4~7글자 단어가 필요해요!');S.gDone=true;return;}S.wWord=rnd(wSrc);S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='wordfind'){buildWF(src);}
  if(id==='wc'){const pool=src.filter(w=>w.en.length>=3);S.wcWord=pool.length?rnd(pool):src[0];S.wcLetters=S.wcWord.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<S.wcWord.en.length-1;return{letter:l,hidden:hide};});S.wcGuessed=new Set();S.wcWrong=0;}
  if(id==='sentence'||id==='ssort'){buildSentenceFromWords(ws||S.gWords);if(id==='ssort')speak(S.sbS.en);}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside.','My best friend called me last night.']);S.chIdx=0; S._chainSaved=false;S.chIn='';S.chDone=false;}

  // 깜빡이(flip)는 학습 탭 플래시카드 모드로 이동
  if(id==='flip') {
    // S.words를 덮어쓰지 않고 gWords를 임시로 참조
    S._flipWords = S.gWords; // 임시 저장
    S._flipIdx = 0;
    S.tab = 'study'; S.stab = 'learn'; go();
    toast(`⚡ 깜빡이 시작! ${S.gWords.length}개 단어`);
    return;
  }

  // 게임 탭 또는 나비 탭으로 전환 (호출된 탭 기준)
  if(S.tab!=='game') S.tab='butterfly'; S.stab=null; updHD();
  showCountdown(()=>go());
}

function rWC(){

  const w=S.wcWord;
  const visibleWord=S.wcLetters.map((l,i)=>{
    if(!l.hidden||S.wcGuessed.has(i)) return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:#1E5FA5;margin:0 2px;border-bottom:3px solid #1E5FA5;padding:0 4px">${l.letter.toUpperCase()}</span>`;
    return `<span style="font-size:24px;font-weight:900;font-family:monospace;color:transparent;margin:0 2px;border-bottom:3px solid ${S.wcWrong>=6?'#DC2626':'#BFDBFE'};padding:0 4px">_</span>`;
  }).join('');
  const allDone=S.wcLetters.every((l,i)=>!l.hidden||S.wcGuessed.has(i));
  if(allDone){S.gScore+=Math.max(0,(6-S.wcWrong)*20);ok();setTimeout(()=>{S.gIdx++;if(S.gIdx>=S.gWords.length){S.gDone=true;go();return;}
      // 다음 단어는 S.gWords에서
      const nw=S.gWords[S.gIdx];
      if(!nw){S.gDone=true;go();return;}
      S.wcWord=nw;
      S.wcLetters=nw.en.split('').map((l,i)=>{const hide=Math.random()<.5&&i>0&&i<nw.en.length-1;return{letter:l,hidden:hide};});
      S.wcGuessed=new Set();S.wcWrong=0;go();},800);}
  const alpha='abcdefghijklmnopqrstuvwxyz'.split('');
  // 단어에 공백/특수문자 있으면 자동으로 그것도 추가
  const extra = [...new Set((S.wcWord?.en||'').toLowerCase().split('').filter(ch=>!/[a-z]/.test(ch)&&ch!==''))];
  const allKeys = [...alpha, ...extra];
  const usedWrong=new Set([...S.wcGuessed].filter(i=>!S.wcLetters[i]?.hidden).map(()=>null));
  return ghdr('🔡 단어 완성',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.wcWrong>=6?'아쉬워! 다음엔 꼭!':allDone?'맞췄어! 🎉':'빈칸의 글자를 채워봐! 🔡',S.lid,allDone?'happy':S.wcWrong>=6?'sad':'normal')}
    <div style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:20px;padding:20px;text-align:center;border:3px solid #BFDBFE">
      <div style="font-size:64px;margin-bottom:8px">${w.img||'📝'}</div>

      <div style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0">${visibleWord}</div>
      <div style="font-size:12px;color:#9CA3AF;margin-top:8px">오답: ${S.wcWrong}/6</div>
      <button onclick="hintWC()" style="margin-top:8px;background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:10px;padding:6px 14px;font-size:11px;font-weight:700;color:#B45309;cursor:pointer">💡 힌트 (-10점)</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">
${allKeys.map(letter=>{const guessedIdx=S.wcLetters.findIndex((l,i)=>l.letter===letter&&l.hidden&&S.wcGuessed.has(i));const isCorrect=guessedIdx>=0;const isWrong=[...S.wcGuessed].some(i=>S.wcLetters[i]?.letter===letter&&!S.wcLetters[i]?.hidden)||(!isCorrect&&[...Array(26)].some((_,i)=>S.wcGuessed.has&&false)); return `<button onclick="guessWC('${letter}')" style="width:32px;height:36px;background:${isCorrect?'#DCFCE7':isWrong?'#FEE2E2':'#fff'};border:1.5px solid ${isCorrect?'#86EFAC':isWrong?'#FECDD3':'#E5E7EB'};border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;color:${isCorrect?'#16A34A':isWrong?'#DC2626':'#111'}">${letter.toUpperCase()}</button>`;}).join('')}
    </div>
  </div>`;
}

// ── 단어 완성 힌트: 숨겨진 글자 1개 자동 공개 ──
function hintWC(){
  if(!S.wcWord||!S.wcLetters) return;
  const hidden = S.wcLetters.map((l,i)=>({l,i})).filter(x=>x.l.hidden && !S.wcGuessed.has(x.i));
  if(!hidden.length){toast('힌트 없음'); return;}
  const h = hidden[Math.floor(Math.random()*hidden.length)];
  S.wcGuessed.add(h.i);
  S.gScore = Math.max(0, (S.gScore||0)-10);
  toast('💡 힌트: ' + h.l.letter.toUpperCase() + ' (-10점)');
  go();
}
function guessWC(letter){
  SFX.play('tap');vib(20);

function buildWF(src){
  // 단어 수에 따라 그리드 크기 결정
  const wordCount = Math.min((src||S.gWords||[]).length, 8);
  // 단어 정리: 영문자만 남기고, 너무 길거나 짧은 건 제외
  const cleanedSrc = (src||S.gWords)
    .map(w=>w.en.toUpperCase().replace(/[^A-Z]/g,''))
    .filter(w=>w.length>=3 && w.length<=10);
  const pickWords = pick(cleanedSrc, Math.min(wordCount, cleanedSrc.length));
  const sz = Math.max(8, Math.ceil(Math.sqrt(pickWords.reduce((a,w)=>a+w.length,0)*2)));
  const gridSz = Math.min(sz, 12); // 최대 12×12
  const grid = Array.from({length:gridSz},()=>Array(gridSz).fill(''));
  const placed = [];
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  pickWords.forEach(w=>{
    for(let t=0;t<100;t++){
      const dir=Math.floor(Math.random()*2);
      const dr=[0,1][dir], dc=[1,0][dir];
      const r=Math.floor(Math.random()*(gridSz-dr*(w.length-1)));
      const c=Math.floor(Math.random()*(gridSz-dc*(w.length-1)));
      if(r+dr*(w.length-1)>=gridSz||c+dc*(w.length-1)>=gridSz) continue;
      let ok=true;
      const cells=[];
      for(let i=0;i<w.length;i++){
        const cr=r+dr*i, cc=c+dc*i;
        if(grid[cr][cc]&&grid[cr][cc]!==w[i]){ok=false;break;}
        cells.push(`${cr},${cc}`);
      }
      if(ok){
        cells.forEach((k,i)=>{const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=w[i];});
        placed.push({word:w,cells});
        break;
      }
    }
  });

  // 빈 칸 채우기
  for(let r=0;r<gridSz;r++)for(let c=0;c<gridSz;c++)
    if(!grid[r][c])grid[r][c]=alpha[Math.floor(Math.random()*26)];

  S.wfGrid=grid;
  S.wfWords=placed; // 실제 배치된 단어만
  S.wfFound=new Set();
  S.wfSel=[];
  S.wfGridSz=gridSz;
}

function addDiaryPhoto(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=600; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      if(!S.dPhotos)S.dPhotos=[];
      if(S.dPhotos.length>=3){toast('사진은 최대 3장');return;}
      S.dPhotos.push(canvas.toDataURL('image/jpeg',0.7)); go();
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}

function createBookcase() {
  const icon = document.getElementById('bc-icon')?.value.trim()||'📁';
  const name = document.getElementById('bc-name')?.value.trim();
  if(!name){toast('책장 이름을 입력하세요','err');return;}
  const selected = [...document.querySelectorAll('#bc-books-select button.selected')].map(b=>b.textContent);
  if(!S.bookcase) S.bookcase = [];
  S.bookcase.push({name, icon, bookNames: selected});
  sv();
  toast(`✅ "${name}" 책장 생성!`);
  showBookcaseModal();
}

function addToBookcase(bcIdx, bookName) {
  if(!S.bookcase || !S.bookcase[bcIdx]) return;
  if(!S.bookcase[bcIdx].bookNames) S.bookcase[bcIdx].bookNames = [];
  if(!S.bookcase[bcIdx].bookNames.includes(bookName)) {
    S.bookcase[bcIdx].bookNames.push(bookName);
    sv();
    toast('✅ "'+bookName+'" 추가!');
  }
}

function removeFromBookcase(bcIdx, bookName) {
  if(!S.bookcase || !S.bookcase[bcIdx]) return;
  S.bookcase[bcIdx].bookNames = (S.bookcase[bcIdx].bookNames||[]).filter(b=>b!==bookName);
  sv();
}
function deleteBookcase(idx) {
  if(!confirm('책장을 삭제할까요? 단어장은 유지돼요')) return;
  S.bookcase.splice(idx, 1);
  sv();
  showBookcaseModal();
}

// CSV 불러오기 (앱 설정에서)
function importCSVApp(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const start = lines[0].toLowerCase().includes('en') ? 1 : 0;
    const newWords = [];
    lines.slice(start).forEach(line => {
      const p = line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
      if(p.length>=2&&p[0]&&p[1]) {
        if(!S.words.find(w=>w.en.toLowerCase()===p[0].toLowerCase())) {
          newWords.push({en:p[0],kr:p[1],ph:p[2]||'',ex:p[3]||p[0]+'.',img:p[4]||'📝',tip:p[5]||'',meanings:[p[1]]});
        }
      }
    });
    if(!newWords.length){toast('추가할 새 단어가 없어요');return;}
    S.words.push(...newWords);
    sv(); cm();
    toast(`✅ ${newWords.length}개 불러오기 완료!`,'ok');
    go();
  };
  reader.readAsText(file, 'UTF-8');
}

// 구글 드라이브 백업
async function syncGoogleDrive() {
  try {
    // Google Identity Services로 토큰 요청
    if(!window.google?.accounts) {
      // GIS 라이브러리 동적 로드
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://accounts.google.com/gsi/client';
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }
    toast('구글 드라이브 연동 중...');
    // 백업 데이터 준비
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      words: S.words,
      markMap: S.markMap,
      srsMap: S.srsMap,
      dList: S.dList,
      books: S.books,
      streak: S.streak,
      attendDates: S.attendDates,
      lid: S.lid,
      nick: S.nick,
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});

    // Google OAuth2 토큰 요청
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: '959781543804-wordday.apps.googleusercontent.com',
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (tokenResp) => {
        if(tokenResp.error) { toast('구글 로그인 실패: '+tokenResp.error,'err'); return; }
        // 파일 업로드
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({
          name: `Vocabug_backup_${new Date().toISOString().slice(0,10)}.json`,
          mimeType: 'application/json',
          parents: ['appDataFolder']
        })], {type:'application/json'}));
        form.append('file', blob);
        const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method:'POST',
          headers:{Authorization:`Bearer ${tokenResp.access_token}`},
          body: form,
        });
        if(resp.ok) {
          const now = new Date().toLocaleString('ko-KR');
          localStorage.setItem('wd-gdrive-sync', now);
          toast('☁️ 구글 드라이브 백업 완료!','ok');
          showAppSettings('backup');

function doRestore() {
  const file = document.getElementById('restore-file')?.files[0];
  if(!file){toast('파일을 선택하세요','err');return;}
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.words) S.words = data.words;
      if(data.markMap) S.markMap = data.markMap;
      if(data.srsMap) S.srsMap = data.srsMap;
      if(data.dList) S.dList = data.dList;
      if(data.books) {
        // 안전망: 로컬에 단어 있는 책이 있는데 클라우드가 비었으면 덮어쓰지 않음
        const _cloudHasWords = Array.isArray(data.books) && data.books.some(b=>(b.words||[]).length>0);
        const _localHasWords = Array.isArray(S.books) && S.books.some(b=>(b.words||[]).length>0);
        if(_cloudHasWords || !_localHasWords) {
          S.books = data.books;
        }
      }
      // [markMap 마이그레이션] 인덱스 키 잔재 → 단어명 키 통일 (데이터 분열 방지)
      try {
        var _mmKeys = Object.keys(S.markMap||{});
        var _isIndexKey = _mmKeys.length>0 && /^[0-9]+$/.test(_mmKeys[0]);
        if(_isIndexKey){
          var _curBk = (S.books||[]).find(function(b){return b.name===S.currentBook;});
          if(_curBk && _curBk.markMap && Object.keys(_curBk.markMap).length>0){
            // 책 markMap(단어명 키)이 정상 데이터 → 전역도 그것으로 통일
            S.markMap = JSON.parse(JSON.stringify(_curBk.markMap));
          } else if(_curBk && (_curBk.words||[]).length){
            // 책 markMap이 비었으면 인덱스 키를 단어로 변환
            var _conv = {};
            Object.keys(S.markMap).forEach(function(k){
              var _i = Number(k);
              if(!isNaN(_i) && _curBk.words[_i]){ _conv[_curBk.words[_i].en] = S.markMap[k]; }
              else if(isNaN(_i)){ _conv[k] = S.markMap[k]; }
            });
            S.markMap = _conv;
            if(_curBk){ _curBk.markMap = JSON.parse(JSON.stringify(_conv)); }
          }
          try { localStorage.setItem("wd-mk", JSON.stringify(S.markMap)); } catch(e){}
        }
      } catch(e){ console.warn("markMap migration skip", e); }
        // 전역 markMap을 현재 책과 동기화 (내 단어장 vs 책 카운트 일치)
        try {
          var _syncBk = (S.books||[]).find(function(b){return b.name===S.currentBook;});
          if(_syncBk && _syncBk.markMap && S.currentBook && S.currentBook!=="내 단어장"){
            S.markMap = JSON.parse(JSON.stringify(_syncBk.markMap));
          }
        } catch(e){}
      

      if(data.streak) S.streak = data.streak;
      if(data.nick) S.nick = data.nick;
      if(data.lid) S.lid = data.lid;
      sv(); cm();
      toast('✅ 복원 완료!','ok');
      go('home');
    } catch(err) {
      toast('복원 실패: 올바른 백업 파일이 아니에요','err');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

async function addFriendByCode() {
  const code = document.getElementById('friend-code-inp')?.value?.trim()?.toUpperCase();
  if(!code||code.length<8){toast('8자리 코드를 입력해주세요');return;}
  if(code === (S.user?.uid?.slice(0,8)?.toUpperCase())){toast('본인 코드예요!');return;}
  try {
    // Firebase에서 해당 코드 사용자 찾기
    const snap = await db.collection('users').where('code','==',code).limit(1).get();
    if(snap.empty){toast('해당 코드의 사용자를 찾을 수 없어요');return;}
    const friendData = snap.docs[0].data();
    const friendUid = snap.docs[0].id;
    if(!S.friends) S.friends=[];
    if(S.friends.find(f=>f.uid===friendUid)){toast('이미 친구예요!');return;}
    S.friends.push({uid:friendUid, nick:friendData.nick||'친구', lid:friendData.lid||'egg', streak:friendData.streak||0, code});
    sv();
    toast(`✅ ${friendData.nick||'친구'} 추가 완료!`);
    showFriends();
  } catch(e){toast('검색 실패. 잠시 후 다시 시도해주세요');}
}

async function restoreFromBackup() {
  if(!S.user?.uid) { toast('로그인이 필요합니다','err'); return; }
  toast('백업 검색 중...');
  try {
    // user_words 컬렉션에서 복구
    const wdoc = await db.collection('user_words').doc(S.user.uid).get();
    if(wdoc.exists) {
      const wd = wdoc.data();
      const totalWords = (wd.books||[]).reduce((s,b)=>s+(b.words||[]).length,0) + (wd.words||[]).length;
      if(totalWords > 0) {
        if(!confirm('user_words 백업에서 단어 '+totalWords+'개를 복구할까요?')) return;
        if(wd.books?.some(b=>(b.words||[]).length>0)) { S.books = wd.books; localStorage.setItem('wd-bks', JSON.stringify(wd.books)); }
        if(wd.words?.length>0) { S.words = wd.words; localStorage.setItem('wd-w', JSON.stringify(wd.words)); }
        sv(); cm(); go(); toast('✅ 단어 '+totalWords+'개 복구 완료!'); return;
      }
    }
    // 일별 백업에서 복구 (최근 7일)
    const today_ = new Date().toISOString().slice(0,10);
    for(let i=1; i<=7; i++) {
      const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
      const bak = await db.collection('user_backups').doc(S.user.uid+'_'+d).get();
      if(bak.exists) {
        const b = bak.data();
        const total = (b.books||[]).reduce((s,bk)=>s+(bk.words||[]).length,0) + (b.words||[]).length;
        if(total > 0) {
          if(!confirm(d+' 백업에서 단어 '+total+'개를 복구할까요?')) return;
          if(b.books?.some(bk=>(bk.words||[]).length>0)) { S.books = b.books; localStorage.setItem('wd-bks', JSON.stringify(b.books)); }
          if(b.words?.length>0) { S.words = b.words; localStorage.setItem('wd-w', JSON.stringify(b.words)); }
          sv(); cm(); go(); toast('✅ '+d+' 백업에서 단어 '+total+'개 복구!'); return;
        }
      }
    }
    toast('복구 가능한 백업이 없습니다','err');
  } catch(e) { toast('복구 실패: '+e.message,'err'); }
}

function exportCSV() {
  const rows = ['영단어,한국어뜻,발음기호,예문,암기팁,마크'];
  S.words.forEach(w => {
    const mark = ['미분류','외운','헷갈리는'][getMark(w.en)||0];
    rows.push([w.en,w.kr,w.ph||'',w.ex||'',w.tip||'',mark].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vocabug_단어장_${today()}.csv`;
  a.click();
  toast('✅ CSV 내보내기 완료!');
}

function importCSV(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l=>l.trim());
    let cnt = 0;
    // 헤더 스킵
    const start = lines[0].toLowerCase().includes('영단어') ? 1 : 0;
    lines.slice(start).forEach(line => {
      const parts = line.split(',').map(p=>p.trim().replace(/^"|"$/g,'').replace(/""/g,'"'));
      if(parts.length>=2) {
        const en=parts[0], kr=parts[1], ph=parts[2]||'', ex=parts[3]||'', tip=parts[4]||'';
        if(en&&kr&&!S.words.find(w=>w.en.toLowerCase()===en.toLowerCase())) {
          S.words.push({en,kr,ph,ex:ex||en+'.',tip:tip||en+' = '+kr,meanings:[kr],img:'📝'});
          cnt++;
        }
      }
    });
    sv(); cm(); toast(`✅ ${cnt}개 단어 가져오기 완료!`); go('mybooks','list');
  };
  reader.readAsText(file, 'UTF-8');
}

function importJSON(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.words) { toast('올바른 JSON 파일이 아니에요'); return; }
      if(!confirm(`백업 파일에서 ${data.words.length}개 단어를 복원할까요?\n현재 데이터와 합쳐집니다.`)) return;
      let cnt = 0;
      (data.words||[]).forEach(w => {
        if(!S.words.find(x=>x.en.toLowerCase()===w.en.toLowerCase())) {
          S.words.push(w); cnt++;
        }
      });
      // 마크/SRS 병합
      Object.assign(S.markMap, data.markMap||{});
      Object.assign(S.srsMap, data.srsMap||{});
      Object.assign(S.studyLog, data.studyLog||{});
      sv(); cm(); toast(`✅ ${cnt}개 단어 복원 완료!`); go('mybooks','list');
    } catch(err) { toast('파일을 읽을 수 없어요'); }
  };
  reader.readAsText(file);
}

      const dd=ls.getItem('wd-dd'); if(dd) S._dailyDate=dd;
      const dxg=ls.getItem('wd-dxg'); if(dxg) S._dailyXpGiven=JSON.parse(dxg);
      const txp=ls.getItem('wd-txp'); if(txp) S._totalXp=Number(txp)||0;
      const tsm=ls.getItem('wd-tsm'); if(tsm) S._totalStudyMins=Number(tsm)||0;
      const sl2=ls.getItem('wd-sl'); if(sl2) S.studyLog=JSON.parse(sl2);
      const ad=ls.getItem('wd-ad'); if(ad) S.attendDates=JSON.parse(ad);
      const ac=ls.getItem('wd-ac'); if(ac) S.attendCount=Number(ac)||0;
      const pc=ls.getItem('wd-pet-color'); if(pc) S._petColor=pc;
    } catch(e) {}

    // ── STEP 2: localStorage 데이터 있으면 즉시 앱 시작, Firebase는 백그라운드 동기화 ──
    const _hasLocalData = !!(
      localStorage.getItem('wd-xp') ||
      localStorage.getItem('wd-sl') ||  // studyLog
      localStorage.getItem('wd-bks')    // 단어장
    );
    if(_hasLocalData) {
      setSplash(60, '거의 다 됐어요!', 'XP 설정 로드 중');
      await loadXPConfig();
      await loadPopupConfig();
      setSplash(90, '시작합니다! 🦋', '앱 시작 중');
      startApp();
      // Firebase 백그라운드 동기화 (앱 시작 후)
      if(typeof db !== 'undefined') {
        setSplash(100, '', '');
        db.collection('users').doc(user.uid).get().then(_doc => {
          if(!_doc.exists) return;
          const _data = _doc.data();
          // ── Firebase 데이터 유효성 검사 후 머지 ──
          const _localXp = parseInt(localStorage.getItem('wd-txp')||'0') || S._totalXp || S.xp || 0;
          const _fbXp = _data._totalXp || _data.xp || 0;
          const _isFirebaseValid = !(
            (_localXp > 500 && _fbXp < _localXp * 0.3) || // XP 70% 이상 감소 = 비정상
            (_data.nick === '' && S.nick && S.nick.length > 0) // 닉네임 소실
          );
          if(!_isFirebaseValid) {
            console.warn('[Firebase 백그라운드] 비정상 데이터 감지, 머지 건너뜀', {localXp:_localXp, fbXp:_fbXp});
          } else {
            ['xp','lid','streak','nick',
             'markMap','_achievements','_acc','_equipped','_ownedPacks',
             'alStudy','alGoal','alStreak','_dailyGoalMin','_dailyStudiedMin',
             '_dailyDate','_dailyXpGiven','fontFamily','lastDate','_totalXp','attendCount','attendDates'
            ].forEach(k => {
              // XP가 비정상적으로 낮은 데이터는 덮어쓰지 않음
              if(k === 'xp' && _data[k] === 0 && (S.xp||0) > 100) return;
              if(k === '_totalXp' && _data[k] === 0 && (S._totalXp||0) > 100) return;
              if(k === 'nick' && _data[k] === '' && S.nick) return;
              if(_data[k]!==undefined) S[k]=_data[k]; // currentBook 제외: 로컬 위치 보존
            });
          }
          if(_data.studyLog) {
            // 날짜별로 더 큰 값 유지 (로컬과 Firebase 중 최신 데이터 보존)
            const merged = Object.assign({}, _data.studyLog);
            Object.entries(S.studyLog||{}).forEach(([date, local]) => {
              const fb = merged[date] || {};
              merged[date] = {
                words: Math.max(local.words||0, fb.words||0),
                quiz:  Math.max(local.quiz||0,  fb.quiz||0),
                min:   Math.max(local.min||0,   fb.min||0),
                xp:    Math.max(local.xp||0,    fb.xp||0),
              };
            });
            S.studyLog = merged;
          }
          // 게임 통계 복원 (Firebase와 로컬 중 더 큰 값 유지)
          if(_data.gameDailyCount && typeof _data.gameDailyCount === 'object') {
            const _localGdc = S.gameDailyCount || {};
            const _mergedGdc = Object.assign({}, _data.gameDailyCount);
            Object.entries(_localGdc).forEach(([date, games]) => {
              if(!_mergedGdc[date]) { _mergedGdc[date] = games; return; }
              Object.entries(games).forEach(([gid, v]) => {
                const fb = _mergedGdc[date][gid];
                if(!fb) { _mergedGdc[date][gid] = v; return; }
                if(typeof v === 'object' && typeof fb === 'object') {
                  _mergedGdc[date][gid] = {
                    words: Math.max(v.words||0, fb.words||0),
                    right: Math.max(v.right||0, fb.right||0),
                    wrong: Math.max(v.wrong||0, fb.wrong||0),
                  };
                }
              });
            });
            S.gameDailyCount = _mergedGdc;
            localStorage.setItem('wd-gdc', JSON.stringify(_mergedGdc));
          }
          if(_data.gamePlayCount && typeof _data.gamePlayCount === 'object') {
            const _localGpc = S.gamePlayCount || {};
            const _mergedGpc = Object.assign({}, _data.gamePlayCount);
            Object.entries(_localGpc).forEach(([gid, v]) => {
              _mergedGpc[gid] = Math.max(v||0, _mergedGpc[gid]||0);
            });
            S.gamePlayCount = _mergedGpc;
            localStorage.setItem('wd-gpc', JSON.stringify(_mergedGpc));
          }
          if(_data.bestScores && typeof _data.bestScores === 'object') {
            const _localBs = S.bestScores || {};
            const _mergedBs = Object.assign({}, _data.bestScores);
            Object.entries(_localBs).forEach(([gid, v]) => {
              _mergedBs[gid] = Math.max(v||0, _mergedBs[gid]||0);
            });
            S.bestScores = _mergedBs;
            localStorage.setItem('wd-bs', JSON.stringify(_mergedBs));
          }
          if(Array.isArray(_data.learned)) S.learned=new Set(_data.learned);
          if(Array.isArray(_data.favorites)) S.favorites=_data.favorites;
          if(Array.isArray(_data.myButterflies)) {
            // 로컬과 Firebase 합집합 (더 많은 나비 유지)
            const _lsBf = JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
            const _bfSet = new Set([..._data.myButterflies, ..._lsBf]);
            const _mergedBf = [..._bfSet];
            S.myButterflies = _mergedBf;
            localStorage.setItem('wd-butterflies', JSON.stringify(_mergedBf));
            // 합집합이 Firebase보다 크면 Firebase도 업데이트
            if(_mergedBf.length > _data.myButterflies.length && S.user && typeof db!=='undefined') {
              db.collection('users').doc(S.user.uid).set({myButterflies:_mergedBf},{merge:true}).catch(()=>{});
            }
          }
          if(Array.isArray(_data.collection)) {
            const lsCol = JSON.parse(localStorage.getItem('bw-collection')||'[]');
            const fbIds = new Set(_data.collection.map(x=>x.id));
            const merged = [..._data.collection, ...lsCol.filter(x=>!fbIds.has(x.id))].slice(0, MAX_COLLECTION);
            S._collection = merged;
            localStorage.setItem('bw-collection', JSON.stringify(merged));
          }
          const _fix = (arr) => (arr||[]).map(w => {
            if(!w||!w.en||!w.kr) return w;
            if(w.en.includes(' ') && w.en.length>10 && /^[a-zA-Z]+$/.test(w.kr) && w.kr.length<20)
              return {...w, en:w.kr, kr:w.ph||'', ph:w.ex||'', ex:w.en, pos:w.pos||''};
            if(w.ph && /^(명사|동사|형용사|부사|전치사|접속사)/.test(w.ph))
              return {...w, pos:w.ph, ph:w.ex||'', ex:w.en+'.'};
            return w;
          });
          S.words = _fix(S.words||[]);
          S.books = (S.books||[]).map(bk=>({...bk,words:_fix(bk.words||[])}));
          sv(); // 최신 데이터 저장
          console.log('[앱] Firebase 백그라운드 동기화 완료');
        }).catch(e => console.warn('[앱] Firebase 동기화 실패', e));
      }
      return; // 아래 로직 실행 안 함
    }

    // ── 첫 로그인 or localStorage 없음: Firebase에서 직접 로드 (타임아웃 5초) ──
    setSplash(40, '계정 데이터 로드 중...', 'Firebase 연결 중');
    await loadXPConfig();
    await loadPopupConfig();
    setSplash(60, '계정 데이터 로드 중...', '사용자 데이터 받아오는 중');

    // Firebase에서 최신 데이터 먼저 로드한 뒤 startApp (타임아웃 5초)
    if(typeof db !== 'undefined') {
      try {
        // users + user_words 동시 로드
        const _fbPromise = Promise.all([
          db.collection('users').doc(user.uid).get(),
          db.collection('user_words').doc(user.uid).get()
        ]);
        const _timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000));
        const [_doc, _wdoc] = await Promise.race([_fbPromise, _timeout]);
        // user_words에서 단어장 복원
        if(_wdoc && _wdoc.exists) {
          const _wd = _wdoc.data();
          if(_wd.books && _wd.books.some(b=>(b.words||[]).length>0)) {
            S.books = _wd.books;
            localStorage.setItem('wd-bks', JSON.stringify(_wd.books));
          }
          if(_wd.words && _wd.words.length>0) {
            S.words = _wd.words;
            localStorage.setItem('wd-w', JSON.stringify(_wd.words));
          }
          console.log('[앱] user_words 로드:', (S.books||[]).map(b=>b.name+':'+b.words?.length).join(', '));
        }
        if(_doc.exists) {
          const _data = _doc.data();
          // ── Firebase 데이터 유효성 검사 후 머지 ──
          const _localXp = parseInt(localStorage.getItem('wd-txp')||'0') || S._totalXp || S.xp || 0;
          const _fbXp = _data._totalXp || _data.xp || 0;
          const _isFirebaseValid = !(
            (_localXp > 500 && _fbXp < _localXp * 0.3) || // XP 70% 이상 감소 = 비정상
            (_data.nick === '' && S.nick && S.nick.length > 0) // 닉네임 소실
          );
          if(!_isFirebaseValid) {
            console.warn('[Firebase 백그라운드] 비정상 데이터 감지, 머지 건너뜀', {localXp:_localXp, fbXp:_fbXp});
          } else {
            ['xp','lid','streak','nick',
             'markMap','_achievements','_acc','_equipped','_ownedPacks',
             'alStudy','alGoal','alStreak','_dailyGoalMin','_dailyStudiedMin',
             '_dailyDate','_dailyXpGiven','fontFamily','lastDate','_totalXp','attendCount','attendDates'
            ].forEach(k => {
              // XP가 비정상적으로 낮은 데이터는 덮어쓰지 않음
              if(k === 'xp' && _data[k] === 0 && (S.xp||0) > 100) return;
              if(k === '_totalXp' && _data[k] === 0 && (S._totalXp||0) > 100) return;
              if(k === 'nick' && _data[k] === '' && S.nick) return;
              if(_data[k]!==undefined) S[k]=_data[k]; // currentBook 제외: 로컬 위치 보존
            });
          }
          if(_data.studyLog) {
            // 날짜별로 더 큰 값 유지 (로컬과 Firebase 중 최신 데이터 보존)
            const merged = Object.assign({}, _data.studyLog);
            Object.entries(S.studyLog||{}).forEach(([date, local]) => {
              const fb = merged[date] || {};
              merged[date] = {
                words: Math.max(local.words||0, fb.words||0),
                quiz:  Math.max(local.quiz||0,  fb.quiz||0),
                min:   Math.max(local.min||0,   fb.min||0),
                xp:    Math.max(local.xp||0,    fb.xp||0),
              };
            });
            S.studyLog = merged;
          }
          // 게임 통계 복원 (Firebase와 로컬 중 더 큰 값 유지)
          if(_data.gameDailyCount && typeof _data.gameDailyCount === 'object') {
            const _localGdc = S.gameDailyCount || {};
            const _mergedGdc = Object.assign({}, _data.gameDailyCount);
            Object.entries(_localGdc).forEach(([date, games]) => {
              if(!_mergedGdc[date]) { _mergedGdc[date] = games; return; }
              Object.entries(games).forEach(([gid, v]) => {
                const fb = _mergedGdc[date][gid];
                if(!fb) { _mergedGdc[date][gid] = v; return; }
                if(typeof v === 'object' && typeof fb === 'object') {
                  _mergedGdc[date][gid] = {
                    words: Math.max(v.words||0, fb.words||0),
                    right: Math.max(v.right||0, fb.right||0),
                    wrong: Math.max(v.wrong||0, fb.wrong||0),
                  };
                }
              });
            });
            S.gameDailyCount = _mergedGdc;
            localStorage.setItem('wd-gdc', JSON.stringify(_mergedGdc));
          }
          if(_data.gamePlayCount && typeof _data.gamePlayCount === 'object') {
            const _localGpc = S.gamePlayCount || {};
            const _mergedGpc = Object.assign({}, _data.gamePlayCount);
            Object.entries(_localGpc).forEach(([gid, v]) => {
              _mergedGpc[gid] = Math.max(v||0, _mergedGpc[gid]||0);
            });
            S.gamePlayCount = _mergedGpc;
            localStorage.setItem('wd-gpc', JSON.stringify(_mergedGpc));
          }
          if(_data.bestScores && typeof _data.bestScores === 'object') {
            const _localBs = S.bestScores || {};
            const _mergedBs = Object.assign({}, _data.bestScores);
            Object.entries(_localBs).forEach(([gid, v]) => {
              _mergedBs[gid] = Math.max(v||0, _mergedBs[gid]||0);
            });
            S.bestScores = _mergedBs;
            localStorage.setItem('wd-bs', JSON.stringify(_mergedBs));
          }
          if(Array.isArray(_data.learned)) S.learned=new Set(_data.learned);
          if(Array.isArray(_data.favorites)) S.favorites=_data.favorites;
        if(Array.isArray(_data.myButterflies)) {
          // 로컬과 Firebase 합집합 (더 많은 나비 유지, 어느 쪽도 손실 없음)
          const _lsBf2 = JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
          const _bfSet2 = new Set([..._data.myButterflies, ..._lsBf2]);
          const _mergedBf2 = [..._bfSet2];
          S.myButterflies = _mergedBf2;
          localStorage.setItem('wd-butterflies', JSON.stringify(_mergedBf2));
          // 합집합이 Firebase보다 크면 Firebase도 업데이트
          if(_mergedBf2.length > _data.myButterflies.length && S.user && typeof db!=='undefined') {
            db.collection('users').doc(S.user.uid).set({myButterflies:_mergedBf2},{merge:true}).catch(()=>{});
          }
        } else {
          // Firebase에 없으면 localStorage 데이터 사용 후 Firebase 저장
          const lsBf = JSON.parse(localStorage.getItem('wd-butterflies')||'[]');
          if(lsBf.length > 0) {
            S.myButterflies = lsBf;
            if(S.user && typeof db!=='undefined') {
              db.collection('users').doc(S.user.uid).set({myButterflies:lsBf},{merge:true});
            }
          }
        }
        if(Array.isArray(_data.collection)) {
          // localStorage 컬렉션과 Firebase 컬렉션 합집합 (id 기준)
          const lsCol = JSON.parse(localStorage.getItem('bw-collection')||'[]');
          const fbIds = new Set(_data.collection.map(x=>x.id));
          const merged = [..._data.collection, ...lsCol.filter(x=>!fbIds.has(x.id))];
          S._collection = merged;
          localStorage.setItem('bw-collection', JSON.stringify(merged));
          if(merged.length > _data.collection.length && S.user && typeof db!=='undefined') {
            db.collection('users').doc(S.user.uid).set({collection:merged},{merge:true});
          }
        } else {
          const lsCol = JSON.parse(localStorage.getItem('bw-collection')||'[]');
          if(lsCol.length > 0) {
            S._collection = lsCol;
            if(S.user && typeof db!=='undefined') {
              db.collection('users').doc(S.user.uid).set({collection:lsCol},{merge:true});
            }
          }
        }

          // 필드 순서 오류 자동 수정
          const _fix = (arr) => (arr||[]).map(w => {
            if(!w||!w.en||!w.kr) return w;
            if(w.en.includes(' ') && w.en.length>10 && /^[a-zA-Z]+$/.test(w.kr) && w.kr.length<20) {
              console.log('[필드수정]', w.en.slice(0,20), '→', w.kr);
              return {...w, en:w.kr, kr:w.ph||'', ph:w.ex||'', ex:w.en, pos:w.pos||'', meanings:[w.ph||'']};
            }
            if(w.ph && /^(명사|동사|형용사|부사|전치사|접속사)/.test(w.ph)) {
              return {...w, pos:w.ph, ph:w.ex||'', ex:w.en+'.'};
            }
            return w;
          });
          S.words = _fix(S.words);
          S.books = (S.books||[]).map(bk => ({...bk, words:_fix(bk.words||[])}));
          console.log('[앱] Firebase 선로드 완료, words:', S.words.length, 'books:', S.books.length);
          // 로컬스토리지에도 반영
          ['lid','xp','streak','nick','markMap','attendCount','attendDates','_totalXp'].forEach(k=>{ if(S[k]!==undefined) {} }); // currentBook 제외
          sv();
        }
      } catch(_e) { console.log('[앱] Firebase 선로드 실패, localStorage 사용'); setSplash(90,'시작합니다! 🦋','로컬 데이터로 시작'); }
    }

    setSplash(95,'시작합니다! 🦋','앱 시작 중');
    startApp();
    // 백그라운드 Firebase 동기화
    if(typeof db !== 'undefined') {
      db.collection('users').doc(user.uid).get().then(doc => {
        if(doc.exists) {
          const data = doc.data();
          ['xp','lid','streak','nick',
           'markMap','_achievements','_acc','_equipped','_ownedPacks',
           'alStudy','alGoal','alStreak','_dailyGoalMin','_dailyStudiedMin',
           '_dailyDate','_dailyXpGiven','studyLog','fontFamily','lastDate'
          ].forEach(k => { if(data[k]!==undefined) S[k]=data[k]; });
          // currentBook은 로컬 유지 (Firebase 동기화 제외 - 사용자 위치 보존)
          // 필드 순서 오류 자동 수정 (en↔ex 뒤바뀐 경우)
          const _fixWords = (arr) => (arr||[]).map(w => {
            if(!w||!w.en||!w.kr) return w;
            if(w.en.includes(' ') && w.en.length>10 && /^[a-zA-Z]+$/.test(w.kr) && w.kr.length<20) {
              return {...w, en:w.kr, kr:w.ph||'', ph:w.ex||'', ex:w.en, pos:w.pos||'', meanings:[w.ph||'']};
            }
            if(w.ph && /^(명사|동사|형용사|부사|전치사|접속사)/.test(w.ph)) {
              return {...w, pos:w.ph, ph:w.ex||'', ex:w.en+'.'};
            }
            return w;
          });
          // words 수정
          const _w0 = (S.words||[])[0];
          if(_w0) console.log('[필드수정] words[0] 수정 전:', JSON.stringify({en:_w0.en,kr:_w0.kr,ph:_w0.ph,ex:_w0.ex}));
          S.words = _fixWords(S.words);
          // books 수정 (S.books에 이미 data.books가 복사된 상태)
          S.books = (S.books||[]).map(bk => {
            const fixed = _fixWords(bk.words||[]);
            if(fixed.length>0) console.log('[필드수정] book:'+bk.name+' words[0]:', JSON.stringify({en:fixed[0].en,kr:fixed[0].kr}));
            return {...bk, words: fixed};
          });
          // 수정된 데이터 즉시 저장 및 화면 갱신
          sv();
          if(typeof go === 'function') go();
          if(Array.isArray(data.learned)) S.learned=new Set(data.learned);
          if(Array.isArray(data.favorites)) S.favorites=data.favorites;
        if(Array.isArray(data.myButterflies)) localStorage.setItem('wd-butterflies', JSON.stringify(data.myButterflies));
          try { if(typeof updHD==='function') updHD(); } catch(e) {}
        }
      }).catch(()=>{});
    }
  } else {
    S.user = null;
    try {
      const ls = localStorage;
      if(ls.getItem('wd-l'))  S.lid = ls.getItem('wd-l');
      if(ls.getItem('wd-xp')) S.xp = Number(ls.getItem('wd-xp'))||0;
      if(ls.getItem('wd-st')) S.streak = Number(ls.getItem('wd-st'))||0;
      if(ls.getItem('wd-nk')) S.nick = ls.getItem('wd-nk');
      const bks=ls.getItem('wd-bks'); if(bks) S.books=JSON.parse(bks);
      const cbk=ls.getItem('wd-cbk'); if(cbk) S.currentBook=cbk;
      const w=ls.getItem('wd-w'); if(w) S.words=JSON.parse(w);
      // 현재 책이 내 단어장이 아니면 해당 책 단어를 활성화 (활성 단어/책 일치)
      if(S.currentBook && S.currentBook!=='내 단어장' && Array.isArray(S.books)){
        const _cb=S.books.find(b=>b.name===S.currentBook);
        if(_cb && Array.isArray(_cb.words)){ S.words=[..._cb.words]; if(_cb.markMap)S.markMap={..._cb.markMap}; if(_cb.srsMap)S.srsMap={..._cb.srsMap}; if(_cb.learned)S.learned=new Set(_cb.learned); }
      }
      // 필드 순서 오류 자동 수정
      const _fixW2 = (arr) => (arr||[]).map(w => {
        if(!w||!w.en||!w.kr) return w;
        if(w.en.includes(' ') && w.en.length>10 && /^[a-zA-Z]+$/.test(w.kr) && w.kr.length<20) {
          return {...w, en:w.kr, kr:w.ph||'', ph:w.ex||'', ex:w.en, meanings:[w.ph||'']};
        }
        if(w.ph && /^(명사|동사|형용사|부사)/.test(w.ph)) {
          return {...w, pos:w.ph, ph:w.ex||'', ex:w.en+'.'};
        }
        return w;
      });
      S.words = _fixW2(S.words);
      S.books = (S.books||[]).map(bk=>({...bk, words:_fixW2(bk.words)}));
    } catch(e) {}
    loadXPConfig().catch(()=>{});
    setSplash(100,'','');
    showLogin();
  }
});
</script>
