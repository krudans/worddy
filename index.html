*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#1E5FA5;display:flex;justify-content:center;align-items:center;}
#app{width:100%;max-width:430px;height:100%;max-height:100dvh;background:#F5F7FF;display:flex;flex-direction:column;overflow:hidden;}
.hd{background:#1E5FA5;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 12px;flex-shrink:0;}
.hd-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;}
.lbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);}
.xpbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;}
.xpfill{height:100%;background:#fff;border-radius:3px;transition:width .5s;}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.body::-webkit-scrollbar{display:none;}
.nav{background:#fff;border-top:1.5px solid #E5E7EB;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px)+5px);flex-shrink:0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:2px 0;}
.ni-ic{font-size:20px;line-height:1.2;}
.ni-lb{font-size:9px;font-weight:600;color:#9CA3AF;}
.ni-lb.on{color:#1E5FA5;font-weight:800;}
.dot{width:4px;height:4px;border-radius:50%;background:#1E5FA5;}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;}
.card{background:#fff;border-radius:18px;border:1.5px solid #E5E7EB;padding:16px;}
.btn{border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;transition:all .15s;}
.btn:active{transform:scale(.97);}
.bb{background:#1E5FA5;color:#fff;}
.bg{background:#16A34A;color:#fff;}
.bgr{background:#F3F4F6;color:#6B7280;}
.pb{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;transition:width .4s;}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;}
.stabs{background:#fff;border-bottom:1.5px solid #E5E7EB;display:flex;flex-shrink:0;overflow-x:auto;}
.stabs::-webkit-scrollbar{display:none;}
.st{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;gap:2px;}
.st.on{border-bottom-color:#1E5FA5;}
.st-ic{font-size:16px;}
.st-lb{font-size:9px;font-weight:700;color:#9CA3AF;}
.st-lb.on{color:#1E5FA5;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gc{background:#fff;border-radius:16px;border:1.5px solid #E5E7EB;padding:14px;cursor:pointer;text-align:center;transition:transform .1s;}
.gc:active{transform:scale(.97);}
.chip{display:inline-block;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid;transition:all .15s;user-select:none;}
.chip:active{transform:scale(.95);}
.chip-b{background:#EFF6FF;border-color:#BFDBFE;color:#1E5FA5;}
.chip-ok{background:#DCFCE7;border-color:#86EFAC;color:#15803D;}
.chip-ng{background:#FFF1F2;border-color:#FECDD3;color:#DC2626;}
.chip-gr{background:#F3F4F6;border-color:#E5E7EB;color:#9CA3AF;}
.ans-box{min-height:52px;background:#F9FAFB;border-radius:12px;border:2px dashed #D1D5DB;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.ans-ok{background:#F0FDF4;border-color:#86EFAC;}
.ans-ng{background:#FFF1F2;border-color:#FECDD3;}
.wc{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-family:monospace;text-transform:uppercase;border:2.5px solid #E5E7EB;border-radius:9px;transition:all .2s;}
.wf-grid{display:inline-grid;gap:3px;background:#F3F4F6;padding:8px;border-radius:12px;}
.wf-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff;border-radius:7px;cursor:pointer;font-family:monospace;border:1.5px solid #E5E7EB;transition:all .15s;user-select:none;}
.wf-cell.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5;}
.wf-cell.fnd{background:#DCFCE7;border-color:#86EFAC;color:#15803D;cursor:default;}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+22px);}
.tw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{background:#1A1A2E;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.cbrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;border:1.5px solid #DBEAFE;flex:1;font-size:13px;font-weight:600;color:#1e3a5f;line-height:1.6;}
.topt{background:#fff;border:2px solid #E5E7EB;border-radius:14px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;color:#374151;transition:all .2s;text-align:center;}
.topt.sel{background:#EFF6FF;border-color:#1E5FA5;color:#1E5FA5;}
.topt.ok{background:#F0FDF4;border-color:#16A34A;color:#16A34A;}
.topt.ng{background:#FFF1F2;border-color:#DC2626;color:#DC2626;}
.toggle{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:#1E5FA5;}
.tk{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on .tk{transform:translateX(20px);}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:12px;border:1.5px solid #E5E7EB;padding:12px 14px;font-size:14px;width:100%;background:#fff;}
input:focus,textarea:focus{outline:none;border-color:#1E5FA5;}
</style>

function load(){
  S.lid=localStorage.getItem('wd-l')||'egg';

  S.words=JSON.parse(localStorage.getItem('wd-w')||'null')||[...WDB[S.lid]||WDB.egg];
  S.learned=new Set(JSON.parse(localStorage.getItem('wd-lrn')||'[]'));
  S.dList=JSON.parse(localStorage.getItem('wd-dl')||'[]');
  S.goal=localStorage.getItem('wd-gl')||null;
  S.goalTotal=+(localStorage.getItem('wd-glt')||0);
}
function sv(){
  localStorage.setItem('wd-l',S.lid);localStorage.setItem('wd-xp',S.xp);

  localStorage.setItem('wd-nk',S.nick);localStorage.setItem('wd-w',JSON.stringify(S.words));
  localStorage.setItem('wd-lrn',JSON.stringify([...S.learned]));
  localStorage.setItem('wd-dl',JSON.stringify(S.dList));
  if(S.goal)localStorage.setItem('wd-gl',S.goal);

}

function addXP(n){

function startTest(){

function renderTQ(){
  if(S.tIdx>=S.tQs.length){finishTest();return;}

    </div>
    <div class="g2">${q.c.map((c,i)=>{
      let cls='topt';
      if(S.tAns){if(i===q.a)cls+=' ok';else if(S.tRes===i)cls+=' ng';}
      return`<div class="${cls}" onclick="${S.tAns?'':``ansT(${i})``}">${c}</div>`;
    }).join('')}</div>
  </div>`;
}
function ansT(i){
  const q=S.tQs[S.tIdx];S.tAns=true;S.tRes=i;
  if(i===q.a)S.tScore[q.lv]=(S.tScore[q.lv]||0)+1;
  renderTQ();
  setTimeout(()=>{S.tIdx++;S.tAns=false;S.tRes=null;renderTQ();},700);
}
function finishTest(){
  let final='egg';
  for(const l of LEVELS){if((S.tScore[l.id]||0)>=3)final=l.id;else break;}

async function handleFile(input,type){
  const file=input.files[0];if(!file)return;
  S.ai=true;go('study','add');
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type.includes('pdf')?'image/png':file.type,data:b64}},{type:'text',text:'이 이미지에서 영어 단어들을 찾아 JSON 배열로만 반환. 형식: [{"en":"word","kr":"뜻"}]. 관사/전치사 제외.'}]}]})});
    const d=await resp.json();
    const txt=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    showExtracted(parsed);
  }catch(e){toast('추출 실패. 다시 시도해주세요.');}
  S.ai=false;go('study','add');
}
function showExtracted(words){
  let sel=new Set(words.map((_,i)=>i));
  const renderList=()=>document.getElementById('ext-list').innerHTML=words.map((w,i)=>`
    <div onclick="togW(${i})" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6;cursor:pointer;">
      <div style="width:24px;height:24px;border-radius:50%;background:${sel.has(i)?'#16A34A':'#E5E7EB'};display:flex;align-items:center;justify-content:center;font-size:12px;color:${sel.has(i)?'#fff':'#9CA3AF'};flex-shrink:0;">${sel.has(i)?'✓':''}</div>
      <span style="font-weight:700;font-family:monospace;color:#1E5FA5;">${w.en}</span>
      <span style="color:#6B7280;">${w.kr}</span>
    </div>`).join('');
  window.togW=i=>{sel.has(i)?sel.delete(i):sel.add(i);renderList();};
  window.svExt=()=>{const add=words.filter((_,i)=>sel.has(i));add.forEach(w=>{if(!S.words.find(x=>x.en===w.en))S.words.push({...w,ph:'',pos:'',ex:w.en+'.',tip:w.en+' = '+w.kr,meanings:[w.kr]});});sv();cm();toast(`✅ ${add.length}개 추가!`);go('study','add');};
  document.getElementById('mr').innerHTML=`<div class="mbg"><div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:16px;font-weight:800;">추출 단어 ${words.length}개</div>
      <div style="display:flex;gap:8px;">
        <button onclick="sel=new Set([...Array(${words.length}).keys()]);renderList?renderList():null" style="background:none;border:none;font-size:12px;color:#1E5FA5;cursor:pointer;">전체선택</button>
        <button onclick="sel.clear();document.getElementById('ext-list').querySelectorAll('[onclick]').forEach(e=>e.click&&0)" style="background:none;border:none;font-size:12px;color:#DC2626;cursor:pointer;">전체해제</button>
      </div>
    </div>
    <div id="ext-list" style="max-height:280px;overflow-y:auto;"></div>
    <button class="btn bg" onclick="svExt()" style="margin-top:12px;">선택 단어 저장</button>
    <button class="btn bgr" onclick="cm()" style="margin-top:8px;">닫기</button>
  </div></div>`;
  renderList();
}

function startGameW(id,ws){
  const src=ws||(S.words.length>=2?S.words:(WDB[S.lid]||WDB.egg));
  S.gameId=id;S.gDone=false;S.gScore=0;S.gIdx=0;S.gAns=false;S.gRes=null;S.gInput='';
  S.gWords=pick(src,Math.min(8,src.length));
  if(id==='match'){S.mPairs=pick(src,Math.min(5,src.length));S.mEn=shuf(S.mPairs.map(p=>p.en));S.mKr=shuf(S.mPairs.map(p=>p.kr));S.mMatched=new Set();S.mEn0=null;S.mKr0=null;S.mScore=0;}
  if(id==='wordle'){const pool=src.filter(w=>w.en.length>=4&&w.en.length<=7);S.wWord=pool.length?rnd(pool):src[0];S.wGuess=[];S.wIn='';S.wOver=false;S.wWon=false;}
  if(id==='sentence'){S.sbS=rnd([{kr:'나는 매일 공부한다',en:'I study every day',words:['I','study','every','day'],wrong:['she','playing','yesterday']},{kr:'그녀는 행복하다',en:'She is happy',words:['She','is','happy'],wrong:['He','are','sad','am']},{kr:'우리는 영어를 배운다',en:'We learn English',words:['We','learn','English'],wrong:['They','teach','Korean','are']}]);S.sbP=shuf([...S.sbS.words,...S.sbS.wrong.slice(0,2)]);S.sbC=[];S.sbAns=false;S.sbOk=false;}
  if(id==='chain'){S.chStory=rnd(['Yesterday I went to the park.','One morning a bird sang outside my window.','My best friend called me last night.']);S.chIdx=0;S.chIn='';S.chDone=false;}
  if(id==='ssort'||id==='listen'){speak(S.gWords[0]?.en||'');}
  S.tab='game';go();
}

function rGame(){
  if(S.gDone)return rGameDone();
  const map={quiz:rQ4,fill:rFill,wordfind:rWF,chain:rChain,match:rMatch,sentence:rSentence,scramble:rTyping,typing:rTyping,wordle:rWordle,ssort:rSSorting,listen:rListen};
  return(map[S.gameId]||rGameDone)();
}

  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  const src=S.words.length>=4?S.words:(WDB[S.lid]||WDB.egg);
  const cs=shuf([w,...pick(src.filter(x=>x.en!==w.en),3)]);
  return ghdr('🎯 뜻 맞추기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'맞아! 정말 잘했어! 🎉':'아쉬워! 다음엔 꼭 맞춰봐 💪'):'이 단어의 뜻은 뭘까? 골라봐! 🎯',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}

    <div class="card" style="text-align:center;padding:24px;background:#EFF6FF;border-color:#BFDBFE;">
      <div style="font-size:30px;font-weight:900;color:#1E5FA5;font-family:monospace;">${w.en}</div>
      <div style="font-size:13px;color:#9CA3AF;margin-top:4px;">${w.ph||''}</div>
    </div>

function buildWF(){
  const words=pick(S.gWords.map(w=>w.en.toUpperCase()),Math.min(4,S.gWords.length));
  const sz=8;const grid=Array.from({length:sz},()=>Array(sz).fill(''));
  const placed=[];const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  words.forEach(w=>{for(let t=0;t<60;t++){const dir=Math.floor(Math.random()*2),r=Math.floor(Math.random()*sz),c=Math.floor(Math.random()*sz),dr=[0,1][dir],dc=[1,0][dir];
    if(r+dr*(w.length-1)>=sz||c+dc*(w.length-1)>=sz)continue;
    let ok=true;const cells=[];
    for(let i=0;i<w.length;i++){const cr=r+dr*i,cc=c+dc*i;if(grid[cr][cc]&&grid[cr][cc]!==w[i]){ok=false;break;}cells.push(`${cr},${cc}`);}
    if(ok){cells.forEach((k,i)=>{const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=w[i];});placed.push({word:w,cells});break;}
  });});
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(!grid[r][c])grid[r][c]=alpha[Math.floor(Math.random()*26)];
  S.wfGrid=grid;S.wfWords=placed;S.wfFound=new Set();S.wfSel=[];
}
function rWF(){
  if(!S.wfGrid.length)buildWF();
  const sz=S.wfGrid.length;
  const foundCells=new Set(S.wfWords.filter(w=>S.wfFound.has(w.word)).flatMap(w=>w.cells));
  const all=S.wfFound.size>=S.wfWords.length;
  if(all&&!S.gDone){S.gDone=true;S.gScore=S.wfFound.size*100;setTimeout(()=>go(),300);}
  return ghdr('🔍 단어 찾기',`${S.wfFound.size}/${S.wfWords.length}`)+`<div class="pad">
    ${cbrow(all?'모두 찾았어! 대단해! 🎉':'격자에서 단어를 찾아봐! 가로·세로로 숨어있어 🔍',S.lid,all?'happy':'normal')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${S.wfWords.map(w=>`<span style="padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;font-family:monospace;background:${S.wfFound.has(w.word)?'#DCFCE7':'#F3F4F6'};color:${S.wfFound.has(w.word)?'#16A34A':'#374151'};text-decoration:${S.wfFound.has(w.word)?'line-through':'none'};">${w.word}</span>`).join('')}
    </div>
    <div style="display:flex;justify-content:center;overflow-x:auto;">
      <div class="wf-grid" style="grid-template-columns:repeat(${sz},1fr);">
        ${S.wfGrid.map((row,r)=>row.map((cell,c)=>{const k=`${r},${c}`;const isSel=S.wfSel.includes(k);const isFnd=foundCells.has(k);
          return`<div class="wf-cell ${isFnd?'fnd':isSel?'sel':''}" onclick="selWF(${r},${c})">${cell}</div>`;}).join('')).join('')}
      </div>

  </div>`;
}
function selWF(r,c){const k=`${r},${c}`;const foundCells=new Set(S.wfWords.filter(w=>S.wfFound.has(w.word)).flatMap(w=>w.cells));if(foundCells.has(k))return;if(S.wfSel.includes(k)){S.wfSel=S.wfSel.filter(x=>x!==k);}else{S.wfSel.push(k);}

    <div class="card" style="background:#FFF8E1;border-color:#FFE082;text-align:center;">
      <div style="font-size:13px;color:#E65100;margin-bottom:8px;">힌트: ${S.sbS.kr}</div>
      <button onclick="speak('${S.sbS.en}')" style="background:#E65100;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;">🔊 다시 듣기</button>
    </div>
    <div><div style="font-size:12px;color:#9CA3AF;margin-bottom:7px;">문장 완성하기</div>
      <div class="ans-box ${S.sbAns?(S.sbOk?'ans-ok':'ans-ng'):''}">
        ${S.sbC.length?S.sbC.map((w,i)=>`<span class="chip chip-b" onclick="${S.sbAns?'':``rmSB(${i})``}">${w}</span>`).join('')
        :`<span style="font-size:13px;color:#D1D5DB;">아래 단어를 탭해서 문장 배열하기</span>`}
      </div>
    </div>
    ${S.sbAns?`<div class="card" style="background:${S.sbOk?'#F0FDF4':'#FFF1F2'};border-color:${S.sbOk?'#86EFAC':'#FECDD3'};">
      <div style="font-size:14px;font-weight:700;color:#111;">${S.sbS.en}</div>
    </div>
    <button class="btn bb" onclick="S.sbS=null;go()">다음 →</button>`:`
    <div style="display:flex;flex-wrap:wrap;gap:7px;">
      ${S.sbP.map((w,i)=>{const used=S.sbC.filter(c=>c===w).length>=S.sbP.filter(p=>p===w).length;
        return`<span class="chip ${used?'chip-gr':'chip-b'}" onclick="${used?'':``pickSB('${w}')``}" style="opacity:${used?.5:1};">${w}</span>`;}).join('')}
    </div>
    <button class="btn" onclick="chkSB()" ${S.sbC.length<2?'disabled':''} style="background:#E65100;color:#fff;">확인 ✓</button>`}
  </div>`;
}

function rListen(){
  const w=S.gWords[S.gIdx];if(!w){S.gDone=true;return rGame();}
  if(!S.gAns&&S.gIdx===0)speak(w.en);
  return ghdr('👂 듣고 완성하기',`${S.gIdx+1}/${S.gWords.length}`)+`<div class="pad">
    ${cbrow(S.gAns?(S.gRes==='ok'?'정확히 들었어! 🎉':'아쉬워! 다시 들어봐 💪'):'음성을 듣고 들린 단어를 입력해봐! 👂',S.lid,S.gAns?(S.gRes==='ok'?'happy':'sad'):'normal')}
    <div class="pb"><div class="pf" style="width:${Math.round(S.gIdx/S.gWords.length*100)}%;background:#880E4F;"></div></div>
    <div class="card" style="text-align:center;padding:24px;background:#FCE4EC;border-color:#F48FB1;">
      <div style="font-size:13px;color:#880E4F;margin-bottom:12px;">뜻: ${w.kr}</div>
      <button onclick="speak('${w.en}')" style="background:#880E4F;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;">🔊 듣기</button>
    </div>
    <input id="ti" value="${S.gInput}" oninput="S.gInput=this.value" onkeydown="if(event.key==='Enter')chkT('${w.en}')" placeholder="들린 단어 입력..." style="border:2px solid ${S.gRes==='ok'?'#16A34A':S.gRes==='ng'?'#DC2626':'#BFDBFE'};background:${S.gRes==='ok'?'#F0FDF4':S.gRes==='ng'?'#FFF1F2':'#fff'};font-size:17px;font-family:monospace;font-weight:700;transition:all .2s;"/>
    <button class="btn" onclick="chkT('${w.en}')" ${S.gAns?'disabled':''} style="background:#880E4F;color:#fff;">확인</button>
  </div>`;
}

// ── 일기 ──
function rDiary(){
  if(S.dView==='list')return rDiaryList();
  const tw=S.words.slice(0,6);
  const used=tw.filter(w=>(S.dTr||S.dText).toLowerCase().includes(w.en.toLowerCase()));
  return`<div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;">${cbrow('오늘 하루를 기록해봐! 🌸',S.lid).replace('class="cbrow"','class="cbrow" style="flex:1;"')}
      <button onclick="S.dView='list';go()" style="background:#F3F4F6;border:none;border-radius:10px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;color:#6B7280;flex-shrink:0;margin-left:8px;">이전 일기</button>
    </div>
    <div class="card"><div style="font-size:12px;font-weight:700;color:#9CA3AF;margin-bottom:8px;">오늘 기분</div>
      <div style="display:flex;gap:8px;">${['😊','😐','😔','🥰','😤','😴'].map(m=>`<button onclick="S.dMood='${m}';go()" style="font-size:24px;background:${S.dMood===m?'#EFF6FF':'transparent'};border:2px solid ${S.dMood===m?'#1E5FA5':'transparent'};border-radius:10px;padding:4px 6px;cursor:pointer;">${m}</button>`).join('')}</div>
    </div>
    ${tw.length?`<div><div style="font-size:12px;color:#9CA3AF;margin-bottom:6px;">단어 탭하면 삽입</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">${tw.map(w=>`<button onclick="S.dText=(S.dText+' ${w.en}').trim();go()" style="padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:${used.includes(w)?'#DCFCE7':'#F3F4F6'};color:${used.includes(w)?'#16A34A':'#374151'};border:1.5px solid ${used.includes(w)?'#86EFAC':'#E5E7EB'};">${used.includes(w)?'✓ ':''}${w.en}</button>`).join('')}</div>
    </div>`:''}
    <textarea id="dt" placeholder="한국어 또는 영어로 오늘 하루를 써보세요..." style="min-height:110px;resize:none;line-height:1.7;" oninput="S.dText=this.value">${S.dText}</textarea>
    <div style="display:flex;gap:8px;">
      <button class="btn bb" onclick="trDiary()" ${S.ai?'disabled':''} style="flex:1;">${S.ai?'번역 중...':'🌐 영어로 번역'}</button>
      <button onclick="dHelp()" ${S.ai?'disabled':''} style="background:#FDF4FF;border:1.5px solid #E9D5FF;border-radius:14px;padding:14px;font-size:13px;font-weight:700;cursor:pointer;color:#7C3AED;white-space:nowrap;">✨ 교정</button>
    </div>
    ${S.dTr?`<div class="card" style="background:#F0FDF4;border-color:#86EFAC;">
      <div style="font-size:11px;font-weight:700;color:#16A34A;margin-bottom:5px;">✅ AI 번역</div>
      <div style="font-size:13px;color:#14532D;line-height:1.8;">${S.dTr}</div>
    </div>`:''}
    ${S.dHelp?`<div class="card" style="background:#FDF4FF;border-color:#E9D5FF;">
      <div style="font-size:12px;color:#4C1D95;line-height:1.7;white-space:pre-wrap;">${S.dHelp}</div>
    </div>`:''}
    ${S.dSaved?`<div class="card" style="background:#F0FDF4;border-color:#86EFAC;text-align:center;padding:18px;">
      ${charSVG(S.lid,50,'happy')}
      <div style="font-size:15px;font-weight:800;color:#15803D;margin:8px 0;">저장 완료! 🎉</div>
      <button class="btn bb" onclick="S.dText='';S.dTr='';S.dHelp='';S.dMood='😊';S.dSaved=false;go()">새 일기 쓰기</button>
    </div>`:`<button class="btn bg" onclick="svDiary()">💾 일기 저장</button>`}
  </div>`;
}
async function trDiary(){
  if(!S.dText.trim()){toast('일기를 먼저 써주세요');return;}S.ai=true;go();
  const ws=S.words.slice(0,6).map(w=>w.en).join(', ');
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:`한국어 일기를 자연스러운 영어로 번역. 가능하면 포함: ${ws}. 번역만 출력.\n"${S.dText}"`}]})});
    const d=await r.json();S.dTr=d.content?.[0]?.text?.trim()||'';}catch(e){toast('AI 오류');}
  S.ai=false;go();
}
async function dHelp(){
  if(!(S.dTr||S.dText).trim()){toast('일기를 먼저 써주세요');return;}S.ai=true;go();
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:`다음 영어를 교정하고 자연스러운 표현 제안. 한국어로.\n"${S.dTr||S.dText}"`}]})});
    const d=await r.json();S.dHelp=d.content?.[0]?.text?.trim()||'';}catch(e){toast('AI 오류');}
  S.ai=false;go();
}
function svDiary(){
  if(!S.dText.trim()&&!S.dTr.trim()){toast('일기를 써주세요');return;}
  S.dList.unshift({date:today(),mood:S.dMood,kr:S.dText,en:S.dTr,id:Date.now()});
  if(S.dList.length>100)S.dList.pop();
  S.dSaved=true;addXP(10);sv();go();
}
function rDiaryList(){
  return`<div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:16px;font-weight:800;color:#111;">📖 일기 목록</div>
      <button onclick="S.dView=null;go()" style="background:#1E5FA5;color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;">✏️ 새 일기</button>
    </div>
    ${S.dList.length===0?`<div class="card" style="text-align:center;padding:30px;">${charSVG(S.lid,50)}<div style="font-size:14px;color:#9CA3AF;margin-top:10px;">아직 일기가 없어요</div></div>`:
    S.dList.map(e=>`<div class="card" onclick="vwDiary(${e.id})" style="cursor:pointer;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="font-size:13px;font-weight:700;color:#374151;">${e.date} ${e.mood}</div>
        <button onclick="event.stopPropagation();if(confirm('삭제?')){S.dList=S.dList.filter(d=>d.id!==${e.id});sv();go();}" style="background:none;border:none;color:#FCA5A5;font-size:16px;cursor:pointer;">×</button>
      </div>
      <div style="font-size:13px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.kr||e.en||'(내용 없음)'}</div>
    </div>`).join('')}
  </div>`;
}
function vwDiary(id){
  const e=S.dList.find(d=>d.id===id);if(!e)return;
  document.getElementById('mr').innerHTML=`<div class="mbg" onclick="cm()"><div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="font-size:16px;font-weight:800;">${e.date} ${e.mood}</div>
      <button onclick="cm()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#9CA3AF;">×</button>
    </div>
    ${e.kr?`<div style="font-size:14px;color:#374151;line-height:1.8;margin-bottom:12px;">${e.kr}</div>`:''}
    ${e.en?`<div style="background:#F0FDF4;border-radius:12px;padding:14px;"><div style="font-size:11px;font-weight:700;color:#16A34A;margin-bottom:6px;">영어 번역</div><div style="font-size:13px;color:#14532D;line-height:1.8;">${e.en}</div></div>`:''}
    <button class="btn bgr" onclick="cm()" style="margin-top:14px;">닫기</button>
  </div></div>`;
}

// ── 프로필 ──
function rProfile(){
  const l=lv(S.lid);
  return`<div class="pad">
    <div style="text-align:center;padding:16px 0;">
      <div style="margin-bottom:12px;">${charSVG(S.lid,80)}</div>
      <div style="font-size:20px;font-weight:900;color:#111;margin-bottom:4px;">${S.nick}</div>
      <div style="display:inline-block;background:${l.bg};color:${l.color};border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;">${l.emoji} ${l.name} · ${l.desc}</div>
    </div>
    <!-- 통계 -->
    <div class="g2">
      ${[['📖',S.words.length+'개','단어장','#1E5FA5'],['✅',S.learned.size+'개','완료','#16A34A'],['🔥',S.streak+'일','연속','#D97706'],['📝',S.dList.length+'개','일기','#880E4F']].map(([ic,v,lb,c])=>`
      <div class="card" style="text-align:center;padding:12px;">
        <div style="font-size:22px;margin-bottom:4px;">${ic}</div>
        <div style="font-size:20px;font-weight:900;color:${c};">${v}</div>
        <div style="font-size:11px;color:#9CA3AF;">${lb}</div>
      </div>`).join('')}
    </div>
    <!-- 레벨 성장 -->
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px;">🦋 성장 단계</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        ${LEVELS.map(lx=>`<div style="text-align:center;opacity:${lx.min<=S.xp?1:.35};">
          <div style="font-size:${lx.id===S.lid?'22px':'16px'};margin-bottom:2px;">${lx.emoji}</div>
          <div style="font-size:9px;color:${lx.id===S.lid?lx.color:'#D1D5DB'};font-weight:${lx.id===S.lid?'700':'400'};">${lx.name.split(' ')[0]}</div>
        </div>`).join('')}
      </div>
    </div>
    <!-- 알림 설정 -->
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:12px;">🔔 알림 설정</div>
      ${[{k:'alS',ic:'📖',nm:'공부 알림',h:S.alS.h,m:S.alS.m},{k:'alD',ic:'✍️',nm:'일기 알림',h:S.alD.h,m:S.alD.m}].map(a=>`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6;">
        <span style="font-size:18px;">${a.ic}</span>
        <div style="flex:1;"><div style="font-size:13px;font-weight:600;color:#111;">${a.nm}</div>
          <div style="font-size:11px;color:#9CA3AF;">${String(a.h).padStart(2,'0')}:${String(a.m).padStart(2,'0')}</div></div>
        <button class="toggle ${S[a.k].on?'on':''}" onclick="S.${a.k}.on=!S.${a.k}.on;go()"><div class="tk"></div></button>
      </div>`).join('')}
      <button onclick="reqNotif()" style="background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#1E5FA5;width:100%;margin-top:10px;">🔔 알림 권한 허용</button>
    </div>
    <!-- 닉네임 변경 -->
    <div class="card">
      <div style="font-size:13px;font-weight:800;color:#111;margin-bottom:10px;">✏️ 닉네임 변경</div>
      <div style="display:flex;gap:8px;">
        <input id="cnk" placeholder="새 닉네임" value="${S.nick}" style="flex:1;"/>
        <button onclick="const v=document.getElementById('cnk')?.value.trim();if(v){S.nick=v;sv();toast('닉네임 변경!');go();}" style="background:#1E5FA5;color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;">변경</button>
      </div>
    </div>
    <!-- 레벨 재테스트 / 로그아웃 -->
    <button class="btn" onclick="if(confirm('레벨 테스트 재시작?')){localStorage.removeItem('wd-tested');showTestIntro();}" style="background:#FFF8E1;color:#E65100;border:1.5px solid #FFE082;">📝 레벨 재테스트</button>
    <button class="btn bgr" onclick="if(confirm('로그아웃?')){auth.signOut();}">로그아웃</button>
  </div>`;
}
function reqNotif(){
  if(!('Notification' in window)){toast('이 브라우저는 알림 미지원');return;}
  Notification.requestPermission().then(p=>{if(p==='granted')toast('🔔 알림 권한 허용됨!');});
}

// ── 초기화 ──
</script>
</body>
</html>
