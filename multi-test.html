<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다국어 순환팩 · 미리보기</title>
<style>
  :root{
    --bg:#0E1320; --panel:#161D2E; --panel2:#1E2740; --line:rgba(255,255,255,.09);
    --tx:#EAEEF7; --tx2:#9AA6BE; --tx3:#5C6781;
    --en:#5B8DEF; --ko:#F2698E; --ja:#C77DFF; --de:#F3B14E;
    --accent:#6EE7C7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
  body{max-width:520px;margin:0 auto;padding:18px 16px 60px;min-height:100vh}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);font-weight:700}
  h1{font-size:23px;font-weight:800;margin:6px 0 2px;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--tx2);margin-bottom:18px;line-height:1.5}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
  .lbl{font-size:11px;color:var(--tx3);font-weight:700;letter-spacing:.05em;margin-bottom:7px}

  /* 언어 쌍 컨트롤 */
  .pairrow{display:flex;align-items:center;gap:10px}
  .langcol{flex:1}
  .seg{display:flex;gap:5px}
  .seg button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);
    border-radius:11px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .seg button[data-l="en"].on{background:var(--en);border-color:var(--en);color:#06122b}
  .seg button[data-l="ko"].on{background:var(--ko);border-color:var(--ko);color:#2b0610}
  .seg button[data-l="ja"].on{background:var(--ja);border-color:var(--ja);color:#1c062b}
  .seg button[data-l="de"].on{background:var(--de);border-color:var(--de);color:#2b1c06}
  .seg button.dim{opacity:.32;cursor:not-allowed}
  .swap{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);
    background:var(--panel2);color:var(--accent);font-size:18px;cursor:pointer;align-self:flex-end;
    transition:transform .35s cubic-bezier(.5,1.6,.4,1)}
  .swap:active{transform:rotate(180deg)}

  /* 단계 */
  .steps{display:flex;gap:6px;margin-top:4px}
  .steps button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);
    border-radius:10px;padding:8px 0;font-size:13px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
  .steps button.on{background:var(--accent);border-color:var(--accent);color:#04201a}

  /* 카드 */
  .card{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:22px;padding:24px 20px;text-align:center;overflow:hidden}
  .emoji{font-size:54px;line-height:1;margin-bottom:6px}
  .qlabel{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .qmeta{font-size:13px;color:var(--tx2);margin-top:4px;font-family:ui-monospace,monospace}
  .arrow{color:var(--tx3);font-size:15px;margin:10px 0 4px}
  .alabel{font-size:20px;font-weight:700;color:var(--tx)}

  .speak{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:rgba(110,231,199,.12);
    border:1px solid rgba(110,231,199,.3);color:var(--accent);border-radius:30px;padding:8px 18px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .sent{margin-top:16px;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px}
  .sent .q{font-size:15px;line-height:1.55}
  .sent .a{font-size:13px;color:var(--tx2);line-height:1.55;margin-top:5px}
  .chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:20px;margin-right:6px;vertical-align:1px}
  .chip.en{background:rgba(91,141,239,.18);color:var(--en)}
  .chip.ko{background:rgba(242,105,142,.18);color:var(--ko)}
  .chip.ja{background:rgba(199,125,255,.18);color:var(--ja)}
  .chip.de{background:rgba(243,177,78,.18);color:var(--de)}

  /* 4개국어 한눈에 */
  .allrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-top:1px solid var(--line)}
  .allrow:first-child{border-top:none}
  .flag{font-size:11px;font-weight:800;width:30px;flex:none}
  .flag.en{color:var(--en)} .flag.ko{color:var(--ko)} .flag.ja{color:var(--ja)} .flag.de{color:var(--de)}
  .alabel2{font-size:16px;font-weight:700;flex:1}
  .aroma{font-size:11px;color:var(--tx3);font-family:ui-monospace,monospace}
  .mini{font-size:13px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);cursor:pointer;flex:none}

  /* 내비 */
  .nav{display:flex;align-items:center;gap:10px;margin-top:16px}
  .nav button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
  .nav .count{flex:none;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
  .note{font-size:11px;color:var(--tx3);text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
  <div class="eyebrow">Worddy · multilingual pack</div>
  <h1>다국어 순환팩 미리보기</h1>
  <p class="sub">한 개념에 영·한·일·독을 매달아 둔 데이터입니다. <b>학습언어</b>와 <b>모국어</b>만 바꾸면 같은 데이터가 방향을 바꿔 학습됩니다. (시드 8개 · 검증용 화면)</p>

  <div class="panel">
    <div class="pairrow">
      <div class="langcol">
        <div class="lbl">학습언어 (문제로 보이는 말)</div>
        <div class="seg" id="segLearn"></div>
      </div>
      <button class="swap" id="swap" title="학습↔모국 바꾸기">⇄</button>
      <div class="langcol">
        <div class="lbl">모국어 (뜻·풀이로 보이는 말)</div>
        <div class="seg" id="segNative"></div>
      </div>
    </div>
    <div style="margin-top:12px">
      <div class="lbl">예문 단계 1~5</div>
      <div class="steps" id="segStep"></div>
    </div>
  </div>

  <div class="card" id="card"><!-- rendered --></div>

  <div class="nav">
    <button id="prev">← 이전</button>
    <span class="count" id="count">1 / 8</span>
    <button id="next">다음 →</button>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="lbl">이 개념을 4개국어로 한눈에</div>
    <div id="allLangs"></div>
  </div>

  <p class="note">데이터: bwd-multi.js (개념 중심 · 양방향). 학습/게임 코드는 학습언어·모국어 블록만 꺼내 쓰므로, 언어가 늘어도 이 화면 구조는 그대로입니다.</p>

<script>
/* ── 내장 시드 데이터(8개) — bwd-multi.js v2와 동일 ── */
var BWD_MULTI = {
  apple:{cefr:"A1",emoji:"🍎",
    en:{label:"apple",roma:"",ex5:["The apple is red.","I eat an apple.","I like sweet red apples.","When I am hungry, I eat an apple.","Every morning I eat a fresh apple that my mother buys at the market."]},
    ko:{label:"사과",roma:"sagwa",ex5:["사과가 빨개요.","나는 사과를 먹어요.","나는 달고 빨간 사과를 좋아해요.","배가 고프면 나는 사과를 먹어요.","매일 아침 나는 어머니가 시장에서 사 오신 신선한 사과를 먹어요."]},
    ja:{label:"りんご",roma:"ringo",ex5:["りんごは赤い。","私はりんごを食べる。","私は甘くて赤いりんごが好きだ。","お腹がすくと、私はりんごを食べる。","毎朝、私は母が市場で買ってくる新鮮なりんごを食べる。"]},
    de:{label:"Apfel",roma:"der · Äpfel",ex5:["Der Apfel ist rot.","Ich esse einen Apfel.","Ich mag süße rote Äpfel.","Wenn ich Hunger habe, esse ich einen Apfel.","Jeden Morgen esse ich einen frischen Apfel, den meine Mutter auf dem Markt kauft."]}},
  water:{cefr:"A1",emoji:"💧",
    en:{label:"water",roma:"",ex5:["The water is cold.","I drink water.","I drink cold, clean water.","I drink water because I am thirsty.","After running for an hour, I drank a big glass of cold water."]},
    ko:{label:"물",roma:"mul",ex5:["물이 차가워요.","나는 물을 마셔요.","나는 차갑고 깨끗한 물을 마셔요.","목이 말라서 나는 물을 마셔요.","한 시간 동안 달린 뒤에 나는 차가운 물 한 잔을 마셨어요."]},
    ja:{label:"水",roma:"mizu",ex5:["水は冷たい。","私は水を飲む。","私は冷たくてきれいな水を飲む。","のどがかわいたので、私は水を飲む。","一時間走ったあと、私は冷たい水を一杯飲んだ。"]},
    de:{label:"Wasser",roma:"das · —",ex5:["Das Wasser ist kalt.","Ich trinke Wasser.","Ich trinke kaltes, sauberes Wasser.","Ich trinke Wasser, weil ich durstig bin.","Nachdem ich eine Stunde gelaufen war, trank ich ein großes Glas kaltes Wasser."]}},
  book:{cefr:"A1",emoji:"📖",
    en:{label:"book",roma:"",ex5:["The book is new.","I read a book.","I read an interesting book.","I read a book before I sleep.","Last night I read an interesting book that my friend gave me for my birthday."]},
    ko:{label:"책",roma:"chaek",ex5:["책이 새것이에요.","나는 책을 읽어요.","나는 재미있는 책을 읽어요.","나는 자기 전에 책을 읽어요.","어젯밤 나는 친구가 생일에 준 재미있는 책을 읽었어요."]},
    ja:{label:"本",roma:"hon",ex5:["本は新しい。","私は本を読む。","私は面白い本を読む。","私は寝る前に本を読む。","昨夜、私は友達が誕生日にくれた面白い本を読んだ。"]},
    de:{label:"Buch",roma:"das · Bücher",ex5:["Das Buch ist neu.","Ich lese ein Buch.","Ich lese ein interessantes Buch.","Ich lese ein Buch, bevor ich schlafe.","Gestern Abend las ich ein interessantes Buch, das mir mein Freund zum Geburtstag geschenkt hat."]}},
  house:{cefr:"A1",emoji:"🏠",
    en:{label:"house",roma:"",ex5:["The house is big.","I see a house.","They live in a small house.","I clean the house when it is dirty.","My grandparents live in an old house that stands on a quiet hill near the sea."]},
    ko:{label:"집",roma:"jip",ex5:["집이 커요.","나는 집을 봐요.","그들은 작은 집에 살아요.","집이 더러우면 나는 집을 청소해요.","우리 조부모님은 바닷가 조용한 언덕에 있는 오래된 집에 살아요."]},
    ja:{label:"家",roma:"ie",ex5:["家は大きい。","私は家を見る。","彼らは小さい家に住んでいる。","家が汚いとき、私は家を掃除する。","祖父母は、海の近くの静かな丘に建つ古い家に住んでいる。"]},
    de:{label:"Haus",roma:"das · Häuser",ex5:["Das Haus ist groß.","Ich sehe ein Haus.","Sie wohnen in einem kleinen Haus.","Ich putze das Haus, wenn es schmutzig ist.","Meine Großeltern wohnen in einem alten Haus, das auf einem ruhigen Hügel am Meer steht."]}},
  dog:{cefr:"A1",emoji:"🐶",
    en:{label:"dog",roma:"",ex5:["The dog is big.","I have a dog.","I have a small brown dog.","The dog barks when someone comes.","Every evening I walk my friendly dog in the park near our house."]},
    ko:{label:"개",roma:"gae",ex5:["개가 커요.","나는 개가 있어요.","나는 작은 갈색 개가 있어요.","누가 오면 개가 짖어요.","매일 저녁 나는 집 근처 공원에서 다정한 개를 산책시켜요."]},
    ja:{label:"犬",roma:"inu",ex5:["犬は大きい。","私は犬を飼っている。","私は小さい茶色の犬を飼っている。","だれかが来ると、犬はほえる。","毎晩、私は家の近くの公園で人なつっこい犬を散歩させる。"]},
    de:{label:"Hund",roma:"der · Hunde",ex5:["Der Hund ist groß.","Ich habe einen Hund.","Ich habe einen kleinen braunen Hund.","Der Hund bellt, wenn jemand kommt.","Jeden Abend gehe ich mit meinem freundlichen Hund im Park neben unserem Haus spazieren."]}},
  cat:{cefr:"A1",emoji:"🐱",
    en:{label:"cat",roma:"",ex5:["The cat is small.","I see a cat.","A black cat sits on the wall.","The cat sleeps when it is warm.","My quiet cat likes to sleep on the soft chair by the sunny window."]},
    ko:{label:"고양이",roma:"goyangi",ex5:["고양이가 작아요.","나는 고양이를 봐요.","검은 고양이가 담 위에 앉아 있어요.","따뜻하면 고양이가 자요.","나의 조용한 고양이는 햇빛 드는 창가의 푹신한 의자에서 자는 것을 좋아해요."]},
    ja:{label:"猫",roma:"neko",ex5:["猫は小さい。","私は猫を見る。","黒い猫が塀の上に座っている。","暖かいと、猫は眠る。","私の静かな猫は、日の当たる窓のそばの柔らかい椅子で眠るのが好きだ。"]},
    de:{label:"Katze",roma:"die · Katzen",ex5:["Die Katze ist klein.","Ich sehe eine Katze.","Eine schwarze Katze sitzt auf der Mauer.","Die Katze schläft, wenn es warm ist.","Meine ruhige Katze schläft gern auf dem weichen Stuhl am sonnigen Fenster."]}},
  school:{cefr:"A1",emoji:"🏫",
    en:{label:"school",roma:"",ex5:["The school is near.","I go to school.","I go to a big school.","I go to school even when it rains.","Every morning my sister and I walk to the big school at the end of our street."]},
    ko:{label:"학교",roma:"hakgyo",ex5:["학교가 가까워요.","나는 학교에 가요.","나는 큰 학교에 다녀요.","비가 와도 나는 학교에 가요.","매일 아침 나와 여동생은 우리 거리 끝에 있는 큰 학교까지 걸어가요."]},
    ja:{label:"学校",roma:"gakkō",ex5:["学校は近い。","私は学校へ行く。","私は大きい学校に通っている。","雨が降っても、私は学校へ行く。","毎朝、私と妹は通りの突き当たりにある大きい学校まで歩いていく。"]},
    de:{label:"Schule",roma:"die · Schulen",ex5:["Die Schule ist nah.","Ich gehe zur Schule.","Ich gehe auf eine große Schule.","Ich gehe zur Schule, auch wenn es regnet.","Jeden Morgen gehen meine Schwester und ich zu der großen Schule am Ende unserer Straße."]}},
  friend:{cefr:"A1",emoji:"🧑‍🤝‍🧑",
    en:{label:"friend",roma:"",ex5:["He is my friend.","I meet my friend.","I meet my old friend today.","I call my friend when I am sad.","Whenever I have a problem, I talk to my best friend, who always listens to me."]},
    ko:{label:"친구",roma:"chingu",ex5:["그는 내 친구예요.","나는 친구를 만나요.","나는 오늘 오랜 친구를 만나요.","슬플 때 나는 친구에게 전화해요.","문제가 생길 때마다 나는 언제나 내 말을 들어주는 가장 친한 친구와 이야기해요."]},
    ja:{label:"友達",roma:"tomodachi",ex5:["彼は私の友達だ。","私は友達に会う。","私は今日、古い友達に会う。","悲しいとき、私は友達に電話する。","問題があるときはいつも、私はいつも話を聞いてくれる親友に相談する。"]},
    de:{label:"Freund",roma:"der · Freunde",ex5:["Er ist mein Freund.","Ich treffe meinen Freund.","Ich treffe heute meinen alten Freund.","Ich rufe meinen Freund an, wenn ich traurig bin.","Wann immer ich ein Problem habe, spreche ich mit meinem besten Freund, der mir immer zuhört."]}}
};
var LANGS=['en','ko','ja','de'];
var LANGNAME={en:'영어',ko:'한국어',ja:'일본어',de:'독일어'};
var TTS={en:'en-US',ko:'ko-KR',ja:'ja-JP',de:'de-DE'};
var ids=Object.keys(BWD_MULTI);

var st={learn:'en', native:'ko', step:1, idx:0};

function buildSeg(elId, which){
  var el=document.getElementById(elId); el.innerHTML='';
  LANGS.forEach(function(L){
    var b=document.createElement('button'); b.textContent=LANGNAME[L]; b.dataset.l=L;
    var other = which==='learn'? st.native : st.learn;
    if(st[which]===L) b.classList.add('on');
    if(L===other) b.classList.add('dim'); // 같은 언어 중복 방지
    b.onclick=function(){ if(L===other) return; st[which]=L; render(); };
    el.appendChild(b);
  });
}
function buildSteps(){
  var el=document.getElementById('segStep'); el.innerHTML='';
  for(var i=1;i<=5;i++){ (function(n){
    var b=document.createElement('button'); b.textContent=n; if(st.step===n) b.classList.add('on');
    b.onclick=function(){ st.step=n; render(); }; el.appendChild(b);
  })(i); }
}
function _bestVoiceFor(code){
  try{
    var vs=window.speechSynthesis.getVoices()||[]; if(!vs.length) return null;
    var prefix=String(code||'en').toLowerCase().replace('_','-').split('-')[0];
    function sc(v){ var l=(v.lang||'').toLowerCase().replace('_','-'); if(l.indexOf(prefix)!==0) return -1;
      var n=(v.name||'').toLowerCase(), s=2;
      if(/google/.test(n)) s+=50; if(/natural|neural/.test(n)) s+=48;
      if(/premium|enhanced|wavenet|siri/.test(n)) s+=30; if(/microsoft/.test(n)) s+=18;
      if(v.localService===false) s+=8; if(/compact|espeak/.test(n)) s-=45; return s; }
    var best=null,bs=-1; for(var i=0;i<vs.length;i++){var s=sc(vs[i]); if(s>bs){bs=s;best=vs[i];}}
    return bs>=0?best:null;
  }catch(e){ return null; }
}
function speak(text, lang){
  try{ window.speechSynthesis.cancel();
    var code=TTS[lang]||'en-US';
    var u=new SpeechSynthesisUtterance(text); u.lang=code; u.rate=(lang==='ko')?0.92:(lang==='en'?0.9:0.92);
    var v=_bestVoiceFor(code); if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
try{ window.speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
function render(){
  buildSeg('segLearn','learn'); buildSeg('segNative','native'); buildSteps();
  var id=ids[st.idx], c=BWD_MULTI[id];
  var Q=c[st.learn], A=c[st.native], i=st.step-1;
  var qEx=Q.ex5[i]||Q.ex5[0], aEx=A.ex5[i]||A.ex5[0];
  document.getElementById('count').textContent=(st.idx+1)+' / '+ids.length;

  document.getElementById('card').innerHTML=
    '<div class="emoji">'+c.emoji+'</div>'+
    '<div class="qlabel" style="color:var(--'+st.learn+')">'+Q.label+'</div>'+
    (Q.roma?'<div class="qmeta">'+Q.roma+'</div>':'')+
    '<div class="arrow">▾ '+LANGNAME[st.native]+'</div>'+
    '<div class="alabel">'+A.label+(A.roma?' <span class="aroma">'+A.roma+'</span>':'')+'</div>'+
    '<button class="speak" onclick="speak('+JSON.stringify(qEx).replace(/"/g,'&quot;')+",'"+st.learn+"')\">🔊 "+LANGNAME[st.learn]+' 예문 듣기</button>'+
    '<div class="sent">'+
      '<div class="q"><span class="chip '+st.learn+'">'+st.learn.toUpperCase()+'</span>'+qEx+'</div>'+
      '<div class="a"><span class="chip '+st.native+'">'+st.native.toUpperCase()+'</span>'+aEx+'</div>'+
    '</div>';

  // 4개국어 한눈에
  var all=LANGS.map(function(L){
    var blk=c[L];
    return '<div class="allrow">'+
      '<span class="flag '+L+'">'+L.toUpperCase()+'</span>'+
      '<span class="alabel2">'+blk.label+'</span>'+
      (blk.roma?'<span class="aroma">'+blk.roma+'</span>':'<span class="aroma"></span>')+
      '<button class="mini" onclick="speak('+JSON.stringify(blk.label).replace(/"/g,'&quot;')+",'"+L+"')\">🔊</button>"+
    '</div>';
  }).join('');
  document.getElementById('allLangs').innerHTML=all;
}
document.getElementById('swap').onclick=function(){ var t=st.learn; st.learn=st.native; st.native=t; render(); };
document.getElementById('prev').onclick=function(){ st.idx=(st.idx-1+ids.length)%ids.length; render(); };
